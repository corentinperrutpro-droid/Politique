>repris, sous contrôle constitutionnel</td></tr><tr><td>Sénat n° 860 — financements privés de l'action publique</td><td>unanimité, 32 recos</td><td>loi du 25 juin 2026 (reco 7) / PJL en navette (reco 30)</td><td>partiellement fondé</td></tr><tr><td>AN — hauts patrimoines</td><td>transpartisane, 19 recos</td><td>PLF 2027 (visé)</td><td>reprise non constatée</td></tr><tr><td>AN n° 2698 — audiovisuel public</td><td>12 pour / 10 contre / 8 abstentions</td><td>aucun</td><td>sans portée normative</td></tr></table>\n<p>Trois enseignements : un rapport unanime n'est pas garanti d'aboutir, et un rapport contesté peut n'aboutir à rien ; la reprise passe souvent par un texte que le rapport ne visait pas (le suivi doit se faire par article, pas par thème) ; une recommandation reprise peut être censurée avant d'exister (le cycle complet va du rapport au Conseil constitutionnel).</p>\n<p><strong>Le fait institutionnel de 2026.</strong> La commission d'enquête sur l'audiovisuel public a vu ses travaux suspendus par son président en janvier 2026 — décision inédite sous la Ve République — après 36 interviews du rapporteur, plus de 330 publications sur les réseaux sociaux, la diffusion d'extraits tronqués et des dizaines de plaintes de personnes auditionnées. De nouvelles règles ont été adoptées et une saisine judiciaire pour parjure engagée. Conclusion du président : il faut revoir les règles de fonctionnement des commissions d'enquête — non pour restreindre leurs pouvoirs, mais pour encadrer leur usage médiatique.</p>\n<p><strong>Le droit de tirage, mode de création dominant.</strong> Les quatre commissions d'enquête lues procèdent toutes d'un droit de tirage de groupe, avec une conséquence non anticipée : la qualité des objets produits est extrêmement inégale, puisque le droit de tirage soustrait la création au vote de la majorité.</p>\n<p><strong>Corrections de droit</strong> : le droit de tirage relève, à l'Assemblée, de l'article 141 al. 2 du règlement (et non de l'article 51-1 de la Constitution, qui renvoie seulement aux règlements) · le délai de six mois est fixé par l'article 6 de l'ordonnance n° 58-1100 · la règle de non-réitération porte sur un délai de douze mois à compter de la fin de la mission précédente, et non « une commission par sujet et par session ».</p>\n<h3>1. Définition & Cadre</h3>\n<p>Les commissions d'enquête parlementaires sont des organes temporaires créés par l'AN ou le Sénat pour enquêter sur des faits déterminés ou la gestion de services publics. Outil clé du contrôle parlementaire, elles disposent de pouvoirs d'investigation étendus.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 51-2 de la Constitution (depuis 2008) · article 6 de l'ordonnance n° 58-1100 du 17 novembre 1958 · règlement AN (articles 137 à 144-2) · articles 434-13 à 434-15 du Code pénal (faux témoignage).</p>\n<h3>3. La Création</h3>\n<p>Proposition de résolution, acceptation par la conférence des présidents, vote en séance. Limites : pas sur des faits ayant donné lieu à des poursuites judiciaires en cours, durée maximale de 6 mois, pas de nouvelle commission sur le même sujet avant 12 mois. Droit de tirage de l'opposition : chaque groupe minoritaire a droit à une commission d'enquête par session.</p>\n<h3>4. La Composition</h3>\n<p>30 députés ou 21 sénateurs, répartition proportionnelle aux groupes. Le président est souvent issu de la majorité, le rapporteur de l'opposition, pour un contrôle équilibré.</p>\n<h3>5. Les Pouvoirs d'Investigation</h3>\n<p>Auditions sous serment (5 ans et 75 000 € pour faux témoignage, 2 ans et 7 500 € pour refus de comparaître), accès à tout document utile sauf secret-défense, déplacements sur le terrain.</p>\n<h3>6. Le Rapport Final</h3>\n<p>Constats, analyse, recommandations, annexes. Adopté par la commission à la majorité des membres, avec possibilité de contributions individuelles. Pas de force contraignante, mais souvent suivi politiquement (loi, réforme).</p>\n<h3>7. Les Commissions d'Enquête Marquantes</h3>\n<p>Sang contaminé (1991), Outreau (2012), affaire Benalla (2018), gestion Covid (2020), narcotrafic, imposition des plus hauts patrimoines, audiovisuel public (2024-2026).</p>\n<h3>8. Les Limites Pratiques</h3>\n<p>6 mois souvent courts pour des sujets complexes, documents parfois transmis tardivement, influence politique majorité/opposition, moyens limités (1-2 administrateurs par commission).</p>\n<h3>9. Les Missions d'Information</h3>\n<p>Différence : pas de pouvoir d'auditions sous serment, pas de périmètre limité, souvent plus longues, plus simples à créer.</p>\n<h3>10. La Délégation aux Renseignements (CDPR)</h3>\n<p>Créée en 2007, contrôle des services de renseignement, habilitation au secret-défense, composition mixte (4 députés + 4 sénateurs).</p>\n<h3>11. Comparaisons étrangères</h3>\n<p>USA (subpoena power très puissant) · Royaume-Uni (Select Committees) · Allemagne (Untersuchungsausschuss) · Italie (commissioni d'inchiesta).</p>\n<h3>12. Enjeux Stratégiques</h3>\n<p>Les commissions d'enquête sont un outil puissant, renforcé par le droit de tirage de 2008, mais limité en pratique par les moyens et la durée — et, depuis 2026, par la question de l'encadrement de leur exercice médiatique.</p>\n<h3>13. Synthèse Décisionnelle</h3>\n<p>Prolonger la durée à 12 mois pour les sujets complexes + augmenter les moyens (3-5 administrateurs) + sanctions pénales renforcées + obligation de réponse du Gouvernement dans les 6 mois + plateforme publique de suivi des recommandations + encadrement de l'exercice médiatique des travaux plutôt que restriction des pouvoirs.</p>"}, {"id": "35962af8e03f8170a769e2ec58138dae", "titre": "Les missions d'information et niches parlementaires : outils du contrôle", "theme": 1, "cat": "1.3.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les missions d'information sont des structures parlementaires légères qui examinent une question précise et publient un rapport avec recommandations. Elles peuvent être temporaires ou permanentes, communes ou unilatérales. Sans pouvoir décisionnel, elles sont un instrument clé du contrôle parlementaire.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Règlement de l'AN (art. 145, 145-1, 145-2, 145-7) · règlement du Sénat (art. 21) · loi du 14 juin 1996 · article 145-7 (missions d'information sur l'application des lois, 2009) · pas de pouvoirs d'enquête (à la différence des commissions d'enquête).</p>\n<h3>3. Typologie des Missions d'Information</h3>\n<p>Mission de la conférence des présidents (thème transversal, plusieurs commissions, 6 mois à 1 an) · mission d'une commission (plus rapide, 3-6 mois) · mission commune (plusieurs commissions) · mission « flash » (très rapide, 3 mois max, 2 rapporteurs majorité/opposition).</p>\n<h3>4. Le Travail des Missions</h3>\n<p>Auditions (ministres, hauts fonctionnaires, experts, ONG), déplacements en France et à l'étranger, rédaction par 2 corapporteurs généralement, environ 30-50 recommandations par rapport, sans force contraignante mais avec une influence réelle.</p>\n<h3>5. Les Missions Marquantes 2018-2024</h3>\n<p>Gilets jaunes (2019, 30 recommandations) · pesticides (2020) · influence étrangère (2023) · intelligence artificielle (2024, 50 recommandations) · Église et abus sexuels (2021, suite au rapport CIASE).</p>\n<h3>6. Les Niches Parlementaires (Journées Réservées)</h3>\n<p>Article 48 al. 5 : 1 journée/mois réservée à l'AN et au Sénat pour l'initiative parlementaire, partagée entre les groupes. Niches d'opposition : 1 journée/an par groupe depuis 2008, adoption rare, souvent transformée en « liste de vœux » politique.</p>\n<h3>7. Comparaisons étrangères</h3>\n<p>USA (Congressional hearings) · Royaume-Uni (Select Committees très actifs et médiatisés) · Allemagne (Untersuchungsausschüsse).</p>\n<h3>8. Enjeux Stratégiques</h3>\n<p>Les missions d'information sont un instrument clé mais sous-valorisé, dont l'impact dépend fortement de la qualité médiatique et qui manque de moyens d'enquête propres.</p>\n<h3>9. Synthèse Décisionnelle</h3>\n<p>Renforcer les missions : pouvoirs d'enquête (sous serment), dotation budgétaire dédiée, suite obligatoire du gouvernement (réponse sous 6 mois), création d'un office de contrôle commun aux deux assemblées, répartition équitable des niches entre groupes.</p>"}, {"id": "35962af8e03f81c09e70c6775e95e801", "titre": "La tripartition de l'AN 2024 : coalitions, instabilité et négociations", "theme": 1, "cat": "1.3.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>Depuis la dissolution du 9 juin 2024, l'Assemblée nationale est tripartite sans majorité absolue (289 sièges requis). Les coalitions et alliances tactiques déterminent l'adoption ou le rejet des textes. C'est une situation inédite sous la Ve République.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Constitution de la Ve République sans prévision spécifique pour la majorité relative · article 49 al. 3 (devient l'arme principale) · article 49 al. 2 (motion de censure) · article 12 (dissolution interdite moins d'un an après une élection).</p>\n<h3>3. Composition de l'AN 2024</h3>\n<table><tr><th>Groupe</th><th>Sièges</th><th>Couleur politique</th></tr><tr><td>RN+UDR</td><td>142</td><td>Extrême droite/Droite</td></tr><tr><td>Ensemble (EPR+MoDem+Horizons)</td><td>166</td><td>Centre/Macronie</td></tr><tr><td>LR</td><td>47</td><td>Droite</td></tr><tr><td>NFP</td><td>193</td><td>Gauche</td></tr><tr><td>LIOT</td><td>23</td><td>Centre-divers</td></tr><tr><td>Non-inscrits</td><td>6</td><td>-</td></tr></table>\n<p>Total 577 sièges, majorité absolue 289.</p>\n<h3>4. Les Coalitions Possibles</h3>\n<p>Bloc central (Ensemble + LR) : 213 sièges, insuffisant. Arc républicain élargi (+ LIOT + PS/Éco) : 363 sièges, possible mais fragile. NFP minoritaire refusé par Macron pour Matignon. RN comme arbitre, pouvant renverser tout gouvernement en s'alliant au NFP.</p>\n<h3>5. Les Premiers Ministres Successifs</h3>\n<p>Barnier (coalition Ensemble+LR+LIOT, soutien indirect RN, renversé le 5 déc. 2024) · Bayrou (même coalition, 49.3 systématique, confiance perdue sept. 2025) · Lecornu I (démission immédiate) · Lecornu II (même coalition, difficultés persistantes).</p>\n<h3>6. Le Mode de Travail</h3>\n<p>Négociation au cas par cas pour chaque texte, avec un risque de veto RN ou NFP. Usage massif du 49.3 (Borne record, puis Barnier, Bayrou, Lecornu à des degrés moindres). Nombreuses motions de censure, dont une seule adoptée (Barnier).</p>\n<h3>7. Les Configurations Stratégiques</h3>\n<p>Front républicain anti-RN (bloque les textes RN-compatibles mais refus du PS de gouverner avec la Macronie) · NFP au gouvernement (refusé en 2024, possible après nouvelle dissolution) · gouvernement RN (insuffisant en sièges avec LR+LIOT, plus probable après 2027) · cohabitation Macron-Bardella (scénario après 2027).</p>\n<h3>8. La Question de la Stabilité</h3>\n<p>Problèmes structurels : pas de majorité stable possible, paralysie sur les grandes réformes. Solutions évoquées : nouvelle dissolution, passage à la proportionnelle, contrat de législature formalisé.</p>\n<h3>9. Comparaisons étrangères</h3>\n<p>Allemagne (Koalitionsvertrag) · Italie (majorité fluctuante mais formalisée) · Espagne (coalitions de gauche ou de droite) · Pays-Bas (coalitions à 4-6 partis).</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>La crise de 2024-2025 est inédite : le système de la Ve République a été conçu pour la majorité absolue, et la tripartition est devenue une donnée structurelle nécessitant de réinventer la pratique politique.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Introduire une motion de censure constructive à l'allemande + rendre obligatoires des contrats de coalition publics + vote d'investiture du PM par l'AN avant nomination + introduire une dose de proportionnelle (10-20 %).</p>"}, {"id": "35762af8e03f81ab8f11f9acfab2d81b", "titre": "Le Sénat : composition, pouvoirs, Larcher et débat sur sa légitimité", "theme": 1, "cat": "1.3.2", "html": "<h3>🔁 Lecture croisée — 10 août 2026</h3>\n<p>Depuis un exemplaire archivé de cette fiche. Apports versés :</p>\n<p><strong>Calendrier et mécanique</strong> : session ordinaire du 1er octobre au 30 juin · 8 commissions permanentes (comme l'AN).</p>\n<p><strong>Moyens</strong> : budget ≈ 340 M€ · indemnités ≈ 7 200 € brut/mois · enveloppe collaborateurs ≈ 8 640 €/mois · ≈ 1 000 fonctionnaires (millésimes à confirmer).</p>\n<p><strong>Sociologie</strong> : parité 34,5 % de femmes (2023) · âge moyen ≈ 61 ans · 80 % des communes de moins de 3 500 habitants (fondement du biais rural).</p>\n<p><strong>Chronologie</strong> : 2003 (mandat ramené à 6 ans, renouvellement par moitié) · 2011 (première présidence de gauche depuis 1968).</p>\n<p><strong>⚠️ Divergences non tranchées</strong> : nombre de grands électeurs (≈150 000 vs ≈162 000 selon les sources — à établir sur senat.fr) · décompte exact des mandats de Larcher (dépend de la période 2008-2011, à préciser avant citation).</p>\n<h3>1. Définition & Cadre</h3>\n<p>Le Sénat est la chambre haute du Parlement français. 348 sénateurs élus pour 6 ans (renouvelé par moitié tous les 3 ans) au suffrage universel indirect par les « grands électeurs » (environ 162 000). Le Sénat représente les collectivités territoriales. Il ne peut pas être dissous. Il est structurellement à droite depuis des décennies.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 24 (représentation des collectivités territoriales) · article 45 (procédure législative, dernier mot à l'AN sauf révisions constitutionnelles) · article 89 (droit de veto sur les révisions constitutionnelles si voie du Congrès) · ordonnance du 17 novembre 1958.</p>\n<h3>3. Le Corps Électoral : Les « Grands Électeurs »</h3>\n<p>Maires et maires adjoints, conseillers départementaux, conseillers régionaux, députés, délégués des communes proportionnels à leur population. Biais : les petites communes rurales sont surreprésentées, ce qui explique l'ancrage à droite du Sénat.</p>\n<h3>4. Composition (2025)</h3>\n<table><tr><th>Groupe</th><th>Sièges</th></tr><tr><td>Les Républicains (LR)</td><td>136</td></tr><tr><td>Rassemblement des démocrates (centre-droit)</td><td>50</td></tr><tr><td>Socialistes et assimilés</td><td>64</td></tr><tr><td>RDPI (Renaissance)</td><td>22</td></tr><tr><td>RDSE (Radicaux)</td><td>17</td></tr><tr><td>Union Centriste</td><td>24</td></tr><tr><td>Les Indépendants</td><td>15</td></tr><tr><td>Écologistes</td><td>12</td></tr><tr><td>CRCE-K (Communistes)</td><td>17</td></tr><tr><td>TOTAL</td><td>348</td></tr></table>\n<p>La gauche n'a pas eu la majorité au Sénat depuis 1968, sauf la parenthèse 2011-2014.</p>\n<h3>5. Gérard Larcher : Le Président du Sénat</h3>\n<p>Président du Sénat depuis 2014 (réélu 2017, 2020, 2023), LR, sénateur depuis 1994. 2e personnage de l'État (intérim présidentiel si nécessaire). A joué un rôle clé dans les crises institutionnelles de 2024. Budget Sénat 2024 : 340 M€.</p>\n<h3>6. Les Pouvoirs Spécifiques du Sénat</h3>\n<p>Ce qu'il peut faire : veto constitutionnel sur les révisions passant par le Congrès, priorité de saisine pour les textes sur les collectivités territoriales, rôle de chambre de réflexion, nomination de 3 membres du Conseil constitutionnel, continuité institutionnelle (ne peut être dissous). Ce qu'il ne peut pas faire : renverser le gouvernement, avoir le dernier mot sur les lois ordinaires.</p>\n<h3>7. La Navette Législative et la CMP</h3>\n<p>1re lecture AN → 1re lecture Sénat → en cas de désaccord, 2e lectures → CMP (7 députés + 7 sénateurs) → en cas d'échec, l'AN peut statuer définitivement. Exception : révisions constitutionnelles, lois organiques relatives au Sénat, lois sur les collectivités (accord obligatoire des deux chambres).</p>\n<h3>8. Le Sénat : Chambre de Résistance ?</h3>\n<p>Le Sénat a bloqué ou fortement amendé de nombreux textes gouvernementaux (loi immigration 2024, mesures durcies puis censurées par le Conseil constitutionnel), tout en confortant parfois le gouvernement (réforme des retraites 2023). Rôle de gardien des libertés locales face à la recentralisation.</p>\n<h3>9. Débat sur la Légitimité du Sénat</h3>\n<p>Pour le maintien : stabilité, représentation territoriale, travail législatif approfondi. Pour la suppression : proposée par LFI (programme NFP 2024), élection indirecte, biais à droite, double emploi avec l'AN. Rappel historique : de Gaulle a perdu le référendum de 1969 sur la réforme du Sénat, entraînant sa démission.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p><strong>Recommandation</strong> : maintenir le Sénat mais réformer son mode d'élection (réduire le biais rural) + renforcer ses pouvoirs de contrôle (notamment européen) + réduire son rôle législatif sur les textes nationaux non territoriaux + maintenir son rôle de gardien des libertés locales.</p>"}, {"id": "35862af8e03f81ed92ecdd6ebf57f1b6", "titre": "L'élection des sénateurs : 162 000 grands électeurs, scrutin et composition 2024", "theme": 1, "cat": "1.3.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les 348 sénateurs sont élus au suffrage universel indirect par environ 162 000 grands électeurs (députés, conseillers régionaux, départementaux, municipaux). Le mode de scrutin varie selon le nombre de sénateurs par département. Le Sénat est renouvelé par moitié tous les 3 ans, mandat de 6 ans.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Articles 24 à 33 de la Constitution · loi organique du 30 juillet 2003 (mode de scrutin) · Code électoral (livre II).</p>\n<h3>3. Le Collège Électoral</h3>\n<p>162 000 grands électeurs : 577 députés, 1 671 conseillers régionaux, 4 056 conseillers départementaux, environ 155 000 délégués des conseils municipaux. 95 % des grands électeurs sont des délégués municipaux, ce qui privilégie les zones rurales.</p>\n<h3>4. Le Mode de Scrutin</h3>\n<p>Scrutin uninominal majoritaire à 2 tours pour les départements de 1 ou 2 sénateurs (70 départements, favorisant les notables locaux). Scrutin proportionnel à la plus forte moyenne pour les départements de 3 sénateurs ou plus (31 départements, favorisant les partis structurés).</p>\n<h3>5. Composition du Sénat 2024</h3>\n<table><tr><th>Groupe</th><th>Sièges</th></tr><tr><td>LR</td><td>132</td></tr><tr><td>UC</td><td>57</td></tr><tr><td>SER</td><td>65</td></tr><tr><td>RDPI (Renaissance)</td><td>24</td></tr><tr><td>CRCE-K (PCF)</td><td>18</td></tr><tr><td>RDSE</td><td>17</td></tr><tr><td>LIRT (Écologistes)</td><td>19</td></tr><tr><td>Non-inscrits</td><td>16</td></tr><tr><td>Total</td><td>348</td></tr></table>\n<p>Majorité LR-UC : 189 sièges (majorité absolue à 174). Président : Gérard Larcher (LR), depuis 2014.</p>\n<h3>6. Le Renouvellement par Moitié</h3>\n<p>Série 1 (170 sénateurs) renouvelée en 2020, 2026, 2032. Série 2 (178 sénateurs) renouvelée en 2023, 2029, 2035. Avantage : continuité institutionnelle. Inconvénient : peu de renouvellement politique brutal.</p>\n<h3>7. La Particularité du Sénat des Français de l'Étranger</h3>\n<p>12 sénateurs représentent les Français de l'étranger (environ 2,5 millions de personnes), élus par 199 conseillers consulaires.</p>\n<h3>8. La Présence des Femmes</h3>\n<p>Loi du 6 juin 2000 sur la parité étendue au Sénat, listes paritaires obligatoires en scrutin proportionnel. 2024 : 36 % de femmes.</p>\n<h3>9. La Question de la Légitimité</h3>\n<p>Débat récurrent sur la suppression du Sénat (échec du référendum gaulliste de 1969). Critiques : « chambre des notables », peu représentative des urbains. Défenses : représentation des territoires, contre-pouvoir essentiel.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Le mode de scrutin sénatorial favorise structurellement les zones rurales. Réformes à envisager : repondération des délégués municipaux selon la démographie, proportionnelle intégrale, réduction du mandat à 5 ans.</p>\n<h3>🔄 MAJ — Élections sénatoriales de septembre 2026 : le corps électoral rebattu par les municipales</h3>\n<p><strong>Échéance</strong> : renouvellement d'une série du Sénat en septembre 2026.</p>\n<p><strong>Le fait nouveau</strong> : les municipales des 15 et 22 mars 2026 (participation ~57 %) ont modifié le collège des grands électeurs. Le RN et ses alliés UDR remportent 74 mairies (dont 31 dès le 1er tour) et font élire plus de 3 000 conseillers municipaux dans 84 départements. Nice bascule (Éric Ciotti, UDR) ; le RN échoue à Marseille, Nîmes et Toulon. Paris : Emmanuel Grégoire (union de la gauche) élu maire avec 50,52 %.</p>\n<p><strong>Pourquoi c'est décisif</strong> : environ 95 % des grands électeurs sont des délégués des conseils municipaux (art. L. 280 du Code électoral). Les municipales de mars 2026 déterminent donc mécaniquement la composition du collège de septembre 2026. Historiquement, le Sénat est le point faible du RN, quasi absent d'un collège dominé par les élus des petites communes rurales et les réseaux LR/centristes.</p>\n<p><strong>Enjeu stratégique</strong> : le RN pourrait pour la première fois constituer un groupe significatif au Sénat (projections : une dizaine de sièges supplémentaires), sans bouleverser l'équilibre général. La majorité LR-Union centriste devrait se maintenir, ce qui pèse directement sur la navette parlementaire. Le Sénat, ne pouvant être dissous, constitue un contrepoids stable face à une Assemblée fragmentée depuis 2024.</p>\n<p><strong>À surveiller</strong> : date exacte du scrutin, série renouvelée, effet réel des mairies RN sur le nombre de délégués, recomposition éventuelle des groupes après le verdict Le Pen du 7 juillet 2026 et la structuration des candidatures 2027.</p>"}, {"id": "35862af8e03f814faa1fcb56f4a613a2", "titre": "Les commissions permanentes du Sénat : 7 commissions, missions d'information et enquête", "theme": 1, "cat": "1.3.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les commissions permanentes du Sénat sont au nombre de 7. Elles examinent les projets et propositions de loi avant le passage en séance. Elles ont aussi un rôle de contrôle et d'évaluation. Le Sénat est réputé pour la qualité technique de ses rapports.</p>\n<h3>2. Les 7 Commissions Permanentes</h3>\n<table><tr><th>Commission</th><th>Effectif</th></tr><tr><td>Affaires économiques</td><td>49</td></tr><tr><td>Affaires étrangères, défense, forces armées</td><td>57</td></tr><tr><td>Affaires sociales</td><td>52</td></tr><tr><td>Aménagement du territoire et développement durable</td><td>49</td></tr><tr><td>Culture, éducation, communication</td><td>49</td></tr><tr><td>Finances</td><td>49</td></tr><tr><td>Lois</td><td>49</td></tr></table>\n<h3>3. La Commission des Finances</h3>\n<p>Particularité : présidée par l'opposition, tradition républicaine. Examen du PLF et du PLFSS, contrôle de l'exécution budgétaire, rapporteur général issu de la majorité sénatoriale.</p>\n<h3>4. La Commission des Lois</h3>\n<p>Examen des projets touchant aux libertés, à la justice, à la sécurité, très influente sur les questions régaliennes (rapports notables sur le narcotrafic, la violence à l'école).</p>\n<h3>5. Les Missions d'Information et Commissions d'Enquête</h3>\n<p>Mission d'information : sujet thématique, durée libre. Commission d'enquête : pouvoirs renforcés (auditions sous serment). Exemples récents : Uber Files (2022), narcotrafic (2024), Nouvelle-Calédonie (2024-2025).</p>\n<h3>6. La Délégation aux Droits des Femmes</h3>\n<p>Créée en 1999, veille à l'égalité hommes-femmes, travaux significatifs sur les violences faites aux femmes.</p>\n<h3>7. La Délégation aux Collectivités Territoriales</h3>\n<p>Spécifique au Sénat, 36 membres, examine tous les projets impactant les collectivités.</p>\n<h3>8. La Conférence des Présidents</h3>\n<p>Présidée par Gérard Larcher, composée des présidents de groupes et de commissions et des vice-présidents, décide de l'ordre du jour des séances.</p>\n<h3>9. La Production Réglementaire du Sénat</h3>\n<table><tr><th>Indicateur</th><th>Valeur 2023</th></tr><tr><td>Lois adoptées</td><td>76</td></tr><tr><td>Propositions de loi sénatoriales</td><td>18 (24 % des lois)</td></tr><tr><td>Rapports d'information</td><td>175</td></tr><tr><td>Auditions</td><td>3 200</td></tr><tr><td>Amendements examinés</td><td>16 000</td></tr></table>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Les commissions sénatoriales sont reconnues pour la qualité de leurs rapports techniques. Renforcement à envisager : pouvoirs de contrôle sur l'exécution des recommandations, suivi obligatoire des rapports d'enquête.</p>"}, {"id": "35862af8e03f8185b301fdf40ad2a7b9", "titre": "Le Président du Sénat et Gérard Larcher : statut, pouvoirs et rôle politique", "theme": 1, "cat": "1.3.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Gérard Larcher est président du Sénat depuis le 1er octobre 2014, réélu en 2017, 2020 et 2023. C'est une figure majeure de la droite républicaine, gardien des institutions et acteur clé des moments de crise (Covid, Gilets jaunes, dissolution 2024).</p>\n<h3>2. Le Statut Constitutionnel du Président du Sénat</h3>\n<p>Article 7 : en cas de vacance du pouvoir présidentiel, le président du Sénat assure l'intérim (précédents : Alain Poher en 1969 et 1974). Autres rôles constitutionnels : nomme 2 membres du CSM et 3 membres du Conseil constitutionnel, préside le comité consultatif sur le secret défense.</p>\n<h3>3. Le Profil de Gérard Larcher</h3>\n<p>Né en 1949, vétérinaire, maire de Rambouillet (1983-2004), sénateur des Yvelines depuis 1986, ministre du Travail (2007-2009, gouvernement Fillon).</p>\n<h3>4. Les Pouvoirs du Président du Sénat</h3>\n<p>Préside les séances plénières et la Conférence des présidents, représente le Sénat, exerce la police de l'hémicycle, saisit le Conseil constitutionnel.</p>\n<h3>5. Le Rôle Politique de Larcher</h3>\n<p>Gardien institutionnel du parlementarisme face à l'exécutif, critique des recours abusifs au 49.3. Médiateur en crise : Gilets jaunes (2018-2019, Grand Débat), Covid (maintien des travaux parlementaires), dissolution de 2024 (appels au respect du résultat).</p>\n<h3>6. Les Recommandations Larcher (Comité Balladur 2007)</h3>\n<p>Renforcement du parlementarisme, limitation du 49.3, encadrement du droit d'amendement.</p>\n<h3>7. Les Affaires</h3>\n<p>Pas d'affaire judiciaire majeure. Critique de l'opposition : jugé parfois trop proche du pouvoir ou conciliant avec Macron.</p>\n<h3>8. La Réélection 2023</h3>\n<p>4e mandat, 235 voix sur 348, conforté par l'arrivée du NFP à l'AN en 2024 qui accroît le besoin d'un médiateur stable.</p>\n<h3>9. Données Clés</h3>\n<table><tr><th>Indicateur</th><th>Valeur</th></tr><tr><td>Mandats successifs</td><td>4 (depuis 2014)</td></tr><tr><td>Effectifs cabinet Sénat</td><td>110</td></tr><tr><td>Budget Sénat</td><td>360 M€/an</td></tr></table>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Larcher est une figure institutionnelle structurante dont la stabilité est un atout dans les périodes troubles. Succession ouverte à terme, profil probable : LR ou UC avec stature parlementaire confirmée.</p>"}, {"id": "35962af8e03f819a9ab5ec6f1f65a26d", "titre": "La Commission mixte paritaire (CMP) : composition, rôle et dernière lecture", "theme": 1, "cat": "1.3.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>La commission mixte paritaire (CMP) est l'outil de conciliation entre l'Assemblée nationale et le Sénat lorsque les deux chambres n'arrivent pas à voter un texte en termes identiques. Elle réunit à égalité 7 députés et 7 sénateurs chargés de proposer un texte commun.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 45 al. 2 à 4 de la Constitution · règlements de chaque assemblée.</p>\n<h3>3. La Procédure de la Navette Parlementaire</h3>\n<p>Texte déposé, 1re lecture dans chaque assemblée ; si vote en termes identiques, adoption finale ; sinon, lectures successives. Convocation de la CMP sur décision du PM après 2 lectures (ou 1 en procédure accélérée).</p>\n<h3>4. La Composition de la CMP</h3>\n<p>7 députés et 7 sénateurs titulaires (+ 7 suppléants chacun), désignés par les commissions compétentes, répartition proportionnelle aux groupes. Présidence alternée entre Palais Bourbon et Palais du Luxembourg.</p>\n<h3>5. Le Déroulement</h3>\n<p>CMP conclusive (accord, adoption dans chaque chambre) · CMP non conclusive (le Gouvernement peut demander à l'AN de statuer en dernier mot) · pas de convocation (navette continue, plus rare).</p>\n<h3>6. Le « Dernier Mot » de l'AN</h3>\n<p>Article 45 al. 4 : si la CMP échoue, le Gouvernement peut demander à l'AN de statuer définitivement, marginalisant le Sénat, sauf pour les lois constitutionnelles et les lois organiques relatives au Sénat.</p>\n<h3>7. Statistiques 2022-2024</h3>\n<p>Environ 80 CMP sur la législature 2022-2024, taux de conclusion tombé à 65 % (contre 90 % avant 2022), recours plus fréquent au dernier mot.</p>\n<h3>8. Les CMP Marquantes Récentes</h3>\n<p>Réforme des retraites (2023, CMP conclusive, adoption par 49.3) · loi immigration (2023, CMP conclusive, 35 articles ensuite censurés) · loi narcotrafic (2025, compromis Renaissance-LR).</p>\n<h3>9. Le Rôle Politique de la CMP</h3>\n<p>Outil de négociation et de marchandage politique, où le texte final est souvent plus proche des positions du Sénat, notamment sur les sujets régaliens.</p>\n<h3>10. Les Limites de la CMP</h3>\n<p>Manque de transparence (débats non publics), déséquilibre numérique entre chambres compensé par une représentation égalitaire en CMP (7+7).</p>\n<h3>11. Comparaisons étrangères</h3>\n<p>Allemagne (Vermittlungsausschuss) · USA (Conference Committee) · Italie et Espagne (pas d'équivalent, navette continue).</p>\n<h3>12. Enjeux Stratégiques</h3>\n<p>La CMP est l'instrument de conciliation du bicamérisme, sa multiplication depuis 2022 témoignant de la difficulté de gouverner sans majorité stable.</p>\n<h3>13. Synthèse Décisionnelle</h3>\n<p>Maintenir la CMP + transparence (enregistrement vidéo public, procès-verbaux détaillés) + composition révisée + adoption par défaut du texte CMP sans nouveau vote pour accélérer la procédure.</p>"}, {"id": "35962af8e03f81daa31bd816e70f4993", "titre": "Le Sénat : suppression, réforme et bicamérisme inégalitaire", "theme": 1, "cat": "1.3.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le débat sur la suppression du Sénat est récurrent sous la Ve République. Le Sénat est critiqué pour son coût, sa légitimité démocratique limitée (élection au suffrage indirect) et sa représentation des territoires ruraux. Plusieurs tentatives de réforme ont échoué (de Gaulle 1969, Mitterrand, Macron 2018).</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 24 (bicamérisme) · article 89 (révision constitutionnelle, vote concordant des deux chambres ou référendum) · article 11 (référendum, utilisé par de Gaulle en 1969).</p>\n<h3>3. Les Tentatives de Suppression</h3>\n<p>1969 (référendum de Gaulle, fusion Sénat-CESE et régionalisation, rejeté à 52,4 %, démission de de Gaulle) · Mitterrand (proposition non mise en œuvre) · Macron 2018 (réduction du nombre de parlementaires, abandonnée après l'affaire Benalla et le Covid).</p>\n<h3>4. Les Critiques du Sénat</h3>\n<p>Coût (budget 2024 : 350 M€) · représentativité (162 000 grands électeurs contre 47 millions pour l'AN, surreprésentation rurale) · légitimité démocratique (suffrage indirect) · bilan politique dominé par la droite depuis 1958 (sauf 2011-2014).</p>\n<h3>5. Les Arguments en Faveur du Maintien</h3>\n<p>Bicamérisme (2 lectures, meilleure qualité législative) · représentation des territoires · stabilité institutionnelle (non dissous, renouvellement par moitié) · qualité du travail (60 % des amendements adoptés par l'AN viennent du Sénat).</p>\n<h3>6. Les Réformes Alternatives Possibles</h3>\n<p>Réduction du nombre de sénateurs (200 au lieu de 348) · modification du mode d'élection (suffrage direct) · fusion CESE-Sénat · limitation des pouvoirs (veto sur les lois organiques relatives au Sénat) · limitation dans le temps des mandats.</p>\n<h3>7. La Réforme du Cumul des Mandats</h3>\n<p>Loi du 14 février 2014 : interdiction de cumuler mandat parlementaire et fonction exécutive locale, applicable depuis 2017, ayant bouleversé le Sénat.</p>\n<h3>8. Les Comparaisons Internationales</h3>\n<p>Sénats puissants (USA, Italie) · Sénats faibles (France, Espagne, Royaume-Uni) · monocamérisme (pays scandinaves, Portugal, Grèce).</p>\n<h3>9. La Position des Partis Politiques</h3>\n<p>Maintien : LR. Réforme : Renaissance, PS. Suppression : LFI, EELV, RN.</p>\n<h3>10. Le Verrou Constitutionnel</h3>\n<p>Toute révision constitutionnelle doit être adoptée par les deux chambres en termes identiques ou soumise à référendum. En pratique, le Sénat ne votera jamais sa propre suppression, et la voie référendaire reste risquée (précédent de 1969).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>La suppression du Sénat est juridiquement quasi impossible, la réforme plus probable, le débat récurrent mais sans conséquence pratique jusqu'ici.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Réforme par réduction à 250 sénateurs + introduction de la proportionnelle pour la moitié des sièges + fusion partielle avec le CESE + suppression du veto sur les lois organiques relatives au Sénat + revalorisation du rôle de contrôle.</p>"}, {"id": "35962af8e03f81f49f69e8f27ba12285", "titre": "Les groupes politiques au Sénat : composition 2024-2027 et stratégies", "theme": 1, "cat": "1.3.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les groupes politiques au Sénat sont les organisations structurantes du travail parlementaire. Le Sénat compte 348 sièges, la majorité absolue étant de 175. La gauche étant historiquement minoritaire, la droite et le centre dominent depuis 1958 (sauf 2011-2014).</p>\n<h3>2. Cadre Juridique</h3>\n<p>Règlement du Sénat (art. 5 et suivants) · article 24 al. 4 de la Constitution · renouvellement par moitié tous les 3 ans · mandat de 6 ans depuis 2003.</p>\n<h3>3. Composition Actuelle (2024-2027)</h3>\n<table><tr><th>Groupe</th><th>Sièges</th></tr><tr><td>LR</td><td>132</td></tr><tr><td>SER</td><td>64</td></tr><tr><td>UC</td><td>59</td></tr><tr><td>RDPI (Macronie)</td><td>22</td></tr><tr><td>RDSE</td><td>16</td></tr><tr><td>CRCE-K</td><td>17</td></tr><tr><td>GEST</td><td>18</td></tr><tr><td>LIRT</td><td>14</td></tr></table>\n<p>Total 342 + 6 non-inscrits = 348. Majorité absolue : 175.</p>\n<h3>4. La Domination LR-Centriste</h3>\n<p>Coalition LR + UC + LIRT = 205 sièges, majorité absolue confortable, bloquant systématiquement les réformes contraires aux orientations de droite. Historique : droite majoritaire de 1958 à 2011, parenthèse socialiste 2011-2014, retour de la droite depuis 2014.</p>\n<h3>5. Les Présidents de Groupes Clés</h3>\n<p>Bruno Retailleau (LR, président 2014-2024, devenu ministre de l'Intérieur en septembre 2024) · Hervé Marseille (UC, négociateur systématique) · Patrick Kanner (SER, voix forte de l'opposition de gauche).</p>\n<h3>6. Le Travail des Groupes</h3>\n<p>Rôle : définition de la stratégie politique, distribution des temps de parole, coordination des amendements. Discipline plus stricte qu'à l'AN, avec des votes libres plus fréquents sur les textes éthiques.</p>\n<h3>7. Les Stratégies Politiques</h3>\n<p>LR (conservatisme institutionnel, rigueur budgétaire, durcissement sur l'immigration) · UC (centrisme européen, négociation) · SER (opposition constructive) · RDPI (faible poids, négociation systématique).</p>\n<h3>8. Les Effets Politiques</h3>\n<p>Veto du Sénat sur certaines réformes territoriales et institutionnelles. Négociations en CMP avec un taux de conclusion d'environ 65 % en 2023, l'échec renvoyant au dernier mot de l'AN.</p>\n<h3>9. Comparaisons étrangères</h3>\n<p>USA (party leaders et whips) · Royaume-Uni (Lords speakers) · Allemagne (Fraktionen) · Italie (groupes parlementaires).</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>Le Sénat est le « verrou » institutionnel de la droite ; toute réforme structurelle doit composer avec LR-UC ; la Macronie n'y a jamais eu la majorité.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Maintenir la représentation des collectivités + débattre d'une réforme du mode de scrutin (proportionnelle intégrale dans certains départements) + renforcer la transparence du financement des groupes + maintenir le bicamérisme.</p>"}, {"id": "35962af8e03f815ab567dad5c8cae4bd", "titre": "Le Sénat représentant des collectivités territoriales : article 24, collège et réformes", "theme": 1, "cat": "1.3.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>L'article 24 al. 4 de la Constitution dispose que le Sénat assure la représentation des collectivités territoriales de la République. Cette mission lui confère une légitimité spécifique mais aussi une influence politique structurante sur les politiques territoriales et la décentralisation.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 24 al. 4 · loi organique du 30 juillet 2003 (mandat de 6 ans) · loi du 2 août 2013 (élection sénatoriale) · article 39 al. 2 (examen prioritaire au Sénat des textes sur les collectivités) · LOLF (examen des projets de loi de finances).</p>\n<h3>3. Le Collège Électoral</h3>\n<p>162 000 grands électeurs : 577 députés, environ 3 600 conseillers régionaux, environ 4 000 conseillers départementaux, environ 150 000 conseillers municipaux. Répartition : communes de moins de 10 000 habitants représentant 95 % des grands électeurs, expliquant le biais rural.</p>\n<h3>4. La Représentation Départementale</h3>\n<p>1 à 2 sénateurs pour les départements faiblement peuplés, jusqu'à 12 pour Paris, 348 sièges au total dont 13 pour l'outre-mer et 12 pour les Français de l'étranger. Scrutin majoritaire pour 115 départements, proportionnel pour 33.</p>\n<h3>5. Le Pouvoir d'Examen Prioritaire</h3>\n<p>Article 39 al. 2 : les projets de loi sur l'organisation des collectivités territoriales sont soumis en premier au Sénat, lui donnant une influence majeure sur leur contenu initial (lois de décentralisation, NOTRe 2015, MAPTAM 2014, 3DS 2022).</p>\n<h3>6. La Délégation aux Collectivités Territoriales</h3>\n<p>Créée en 2009, 36 sénateurs, rapports annuels sur la DGF et la péréquation, auditions des associations d'élus (AMF, ADF, Régions de France).</p>\n<h3>7. Les Acteurs Clés</h3>\n<p>Gérard Larcher (voix la plus écoutée des élus locaux) · associations partenaires (AMF, ADF, Régions de France) · Congrès des maires (novembre, Porte de Versailles).</p>\n<h3>8. Les Critiques de la Représentation</h3>\n<p>Surreprésentation rurale (22 % de la population rurale pour plus de 50 % des grands électeurs) · sous-représentation des intercommunalités · faible poids des conseillers régionaux.</p>\n<h3>9. Les Propositions de Réforme</h3>\n<p>Réforme Macron 2018 abandonnée (réduction du nombre de sénateurs, modification du mode de scrutin) · maintien du statu quo (LR) · repondération en faveur des métropoles (PS) · suppression (LFI).</p>\n<h3>10. Comparaisons étrangères</h3>\n<p>Allemagne (Bundesrat, représentation des Länder) · USA (2 sénateurs par État) · Italie et Espagne (élection régionale).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Le Sénat français est unique en Europe par son élection indirecte via des grands électeurs locaux, avec une légitimité territoriale forte mais une dérive politique vers la droite qui pose question.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Repondérer les grands électeurs (moins de poids pour les communes de moins de 10 000 habitants) + inclure les délégués des EPCI à fiscalité propre + renforcer la Délégation aux collectivités + audits annuels obligatoires sur la DGF et la péréquation + maintenir le droit d'examen prioritaire.</p>"}, {"id": "35362af8e03f81b29530c12623a364af", "titre": "Le bicamérisme inégalitaire et la CMP", "theme": 1, "cat": "1.3.3", "html": "<h3>🔁 Apports versés — 6 août 2026 (fusion de la version archivée « navette, CMP et dernier mot »)</h3>\n<p>Cette fiche reste la canonique. Apports transférés :</p>\n<p><strong>Cadre juridique complété</strong> : art. 24 (vote de la loi, représentation des collectivités par le Sénat al. 4) · art. 39 (initiative partagée ; PLF/PLFSS déposés obligatoirement à l'AN) · art. 46 al. 4 (les lois organiques relatives au Sénat exigent un vote conforme des deux chambres — pas de dernier mot) · art. 89 (égalité stricte pour les révisions) · art. 88-7 (opposition à la révision simplifiée des traités UE par motion votée en termes identiques par les deux chambres).</p>\n<p><strong>Les trois issues de la CMP</strong> : accord + adoption par les deux chambres → loi · accord + rejet par une chambre → le Gouvernement peut demander à l'AN de statuer en dernier ressort · échec → nouvelle lecture puis dernier mot AN possible. Limites du dernier mot : nouvelle délibération demandable par le PR (art. 10) et saisine du CC par 60 sénateurs après adoption.</p>\n<p><strong>Bilan statistique 2017-2024</strong> (périmètre à confirmer) : ~430 lois, ~60 % adoptées en termes conformes sans dernier mot, ~35 % après CMP conclusive, ~5 % en dernier ressort AN.</p>\n<p><strong>Sociologie du rapport de force</strong> : domaines où le Sénat est régulièrement battu (réformes sociétales, fiscalité) vs domaines où il impose ses vues (collectivités territoriales, justice). Asymétrie 2024-2026 : AN fragmentée sans majorité vs Sénat à majorité LR/centriste stable.</p>\n<p><strong>Grappe consignée, non résolue</strong> : une autre fiche de la même catégorie 1.3.3 (« La navette parlementaire et la CMP : mécanisme, statistiques et réformes ») recouvre fortement celle-ci — ligne de partage proposée : navette/CMP procédurale → l'autre fiche ; équilibre bicaméral et réforme du Sénat → celle-ci.</p>\n<h3>1. Définition & Cadre</h3>\n<p>Le bicamérisme inégalitaire français désigne le système dans lequel les deux chambres du Parlement (AN et Sénat) ont des pouvoirs différents, l'AN disposant du dernier mot en cas de désaccord. La commission mixte paritaire (CMP) est le mécanisme de recherche de compromis entre les deux chambres.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 45 (procédure de navette et rôle de la CMP) · article 46 (lois organiques) · article 89 (révisions constitutionnelles, accord des deux chambres obligatoire) · CMP (7 députés + 7 sénateurs).</p>\n<h3>3. Fonctionnement Concret</h3>\n<p>Procédure normale : texte adopté par l'AN en 1re lecture, examen et amendement par le Sénat, navette jusqu'à accord ou 2 lectures, CMP convocable après 2 échecs, dernier mot AN si la CMP échoue. Procédure accélérée : 1 seule lecture par chambre puis CMP puis dernier mot AN, de plus en plus fréquente.</p>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>Présidents de commission AN/Sénat</td><td>Co-présidents de la CMP</td></tr><tr><td>Rapporteurs</td><td>Négocient le texte commun</td></tr><tr><td>Gouvernement</td><td>Peut accepter ou rejeter le texte CMP</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Sans coût spécifique, procédure parlementaire intégrée.</p>\n<h3>6. Audit Factuel</h3>\n<p>Environ 200 CMP convoquées par législature, taux d'accord de 60 à 70 %. Procédure accélérée utilisée pour près de 80 % des projets de loi depuis 2017. Le Sénat a bloqué l'inscription de l'IVG en 2021 avant son adoption en 2024.</p>\n<h3>7. Chronologie</h3>\n<p>1958 (bicamérisme inégalitaire institué) · 1969 (tentative de réforme du Sénat rejetée) · 2008 (encadrement de la procédure accélérée) · 2023 (réforme des retraites, CMP en accord) · 2024 (IVG adoptée, rôle de verrou du Sénat levé).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>Équilibres politiques</strong> : la CMP réussit mieux quand AN et Sénat ont des majorités proches</li>\n<li><strong>Calendrier législatif</strong> : la procédure accélérée réduit le temps de navette</li>\n<li><strong>Volonté du gouvernement</strong> : peut refuser le texte CMP</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<ul>\n<li><strong>Abus de la procédure accélérée</strong> : réduit le débat parlementaire</li>\n<li><strong>Sénat comme verrou</strong> : peut bloquer des réformes constitutionnelles</li>\n<li><strong>CMP opaque</strong> : négociations en dehors du regard public</li>\n</ul>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Comparaison : Allemagne (Bundesrat, droit de veto absolu sur certains textes), Royaume-Uni (Lords peuvent retarder mais pas bloquer), Italie (bicamérisme parfait, source d'instabilité).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Renforcer la qualité de la navette sans sacrifier la rapidité législative, réduire l'usage abusif de la procédure accélérée.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : maintien du système actuel</p>\n<p><strong>Scénario 2</strong> : encadrement de la procédure accélérée</p>\n<p><strong>Scénario 3</strong> : renforcement du rôle du Sénat pour certains textes</p>\n<h3>13. Faisabilité</h3>\n<p>Réforme de la procédure accélérée possible par loi organique ; renforcement du Sénat nécessite une révision constitutionnelle.</p>\n<h3>14. Temporalité</h3>\n<p>Court terme : limitation pratique de la procédure accélérée. Moyen terme : réforme institutionnelle.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : L'abus de la procédure accélérée vide la navette bicamérale de sa substance délibérative.</p>\n<p><strong>Options</strong> : Statu quo · Limitation de la procédure accélérée · Renforcement du Sénat</p>\n<p><strong>Recommandation</strong> : Limiter le recours à la procédure accélérée aux textes urgents avérés et renforcer la transparence des travaux de la CMP.</p>\n<p><strong>Sources</strong> : Article 45 Constitution — assemblee-nationale.fr — senat.fr — Rapport Jospin 2012</p>"}, {"id": "35362af8e03f818490a9c7c8fed482c8", "titre": "Le domaine de la loi (articles 34 & 37)", "theme": 1, "cat": "1.3.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>L'article 34 de la Constitution délimite le domaine de la loi — les matières dans lesquelles le Parlement légifère. L'article 37 réserve tout le reste au pouvoir réglementaire du gouvernement. Cette partition constitue une innovation majeure de la Ve République par rapport aux républiques précédentes.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 34 (liste les domaines réservés à la loi : droits civiques et libertés, nationalité, crimes et délits, assiette et taux des impôts, principes fondamentaux du droit du travail, de l'éducation, de la santé, finances publiques) · article 37 (tout ce qui n'est pas du domaine de la loi est réglementaire) · article 41 (irrecevabilité des propositions hors domaine légal) · article 40 (irrecevabilité financière).</p>\n<h3>3. Fonctionnement Concret</h3>\n<p>Le gouvernement peut opposer l'irrecevabilité (art. 41) à tout texte ou amendement hors domaine légal. En pratique, le domaine de la loi s'est élargi par jurisprudence du Conseil constitutionnel.</p>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>Gouvernement</td><td>Maître de l'ordre du jour prioritaire</td></tr><tr><td>AN + Sénat</td><td>Semaines parlementaires réservées</td></tr><tr><td>Conseil d'État</td><td>Avis sur le partage loi/règlement</td></tr><tr><td>Conseil constitutionnel</td><td>Arbitre les conflits de compétence</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Le domaine financier comprend les lois de finances et de financement de la Sécurité sociale ; la LOLF de 2001 en constitue le cadre législatif.</p>\n<h3>6. Audit Factuel</h3>\n<p>Plus de 400 lois adoptées par législature en moyenne. Inflation normative dénoncée (rapport du Conseil d'État 2016). L'article 40 est un filtre efficace mais parfois contourné.</p>\n<h3>7. Chronologie</h3>\n<p>1958 (articles 34/37, rupture avec le parlementarisme absolu) · 1959 (première décision du CC interprétant le domaine de la loi) · 2008 (partage de l'ordre du jour) · 2016 (rapport du CE sur l'inflation normative).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>Jurisprudence CC</strong> : élargissement progressif du domaine de la loi</li>\n<li><strong>Pratique gouvernementale</strong> : usage fréquent de l'irrecevabilité art. 41</li>\n<li><strong>Qualité normative</strong> : le découpage loi/règlement conditionne la lisibilité du droit</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<ul>\n<li><strong>Inflation législative</strong> : trop de lois, pas assez de délibération</li>\n<li><strong>Délégation au gouvernement</strong> : ordonnances de plus en plus fréquentes</li>\n<li><strong>Contournement de l'article 40</strong> : amendements financiers passés en force</li>\n</ul>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Les directives UE étendent parfois la liste des matières à couvrir par la loi ; la transposition législative est un enjeu constant (retards fréquents de la France).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Le respect du partage loi/règlement est une condition de la qualité normative et un enjeu d'efficacité de l'État.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : statu quo</p>\n<p><strong>Scénario 2</strong> : renforcement des articles 40 et 41</p>\n<p><strong>Scénario 3</strong> : un « Parlement légifère moins, contrôle plus »</p>\n<h3>13. Faisabilité</h3>\n<p>Application plus stricte des irrecevabilités possible immédiatement ; réforme formelle nécessite une loi organique ou une révision.</p>\n<h3>14. Temporalité</h3>\n<p>Court terme : application plus stricte des irrecevabilités existantes. Moyen terme : réforme de la procédure législative.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : L'inflation normative et le brouillage de la frontière loi/règlement nuisent à la qualité du droit et à la lisibilité de l'action publique.</p>\n<p><strong>Options</strong> : Statu quo · Renforcement des irrecevabilités · Parlement contrôleur plutôt que législateur</p>\n<p><strong>Recommandation</strong> : Appliquer strictement les irrecevabilités des articles 40 et 41, viser une réduction de 20 % du flux législatif et redéployer le temps parlementaire vers le contrôle.</p>\n<p><strong>Sources</strong> : Articles 34, 37, 40, 41 Constitution — rapport CE sur la qualité du droit 2016 — Legifrance</p>"}, {"id": "35862af8e03f810c8643c4b13843c4c9", "titre": "La procédure législative ordinaire et accélérée", "theme": 1, "cat": "1.3.3", "html": "<h3>🔁 Apports versés — 6 août 2026 (fusion de la version archivée « circuit complet, 49-3, CMP et droits de l'opposition »)</h3>\n<p>Cette fiche reste la canonique. Apports transférés :</p>\n<p><strong>Délais du circuit</strong> : avis du Conseil d'État sur les projets (3-6 semaines) · art. 42 (6 semaines minimum entre dépôt et séance en 1re lecture, 4 semaines devant la seconde chambre, hors procédure accélérée) · saisine du CC (1 mois, 8 jours en urgence) · promulgation (15 jours max).</p>\n<p><strong>Délais budgétaires (art. 47, corrigé)</strong> : 40 jours pour l'AN + 20 jours pour le Sénat, 70 jours au total pour le Parlement. À défaut d'adoption dans les délais : mise en vigueur par ordonnance ; à défaut de LFI au 31 décembre : loi spéciale (précédent utilisé en décembre 2024).</p>\n<p><strong>Tableau des outils du Gouvernement</strong> : vote bloqué (44.3) · irrecevabilité financière (40) · 49.3 (motion dans les 24h) · procédure accélérée (45 al. 2, CMP dès la 1re lecture) · lettre rectificative.</p>\n<p><strong>Droits de l'opposition</strong> : jour de séance mensuel réservé (48 al. 5) · saisine du CC à 60 députés/sénateurs · droit de tirage (une commission d'enquête par groupe et par session).</p>\n<p><strong>Précision de droit</strong> : le dernier mot de l'AN s'applique aussi aux lois organiques (majorité absolue des membres), sauf celles relatives au Sénat (vote conforme requis, art. 46 al. 4).</p>\n<h3>1. Définition & Cadre</h3>\n<p>La procédure législative ordinaire est le circuit normal d'adoption d'une loi en France. Elle débute par le dépôt d'un projet (initiative gouvernementale) ou d'une proposition (initiative parlementaire) et se termine par la promulgation par le Président de la République. Elle peut être accélérée dans certains cas.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Constitution, articles 39 à 47 · règlement de l'Assemblée nationale · règlement du Sénat · loi organique du 15 avril 2009.</p>\n<h3>3. Les Étapes</h3>\n<p>Initiative (projet ou proposition, avis du Conseil d'État obligatoire pour les projets, délibération en Conseil des ministres) → dépôt (AN ou Sénat, sauf lois de finances : AN d'abord) → examen en commission (rapporteur, amendements, vote du texte) → examen en séance publique → navette parlementaire (jusqu'à vote conforme) → CMP en cas de désaccord persistant → dernier mot à l'AN (sauf lois constitutionnelles et organiques) → promulgation (15 jours, possibilité de saisine du CC).</p>\n<h3>4. La Procédure Accélérée</h3>\n<p>Déclenchée par le Gouvernement (article 45), une seule lecture par chambre avant CMP, très utilisée (environ 80 % des projets gouvernementaux).</p>\n<h3>5. Données Clés</h3>\n<table><tr><th>Indicateur</th><th>Valeur</th></tr><tr><td>Lois adoptées par an (moyenne)</td><td>50-60</td></tr><tr><td>Délai moyen d'adoption</td><td>18 mois</td></tr><tr><td>Lois en procédure accélérée</td><td>80 %</td></tr><tr><td>Amendements déposés par an</td><td>50 000+</td></tr><tr><td>Amendements adoptés</td><td>5 000-7 000</td></tr></table>\n<h3>6. Problèmes Identifiés</h3>\n<p>Inflation législative, procédure accélérée systématisée, cavaliers législatifs, sous-utilisation du droit d'amendement de l'opposition, lois jugées bavardes ou inapplicables.</p>\n<h3>7. Comparaisons Internationales</h3>\n<p>Allemagne (procédure plus encadrée, importance du Bundesrat) · USA (commissions très puissantes, filibuster au Sénat) · Royaume-Uni (navette plus courte).</p>\n<h3>8. Synthèse Décisionnelle</h3>\n<p>La procédure législative est lourde et perméable à l'instabilité. Réformes à envisager : limiter la procédure accélérée, garantir le droit de tirage de l'opposition, simplifier la codification (suppression des cavaliers), évaluation ex post systématique.</p>"}, {"id": "35862af8e03f819b804cc219a556a946", "titre": "Les ordonnances (article 38) : législation déléguée", "theme": 1, "cat": "1.3.3", "html": "<h3>🔁 Lecture croisée — apports versés le 10 août 2026</h3>\n<p>Depuis une page archivée sur le même sujet, restée avec la mention « transfert non vérifié ».</p>\n<p><strong>Régime juridique de l'ordonnance selon l'état de ratification</strong> : avant ratification, l'ordonnance est un acte administratif attaquable par recours pour excès de pouvoir devant le Conseil d'État ; après ratification, elle acquiert force de loi et le contrôle ne peut plus passer que par la QPC devant le Conseil constitutionnel. Ce basculement déplace le juge compétent et ferme une voie de recours.</p>\n<p><strong>Dimension européenne</strong> : l'ordonnance est l'instrument privilégié de transposition des directives ; la France est en retard chronique de transposition (constat récurrent de la Commission européenne).</p>\n<p><strong>Leviers de réforme</strong> : limiter le recours (quota annuel ou champ restreint) passe par une loi organique ; rendre la ratification obligatoire dans un délai, sous peine de caducité, peut se faire par simple réforme du règlement de l'Assemblée nationale — le levier le moins coûteux.</p>\n<p><strong>Non transféré</strong> : le chiffre exact des ordonnances Covid (60 ou 71 selon les sources) n'est pas tranché, à vérifier sur Legifrance. La confusion « ordonnances travail 2017 = loi El Khomri » est fausse et écartée : la loi El Khomri est une loi ordinaire d'août 2016, distincte des ordonnances travail de 2017.</p>\n<p>> ⚠️ Cette fiche est hors trame canonique (10 sections au lieu de 15). Mise à la trame à programmer.</p>\n<h3>1. Définition & Cadre</h3>\n<p>Les ordonnances prévues à l'article 38 de la Constitution permettent au Gouvernement de prendre, dans un délai limité, des mesures normalement du domaine de la loi. C'est une législation déléguée par habilitation parlementaire, l'un des outils les plus utilisés de la Ve République (470 ordonnances depuis 1958).</p>\n<h3>2. Cadre Juridique</h3>\n<p>Constitution, article 38 · décisions du Conseil constitutionnel (notamment 24 octobre 1969) · Code des relations entre le public et l'administration.</p>\n<h3>3. Le Mécanisme</h3>\n<p>Loi d'habilitation (votée par le Parlement, définit objet/durée/limites) → rédaction par le Gouvernement (avis obligatoire du CE, délibération en Conseil des ministres, signature du PR) → publication au JO (force réglementaire) → ratification (loi expresse nécessaire pour la valeur législative ; sans elle, valeur réglementaire attaquable devant le CE).</p>\n<h3>4. Données Historiques</h3>\n<p>1958-2024 : plus de 470 ordonnances. Pic 2017-2022 sous Macron (loi Travail, ordonnances Covid). Sarkozy : 70 sur 5 ans. Hollande : 90 sur 5 ans. Macron 1er mandat : plus de 100.</p>\n<h3>5. Domaines d'Utilisation Fréquente</h3>\n<p>Codification, adaptation au droit européen, matières techniques, matières urgentes (Covid), réformes complexes (loi Travail 2017).</p>\n<h3>6. Avantages</h3>\n<p>Rapidité d'adoption, technicité gérée par les administrations, adaptation aux contraintes européennes, permet des réformes complexes.</p>\n<h3>7. Critiques</h3>\n<p>Dépossession du Parlement, contournement du débat démocratique, délai d'habilitation parfois flou, ratification souvent oubliée.</p>\n<h3>8. Le Débat sur la Ratification Implicite</h3>\n<p>Décision du 28 mai 2020 du Conseil constitutionnel : une ordonnance non ratifiée peut être considérée comme « loi » si le législateur l'a confirmée implicitement, limitant le contrôle du Conseil d'État — critiquée comme un affaiblissement de l'État de droit.</p>\n<h3>9. Comparaisons Internationales</h3>\n<p>Italie (decreti legge, plus encadrés) · Espagne (reales decretos) · Royaume-Uni (Statutory Instruments, encore plus utilisés).</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Les ordonnances sont devenues un outil normal de législation, dévoyant l'esprit initial de l'article 38. Réformes à envisager : limitation du nombre annuel, ratification automatique dans un délai (6 mois), publication systématique des avis du Conseil d'État.</p>"}, {"id": "35862af8e03f81d990b4d19fc6a195b0", "titre": "Le référendum (articles 11, 89, 72-1) et le RIP", "theme": 1, "cat": "1.3.3", "html": "<p>> 🔵 Vérification effectuée le 7 août 2026 : chantier consigné depuis longtemps sur les transferts d'une version archivée. Apports manquants intégrés : tentatives RIP 2022 (retraites) et 2024 (visas), comparaisons européennes, débat sur la réactivation du référendum, colonne « initiateur » de la table historique. Chantier clos.</p>\n<h3>1. Définition & Cadre</h3>\n<p>Le référendum est une consultation directe du peuple sur une question d'intérêt général. La Constitution de 1958 prévoit plusieurs types : législatif (article 11), constitutionnel (article 89), local (article 72-1), et partagé d'initiative parlementaire et populaire (RIP, article 11 réformé en 2008). Outil rare et risqué, le référendum a perdu en légitimité depuis le « non » au TCE en 2005 (8 référendums nationaux en 65 ans).</p>\n<h3>2. Cadre Juridique</h3>\n<p>Constitution, articles 11, 88-5, 89, 72-1 · révision constitutionnelle du 23 juillet 2008 (création du RIP) · loi organique du 6 décembre 2013 (modalités du RIP, en vigueur 2015) · Code électoral.</p>\n<h3>3. Référendum Législatif (Article 11)</h3>\n<p>Domaines : organisation des pouvoirs publics, réformes économiques/sociales/environnementales, ratification d'un traité. Initiative : Président sur proposition du Gouvernement, ou propositions conjointes des deux assemblées.</p>\n<h3>4. Le RIP (Référendum d'Initiative Partagée)</h3>\n<p>Conditions cumulatives : initiative d'1/5e des parlementaires (185), soutien d'1/10e des électeurs (≈4,87 millions de signatures), délai de 9 mois, validation du Conseil constitutionnel. Bilan : aucun RIP n'a jamais abouti — Aéroports de Paris (2019, ≈1,1 million de signatures sur 4,87 requises), retraites (2022, rejeté par le CC), visas (2024, rejeté).</p>\n<h3>5. Référendum Constitutionnel (Article 89)</h3>\n<p>Nécessaire pour les révisions constitutionnelles sauf voie du Congrès. Une seule application directe : 2000 (quinquennat). Vote concordant de l'AN et du Sénat requis au préalable.</p>\n<h3>6. Les Référendums Nationaux de la Ve République</h3>\n<table><tr><th>Date</th><th>Sujet</th><th>Résultat</th><th>Initiateur</th></tr><tr><td>28 sept. 1958</td><td>Constitution de la Ve République</td><td>Oui (82,6 %)</td><td>de Gaulle</td></tr><tr><td>8 janv. 1961</td><td>Autodétermination Algérie</td><td>Oui (75 %)</td><td>de Gaulle</td></tr><tr><td>8 avril 1962</td><td>Accords d'Évian</td><td>Oui (90 %)</td><td>de Gaulle</td></tr><tr><td>28 oct. 1962</td><td>Élection du Président au SUD</td><td>Oui (62,3 %)</td><td>de Gaulle</td></tr><tr><td>27 avril 1969</td><td>Régionalisation et réforme du Sénat</td><td>Non (52,4 %)</td><td>de Gaulle (démission)</td></tr><tr><td>23 avril 1972</td><td>Élargissement de la CEE</td><td>Oui (68,3 %)</td><td>Pompidou</td></tr><tr><td>6 nov. 1988</td><td>Statut de la Nouvelle-Calédonie</td><td>Oui (80 %)</td><td>Mitterrand</td></tr><tr><td>20 sept. 1992</td><td>Traité de Maastricht</td><td>Oui (51,04 %)</td><td>Mitterrand</td></tr><tr><td>24 sept. 2000</td><td>Quinquennat</td><td>Oui (73,2 %)</td><td>Chirac</td></tr><tr><td>29 mai 2005</td><td>Traité constitutionnel européen</td><td>Non (54,7 %)</td><td>Chirac</td></tr></table>\n<h3>7. Référendum Local (Article 72-1)</h3>\n<p>Initiative des collectivités territoriales, domaine des compétences propres, force décisionnelle sauf simple consultation. Exemples : Notre-Dame-des-Landes (2016), Nouvelle-Calédonie (2018, 2020, 2021).</p>\n<h3>8. Comparaisons Européennes</h3>\n<p>Suisse (4 à 6 référendums par an) · Italie (référendum abrogatif sur initiative populaire) · Royaume-Uni (deux référendums majeurs : Écosse 2014, Brexit 2016).</p>\n<h3>9. Débat sur la Réactivation du Référendum</h3>\n<p>Plusieurs pistes évoquées par Macron en 2024-2025 (Mayotte, fin de vie, école). Les oppositions (LFI, RN, ex-NFP) convergent sur l'abaissement des seuils du RIP.</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>Déclin du référendum après 2005, débat sur le RIC porté notamment par les Gilets jaunes, RIP en pratique inopérant (seuils jamais approchés à plus de 23 %).</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Le référendum est en sommeil depuis vingt ans et le RIP reste inutilisable en pratique. Options consignées : abaissement du seuil RIP à 500 000 signatures avec délai ramené à 6 mois, ou seuil à 1 million avec un RIC encadré sur le modèle suisse. Toute réforme du RIP nécessite une révision constitutionnelle.</p>\n<p><strong>Sources</strong> : Constitution, articles 11, 72-1, 89 — loi organique du 6 décembre 2013 — conseil-constitutionnel.fr</p>"}, {"id": "35862af8e03f81da9889e32e92d7404d", "titre": "Le droit d'amendement (article 44) : exercice et limites", "theme": 1, "cat": "1.3.3", "html": "<h3>🔁 Apports versés — 6 août 2026 (fusion de la version archivée « art. 44, art. 40 et obstruction »)</h3>\n<p>Cette fiche reste la canonique. Apports transférés :</p>\n<p><strong>Temps législatif programmé (TLP, 2009)</strong> : limite la durée globale des débats sur un texte, critiqué comme « strangulation » du débat par l'opposition.</p>\n<p><strong>Niche parlementaire (réforme 2008)</strong> : un jour de séance par mois réservé aux groupes d'opposition et minoritaires.</p>\n<p><strong>Amendements gouvernementaux tardifs</strong> : le Gouvernement peut amender en séance sans dépôt préalable, pratique des amendements massifs de dernière minute.</p>\n<p><strong>Article 41, procédure</strong> : irrecevabilité opposable par le Gouvernement pour empiètement sur le domaine réglementaire ; en cas de désaccord, le Conseil constitutionnel statue sous 8 jours.</p>\n<p><strong>Précision de droit</strong> : au titre de l'article 40, la compensation (« gage ») ne vaut que pour les pertes de recettes ; une charge nouvelle n'est jamais compensable — une version antérieure affirmait à tort le contraire.</p>\n<h3>1. Définition & Cadre</h3>\n<p>Le droit d'amendement est le pouvoir des parlementaires (et du Gouvernement) de modifier un texte en cours d'examen. C'est l'instrument central du débat législatif, encadré par l'article 44 de la Constitution, objet de tensions récurrentes entre majorité et opposition.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Constitution, article 44 · règlements des assemblées · décisions du Conseil constitutionnel sur les cavaliers législatifs.</p>\n<h3>3. Les Acteurs</h3>\n<p>Peuvent amender : tous les parlementaires, et le Gouvernement (même en séance). Ne peuvent pas amender en tant que tels : les groupes parlementaires.</p>\n<h3>4. Les Limites</h3>\n<p>Article 40 : les amendements parlementaires ne peuvent ni créer/aggraver une charge publique, ni réduire une recette publique — sanction : irrecevabilité financière, très contraignante pour l'opposition. Article 45 : les cavaliers législatifs sont irrecevables, censure stricte du Conseil constitutionnel depuis 2018. Article 41 : empiètement sur le pouvoir réglementaire, opposable par le Gouvernement.</p>\n<h3>5. Les Quotas</h3>\n<p>Vote bloqué (article 44.3) : le Gouvernement peut demander un vote unique sur tout ou partie du texte, en ne retenant que les amendements gouvernementaux ou acceptés.</p>\n<h3>6. Données Clés</h3>\n<table><tr><th>Indicateur</th><th>AN</th><th>Sénat</th></tr><tr><td>Amendements déposés/an</td><td>35 000</td><td>15 000</td></tr><tr><td>Amendements adoptés/an</td><td>4 000</td><td>3 500</td></tr><tr><td>Taux d'adoption</td><td>11 %</td><td>23 %</td></tr></table>\n<h3>7. Pratiques Problématiques</h3>\n<p>Obstruction parlementaire (dépôt massif d'amendements, ex. réforme des retraites 2023), inflation des amendements (+50 % en 10 ans), cavaliers gouvernementaux censurés a posteriori par le Conseil constitutionnel.</p>\n<h3>8. Enjeux Stratégiques</h3>\n<p>Équilibre entre droit d'opposition et efficacité législative, modernisation des procédures parlementaires, qualité de la loi.</p>\n<h3>9. Synthèse Décisionnelle</h3>\n<p>Le droit d'amendement est aujourd'hui dévoyé par l'obstruction et le contournement gouvernemental. Réformes à envisager : limitation des amendements identiques, procédure simplifiée pour les amendements techniques, droit de tirage systématique de l'opposition.</p>"}, {"id": "35962af8e03f81f19025f2cfe3ce2cbd", "titre": "Les lois organiques : nature, procédure et exemples (LOLF, LO RIP, LO magistrats)", "theme": 1, "cat": "1.3.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les lois organiques sont des lois prévues par la Constitution pour préciser les modalités d'application de certaines dispositions constitutionnelles. Elles ont une valeur supérieure aux lois ordinaires mais inférieure à la Constitution. Leur adoption est plus exigeante : majorité absolue à l'AN, contrôle obligatoire du Conseil constitutionnel, parfois veto du Sénat.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 46 de la Constitution · saisine obligatoire du Conseil constitutionnel (article 61 al. 1) · environ 70 lois organiques adoptées depuis 1958.</p>\n<h3>3. La Procédure Spécifique</h3>\n<p>Dépôt (PR, PM, parlementaires) → délai d'examen de 6 semaines avant la 1re lecture (vs 2 semaines pour les lois ordinaires) → vote (accord des deux chambres obligatoire pour les lois organiques relatives au Sénat ; majorité absolue de l'AN en cas de désaccord pour les autres) → saisine obligatoire du Conseil constitutionnel avant promulgation.</p>\n<h3>4. Domaines des Lois Organiques</h3>\n<p>Pouvoirs publics (statut des magistrats, éligibilité et incompatibilités parlementaires, statut du Conseil constitutionnel, RIP) · finances publiques (LOLF, équivalent Sécurité sociale) · collectivités territoriales (Polynésie, Nouvelle-Calédonie) · justice (CSM, CJR).</p>\n<h3>5. Lois Organiques Récentes Notables</h3>\n<p>LOLF du 1er août 2001 (révolution des finances publiques) · loi organique du 25 avril 2014 (statut des magistrats) · loi organique du 6 décembre 2013 (RIP) · loi organique du 29 mars 2011 (Défenseur des droits) · loi organique du 31 décembre 2012 (programmation pluriannuelle, HCFP).</p>\n<h3>6. Le Contrôle du Conseil Constitutionnel</h3>\n<p>Saisine obligatoire par le PM avant promulgation, délai d'1 mois (15 jours en urgence).</p>\n<h3>7. Différence avec les Lois Ordinaires</h3>\n<table><tr><th>Critère</th><th>Loi ordinaire</th><th>Loi organique</th></tr><tr><td>Vote AN si désaccord</td><td>Majorité simple</td><td>Majorité absolue</td></tr><tr><td>Sénat</td><td>AN dernier mot</td><td>Veto si concerne le Sénat</td></tr><tr><td>Contrôle CC</td><td>Facultatif</td><td>Obligatoire</td></tr><tr><td>Délai 1re lecture</td><td>2 sem.</td><td>6 sem.</td></tr></table>\n<h3>8. Le Débat sur le Statut</h3>\n<p>Avantages : stabilisation des règles fondamentales, protection contre les changements de majorité, garantie d'examen par le CC. Inconvénients : rigidité, délais plus longs, pouvoir de blocage du Sénat sur certaines.</p>\n<h3>9. Enjeux Stratégiques</h3>\n<p>Les lois organiques forment l'ossature institutionnelle complémentaire ; le RIP reste inopérant en pratique en raison de seuils trop élevés.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Préserver le statut spécifique des lois organiques + faciliter leur adoption (rationaliser la liste obligatoire) + nouvelle révision de la LOLF pour la planification pluriannuelle + abaisser les seuils du RIP + transparence des décisions du Conseil constitutionnel.</p>"}, {"id": "35962af8e03f8195baaff77f56ab1dc6", "titre": "Les lois de finances : PLF, PLFSS, LOLF, calendrier budgétaire et lois spéciales", "theme": 1, "cat": "1.3.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les lois de finances (LF) et les lois de financement de la sécurité sociale (LFSS) sont des lois spéciales votant les recettes et dépenses publiques annuelles. Le PLF et le PLFSS sont déposés en septembre/octobre, examinés rapidement, et doivent être votés avant le 31 décembre. Leur procédure est dérogatoire au droit commun.</p>\n<h3>2. Cadre Juridique</h3>\n<p>LOLF du 1er août 2001 · loi organique équivalente pour la Sécurité sociale (2005) · articles 39, 40, 47, 47-1 de la Constitution.</p>\n<h3>3. Le Calendrier Budgétaire</h3>\n<p>Avril : débat d'orientation des finances publiques. Juillet-septembre : préparation par Bercy. Avant le 1er octobre : dépôt obligatoire du PLF à l'AN. Phase parlementaire : 70 jours maximum (AN 40 jours, Sénat 20 jours, CMP 10 jours). Adoption impérative avant le 31 décembre, sous peine de loi spéciale (précédent de décembre 2024 après la censure du gouvernement Barnier).</p>\n<h3>4. La Loi Spéciale (Article 47)</h3>\n<p>Si le PLF n'est pas adopté à temps, le Gouvernement dépose une loi spéciale autorisant la perception des impôts existants. Cas de décembre 2024 : déposée le 11 décembre par le gouvernement Bayrou, adoptée le 18 décembre.</p>\n<h3>5. Les Particularités du PLF</h3>\n<p>Dépôt obligatoire à l'AN (article 39 al. 2). Article 40 (irrecevabilité des amendements diminuant les recettes ou créant des charges). Article 49.3 utilisable sans limite de fréquence sur le PLF/PLFSS, contrairement aux autres textes.</p>\n<h3>6. La Structure du PLF</h3>\n<p>Première partie (recettes et équilibre, mesures fiscales, article d'équilibre) · seconde partie (dépenses par mission, 50 missions, 200 programmes, plafonds d'emplois publics).</p>\n<h3>7. La LOLF (2001) : Révolution Budgétaire</h3>\n<p>Passage d'un budget par ministère à une logique mission/programme/action avec indicateurs de performance obligatoires. Bilan 2024 : 50 missions, 200 programmes, 380 Md€ de crédits.</p>\n<h3>8. Le PLFSS</h3>\n<p>Approuve les recettes et dépenses de la Sécurité sociale (environ 650 Md€), 4 branches (Maladie, Vieillesse, Famille, Accidents du travail), ONDAM voté. Dépôt au plus tard le 15 octobre.</p>\n<h3>9. La Pratique du PLF Sous une AN sans Majorité Absolue</h3>\n<p>Borne (plusieurs 49.3 sur PLF/PLFSS) · Barnier (motion de censure adoptée, loi spéciale nécessaire) · Bayrou (négociations multiples).</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>Le PLF est l'instrument central de la politique économique ; sans majorité absolue, son adoption devient critique, la LOLF ayant amélioré la transparence sans empêcher le contournement du débat par le 49.3.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Maintenir la spécificité du PLF + limiter le 49.3 sur PLF/PLFSS (1 max/an chacun) + assouplir l'article 40 (compensation au sein du même programme suffisante) + renforcer le débat d'orientation d'avril avec une programmation pluriannuelle obligatoire.</p>"}, {"id": "35962af8e03f816cbfa0c6309ed189e7", "titre": "La navette parlementaire et la CMP : mécanisme, statistiques et réformes", "theme": 1, "cat": "1.3.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>La navette parlementaire est le mécanisme constitutionnel par lequel un texte législatif est examiné successivement par les deux assemblées jusqu'à l'adoption d'un texte identique. Elle est régie par l'article 45 de la Constitution et peut s'éterniser ou être accélérée par différents mécanismes.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 45 de la Constitution · article 24 al. 1 · article 39 · article 42 · articles 47 et 47-1 (délais spécifiques PLF/PLFSS) · règlements des assemblées.</p>\n<h3>3. La Procédure Ordinaire</h3>\n<p>1re lecture AN → 1re lecture Sénat (vote conforme = adoption définitive, sinon retour AN) → 2e lectures successives jusqu'à accord (théoriquement infinies, en pratique 3-4 lectures maximum).</p>\n<h3>4. La Commission Mixte Paritaire (CMP)</h3>\n<p>Déclenchement après 2 lectures (ou 1 en procédure accélérée), sur décision du PM. Composition : 7 députés + 7 sénateurs, en proportion des groupes, présidence alternée. Si accord, retour dans chaque chambre sans amendement possible ; si échec, retour aux assemblées.</p>\n<h3>5. Le Dernier Mot de l'AN</h3>\n<p>Article 45 al. 4 : si la CMP échoue ou si le texte CMP est rejeté, le PM peut demander à l'AN de statuer définitivement, sauf pour les lois constitutionnelles et les lois organiques relatives au Sénat.</p>\n<h3>6. Les Statistiques 2017-2024</h3>\n<p>Textes adoptés en CMP : 65 % en 2017-2022, 50 % en 2022-2024. Textes à dernier mot AN : 25 %. Durée moyenne : 12-18 mois pour un texte ordinaire, 3-6 mois pour un texte d'urgence.</p>\n<h3>7. La Procédure Accélérée</h3>\n<p>Engagée par le PM avant la 1re lecture, une seule lecture par chambre avant CMP. Utilisée pour 60 % des textes en 2017-2022, 75 % en 2022-2024.</p>\n<h3>8. Les Cas Particuliers</h3>\n<p>Lois constitutionnelles (vote conforme, pas de dernier mot AN) · lois organiques relatives au Sénat (vote conforme requis) · lois de finances (70 jours au total) · lois de financement de la Sécurité sociale (50 jours au total).</p>\n<h3>9. La Question du Bicamérisme</h3>\n<p>Bicamérisme « inégalitaire » où l'AN dispose du dernier mot, mais le Sénat conserve un pouvoir de blocage sur les lois organiques et constitutionnelles, et une influence réelle par la qualité de son travail rédactionnel.</p>\n<h3>10. Comparaisons étrangères</h3>\n<p>USA (Conference Committee, accord obligatoire des deux chambres) · Royaume-Uni (Lords affaiblis depuis 1911) · Allemagne (Vermittlungsausschuss) · Italie (navette identique mais sans dernier mot).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>La navette est l'instrument du compromis bicaméral ; son accélération systématique réduit la qualité du débat ; le dernier mot AN est un atout pour les gouvernements faibles.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Maintenir la navette + limiter la procédure accélérée à 30 % des textes + obliger à motiver son usage + réduire les délais de CMP à 7 jours + rendre obligatoire la publication des positions de CMP.</p>"}, {"id": "35962af8e03f81dca2c6e303f2154baa", "titre": "Les secrétariats généraux des assemblées : effectifs, statut et budget", "theme": 1, "cat": "1.3.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les secrétariats généraux des assemblées (SG-AN, SG-Sénat) sont les administrations qui assurent le fonctionnement quotidien des deux chambres. Ils emploient environ 3 000 fonctionnaires parlementaires (statut sui generis) et gèrent un budget cumulé d'environ 870 M€/an.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Statut des fonctionnaires parlementaires (loi de 1958, modifiée) · autonomie administrative et financière des assemblées (art. 7 de l'ordonnance de 1958) · décisions du Bureau de chaque assemblée.</p>\n<h3>3. Le Secrétariat Général de l'AN</h3>\n<p>Environ 1 250 fonctionnaires parlementaires titulaires, 150 contractuels, 1 500 collaborateurs de députés. Services : séance et travaux parlementaires, commissions, communication, affaires européennes, informatique. Budget AN 2024 : 569 M€.</p>\n<h3>4. Le Secrétariat Général du Sénat</h3>\n<p>Environ 1 100 fonctionnaires parlementaires, 100 contractuels, 700 collaborateurs de sénateurs. Budget Sénat 2024 : 348 M€.</p>\n<h3>5. Le Statut des Fonctionnaires Parlementaires</h3>\n<p>Statut sui generis (ni fonction publique d'État, ni territoriale), recrutement par concours très sélectif, 6 catégories (administrateurs, attachés, secrétaires, agents), rémunération environ 30 % supérieure à la fonction publique d'État à grade équivalent.</p>\n<h3>6. Le Rôle Stratégique</h3>\n<p>Conseil aux parlementaires (rédaction d'amendements, contre-expertise, notes de droit constitutionnel), mémoire institutionnelle (continuité à travers les majorités), logistique (organisation des séances, gestion des immeubles, sécurité).</p>\n<h3>7. Les Innovations Récentes</h3>\n<p>Numérisation (Eloi à l'AN, AMELI au Sénat, débats vidéo en ligne, open data parlementaire) et transparence (publication des amendements en temps réel, comptes rendus publiés sous 24h).</p>\n<h3>8. Les Critiques</h3>\n<p>Coût cumulé de 870 M€/an régulièrement critiqué par la Cour des comptes, privilèges (rémunération et retraite avantageuses), opacité comptable partielle.</p>\n<h3>9. Comparaisons étrangères</h3>\n<p>USA (Congressional Research Service, environ 5 000 personnes) · Royaume-Uni (environ 3 500 personnes) · Allemagne (environ 3 000 personnes au Bundestag).</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>Les secrétariats généraux sont des administrations autonomes garantes de l'indépendance parlementaire, mais leur opacité et leur coût posent question dans un contexte de modernisation numérique encore incomplète.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Maintenir l'autonomie + audit annuel par la Cour des comptes sur le fonctionnement (hors politique) + transparence financière renforcée + ouverture des concours à davantage de profils + harmonisation partielle entre AN et Sénat.</p>"}, {"id": "35362af8e03f8110804cceca9f9be9eb", "titre": "Le Conseil constitutionnel : composition et rôle", "theme": 1, "cat": "1.4.1", "html": "<h3>🔵 Fusion — 7 août 2026 : triplon composition résorbé, socle certifié sur conseil-constitutionnel.fr</h3>\n<p>Cette fiche absorbe deux fiches archivées sur le même sujet. Composition entièrement recertifiée sur source primaire (consultée le 7 août 2026) : les deux fiches sources contenaient des erreurs de composition (membres sortants listés comme actifs, autorité de nomination erronée, deux membres absents).</p>\n<h3>1. Définition & Cadre</h3>\n<p>Le Conseil constitutionnel est l'institution chargée de veiller à la conformité des lois à la Constitution. Créé en 1958, il est passé d'un rôle marginal (« chien de garde de l'exécutif » selon de Gaulle) à une juridiction constitutionnelle majeure depuis 1971 et la QPC de 2010.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Articles 56 à 63 de la Constitution · ordonnance organique n° 58-1067 du 7 novembre 1958 · réforme constitutionnelle du 23 juillet 2008 (création de la QPC).</p>\n<h3>3. Composition — socle certifié au 7 août 2026</h3>\n<p><strong>9 membres nommés</strong> (mandat 9 ans non renouvelable, renouvellement par tiers tous les 3 ans) :</p>\n<table><tr><th>Membre</th><th>Autorité de nomination</th><th>Date</th></tr><tr><td>Richard Ferrand —

bilité face aux acteurs économiques et institutions européennes.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : maintien + rationalisation progressive</p>\n<p><strong>Scénario 2</strong> : fusion en grandes AAI sectorielles</p>\n<p><strong>Scénario 3</strong> : réintégration de certaines AAI dans des structures ministérielles renforcées</p>\n<h3>13. Faisabilité</h3>\n<p>Fusions possibles par la loi ; réintégration complexe juridiquement (contraintes européennes).</p>\n<h3>14. Temporalité</h3>\n<p>Court terme : rationalisation progressive. Moyen terme : réforme d'ensemble post-2027.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : La prolifération des AAI crée une architecture régulatoire complexe, peu lisible, avec des risques de chevauchement et de capture réglementaire.</p>\n<p><strong>Options</strong> : Maintien + rationalisation · Fusions sectorielles · Réintégration partielle</p>\n<p><strong>Recommandation</strong> : Réduire à une quinzaine d'AAI par fusions ciblées et renforcer le contrôle parlementaire par des auditions obligatoires.</p>\n<p><strong>Sources</strong> : Loi du 20 janvier 2017 — Rapport parlementaire 2017 — Cour des comptes</p>"}, {"id": "35362af8e03f8198a3fcf306e4503441", "titre": "Les agences de l'État", "theme": 1, "cat": "1.2.3", "html": "<h3>🔁 Apports versés — 6 août 2026 (fusion de la version archivée « foisonnement et rationalisation »)</h3>\n<p>Cette fiche reste la canonique. Apports transférés :</p>\n<p><strong>Typologie des structures</strong> : établissements publics nationaux (CNRS, INSERM, AFD, ADEME) · GIP (France Compétences, Campus France) · sociétés à capitaux publics (EDF 100 % depuis 2023, SNCF, La Poste) · AAI/API (CNIL, ARCOM, AMF) — seuls les « opérateurs de l'État » au sens LOLF entrent dans le périmètre budgétaire des ~70 Md€ ; les AAI et sociétés n'en font pas partie.</p>\n<p><strong>Repères sectoriels (ordres de grandeur, millésimes à confirmer)</strong> : CNRS ~33 000 agents · CEA ~20 000 · France Travail ~50-55 000 agents / ~6 Md€ · OFB ~3 000 · ANSSI ~600 · Bpifrance ~20 Md€ d'intervention/an · AFD ~12 Md€ d'engagements.</p>\n<p><strong>Historique des réformes</strong> : RGPP 2007-2012 (fusions, non-remplacement) · MAP 2012-2017 (évaluation) · AP2022 2017-2022 (économies limitées) — contradiction structurelle : France 2030 recrée des structures dédiées pendant que le discours officiel prône la rationalisation.</p>\n<p><strong>Correction de périmètre</strong> : la CNAM et la CAF ne sont pas des « agences de l'État » mais des organismes de Sécurité sociale (droit privé chargé d'un service public, financement LFSS, hors budget de l'État) — à ne jamais agréger à l'effectif des ~500 opérateurs.</p>\n<p><strong>Chiffres écartés (non vérifiés en source primaire)</strong> : « 450 opérateurs » (le décompte réel varie selon le millésime, ~430-440 récemment) · ADEME « 10 Md€ d'intervention » (incompatible avec ~900 M€ de subventions 2024) · « rapport Cour des comptes 2012 : supprimer 100+ agences » et « rapport CAE 2023 : surcoût 3-4 Md€/an » (références non recoupées).</p>\n<h3>1. Définition & Cadre</h3>\n<p>Les agences de l'État sont des structures administratives spécialisées, dotées d'une personnalité juridique propre, placées sous tutelle ministérielle. Elles exécutent des missions d'expertise, de gestion ou de mise en œuvre de politiques publiques externalisées des services centraux.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Statuts variés (établissements publics, GIP) · tutelle ministérielle · LOLF (les agences sont des « opérateurs de l'État ») · contrats de performance · contrôle de la Cour des comptes.</p>\n<h3>3. Fonctionnement Concret</h3>\n<table><tr><th>Agence</th><th>Tutelle</th><th>Mission</th></tr><tr><td>ANSES</td><td>Agriculture/Santé</td><td>Sécurité sanitaire</td></tr><tr><td>ADEME</td><td>Transition écologique</td><td>Environnement</td></tr><tr><td>ANR</td><td>Recherche</td><td>Financement recherche</td></tr><tr><td>Bpifrance</td><td>Économie</td><td>Financement entreprises</td></tr><tr><td>Santé publique France</td><td>Santé</td><td>Veille épidémiologique</td></tr><tr><td>France Travail</td><td>Travail</td><td>Emploi</td></tr></table>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>Ministère de tutelle</td><td>Fixe les objectifs, nomme le DG</td></tr><tr><td>Directeur général</td><td>Dirige l'agence</td></tr><tr><td>Conseil d'administration</td><td>Gouvernance</td></tr><tr><td>Cour des comptes</td><td>Contrôle</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>~500 opérateurs recensés. Dotations totales : ~70 Md€/an. Environ 400 000 agents dans les opérateurs. France Travail seul : ~50 000 agents, ~6 Md€/an.</p>\n<h3>6. Audit Factuel</h3>\n<p>Rapport Cour des comptes 2022 : le système des agences est « peu lisible, coûteux, peu évalué ». ADEME : 1 000 agents, 900 M€ de subventions (2024). ANR : 900 M€ de crédits annuels.</p>\n<h3>7. Chronologie</h3>\n<p>Années 1990 (multiplication des agences, new public management) · 2007 (RGPP) · 2017 (Action publique 2022) · 2022 (rapport Cour des comptes critique) · 2023 (France Travail remplace Pôle emploi).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>Budget de l'État</strong> : dotations en LFI</li>\n<li><strong>Politique sectorielle</strong> : les agences exécutent les priorités du ministère de tutelle</li>\n<li><strong>Droit UE</strong> : certaines agences transposent des obligations communautaires</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<ul>\n<li><strong>Foisonnement incontrôlé</strong> : chevauchements, coûts administratifs élevés</li>\n<li><strong>Dilution des responsabilités</strong> : le ministère peut se déresponsabiliser derrière l'agence</li>\n<li><strong>Manque d'évaluation</strong> : peu d'agences font l'objet d'une évaluation systématique</li>\n</ul>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Certaines agences sont le point de contact national d'agences européennes (EFSA pour ANSES, EMA pour ANSM). La Commission européenne dispose elle-même d'une trentaine d'agences.</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>La rationalisation des agences est un levier de maîtrise des dépenses publiques, mais certaines sont essentielles à l'expertise technique indépendante de l'État.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : maintien + évaluation systématique</p>\n<p><strong>Scénario 2</strong> : réduction forte (objectif -30 % d'agences)</p>\n<p><strong>Scénario 3</strong> : réintégration des agences de gestion dans les ministères</p>\n<h3>13. Faisabilité</h3>\n<p>Fusions/suppressions possibles par décret ou loi, avec un risque social et politique réel.</p>\n<h3>14. Temporalité</h3>\n<p>Court terme : revue systématique des opérateurs. Moyen terme : fusions et suppressions progressives (2025-2028).</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : Le système des ~500 agences est opaque, coûteux et peu évalué, diluant la responsabilité politique.</p>\n<p><strong>Options</strong> : Maintien + évaluation · Réduction ciblée · Réintégration partielle</p>\n<p><strong>Recommandation</strong> : Mener une revue complète des opérateurs, supprimer ou fusionner ceux dont la valeur ajoutée n'est pas démontrée, instaurer une évaluation quinquennale obligatoire.</p>\n<p><strong>Sources</strong> : LOLF — Rapport Cour des comptes 2022 — DGFiP — Jaune budgétaire « Opérateurs »</p>"}, {"id": "35362af8e03f81018ff1c178af2e5d24", "titre": "La coordination interministérielle", "theme": 1, "cat": "1.2.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>La coordination interministérielle est l'ensemble des mécanismes permettant d'assurer la cohérence de l'action gouvernementale entre des ministères aux intérêts et logiques parfois divergents. Elle est assurée par plusieurs outils : réunions interministérielles, arbitrages du PM, SGG, circulaires.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 21 (le PM dirige l'action du gouvernement) · circulaires du PM sur l'organisation du travail gouvernemental · décrets d'attribution · réunions interministérielles (cadre informel mais outil principal) · conseils restreints présidés par le PR.</p>\n<h3>3. Fonctionnement Concret</h3>\n<p>Outils : réunions interministérielles (RIM, présidées par un représentant du PM), SGG (coordination procédurale et juridique), arbitrages du PM, conseils de défense/sécurité pour les sujets régaliens, préfets de mission pour des politiques transversales, délégations interministérielles ad hoc.</p>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>PM</td><td>Arbitre final</td></tr><tr><td>SGG</td><td>Coordinateur procédural</td></tr><tr><td>Cabinets ministériels</td><td>Négociateurs politiques</td></tr><tr><td>PR</td><td>Tranche les arbitrages politiques majeurs</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Budget de coordination (programme 129) : ~700 M€. Délégations interministérielles : ~100 M€. SGG : ~200 agents.</p>\n<h3>6. Audit Factuel</h3>\n<p>Plus de 3 000 réunions interministérielles estimées par an. La Cour des comptes souligne le manque de suivi des décisions interministérielles. Chaque grande réforme mobilise 5 à 10 ministères.</p>\n<h3>7. Chronologie</h3>\n<p>1958 (mise en place des RIM) · 1989 (CIACT, aménagement du territoire) · 2017 (comité interministériel de la transformation publique) · 2020 (comité interministériel du plan de relance) · 2023 (Conseil national de la refondation).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>Relation Élysée/Matignon</strong> : clef de la coordination politique</li>\n<li><strong>Culture administrative</strong> : logiques de silo difficiles à briser</li>\n<li><strong>Volonté politique du PM</strong> : seul arbitre formel entre ministères</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<ul>\n<li><strong>Silotage ministériel</strong> : chaque ministère défend son périmètre et son budget</li>\n<li><strong>Double pyramide Élysée/Matignon</strong> : les conseillers élyséens peuvent court-circuiter la coordination</li>\n<li><strong>Surcharge procédurale</strong> : trop de réunions sans décision, suivi défaillant</li>\n</ul>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Le SGAE coordonne les positions françaises à Bruxelles entre ministères, alimentant le COREPER.</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>La qualité de la coordination interministérielle conditionne l'efficacité des grandes politiques transversales (transition écologique, numérique, sécurité nationale).</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : amélioration incrémentale des mécanismes existants</p>\n<p><strong>Scénario 2</strong> : création d'un Secrétariat interministériel puissant (modèle UK Cabinet Office)</p>\n<p><strong>Scénario 3</strong> : numérisation de la coordination (tableau de bord, suivi en temps réel)</p>\n<h3>13. Faisabilité</h3>\n<p>Améliorations procédurales possibles à court terme ; réforme structurelle à moyen terme.</p>\n<h3>14. Temporalité</h3>\n<p>Court terme : outils numériques de suivi. Moyen terme : réforme organisationnelle.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : La coordination interministérielle est insuffisante pour les politiques transversales majeures. Le silotage ministériel et la double pyramide Élysée/Matignon créent des incohérences.</p>\n<p><strong>Options</strong> : Optimisation des mécanismes actuels · Secrétariat interministériel fort · Numérisation</p>\n<p><strong>Recommandation</strong> : Renforcer le SGG comme pivot de coordination, créer un tableau de bord numérique des décisions interministérielles, réduire le nombre de RIM au profit de décisions plus claires.</p>\n<p><strong>Sources</strong> : gouvernement.fr — Cour des comptes — OCDE</p>"}, {"id": "35362af8e03f81d094d7c8683730fc63", "titre": "Le Secrétariat Général de la Présidence (SGPR)", "theme": 1, "cat": "1.2.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le Secrétariat général de la Présidence de la République (SGPR) est la structure permanente et technique de l'Élysée. Distinct du cabinet politique du Président, il assure la continuité institutionnelle de la Présidence, coordonne avec le SGG (Matignon) et suit les dossiers transversaux d'importance stratégique.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Structure interne créée par décision présidentielle, sans base constitutionnelle propre. Rattaché au programme 102 (Présidence de la République) en LFI. Personnel : fonctionnaires détachés et contractuels.</p>\n<h3>3. Fonctionnement Concret</h3>\n<p>Missions : suivi des décisions prises en Conseil des ministres, coordination avec le SGG pour les arbitrages interministériels escaladés au PR, gestion des procédures de nomination aux emplois supérieurs relevant du PR, suivi de l'agenda législatif à impact présidentiel, conservation des archives. Interface clé : le SG de la Présidence parle directement au SG du Gouvernement.</p>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>Secrétaire général de l'Élysée</td><td>Dirige le SGPR, « premier collaborateur » du PR</td></tr><tr><td>SG adjoint</td><td>Appui général</td></tr><tr><td>SGG (Matignon)</td><td>Homologue gouvernemental</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Intégré au budget global de l'Élysée (~105 M€). Personnel SGPR strict : ~50 agents permanents.</p>\n<h3>6. Audit Factuel</h3>\n<p>Secrétaires généraux mémorables : Dominique de Villepin (Chirac), Claude Guéant (Sarkozy), Alexis Kohler (Macron, depuis 2017, le plus long SG de la Ve République, mis en cause devant le PNF). La Cour des comptes préconise plus de transparence sur le rôle du SGPR.</p>\n<h3>7. Chronologie</h3>\n<p>1958 (institutionnalisation du cabinet présidentiel) · 1969 (renforcement sous Pompidou) · 2007 (montée en puissance sous Sarkozy) · 2017 (Kohler SG, rôle majeur de coordination) · 2022 (SGPR renforcé en contexte de gouvernement minoritaire).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>Relation PR/PM</strong> : la qualité SGPR/SGG reflète celle du couple exécutif</li>\n<li><strong>Agenda présidentiel</strong> : les priorités du SGPR suivent celles du PR</li>\n<li><strong>Nominations supérieures</strong> : le SGPR instruit les dossiers de nomination</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<ul>\n<li><strong>Opacité</strong> : rôle non précisément défini dans un texte public</li>\n<li><strong>Court-circuitage de Matignon</strong> : le SGPR peut donner des instructions directes aux ministères</li>\n<li><strong>Affaire Kohler</strong> : mise en examen pour prise illégale d'intérêts, tension institutionnelle</li>\n</ul>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Le SGPR coordonne les « sherpas » pour les sommets européens (Conseil européen, G7, G20), en interface avec le SGAE pour les arbitrages présidentiels.</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Le SGPR est un pouvoir de fait non encadré par les textes, dont la puissance dépend de la personnalité du SG et de la confiance du PR — sa montée en puissance peut affaiblir l'autorité du PM.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : maintien du système actuel, non formalisé</p>\n<p><strong>Scénario 2</strong> : décret d'organisation formalisant le rôle du SGPR</p>\n<p><strong>Scénario 3</strong> : fusion SGPR/SGG en structure exécutive unifiée sous le PM</p>\n<h3>13. Faisabilité</h3>\n<p>Décret d'organisation possible et souhaitable ; fusion très complexe politiquement.</p>\n<h3>14. Temporalité</h3>\n<p>Court terme : formalisation par décret. Long terme : question soulevée dans toute réforme institutionnelle majeure.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : Le SGPR est un centre de pouvoir réel mais non formalisé, dont le poids peut déséquilibrer la relation exécutive au détriment de Matignon.</p>\n<p><strong>Options</strong> : Non formalisation · Décret d'organisation · Fusion SGPR/SGG</p>\n<p><strong>Recommandation</strong> : Formaliser le rôle du SGPR par décret, clarifier ses relations avec le SGG, renforcer la transparence sur les nominations instruites par la Présidence.</p>\n<p><strong>Sources</strong> : elysee.fr — LFI 2024 (programme 102) — Cour des comptes</p>"}, {"id": "35862af8e03f81afacc0e6ffd69cd586", "titre": "Les cabinets ministériels : composition, rôle politique et limitation", "theme": 1, "cat": "1.2.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les cabinets ministériels sont les équipes politiques entourant chaque ministre. Composés de conseillers techniques et de chefs de cabinet, ils sont l'interface entre le politique et l'administration. Critiqués pour leur opacité et leur coût, leur taille a été réduite par décret depuis 2017.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Décret n° 2017-1063 du 18 mai 2017 (limitation des cabinets) · décret du 28 juillet 1948 (statut des conseillers techniques) · article 21 de la Constitution (pouvoir de nomination du PM).</p>\n<h3>3. Composition Type d'un Cabinet</h3>\n<p>Directeur de cabinet (haut fonctionnaire, pilote l'équipe) · directeur adjoint · chef de cabinet (agenda, relations avec les élus) · conseillers techniques par domaine · conseillers presse, parlementaire, communication.</p>\n<h3>4. Limitation des Effectifs (Décret 2017)</h3>\n<p>Ministre de plein exercice : 10 conseillers maximum. Ministre délégué : 8 maximum. Secrétaire d'État : 5 maximum. Premier ministre : 50 conseillers. Président : 50-60 conseillers.</p>\n<h3>5. Le Rôle Politique</h3>\n<p>Filtrer les notes administratives, préparer les arbitrages, anticiper les crises politiques, faire le lien avec les parlementaires de la majorité, assurer la communication politique.</p>\n<h3>6. La Frontière avec l'Administration</h3>\n<p>Tension structurelle entre le cabinet et les directeurs d'administration centrale (DAC) : le directeur de cabinet a théoriquement autorité sur les DAC, mais ceux-ci détiennent l'expertise et la continuité.</p>\n<h3>7. Coûts et Critiques</h3>\n<p>Avant 2017, certains cabinets dépassaient 50 personnes. Coût total des cabinets sous Hollande : ~70 M€/an, ramené à ~40 M€/an après 2017. Critiques : opacité des nominations, rémunérations élevées, multiplication des conseillers élyséens en parallèle.</p>\n<h3>8. Les Trajectoires</h3>\n<p>Pantouflage fréquent (passage public → privé). Environ 70 % des conseillers retournent dans la fonction publique. Trajectoire type : cabinet → direction d'administration centrale ou préfecture.</p>\n<h3>9. La Comparaison Internationale</h3>\n<p>France : cabinets politiques séparés de l'administration. Royaume-Uni : « SpAds » limités. Allemagne : peu de conseillers politiques. USA : très forte politisation (5 000 nominations politiques).</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Les cabinets sont indispensables à la décision politique mais leur taille reste excessive. Réformes : transparence des nominations et des rémunérations, simplification de l'interface cabinet-administration, interdiction de pantouflage pendant 5 ans.</p>"}, {"id": "35862af8e03f81c1acccf3ec6229a9e9", "titre": "Les directions interministérielles : DINUM, DITP, DGAFP, SGAE et coordination", "theme": 1, "cat": "1.2.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les directions interministérielles sont des structures placées auprès du Premier ministre, chargées de piloter des politiques transversales à plusieurs ministères. Elles ont un pouvoir d'impulsion et de coordination, mais peu d'autorité hiérarchique sur les ministères.</p>\n<h3>2. Les Principales Directions Interministérielles</h3>\n<p><strong>DINUM</strong> (Direction Interministérielle du Numérique) : successeur de la DISIC/DINSIC, pilote la transformation numérique de l'État (FranceConnect, beta.gouv.fr, Albert), ~200 agents, budget ~50 M€/an.</p>\n<p><strong>DITP</strong> (Direction Interministérielle de la Transformation Publique) : créée en 2017, pilote « Action Publique 2022 », ~90 agents.</p>\n<p><strong>DGAFP</strong> (Direction Générale de l'Administration et de la Fonction Publique) : créée en 1959, pilote la politique RH de la fonction publique d'État, ~250 agents.</p>\n<p><strong>DGCL</strong> (Direction Générale des Collectivités Locales) : pilote les relations avec les collectivités, sous tutelle du ministère de l'Intérieur.</p>\n<p><strong>SGAE</strong> : coordination de la position française vis-à-vis de l'UE, ~200 agents.</p>\n<h3>3. Les Missions Interministérielles</h3>\n<p>MIVILUDES (dérives sectaires) · MIPROF (protection des femmes victimes de violence) · MILDECA (lutte contre les addictions) · DILA (information légale et administrative).</p>\n<h3>4. La Coordination Interministérielle au Quotidien</h3>\n<p>Réunions interministérielles préparées par le SGG, arbitrages à Matignon, comités interministériels spécialisés (CIH, CISR, CIMER...).</p>\n<h3>5. Données Clés</h3>\n<p>Effectifs DINUM + DITP : environ 290 agents. Budget DINUM : 50 M€/an. Environ 30 comités interministériels actifs. Beta.gouv : 90 startups d'État. 70 % des Français utilisent FranceConnect.</p>\n<h3>6. Les Réussites</h3>\n<p>FranceConnect (authentification unique pour 1 200 services en ligne), Albert (IA publique déployée dans plus de 100 administrations), Service Public+ (amélioration mesurée de la qualité de service).</p>\n<h3>7. Les Critiques</h3>\n<p>Sous-effectifs face à l'ambition affichée, dépendance aux cabinets de conseil externes (affaire McKinsey), manque d'autorité face aux ministères.</p>\n<h3>8. Synthèse Décisionnelle</h3>\n<p>Les directions interministérielles sont essentielles à la transformation publique mais sous-dotées et peu visibles. Renforcement nécessaire : doublement des effectifs DINUM/DITP, réduction de l'externalisation, création d'une autorité hiérarchique sur les systèmes d'information ministériels.</p>"}, {"id": "35862af8e03f8153bb3ad8a96bfdf174", "titre": "Le Conseil de défense et de sécurité nationale (CDSN)", "theme": 1, "cat": "1.2.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le Conseil de défense et de sécurité nationale (CDSN) est une instance de décision présidée par le Président de la République, réunissant les principaux ministres et conseillers en charge de la sécurité nationale. Créé par décret en 1958, son rôle s'est considérablement élargi sous les présidences Sarkozy, Hollande et Macron, devenant le centre névralgique de la décision stratégique française. Pendant la crise Covid (2020-2022), il s'est réuni quasi quotidiennement, suscitant des débats sur la dérive démocratique.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 15 de la Constitution (Président chef des armées) · décret n° 2009-1657 du 24 décembre 2009 (modifié 2017) · Code de la défense · secret-défense couvrant les délibérations.</p>\n<h3>3. Composition</h3>\n<p>Membres permanents : Président (préside), Premier ministre, ministre de la Défense, ministre de l'Intérieur, ministre des Affaires étrangères, ministre de l'Économie, chef d'état-major des armées, SGDSN. Membres invités selon l'ordre du jour : directeurs DGSE, DGSI, DGSN, DGGN, autres ministres concernés, experts thématiques.</p>\n<h3>4. Fonctionnement</h3>\n<p>Réunion à l'Élysée, pas de procès-verbal public, secret-défense, fréquence variable (hebdomadaire en période normale, quotidienne en crise).</p>\n<h3>5. Domaines de Compétence</h3>\n<p>Défense militaire, renseignement, lutte antiterroriste, sécurité économique, cybersécurité, crises sanitaires (depuis Covid), crises énergétiques, souveraineté numérique.</p>\n<h3>6. Formations Spécialisées</h3>\n<p>Conseil national du renseignement (CNR) · Conseil de défense écologique (CDE) · Conseil de défense sanitaire (créé en 2020) · Conseil de défense énergétique (créé en 2022).</p>\n<h3>7. Critiques et Débats</h3>\n<p>Opacité totale (secret-défense), court-circuitage du Conseil des ministres, décisions prises sans contrôle parlementaire. Pendant le Covid, plus de 100 conseils de défense sanitaire en 2020-2022, le Conseil constitutionnel ayant confirmé la légalité du dispositif face aux recours.</p>\n<h3>8. Données Clés</h3>\n<table><tr><th>Année</th><th>Conseils de défense</th></tr><tr><td>2017</td><td>25</td></tr><tr><td>2019</td><td>32</td></tr><tr><td>2020</td><td>102 (Covid)</td></tr><tr><td>2021</td><td>87</td></tr><tr><td>2022</td><td>65 (Ukraine + énergie)</td></tr><tr><td>2024</td><td>52 (élections, JO, Trump)</td></tr></table>\n<h3>9. Synthèse Décisionnelle</h3>\n<p>Outil nécessaire face aux crises, mais avec une dérive vers un mode de gouvernement parallèle. Réformes à envisager : limitation légale des sujets relevant du Conseil de défense, information du Parlement (commission ad hoc) sur les décisions hors défense pure, publication des ordres du jour (pas du contenu).</p>"}, {"id": "35862af8e03f81ff984df4a8d5c0693e", "titre": "Les préfets et la déconcentration : architecture de l'État territorial", "theme": 1, "cat": "1.2.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les préfets et la déconcentration constituent l'architecture de l'État territorial. Le préfet est le représentant de l'État dans les départements et les régions. La déconcentration consiste à déléguer du pouvoir central vers les services déconcentrés (à distinguer de la décentralisation, transfert vers les collectivités territoriales).</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 72 de la Constitution · décret du 29 avril 2004 (pouvoirs des préfets) · charte de la déconcentration (loi du 6 février 1992) · loi NOTRe (2015, redessine les compétences régionales).</p>\n<h3>3. Le Préfet — Statut</h3>\n<p>Haut fonctionnaire nommé en Conseil des ministres. Hiérarchie : préfet de région > préfets de département. 18 préfets de région, 101 préfets de département, 7 préfets de zone de défense. Révocable à tout moment.</p>\n<h3>4. Pouvoirs du Préfet</h3>\n<p>Représentation de l'État (gouvernement et chaque ministre), direction des services déconcentrés. Pouvoirs de police générale et spéciale (immigration, ICPE, OQTF). Contrôle de légalité des actes des collectivités territoriales, avec déféré préfectoral (environ 7 millions d'actes contrôlés par an en 2024).</p>\n<h3>5. Les Services Déconcentrés</h3>\n<table><tr><th>Niveau</th><th>Direction</th></tr><tr><td>Régional</td><td>DREAL, DRAAF, DREETS, DRAJES, Académie</td></tr><tr><td>Départemental</td><td>DDT, DDPP, DDETS</td></tr></table>\n<h3>6. La Réforme RéaTE (2010)</h3>\n<p>Fusion des directions régionales (de 35 à 8 par région), fusion DRE+DRIRE+DIREN en DREAL, objectif de simplification et d'économies, avec des critiques sur l'éloignement des usagers.</p>\n<h3>7. Les Réformes Macron</h3>\n<p>Plan Préfectures Nouvelle Génération (2017) : recentrage sur les missions régaliennes, dématérialisation des titres, suppression de 1 500 emplois en préfecture (2017-2022). Plan Souveraineté (2022) : recentrage de 250 sous-préfectures, sous-préfets réinstaurés comme animateurs territoriaux.</p>\n<h3>8. Données Clés 2024</h3>\n<p>119 préfets en exercice, 240 sous-préfets, 230 000 agents dans les services déconcentrés. Budget préfectoral : 1,8 Md€/an (programme 354).</p>\n<h3>9. Problèmes Actuels</h3>\n<p>Déliquescence des sous-préfectures, confusion entre les multiples acteurs territoriaux (préfet + DDT + agences), sous-effectifs en préfecture face à la complexité, politisation croissante des nominations.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Le préfet reste un pivot indispensable, mais l'État territorial est affaibli : recentrer les préfectures sur le contrôle de légalité et l'accompagnement des maires, dépolitiser les nominations, restaurer la centralité du préfet face à la prolifération des agences.</p>"}, {"id": "35962af8e03f8149a9f8c704114a7a42", "titre": "Les grands corps de l'État et la haute fonction publique : INSP, X, IGF, Mines", "theme": 1, "cat": "1.2.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les grands corps de l'État sont des corps de la haute fonction publique française dotés d'un prestige particulier et de prérogatives spécifiques. Ils forment l'épine dorsale de l'administration et fournissent une grande partie des dirigeants des ministères, AAI, entreprises publiques et du secteur privé. La réforme de la haute fonction publique (2022) a profondément modifié leur statut.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi du 13 juillet 1983 (statut général des fonctionnaires) · ordonnance n° 2021-702 du 2 juin 2021 (réforme de la haute fonction publique) · décrets spécifiques par corps · création du corps des administrateurs de l'État.</p>\n<h3>3. Les Grands Corps Historiques</h3>\n<table><tr><th>Corps</th><th>Création</th><th>Effectifs</th></tr><tr><td>Conseil d'État</td><td>1799</td><td>~300 membres</td></tr><tr><td>Cour des comptes</td><td>1807</td><td>~400 magistrats</td></tr><tr><td>IGF</td><td>1816</td><td>~250</td></tr><tr><td>IGA</td><td>1907</td><td>~50</td></tr><tr><td>IGAS</td><td>1969</td><td>~120</td></tr></table>\n<p>Corps techniques : Mines (1794), Ponts et Chaussées (1716), Télécommunications (1968), Eaux et Forêts (1820), Armement (1968).</p>\n<h3>4. La Réforme de 2022</h3>\n<p>Création du Corps des Administrateurs de l'État, fusionnant les anciens corps (préfets, ambassadeurs, inspecteurs, sous-préfets). Disparition de l'ENA statutaire, accès par concours via l'INSP. Mobilité obligatoire : au moins 4 ans sur deux postes différents avant titularisation, objectif de casser la « caste ».</p>\n<h3>5. L'INSP (ex-ENA)</h3>\n<p>Créé en 2022 en remplacement de l'ENA (créée en 1945). Strasbourg et Paris, 100 élèves/an, recrutement par 3 voies (externe, interne, 3e voie), affectation par fonction plutôt que classement de sortie.</p>\n<h3>6. Les Polytechniciens et les X-Corps</h3>\n<p>École polytechnique créée en 1794, statut militaire, 500 élèves/an. Environ 30 % des polytechniciens intègrent un grand corps technique (Mines, Ponts, Télécoms, Armement), donnant accès aux directions et grandes entreprises.</p>\n<h3>7. Le Pantouflage</h3>\n<p>Passage du public au privé, notamment vers les grandes entreprises. Encadré par l'article 432-13 du Code pénal (interdiction pendant 3 ans) et l'autorisation de la HATVP. Débat récurrent sur les conflits d'intérêts et le drainage des compétences.</p>\n<h3>8. La Répartition des Pouvoirs</h3>\n<p>Les grands corps dominent une grande partie des directions des ministères économiques (IGF, X), des grandes entreprises publiques, et la totalité des juridictions administrative (Conseil d'État) et financière (Cour des comptes) suprêmes.</p>\n<h3>9. Les Critiques</h3>\n<p>Reproduction sociale marquée (majorité des élèves de l'INSP issus des catégories socioprofessionnelles supérieures), domination des grandes écoles parisiennes, élite jugée fermée avec une faible mobilité sociale.</p>\n<h3>10. Comparaisons Internationales</h3>\n<p>USA (pas de « grand corps » systématique, « senior executive service ») · Royaume-Uni (Civil Service, « fast stream ») · Allemagne (carrières spécialisées sans corps unique) · Japon (kanryō, bureaucrates d'élite).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>La réforme de 2022 est ambitieuse mais ses résultats restent incertains. La haute fonction publique demeure un écosystème perçu comme fermé, dans un contexte de politisation croissante.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Évaluation rigoureuse de la réforme 2022 à 5 ans + diversification du recrutement à l'INSP + création d'une voie d'entrée tardive pour les cadres du privé + réglementation renforcée du pantouflage (5 ans) + transparence sur la composition des corps.</p>"}, {"id": "35962af8e03f81e79247f9638346e2c1", "titre": "Le Conseil d'État consultatif : avis, sections administratives et publication", "theme": 1, "cat": "1.2.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le Conseil d'État est l'organe consultatif majeur de l'exécutif français. Sa fonction consultative remonte à 1799 et est aujourd'hui essentielle dans le processus législatif et réglementaire : tout projet de loi et tout décret en Conseil d'État doit recevoir un avis consultatif. C'est à la fois le « juge des juges » et le « conseiller de l'État ».</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 39 al. 2 de la Constitution (avis sur projets de loi) · articles 37, 37-1, 38 (consultation pour textes réglementaires) · Code de justice administrative · loi du 24 mai 1872.</p>\n<h3>3. La Mission Consultative</h3>\n<p>5 sections administratives : intérieur, finances, sociale, travaux publics, administration. Pour les projets de loi : consultation obligatoire avant Conseil des ministres, avis non publié par défaut, non contraignant mais souvent suivi. Pour les ordonnances : même régime que les projets de loi. Pour les décrets : décrets en Conseil d'État soumis à consultation, décrets simples non soumis.</p>\n<h3>4. La Composition du Conseil d'État</h3>\n<p>Environ 300 membres : vice-président (chef effectif, le PM étant président formel), présidents de section, conseillers d'État, maîtres des requêtes, auditeurs. Origines : sortie de l'INSP/ancienne ENA, tour extérieur (nomination directe par le PR, environ 30 %), magistrats des TA et CAA.</p>\n<h3>5. La Section du Contentieux</h3>\n<p>Fonction juridictionnelle de juge suprême de l'administration : 10 chambres, sections réunies, assemblée du contentieux, environ 10 000 affaires par an, en premier ressort, en appel ou en cassation.</p>\n<h3>6. L'Article 39 al. 2 : Révolution de 2008</h3>\n<p>Depuis 2008, le président de l'Assemblée nationale ou du Sénat peut soumettre une proposition de loi pour avis au Conseil d'État, renforçant la sécurité juridique des textes parlementaires (auparavant réservée aux seuls projets de loi du Gouvernement).</p>\n<h3>7. La Publication des Avis</h3>\n<p>Avant 2015 : avis confidentiels. Décret du 11 mars 2015 : publication à la discrétion du Gouvernement. Depuis 2018 (annonce Macron) : la majorité des avis sont publiés. Avantages : transparence démocratique, débat public éclairé. Inconvénients : risque d'autocensure du Conseil, politisation du débat juridique.</p>\n<h3>8. Les Avis Marquants Récents</h3>\n<p>Réforme des retraites (2023) : le CE valide le recours au PLFSS. Loi immigration (2023) : le CE alerte sur des fragilités constitutionnelles, confirmées ensuite par 35 articles censurés par le Conseil constitutionnel.</p>\n<h3>9. Les Débats sur le Conseil d'État</h3>\n<p>Confusion des fonctions (membre-conseiller et membre-juge), risque de partialité malgré un strict respect procédural. La CEDH a condamné un cumul similaire au Luxembourg (arrêt Procola, 1995), amenant la France à réformer pour séparer davantage les fonctions.</p>\n<h3>10. Comparaisons étrangères</h3>\n<p>Allemagne (pas de Conseil d'État, organes différents) · Italie (Consiglio di Stato) · Espagne (Consejo de Estado) · Royaume-Uni (pas d'équivalent, common law).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Le Conseil d'État est un garde-fou essentiel dont la transparence accrue est positive, mais la confusion des fonctions reste débattue.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Maintenir le double rôle (efficacité prouvée) + rendre obligatoire la publication systématique des avis + séparer le personnel entre les deux fonctions + rendre publics les critères de nomination au tour extérieur.</p>"}, {"id": "35962af8e03f8124abaafe973ff7451b", "titre": "Les circulaires et instructions ministérielles : valeur, publication et contrôle", "theme": 1, "cat": "1.2.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les circulaires et instructions ministérielles sont les actes administratifs par lesquels les ministres organisent leurs services et explicitent l'application des lois et règlements. Elles sont essentielles à la mise en œuvre des politiques publiques, mais ont une valeur juridique limitée (en principe, elles ne créent pas de droit).</p>\n<h3>2. Cadre Juridique</h3>\n<p>Décret du 8 décembre 2008 sur la publication des circulaires et instructions · décret du 25 mai 2011 (modificatif) · Code des relations entre le public et l'administration (art. L. 312-2 à L. 312-4) · jurisprudence Crédit Foncier de France (CE, 1969) et Mme Duvignau (CE, 2002).</p>\n<h3>3. Typologie des Circulaires</h3>\n<p>Circulaires interprétatives (explicitent un texte, sans force juridique propre) · circulaires réglementaires (créent du droit, en principe illégales, annulables par le juge) · instructions (adressées à des subordonnés, caractère hiérarchique) · notes de service (très opérationnelles).</p>\n<h3>4. La Publication Obligatoire</h3>\n<p>Depuis 2008, toute circulaire doit être publiée sur circulaires.legifrance.gouv.fr sous 4 mois, sous peine de non-opposabilité. Volumétrie : 200 à 400 circulaires publiées par an, sur un stock historique de plus de 30 000 en vigueur (grand déstockage en 2017, -15 000 circulaires obsolètes).</p>\n<h3>5. Les Circulaires Célèbres et Polémiques</h3>\n<p>Circulaire Guéant 2011 (restriction de l'accès au marché du travail des diplômés étrangers, annulée par le Conseil d'État) · circulaire Castaner 2018-2019 (frontière italienne, contestée) · circulaire Darmanin 2023 (régularisations) · circulaire Attal 2024 (abayas à l'école, validée par le CE).</p>\n<h3>6. La Hiérarchie Administrative</h3>\n<p>Sources subordonnées, du plus haut au plus bas : lois, décrets, arrêtés ministériels, circulaires, notes. Force impérative pour les agents (devoir hiérarchique, sauf illégalité manifeste) ; pour les administrés, seulement si la circulaire est interprétative et invocable.</p>\n<h3>7. Le Recours Contre Une Circulaire</h3>\n<p>Recours pour excès de pouvoir devant le Conseil d'État, délai de 2 mois, caractère impératif requis. La décision GISTI (2020) a élargi les recours possibles à toute disposition générale et impérative.</p>\n<h3>8. Comparaisons étrangères</h3>\n<p>USA (Federal Register, Code of Federal Regulations) · Royaume-Uni (Government Circulars) · Allemagne (Verwaltungsvorschriften).</p>\n<h3>9. Enjeux Stratégiques</h3>\n<p>Les circulaires sont l'outil de pilotage quotidien de l'État, mais leur prolifération crée une « loi parallèle » d'environ 100 000 normes. La publication depuis 2008 a apporté de la transparence.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Garder la structure actuelle + renforcer l'examen préalable du SGG sur toute circulaire de portée générale + obligation d'étude d'impact pour les circulaires majeures + clauses de caducité (5 ans) + déstockage systématique annuel.</p>"}, {"id": "35962af8e03f81fc80bde210676607d8", "titre": "La transformation publique : RGPP, AP2022, Services Publics + et simplification", "theme": 1, "cat": "1.2.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>La transformation publique désigne l'ensemble des réformes visant à moderniser, simplifier et numériser l'action de l'État. Sous la Ve République, plusieurs vagues se sont succédé : RGPP (2007-2012), MAP (2012-2017), Action Publique 2022 (2017-2022), Services Publics + (2022-2024), plan de simplification (2024-2027).</p>\n<h3>2. Cadre Juridique</h3>\n<p>Décret du 14 mars 2018 (organisation gouvernementale, DITP) · décret du 7 octobre 2024 (simplification) · loi du 27 décembre 2019 (transformation de la fonction publique) · loi du 10 août 2018 (État au service d'une société de confiance, ESSOC).</p>\n<h3>3. Les Vagues Successives</h3>\n<p><strong>RGPP (2007-2012)</strong> : lancée par Sarkozy, 500 mesures dont la fusion DGI/DGCP en DGFiP, suppression de 150 000 postes, critiquée pour son approche comptable.</p>\n<p><strong>MAP (2012-2017)</strong> : Hollande/Cazeneuve, approche plus qualitative, création des services numériques (DINUM), plan France Très Haut Débit.</p>\n<p><strong>Action Publique 2022 (2017-2022)</strong> : lancée par Macron, 4 chantiers (qualité, efficacité, numérique, transformation), résultats limités (50 000 postes supprimés pour un objectif de 120 000).</p>\n<p><strong>Services Publics + (2022-2024)</strong> : centrée sur la qualité ressentie, 2 700 France Services en 2024.</p>\n<p><strong>Simplification (2024-2027)</strong> : loi de simplification de 2024, suppression de normes obsolètes.</p>\n<h3>4. Les Acteurs Centraux</h3>\n<p>DITP (créée en 2017, rattachée à Matignon, 100 personnes) · DINUM (créée en 2019, 200 personnes, pilote FranceConnect et data.gouv.fr) · DGAFP (politique RH de la fonction publique, 250 personnes) · beta.gouv.fr (plus de 300 startups d'État depuis 2014).</p>\n<h3>5. Les Outils Concrets</h3>\n<p>FranceConnect (identité numérique unique, 50 millions d'utilisateurs, 1 200 services raccordés) · principe « Dites-le-nous une fois » (12 milliards de pièces évitées par an) · France Services (2 700 maisons, 6 millions de visites/an) · demarches-simplifiees.fr (1 million de demandes/an).</p>\n<h3>6. La Simplification Normative</h3>\n<p>Choc de simplification 2013 (Hollande, bilan mitigé) · loi de simplification du 13 juillet 2024 (plan Le Maire) · test PME (nouvelle norme testée sur les PME, ~500 normes évitées depuis 2018) · principe « one in, two out » (2018, difficile à mettre en œuvre).</p>\n<h3>7. La Modernisation RH</h3>\n<p>Loi du 6 août 2019 : régime contractuel pour les postes de direction, ouverture aux contractuels, suppression du CHSCT au profit du CSA. INSP créé en 2022 : plus de classement de sortie, 80 élèves/an, recrutement diversifié.</p>\n<h3>8. Les Résultats</h3>\n<p>Bilan AP2022 : 50 000 postes supprimés sur un objectif de 120 000, dépenses publiques non réduites en réel, avancée numérique majeure, satisfaction mesurée à 75 % (baromètre 2023). Bilan 2024 : loi de simplification, 7 milliards d'économies visés, mise en œuvre incertaine.</p>\n<h3>9. Comparaisons étrangères</h3>\n<p>Royaume-Uni (Government Digital Service) · USA (US Digital Service, 18F) · Estonie (e-Estonia, 99 % de services en ligne) · Danemark (NemID).</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>La transformation publique est un chantier structurel mais lent. L'opposition syndicale freine les réformes profondes. La numérisation crée des fractures (environ 15 % d'illectronisme).</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Maintenir une politique de transformation par une loi-cadre quinquennale, renforcer la DITP et la DINUM, systématiser l'accompagnement humain, instaurer des clauses de caducité pour les normes, généraliser FranceConnect+ et des audits indépendants des résultats.</p>"}, {"id": "35362af8e03f81518409dedcad8744ee", "titre": "Les groupes parlementaires à l'AN", "theme": 1, "cat": "1.3.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les groupes parlementaires sont les structures collectives qui organisent les députés selon leurs affinités politiques au sein de l'Assemblée nationale. Ils bénéficient de droits et de moyens spécifiques. Un groupe doit compter au minimum 15 membres. Ils sont les acteurs centraux de la vie parlementaire.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Règlement de l'AN (articles 19 à 26) · minimum de 15 membres pour former un groupe · déclaration politique obligatoire · répartition des droits (temps de parole, présidences de commission, questions au gouvernement) proportionnelle à la taille des groupes · droits spécifiques des groupes d'opposition depuis la révision de 2008.</p>\n<h3>3. Fonctionnement Concret</h3>\n<p>Réunion hebdomadaire des groupes pour fixer la ligne politique · président de groupe (porte-parole, négociateur) · questeurs (gestion des moyens) · whips (contrôle du vote des membres) · temps de parole réparti selon la taille du groupe.</p>\n<h3>4. Acteurs & Cartographie du Pouvoir (AN 2024)</h3>\n<table><tr><th>Groupe</th><th>Chef de file</th><th>Sièges</th></tr><tr><td>NFP (LFI/PS/Verts/PCF)</td><td>Multiple</td><td>~193</td></tr><tr><td>Ensemble (Renaissance+)</td><td>Variable</td><td>~164</td></tr><tr><td>RN</td><td>Marine Le Pen</td><td>~143</td></tr><tr><td>Droite (LR+UDI)</td><td>Olivier Marleix</td><td>~67</td></tr><tr><td>Divers</td><td>-</td><td>~10</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Dotation par membre : ~16 800 €/mois pour le fonctionnement du groupe. Personnel permanent : 2 à 20 collaborateurs selon la taille. Budget total des groupes : ~80 M€/an.</p>\n<h3>6. Audit Factuel</h3>\n<p>16e législature (2024) : fragmentation inédite, aucun groupe avec majorité absolue. Plus petit groupe : 15 membres (seuil minimal). Discipline de vote variable (forte au RN, plus faible dans les groupes du centre). Abstentions de plus en plus fréquentes sur les textes du gouvernement.</p>\n<h3>7. Chronologie</h3>\n<p>1958 (groupes de la Ve République) · 1988 (seuil abaissé de 30 à 20 membres) · 2009 (seuil abaissé à 15 membres) · 2022 (première législature sans majorité absolue) · 2024 (fragmentation maximale de la XVIe législature).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>Résultats électoraux</strong> : déterminent la composition des groupes</li>\n<li><strong>Discipline partisane</strong> : conditionne la cohésion et le poids des groupes</li>\n<li><strong>Coalitions</strong> : nécessaires pour former des majorités</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<ul>\n<li><strong>Défections</strong> : des députés quittent leur groupe, créant de l'instabilité</li>\n<li><strong>Groupes hybrides</strong> : certains regroupent des élus aux positions très divergentes</li>\n<li><strong>Financement des groupes</strong> : opacité relative sur l'utilisation des dotations</li>\n</ul>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Les partis français sont affiliés à des partis européens (PPE, S&D, Renew, ID, Greens, GUE). Les groupes au Parlement européen influencent les positions des groupes à l'AN sur les sujets européens.</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>La fragmentation rend nécessaire une culture du compromis inter-groupes. Les groupes sont les acteurs clés pour bâtir des majorités de projet.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : coalitions formelles entre groupes (culture de coalition)</p>\n<p><strong>Scénario 2</strong> : réduction du nombre de groupes par réforme du seuil</p>\n<p><strong>Scénario 3</strong> : réforme du scrutin réduisant la fragmentation</p>\n<h3>13. Faisabilité</h3>\n<p>Culture de coalition possible sans réforme ; modification du seuil nécessite une révision du règlement.</p>\n<h3>14. Temporalité</h3>\n<p>Court terme : négociations inter-groupes sur chaque texte. Moyen terme : possible réforme du scrutin.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : La fragmentation en multiples groupes sans majorité stable rend l'Assemblée incapable de produire une majorité cohérente.</p>\n<p><strong>Options</strong> : Culture de coalition · Réforme du seuil · Réforme du scrutin</p>\n<p><strong>Recommandation</strong> : Encourager les accords de coalition explicites et transparents entre groupes et réduire le nombre de groupes en relevant le seuil à 20 membres.</p>\n<p><strong>Sources</strong> : Règlement AN — assemblee-nationale.fr — CEVIPOF</p>"}, {"id": "35362af8e03f81eebe7bee7455e6a84f", "titre": "Les commissions permanentes de l'AN", "theme": 1, "cat": "1.3.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les commissions permanentes de l'Assemblée nationale sont les instances de travail législatif et de contrôle spécialisées par secteur. Depuis la révision de 2008, elles jouent un rôle renforcé : les textes examinés en séance plénière le sont sur la base du texte adopté en commission.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 43 de la Constitution (les projets et propositions de loi sont envoyés en commission) · 8 commissions permanentes depuis la révision de 2008 (maximum constitutionnel) · règlement de l'AN · révision de 2008 (le texte en séance est celui de la commission) · rapporteurs spéciaux suivant chaque programme budgétaire.</p>\n<h3>3. Fonctionnement Concret</h3>\n<table><tr><th>Commission</th><th>Domaine</th></tr><tr><td>Finances</td><td>Budget</td></tr><tr><td>Lois constitutionnelles</td><td>Droit, justice</td></tr><tr><td>Défense nationale</td><td>Armées</td></tr><tr><td>Affaires étrangères</td><td>Diplomatie</td></tr><tr><td>Affaires sociales</td><td>Santé, travail</td></tr><tr><td>Affaires économiques</td><td>Industrie, agriculture</td></tr><tr><td>Culture et éducation</td><td>Enseignement, culture</td></tr><tr><td>Développement durable</td><td>Environnement</td></tr></table>\n<p>Commissions spéciales créées ponctuellement pour un texte, commissions d'enquête aux pouvoirs d'investigation.</p>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>Président de commission</td><td>Fixe l'agenda, préside</td></tr><tr><td>Rapporteur</td><td>Expert du texte, propose des amendements</td></tr><tr><td>Membres</td><td>Délibèrent, amendent, votent</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Rapporteurs spéciaux ayant accès aux documents budgétaires confidentiels. Secrétariats de commission : ~15 fonctionnaires chacun.</p>\n<h3>6. Audit Factuel</h3>\n<p>Environ 150 rapports législatifs par an. Environ 50 commissions d'enquête ou missions d'information par législature. La commission des finances exerce un droit de tirage de l'opposition, sa présidence revenant traditionnellement à un membre de l'opposition.</p>\n<h3>7. Chronologie</h3>\n<p>1958 (6 commissions permanentes) · 2008 (portées à 8, rôle renforcé) · 2009 (le texte en séance devient celui de la commission) · 2022 (commissions renforcées en contexte de majorité relative).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>Ordre du jour</strong> : partiellement déterminé par le gouvernement, partiellement par les commissions</li>\n<li><strong>Rapporteurs</strong> : la qualité du travail législatif dépend de leur expertise</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<ul>\n<li><strong>Contrôle insuffisant</strong> : les commissions légifèrent plus qu'elles ne contrôlent</li>\n<li><strong>Délais</strong> : examen parfois trop rapide de textes complexes</li>\n<li><strong>Expertise</strong> : les députés manquent parfois d'expertise technique face aux administrations</li>\n</ul>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Une commission des affaires européennes spécifique suit les actes législatifs de l'UE. Comparaison : les commissions allemandes (Ausschüsse) disposent de plus de pouvoirs d'investigation.</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Renforcer la fonction de contrôle des commissions et améliorer l'expertise indépendante des rapporteurs face à l'administration.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : statu quo</p>\n<p><strong>Scénario 2</strong> : renforcement des pouvoirs d'enquête des commissions</p>\n<p><strong>Scénario 3</strong> : développement d'une agence d'expertise parlementaire indépendante</p>\n<h3>13. Faisabilité</h3>\n<p>Renforcement des pouvoirs possible par révision du règlement ; agence d'expertise, décision parlementaire autonome.</p>\n<h3>14. Temporalité</h3>\n<p>Court terme : optimisation des pratiques existantes. Moyen terme : réforme du règlement.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : Les commissions permanentes sont surchargées de législation et sous-investissent le contrôle de l'application des lois.</p>\n<p><strong>Options</strong> : Statu quo · Renforcement du contrôle · Expertise indépendante</p>\n<p><strong>Recommandation</strong> : Dédier 30 % du temps des commissions au suivi de l'application des lois et créer un office parlementaire d'évaluation généraliste, sur le modèle du CBO américain.</p>\n<p><strong>Sources</strong> : Règlement AN — assemblee-nationale.fr — Rapport CEC</p>"}, {"id": "35762af8e03f81529e55d34c86d0b68e", "titre": "L'Assemblée nationale : composition 2024, groupes, commissions et pouvoirs", "theme": 1, "cat": "1.3.1", "html": "<h3>🔁 Lecture croisée — 10 août 2026</h3>\n<p>Depuis un exemplaire archivé de cette fiche. Apports versés :</p>\n<p><strong>Calendrier et discipline budgétaire</strong> : session ordinaire du 1er octobre au 30 juin · article 40 (irrecevabilité financière des amendements, absent de la version antérieure alors qu'il structure le travail législatif quotidien) · article 45 (dernier mot après navette).</p>\n<p><strong>Moyens et statut</strong> : environ 1 200 fonctionnaires, indemnité parlementaire ≈ 7 200 € brut/mois, enveloppe collaborateurs ≈ 10 188 €/mois (millésimes à confirmer).</p>\n<p><strong>Parité</strong> : 37,7 % de femmes députées en 2022. Abstention au 1er tour 2024 : 33 %.</p>\n<p><strong>Dimension européenne</strong> : examen des projets d'actes UE (art. 88-4/88-6), 81 députés européens français — volet absent de la version antérieure.</p>\n<p><strong>⚠️ Divergence sur les sièges 2024, troisième série constatée</strong> : les sources internes donnent trois décomptes incompatibles pour la même législature (Ensemble ≈164/≈160/166 selon les fiches). Aucune série n'est citable en l'état — à trancher une fois pour toutes sur la composition publiée par l'Assemblée nationale, avec date de constat, et à harmoniser dans toute la base.</p>\n<h3>1. Définition & Cadre</h3>\n<p>L'Assemblée nationale est la chambre basse du Parlement français. 577 députés élus pour 5 ans au scrutin uninominal majoritaire à 2 tours dans des circonscriptions. Elle dispose du « dernier mot » sur les lois ordinaires (sauf les révisions constitutionnelles). Depuis 2024, elle est fragmentée en 3 blocs sans majorité.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 24 (le Parlement vote la loi, contrôle le gouvernement) · article 34 (domaine de la loi) · article 35 (déclaration de guerre) · article 39 (dépôt des projets de loi, priorité à l'AN pour le PLF et le PLFSS) · article 49 (responsabilité du gouvernement devant l'AN) · ordonnance du 17 novembre 1958 (règlement de l'AN).</p>\n<h3>3. La Composition Post-Élections 2024</h3>\n<table><tr><th>Bloc / Groupe</th><th>Sièges</th><th>Chef de file</th></tr><tr><td>Nouveau Front Populaire (NFP)</td><td>193</td><td>LFI, PS, EELV, PCF</td></tr><tr><td>Ensemble (Macron)</td><td>~160</td><td>Renaissance, MoDem, Horizons</td></tr><tr><td>Rassemblement National</td><td>143</td><td>Marine Le Pen</td></tr><tr><td>La Droite (LR + divers)</td><td>~40</td><td>Marleix</td></tr><tr><td>Divers</td><td>~40</td><td>—</td></tr><tr><td>TOTAL</td><td>577</td><td>Majorité absolue : 289</td></tr></table>\n<p>Situation inédite : 3 blocs, aucune majorité absolue, gouvernement minoritaire de fait.</p>\n<h3>4. Les Groupes Parlementaires</h3>\n<p>Conditions de formation : 15 députés minimum. Avantages : temps de parole, présidence de commission, ressources financières et humaines.</p>\n<h3>5. Les 8 Commissions Permanentes</h3>\n<p>Lois · Finances · Affaires sociales · Défense · Affaires étrangères · Développement durable · Affaires culturelles · Affaires économiques.</p>\n<h3>6. Les Pouvoirs de Contrôle</h3>\n<p>Questions au gouvernement (mardi et mercredi, retransmises en direct) · commissions d'enquête (peuvent convoquer tout ministre, accéder aux documents) · motion de censure (289 voix) · résolutions depuis 2008 (non contraignantes) · ratification obligatoire des traités importants (art. 53).</p>\n<h3>7. La Présidente de l'AN (Yaël Braun-Pivet)</h3>\n<p>Première femme à présider l'AN (2022, reconduite 2024). Pouvoirs : préside les séances, fixe l'ordre du jour partagé, nomme 3 membres du Conseil constitutionnel. Rôle de médiateur institutionnel en cas de crise. Budget de l'AN 2024 : 570 M€.</p>\n<h3>8. L'AN en Situation de Majorité Relative (depuis 2022)</h3>\n<p>Oblige le gouvernement à négocier texte par texte, favorise l'usage du 49.3 (Borne : plusieurs dizaines de fois), aboutit à la motion de censure contre Barnier (décembre 2024) — retour à une pratique législative plus négociée.</p>\n<h3>9. Synthèse Décisionnelle</h3>\n<p><strong>Recommandation</strong> : réformer le règlement de l'AN (temps réservé à l'opposition augmenté, niches parlementaires hebdomadaires) + renforcer les moyens des commissions d'enquête + introduire le vote de résolutions contraignantes sur certains sujets (politique européenne) + généraliser le vote nominatif systématique publié.</p>"}, {"id": "35762af8e03f8111860cff755612bfbc", "titre": "L'élection et le statut des députés : scrutin, composition 2024 et représentativité", "theme": 1, "cat": "1.3.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les 577 députés de l'Assemblée nationale sont élus au suffrage universel direct uninominal majoritaire à 2 tours pour un mandat de 5 ans. Depuis les élections législatives de juin-juillet 2024, l'AN est fragmentée en 3 blocs sans majorité absolue — situation inédite sous la Ve République.</p>\n<h3>2. Le Mode de Scrutin</h3>\n<p>577 circonscriptions d'environ 130 000 habitants. 1er tour : élu si majorité absolue des suffrages exprimés + 25 % des inscrits. 2e tour : participent les candidats ayant obtenu plus de 12,5 % des inscrits, élu à la majorité relative. Effet : favorise les grands partis, écrase les partis moyens. Plafond de dépenses : 38 000 à 56 700 € selon la taille de la circonscription.</p>\n<h3>3. La Composition Après les Élections 2024</h3>\n<table><tr><th>Groupe</th><th>Sièges</th><th>Leader(s)</th></tr><tr><td>NFP total (LFI, PS, EELV, PCF, divers)</td><td>193</td><td>Multiple</td></tr><tr><td>Ensemble total (Renaissance, MoDem, Horizons)</td><td>~160</td><td>Multiple</td></tr><tr><td>Droite nationale (RN + alliés)</td><td>143</td><td>Marine Le Pen</td></tr><tr><td>LR + indépendants divers</td><td>~81</td><td>Marleix</td></tr><tr><td>TOTAL</td><td>577</td><td>—</td></tr></table>\n<p>Majorité absolue : 289 sièges — aucun bloc ne l'atteint.</p>\n<h3>4. Le Statut du Député</h3>\n<p>Mandat de 5 ans, renouvelable sans limite. Indemnité parlementaire : 7 239 € bruts/mois + indemnité de résidence (738 €) + enveloppe collaborateurs (10 585 €/mois). IRFM supprimée en 2017, remplacée par une avance sur frais plafonnée. Immunité parlementaire (irresponsabilité + inviolabilité). Incompatibilités (fonctions gouvernementales, magistrature). Cumul des mandats interdit depuis 2017 (un seul mandat exécutif local).</p>\n<h3>5. Le Rôle du Président de l'AN</h3>\n<p>Yaël Braun-Pivet (depuis 2022, reconduite 2024), première femme à ce poste. Pouvoirs : préside les séances plénières, fixe l'ordre du jour partagé, nomme 3 membres du Conseil constitutionnel, consultée en cas de dissolution ou d'art. 16, intérim du président du Sénat si nécessaire. Budget de l'AN : 570 M€.</p>\n<h3>6. Les Groupes Parlementaires</h3>\n<p>Seuil de constitution : 15 députés. Avantages : temps de parole, présidence de commissions, dotation financière, personnel supplémentaire, niche parlementaire mensuelle.</p>\n<h3>7. Les Règles du Débat</h3>\n<p>Séances mardi, mercredi, jeudi en période de session. QAG mardi et mercredi 15h. Questions orales le mardi matin. Vote solennel le mardi après examen en commission. Temps législatif programmé dans certaines procédures.</p>\n<h3>8. Les Inégalités de Représentation</h3>\n<p>Femmes : 37,3 % des députés en 2024. Ouvriers et employés : moins de 3 % des députés (pour 50 % de la population). Cadres et professions libérales : plus de 50 % des députés. Âge moyen : 48 ans. Sous-représentation ethnique estimée à moins de 5 %.</p>\n<h3>9. Enjeux Stratégiques</h3>\n<p>L'AN fragmentée (2022-2024) a révélé que le système fonctionne mal sans majorité stable. L'introduction de la proportionnelle changerait profondément la composition et les rapports de force. La représentativité sociale reste un déficit démocratique criant.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p><strong>Recommandation</strong> : introduire une dose de proportionnelle (20-30 %) pour améliorer la représentativité + renforcer le statut de l'opposition + réduire le nombre de circonscriptions à 400 (regroupement) + généraliser le vote nominatif.</p>"}, {"id": "35962af8e03f81558cf9efa6122f2044", "titre": "Le Président de l'Assemblée nationale : pouvoirs, Bureau et Conférence des présidents", "theme": 1, "cat": "1.3.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le Président de l'Assemblée nationale est le 4e personnage de l'État (après le PR, le PM et le président du Sénat). Il/elle dirige les débats, préside la Conférence des présidents, représente l'AN. C'est un poste à forte valeur symbolique et institutionnelle, mais aux pouvoirs encadrés.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 32 de la Constitution (élu pour la durée de la législature) · règlement de l'AN (titre Ier) · statut similaire au président du Sénat · article 56 (nomme 3 membres du Conseil constitutionnel) · article 65 (nomme 2 membres du CSM).</p>\n<h3>3. Le Rôle et les Pouvoirs</h3>\n<p><strong>Pouvoirs de gestion :</strong> préside les séances plénières (délégation possible aux 6 vice-présidents), police des débats, ordonnance les dépenses de l'AN, représente l'AN dans les actes de la vie civile.</p>\n<p><strong>Pouvoirs institutionnels :</strong> saisine du Conseil constitutionnel, nomination de 3 membres du CC et 2 membres du CSM, présidence de la Conférence des présidents, convocation du Bureau.</p>\n<p><strong>Pouvoirs symboliques :</strong> cérémonies officielles, voyages internationaux, représentation auprès du PR.</p>\n<h3>4. Les Présidents de l'AN sous la Ve République</h3>\n<p>De Chaban-Delmas (1958) à Braun-Pivet (2022-), en passant par Fabius, Séguin, Debré, Accoyer, Bartolone, Ferrand — alternance entre figures RPR/UMP et PS/LREM selon les majorités.</p>\n<h3>5. Yael Braun-Pivet : Première Femme à ce Poste (2022)</h3>\n<p>Avocate, ex-présidente de la Commission des lois (2017-2020). Élue le 28 juin 2022 face à Sandrine Rousseau. Réélue en juillet 2024 face à André Chassaigne. Première femme à ce poste, présidant une AN sans majorité absolue — situation inédite. Confrontée à de nombreux 49.3 sous Borne puis Attal. Critiquée pour un voyage en Israël jugé partisan (octobre 2023) et la gestion de débats houleux.</p>\n<h3>6. Le Bureau de l'Assemblée Nationale</h3>\n<p>Composition : 1 président, 6 vice-présidents, 3 questeurs, 12 secrétaires, 22 membres au total. Renouvelé chaque année (sauf le président, élu pour la législature). Règle de représentation de tous les groupes politiques.</p>\n<h3>7. La Conférence des Présidents</h3>\n<p>Composition : président de l'AN, vice-présidents, questeurs, présidents des 8 commissions permanentes, présidents des groupes politiques, rapporteur général du budget, ministre chargé des relations avec le Parlement. Rôle : fixe l'ordre du jour partagé (art. 48 al. 2-3), examine la programmation législative.</p>\n<h3>8. Les Niches Parlementaires (article 48 al. 5)</h3>\n<p>1 jour par mois réservé aux groupes d'opposition et minoritaires (révision 2008), permettant l'examen de propositions de loi. En pratique souvent sans effet concret (majorité enterre les textes), mais offre une visibilité médiatique aux oppositions.</p>\n<h3>9. Le Statut Matériel</h3>\n<p>Rémunération totale (indemnités de PR-AN + de député) : environ 21 700 €/mois bruts. Avantages : Hôtel de Lassay, voiture avec chauffeur, cabinet de 30+ collaborateurs, voyages institutionnels.</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>L'AN sans majorité absolue (depuis 2022) renforce le rôle du Président, dont la capacité d'arbitrage devient cruciale dans les débats houleux, les décisions de recevabilité et d'ordre du jour prenant une portée politique.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Maintenir le mandat de législature (5 ans) + clarifier les pouvoirs en cas de gouvernement minoritaire + transparence accrue des décisions de présidence + renforcer le contrôle du Bureau.</p>"}, {"id": "35962af8e03f8121b1acf7a1dc5ae8c3", "titre": "L'immunité parlementaire : irresponsabilité, inviolabilité et CJR", "theme": 1, "cat": "1.3.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>L'immunité parlementaire protège les députés et sénateurs dans l'exercice de leur mandat. Elle vise à garantir l'indépendance du Parlement face au pouvoir judiciaire et exécutif. Elle se compose de deux éléments distincts : l'irresponsabilité (pour les actes du mandat) et l'inviolabilité (pour les actes étrangers au mandat).</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 26 de la Constitution · règlements de l'AN et du Sénat · loi constitutionnelle du 4 août 1995 (limitation de l'inviolabilité) · loi constitutionnelle du 23 juillet 2008.</p>\n<h3>3. L'Irresponsabilité (article 26 al. 1)</h3>\n<p>Aucun parlementaire ne peut être poursuivi, recherché, arrêté, détenu ou jugé à l'occasion des opinions ou votes émis dans l'exercice de ses fonctions. Couvre votes, paroles à l'hémicycle, propositions, rapports, questions au gouvernement. Permanente, absolue et inaltérable. Limites : ne couvre pas les propos hors du Parlement ; sanctions disciplinaires internes possibles.</p>\n<h3>4. L'Inviolabilité (article 26 al. 2-3)</h3>\n<p>Pour les actes étrangers à l'exercice du mandat, restreignant la possibilité de poursuivre, arrêter ou mettre en examen un parlementaire, limitée à la durée du mandat. Depuis 1995, l'autorisation de l'assemblée n'est nécessaire que pour l'arrestation ou la détention (mises en examen et perquisitions possibles sans autorisation). Procédure : demande de la justice transmise au Bureau, examen et vote du Bureau.</p>\n<h3>5. Cas Célèbres de Levée d'Immunité</h3>\n<p>Marine Le Pen (2015, tweets ; 2017, fonds européens) · Jean-Luc Mélenchon (2018, perquisition LFI) · Manuel Bompard (2024) · Florian Philippot (2017).</p>\n<h3>6. La Séparation des Pouvoirs</h3>\n<p>L'immunité protège le Parlement contre un pouvoir judiciaire potentiellement instrumentalisé par l'exécutif et garantit la liberté d'expression politique. Critiques : risque de protection des élus contre la justice ordinaire, perçu comme un privilège de classe politique.</p>\n<h3>7. Le Cas des Ministres</h3>\n<p>La Cour de justice de la République (CJR), créée en 1993, juge les ministres pour les actes accomplis dans l'exercice de leurs fonctions (12 parlementaires + 3 magistrats). Critiquée comme « justice de classe » à l'indépendance limitée. Affaires récentes : Christine Lagarde (relaxée, 2016), Éric Dupond-Moretti (relaxé, 2024). Suppression promise par Macron en 2017, non tenue, débat récurrent.</p>\n<h3>8. Comparaisons étrangères</h3>\n<p>Allemagne (article 46 Loi fondamentale, régime similaire) · Italie (article 68 Constitution) · Royaume-Uni (parliamentary privilege, mais pas d'immunité pour les infractions de droit commun).</p>\n<h3>9. Les Débats Actuels</h3>\n<p>Pour le maintien : garantie historique de la démocratie parlementaire, protection contre l'instrumentalisation politique de la justice. Pour la réforme : LFI (abolition de la CJR), LR (limitation supplémentaire de l'inviolabilité), Renaissance (statu quo).</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>L'immunité reste une garantie essentielle de la démocratie parlementaire mais doit être rigoureusement encadrée. La CJR est l'institution la plus contestée. La frontière entre actes du mandat et actes privés peut être difficile à tracer.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Maintenir l'irresponsabilité intacte + supprimer la CJR au profit d'une justice ordinaire avec pôle spécialisé + clarifier les frontières par la jurisprudence + transparence des décisions du Bureau sur les levées d'immunité.</p>"}, {"id": "35962af8e03f81c8859ee5ce86976535", "titre": "Le contrôle parlementaire : QAG, commissions d'enquête, MEC et évaluation", "theme": 1, "cat": "1.3.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>L'AN exerce un contrôle sur le Gouvernement via plusieurs outils : questions au Gouvernement (QAG), commissions d'enquête, missions d'information, contrôle budgétaire, MEC, CEC, printemps de l'évaluation. La révision de 2008 a renforcé ce contrôle, qui reste néanmoins sous-utilisé et politiquement déséquilibré.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Articles 24, 48, 51-1, 51-2 de la Constitution · article 6 de l'ordonnance n° 58-1100 du 17 novembre 1958 (régime des commissions d'enquête) · révision du 23 juillet 2008 (1 semaine/mois pour le contrôle, droits de l'opposition) · règlement de l'AN.</p>\n<h3>3. Les Questions au Gouvernement (QAG)</h3>\n<p>Mardi et mercredi 15h-16h, 30 questions par séance (15 majorité, 15 opposition), 2 min question + 2 min réponse, diffusion en direct (LCP), environ 60 QAG par an. Questions écrites : 20 000 déposées par an, taux de réponse ~60 %, délai moyen 4 mois.</p>\n<h3>4. Les Commissions d'Enquête</h3>\n<p>Créées par résolution de l'AN, régime fixé par l'article 6 de l'ordonnance de 1958. Pouvoirs renforcés (audition sous serment, communication de documents). Durée maximale 6 mois, pas de nouvelle commission sur le même objet avant 12 mois. Effectif maximal de 30 députés. Droit de tirage : chaque groupe d'opposition ou minoritaire peut en obtenir une par session ordinaire sans vote de la majorité (article 141 al. 2 du règlement de l'AN).</p>\n<p><strong>Sanctions</strong> : refus de comparaître, de déposer ou de prêter serment puni de 2 ans d'emprisonnement et 7 500 € d'amende ; faux témoignage relevant des articles 434-13 à 434-15 du Code pénal (5 ans, 75 000 €).</p>\n<p><strong>Commissions récentes notables (2023-2026)</strong> : Narcotrafic, contrôle des frais des grandes entreprises, finances locales, Mediator, Areva-Orano, imposition des plus hauts patrimoines, audiovisuel public, marges des industriels et de la grande distribution, financements privés de l'action publique — ces quatre dernières issues d'un droit de tirage en 2025-2026.</p>\n<p><strong>Fait institutionnel de 2026</strong> : la commission d'enquête sur l'audiovisuel public a vu ses travaux suspendus par son président en janvier 2026 — décision inédite sous la Ve République — après 36 interviews du rapporteur et plus de 330 publications sur les réseaux sociaux pendant les travaux. De nouvelles règles ont été adoptées (interdiction des publications en direct pendant les auditions), et une saisine judiciaire pour parjure engagée.</p>\n<h3>5. Le Contrôle Budgétaire</h3>\n<p>MEC (Mission d'Évaluation et de Contrôle, sous-commission des finances, 2-3 missions/an) · printemps de l'évaluation (depuis 2018, 1 semaine en mai) · assistance de la Cour des comptes au Parlement (art. 47-2).</p>\n<h3>6. Le CEC (Comité d'Évaluation et de Contrôle des Politiques Publiques)</h3>\n<p>Créé en 2009, présidé par le Président de l'AN, 36 membres, évalue les politiques publiques transversales, 5 à 10 rapports par an.</p>\n<h3>7. La Mission d'Information</h3>\n<p>Créée par une commission permanente sur un sujet d'intérêt, plus souple qu'une commission d'enquête. 30 à 50 missions par an.</p>\n<h3>8. Le Suivi des Lois</h3>\n<p>Article 145-7 du règlement AN : tout député peut demander un rapport sur la mise en application d'une loi 6 mois après sa promulgation — disposition souvent ignorée en pratique.</p>\n<h3>9. Le Déficit Structurel</h3>\n<p>Contrôle sous-utilisé (90 % du temps parlementaire consacré au législatif), majorité réticente, opposition focalisée sur les médias, moyens administratifs limités.</p>\n<h3>10. Comparaisons Européennes</h3>\n<p>Allemagne (Bundestag, même contrôle mais culturellement plus exercé) · Royaume-Uni (Select Committees plus puissants) · USA (Congressional Hearings très offensifs, subpoena power).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Le contrôle est l'autre cœur du rôle parlementaire (avec la législation), chroniquement sous-utilisé, nécessitant un véritable rééquilibrage des pouvoirs.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Doubler le temps consacré au contrôle (2 semaines/mois) + droit de tirage élargi + commissions d'enquête à pouvoir renforcé + sanctions effectives pour faux témoignage + assistants parlementaires dédiés au contrôle + encadrement de l'usage médiatique des travaux, sans en restreindre les pouvoirs.</p>"}, {"id": "35962af8e03f8118a324dd1632e7eff1", "titre": "L'opposition parlementaire : droits spécifiques (art. 51-1), niche et motion de censure", "theme": 1, "cat": "1.3.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>L'opposition parlementaire dispose de droits spécifiques renforcés par la révision constitutionnelle de 2008. Ces droits visent à garantir un équilibre démocratique entre majorité et minorité. En période de majorité relative (depuis 2022), ces droits se transforment et l'opposition devient parfois décisive (motion de censure Barnier 2024).</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 51-1 de la Constitution (droits spécifiques de l'opposition, depuis 2008) · règlement de l'AN · statut de l'opposition (groupes déclarés en début de législature).</p>\n<h3>3. Les Droits Spécifiques (Article 51-1)</h3>\n<p>Droit de tirage (1 commission d'enquête ou mission d'information par session, sans vote majoritaire) · présidence de la commission des finances réservée à l'opposition depuis 2007 · présidence d'une commission chargée d'examiner certains textes · 1 journée mensuelle d'ordre du jour (niche parlementaire) · dotation financière proportionnelle aux effectifs.</p>\n<h3>4. La Niche Parlementaire</h3>\n<p>1 journée par mois réservée à chaque groupe d'opposition en rotation, 4 à 8 propositions de loi par an et par groupe. Très peu de propositions adoptées (moins de 5 % en moyenne), sauf accord rare avec la majorité, mais effet d'agenda médiatique réel.</p>\n<h3>5. Le Dépôt de Motions</h3>\n<p>Motion de censure (49.2) : 58 signatures minimum, vote sur les seules voix pour, majorité absolue requise. Motion de censure réussie contre Barnier (2024) : première depuis 1962, coalition RN+NFP. Motion de rejet préalable : vote sur le caractère inacceptable d'un texte, tactique d'obstruction parfois utilisée.</p>\n<h3>6. La Question Prioritaire de Constitutionnalité (QPC)</h3>\n<p>Saisine indirecte par 60 députés ou 60 sénateurs, outil d'opposition utilisé régulièrement pour contester des lois en vigueur.</p>\n<h3>7. Le Rôle Médiatique</h3>\n<p>L'opposition utilise les QAG, les commissions d'enquête et les réseaux sociaux pour se faire entendre, avec des stratégies différenciées selon les groupes (LFI : obstruction et réseaux sociaux ; RN : interpellation directe ; LR : technicité ; EELV : actions symboliques).</p>\n<h3>8. Les Limites</h3>\n<p>L'opposition reste structurellement minoritaire (vote final dominé par la majorité), son pouvoir reposant sur des seuils (motion de censure), sauf en configuration de majorité relative où elle peut bloquer, sans pour autant former de coalitions stables.</p>\n<h3>9. La Révolution 2024 : Trois Blocs</h3>\n<p>Configuration inédite (bloc central, NFP, RN+alliés), aucun bloc majoritaire, nécessitant des coalitions sur chaque texte et provoquant la multiplication des 49.3 et des gouvernements de courte durée.</p>\n<h3>10. Comparaisons Européennes</h3>\n<p>Allemagne (grande coalition possible) · Royaume-Uni (Shadow Cabinet structuré) · Espagne (blocs proches du fonctionnement français).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>L'opposition est constitutionnellement essentielle dans une démocratie ; ses droits restent insuffisamment respectés en pratique ; la majorité relative actuelle change durablement la donne.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Renforcement du statut de l'opposition (passage à 2 commissions d'enquête par session) + niche parlementaire élargie (2 jours/mois) + coprésidence de la commission des finances + comité paritaire majorité-opposition pour le contrôle.</p>"}, {"id": "35962af8e03f81b195e3e2a1c7fdf31a", "titre": "Les résolutions parlementaires (article 34-1) : nature, portée et exemples", "theme": 1, "cat": "1.3.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les résolutions parlementaires (article 34-1 de la Constitution, depuis 2008) sont des actes par lesquels les assemblées expriment leur opinion sans créer d'obligation juridique. Elles permettent au Parlement de prendre position sur tout sujet, sans interférer avec la responsabilité du Gouvernement.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 34-1 de la Constitution (introduit en 2008) · loi organique n° 2009-403 du 15 avril 2009 · règlement de l'AN (articles 136 à 139-2) · règlement du Sénat.</p>\n<h3>3. Le Cadre des Résolutions</h3>\n<p>Conditions : pas d'injonction au Gouvernement, pas de mise en cause de sa responsabilité, pas de remise en cause de l'autorité des assemblées. Initiative : tout parlementaire, groupe, ou président d'assemblée. Procédure : examen en commission, débat en séance, vote sans amendement (sauf retouche rédactionnelle).</p>\n<h3>4. Les Types de Résolutions</h3>\n<p>Résolutions de l'article 34-1 (position politique, sans portée juridique) · résolutions de l'article 88-4 (projets d'actes UE, très utilisées, 200+ par an) · résolutions de l'article 88-6 (subsidiarité, avis motivé à la Commission européenne) · résolutions de l'article 88-7 (opposition à une proposition législative européenne).</p>\n<h3>5. Les Résolutions Marquantes</h3>\n<p>Reconnaissance de génocides (arménien 2001, rwandais 2018, crimes soviétiques en Ukraine 2022) · politique étrangère (reconnaissance de l'État de Palestine 2014, résolutions sur l'Ukraine et Gaza en 2024) · sujets sociétaux (GPA 2017, cannabis 2022, fin de vie 2024).</p>\n<h3>6. La Fréquence des Résolutions</h3>\n<p>Environ 140 résolutions adoptées par an (AN + Sénat combinés) en 2024. Plus de 1 500 résolutions cumulées depuis 2008.</p>\n<h3>7. La Portée Politique</h3>\n<p>Avantages : expression des groupes minoritaires, outil de pression politique, symbolique fort à l'international. Limites : pas d'effet juridique, souvent sans suite concrète, perçu comme « déclamatoire ».</p>\n<h3>8. La Réponse du Gouvernement</h3>\n<p>Pas d'obligation de suivre les résolutions, mais une pression politique réelle (exemple : le génocide arménien a conditionné la diplomatie française vis-à-vis de la Turquie).</p>\n<h3>9. Les Résolutions Européennes : Levier Réel</h3>\n<p>L'AN et le Sénat peuvent adopter une résolution sur un projet d'acte UE, engageant politiquement le Gouvernement dans les négociations, sans effet juridique strict mais avec un poids politique réel.</p>\n<h3>10. Comparaisons étrangères</h3>\n<p>Allemagne (« Antrag ») · Italie (« Mozione ») · Royaume-Uni (« Early Day Motion ») · USA (« Resolutions »).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Les résolutions sont un outil sous-utilisé du contrôle politique, peu connu du grand public, posant la question de leur donner une force juridique partielle.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Maintenir le caractère non contraignant + obligation pour le Gouvernement de répondre sous 3 mois + publication systématique au JO + plateforme publique de suivi des résolutions.</p>"}, {"id": "35962af8e03f81bb9449dc8ac63717ae", "titre": "Les commissions d'enquête parlementaires (article 51-2) : pouvoirs et enjeux", "theme": 1, "cat": "1.3.1", "html": "<h3>🧭 Versement doctrinal — 15 août 2026 : ce que sept rapports lus au fond apprennent de l'instrument</h3>\n<p>Cette fiche décrivait correctement le droit des commissions d'enquête, sans donnée sur leur usage réel. Le bloc ci-dessous, tiré de la lecture au fond de sept rapports parlementaires de 2026 (quatre commissions d'enquête, deux rapports de commission permanente, un rapport d'office parlementaire), prime pour tout ce qui touche à l'évaluation de l'instrument.</p>\n<p><strong>La grille d'évaluation adoption × véhicule.</strong> Un rapport parlementaire ne vaut ni par son épaisseur ni par sa couverture médiatique, mais par deux variables croisées : la majorité qui l'a adopté et le véhicule législatif qui le reprend.</p>\n<table><tr><th>Rapport (2026)</th><th>Adoption</th><th>Véhicule</th><th>Statut</th></tr><tr><td>Sénat n° 317 — balance agricole</td><td>consensuelle</td><td>PJL n° 689 / rapport n° 762</td><td>repris et cité</td></tr><tr><td>Sénat n° 632 — marges industriels/grande distribution</td><td>unanimité, 24 recos</td><td>art. 19 bis du PJL n° 689</td><td

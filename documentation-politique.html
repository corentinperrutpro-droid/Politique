différents pour le premier bloc (NFP 182 vs 193, Ensemble 168 vs 166 ; RN/UDR 142 et LR 47 concordent). Ne citer aucun décompte sans reprise sur les résultats officiels du ministère de l'Intérieur ou la composition publiée par l'Assemblée, en précisant la date de constat.</p>\n<h3>1. Définition & Cadre</h3>\n<p>La dissolution de l'Assemblée nationale (art. 12) est le pouvoir discrétionnaire du Président de mettre fin par anticipation à la législature en cours, suivie de l'organisation d'élections législatives anticipées. C'est l'arme constitutionnelle de l'exécutif pour trancher un blocage ou rechercher un nouveau mandat législatif.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 12 : le PR peut, après consultation du Premier ministre et des présidents des assemblées, prononcer la dissolution. Conditions : consultation préalable obligatoire (avis non contraignant), élections entre 20 et 40 jours, pas de nouvelle dissolution dans l'année suivant les élections, impossibilité sous l'article 16.</p>\n<h3>3. Le Mécanisme</h3>\n<p>Décret de dissolution signé par le PR, allocution au peuple (usage), suspension immédiate des travaux parlementaires, convocation des électeurs, campagne électorale. Le Sénat est exclu (renouvelé par moitié tous les 3 ans). Caractère discrétionnaire : acte de gouvernement, non susceptible de recours juridictionnel.</p>\n<h3>4. Les Dissolutions de la Ve République</h3>\n<table><tr><th>Date</th><th>PR</th><th>Motif</th><th>Résultat</th></tr><tr><td>9 oct. 1962</td><td>de Gaulle</td><td>Après motion de censure</td><td>Majorité gaulliste renforcée</td></tr><tr><td>30 mai 1968</td><td>de Gaulle</td><td>Crise de mai 68</td><td>Majorité écrasante UDR</td></tr><tr><td>22 mai 1981</td><td>Mitterrand</td><td>Après élection PR</td><td>Majorité PS</td></tr><tr><td>14 mai 1988</td><td>Mitterrand</td><td>Après réélection</td><td>Majorité relative PS</td></tr><tr><td>21 avril 1997</td><td>Chirac</td><td>Anticipation des réformes</td><td>Cohabitation Jospin</td></tr><tr><td>9 juin 2024</td><td>Macron</td><td>Après défaite aux européennes</td><td>Tripartition, sans majorité</td></tr></table>\n<h3>5. Les Trois Stratégies de Dissolution</h3>\n<p>Confirmer une victoire (Mitterrand 1981, 1988, risque modéré) · crise et arbitrage (de Gaulle 1962, 1968, risque élevé) · anticipation et pari (Chirac 1997, Macron 2024, risque très élevé, menant à cohabitation ou blocage).</p>\n<h3>6. Les Conséquences de 2024</h3>\n<p>Tripartition (NFP, Ensemble, RN/UDR+LR), suivie d'une séquence gouvernementale chaotique : Attal démissionnaire, Barnier nommé puis censuré (5 déc. 2024), Bayrou nommé puis renversé (8 sept. 2025), Lecornu depuis septembre 2025. Bilan : déstabilisation institutionnelle majeure, blocage législatif, perte d'autorité du PR.</p>\n<h3>7. La Question de la Réutilisation</h3>\n<p>Macron peut légalement dissoudre à nouveau depuis le 9 juin 2025, mais le risque politique est élevé compte tenu des sondages favorables au RN, et l'utilité stratégique d'une nouvelle dissolution reste incertaine.</p>\n<h3>8. Comparaisons étrangères</h3>\n<p>Royaume-Uni (procédure abrogée en 2011, restaurée en 2022) · Allemagne (très rare, procédure complexe) · Italie (par le PR sur proposition du PM) · Espagne (par le Roi sur proposition du PM).</p>\n<h3>9. Enjeux Stratégiques</h3>\n<p>La dissolution est l'arme ultime de l'exécutif, mais son usage abusif (1997, 2024) mène au chaos. La tripartition rend toute nouvelle dissolution risquée. Question : faut-il l'encadrer (vote de confiance préalable, motivation publique) ?</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Maintenir l'art. 12 mais : imposer une motivation publique écrite, envisager un vote de confiance préalable, interdire la dissolution dans les 6 mois précédant l'élection présidentielle, clarifier le statut du PM démissionnaire pendant la campagne.</p>"}, {"id": "35962af8e03f81d0a292dda4a3be3ebf", "titre": "La vacance et l'empêchement du Président (art. 7) : intérim et succession", "theme": 1, "cat": "1.2.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>La vacance ou l'empêchement du Président de la République déclenche une procédure d'intérim et d'élection anticipée prévue par l'article 7 de la Constitution. Le Président du Sénat assure l'intérim. Cette situation s'est produite 2 fois sous la Ve République (de Gaulle 1969 par démission, Pompidou 1974 par décès).</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 7 de la Constitution. Cas de déclenchement : décès, démission, empêchement définitif. Constatation par le Conseil constitutionnel (saisi par le Gouvernement). Intérim assuré par le Président du Sénat. Élection anticipée dans les 20-35 jours.</p>\n<h3>3. La Procédure de l'Article 7</h3>\n<p><strong>Constatation :</strong> le Gouvernement saisit le Conseil constitutionnel, qui constate la vacance ou l'empêchement.</p>\n<p><strong>Intérim :</strong> le Président du Sénat exerce les fonctions provisoirement (le Gouvernement collectivement s'il est lui-même empêché). Pouvoirs limités : ni référendum, ni dissolution, ni révision constitutionnelle, ni motion de censure.</p>\n<p><strong>Élection :</strong> convocation des électeurs entre 20 et 35 jours, sauf force majeure constatée par le CC.</p>\n<h3>4. Les Cas Historiques de la Ve République</h3>\n<p><strong>1969, démission de De Gaulle</strong> : après le rejet du référendum du 27 avril 1969 (NON 52,4 %), démission le 28 avril ; intérim d'Alain Poher ; Pompidou élu le 15 juin 1969.</p>\n<p><strong>1974, décès de Pompidou</strong> : décédé le 2 avril 1974 ; intérim d'Alain Poher à nouveau ; Giscard d'Estaing élu le 19 mai 1974.</p>\n<h3>5. Le Cas de l'Empêchement</h3>\n<p>Définition : incapacité (médicale, psychiatrique) du PR à exercer ses fonctions. La maladie de Pompidou (connue depuis 1973) et celle de Mitterrand (cancer caché depuis 1981) n'ont jamais donné lieu à une constatation officielle d'empêchement. Aucune procédure précise n'existe sur l'empêchement médical (pas d'examen obligatoire, pas de saisine automatique).</p>\n<h3>6. La Destitution (Art. 68)</h3>\n<p>Complémentaire à l'article 7 : en cas de « manquement à ses devoirs manifestement incompatible avec l'exercice de son mandat », procédure réformée en 2007, saisine par 1/10 d'une assemblée puis vote des 2/3 des deux assemblées réunies en Haute Cour. Tentative LFI de 2024 rejetée.</p>\n<h3>7. Les Présidents du Sénat (Intérimaires Potentiels)</h3>\n<table><tr><th>Période</th><th>Président</th><th>Parti</th></tr><tr><td>1968-1992</td><td>Alain Poher</td><td>Centre</td></tr><tr><td>1992-1998</td><td>René Monory</td><td>UDF</td></tr><tr><td>1998-2008</td><td>Christian Poncelet</td><td>LR</td></tr><tr><td>2008-2011</td><td>Gérard Larcher</td><td>LR</td></tr><tr><td>2011-2014</td><td>Jean-Pierre Bel</td><td>PS</td></tr><tr><td>2014-</td><td>Gérard Larcher</td><td>LR</td></tr></table>\n<h3>8. Comparaisons étrangères</h3>\n<p>USA (25e Amendement, dispositif d'incapacité détaillé) · Allemagne (Président du Bundestag puis nouvelle élection) · Italie (Président du Sénat puis nouvelle élection) · Russie (Premier ministre puis élection sous 3 mois).</p>\n<h3>9. Enjeux Stratégiques</h3>\n<p>L'article 7 fonctionne mais n'a jamais été testé sur l'empêchement médical — une lacune reconnue. La durée courte de l'intérim (20-35 jours) est un atout de stabilité. Question : faut-il moderniser pour les cas psychiatriques ou cognitifs ?</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Moderniser l'article 7 : examen médical annuel obligatoire du PR, procédure d'empêchement médical sur saisine croisée, clarification du statut de l'intérimaire, maintien d'une durée courte (20-35 jours).</p>"}, {"id": "35862af8e03f81ec85a9cb485e2d247e", "titre": "L'article 35 et le pouvoir de guerre : OPEX et autorisation parlementaire", "theme": 1, "cat": "1.2.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>L'article 35 régit le pouvoir de faire la guerre. La déclaration de guerre est autorisée par le Parlement. Mais l'envoi de troupes à l'étranger ou l'engagement militaire extérieur sont décidés par le Président, avec information puis autorisation parlementaire. C'est un domaine de compétence partagée où l'exécutif domine.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 35 de la Constitution (modifié en 2008) · article 15 (le PR est chef des armées) · article 21 (le PM est responsable de la Défense nationale) · Code de la défense · décret du 9 juillet 1996 sur l'organisation de la défense.</p>\n<h3>3. La Procédure d'Article 35</h3>\n<p><strong>Déclaration de guerre (al. 1) :</strong> autorisation préalable du Parlement obligatoire — jamais utilisée sous la Ve République.</p>\n<p><strong>Engagement de forces à l'étranger (al. 2, ajout 2008) :</strong> le Gouvernement informe le Parlement au plus tard 3 jours après ; le Parlement peut être amené à voter.</p>\n<p><strong>Prolongation au-delà de 4 mois (al. 3, ajout 2008) :</strong> autorisation parlementaire requise, vote des deux assemblées, l'AN décidant en dernier ressort en cas de désaccord.</p>\n<h3>4. Les OPEX (Opérations Extérieures) : Bilan</h3>\n<p>OPEX en cours en 2024 : Chammal (Levant, ~600), Daman (Liban FINUL, ~700), Lynx (Estonie OTAN, ~300), Aigle (Roumanie OTAN, ~700), Corymbe (Golfe de Guinée, ~200), Barkhane (Sahel, terminée en 2022). OPEX historiques majeures : Daguet (1991), Trident (1999), Licorne (2002-2015), Harmattan (2011), Serval (2013), Sangaris (2013-2016), Barkhane (2014-2022).</p>\n<h3>5. Le Vote Parlementaire 2008-2024</h3>\n<table><tr><th>Date</th><th>Opération</th><th>AN</th><th>Sénat</th></tr><tr><td>Janv. 2009</td><td>Afghanistan</td><td>343-210</td><td>220-91</td></tr><tr><td>Juill. 2011</td><td>Libye Harmattan</td><td>482-27</td><td>311-24</td></tr><tr><td>Janv. 2013</td><td>Mali Serval</td><td>342-0</td><td>326-0</td></tr><tr><td>Janv. 2014</td><td>RCA Sangaris</td><td>428-17</td><td>261-6</td></tr><tr><td>Janv. 2015</td><td>Irak Chammal</td><td>488-1</td><td>327-1</td></tr><tr><td>Janv. 2022</td><td>Mali Takuba</td><td>348-50</td><td>248-7</td></tr></table>\n<p>Constat : vote quasi-unanime, révélant un consensus stratégique français durable.</p>\n<h3>6. Les Opérations Sans Vote Parlementaire</h3>\n<p>Frappe en Syrie 2018 (chimique Douma) : ponctuelle, sans vote préalable, information ultérieure. Scénario Iran (2024-2025) : le PR pourrait décider une opération ponctuelle sans vote parlementaire.</p>\n<h3>7. Le Pouvoir Nucléaire</h3>\n<p>Le Président est seul maître du feu nucléaire (décret du 14 janvier 1964) : domaine réservé absolu, sans aucun contrôle parlementaire, dans une posture de dissuasion strictement défensive (environ 290 têtes nucléaires, FOST + FAS).</p>\n<h3>8. Comparaisons étrangères</h3>\n<p>USA (War Powers Resolution 1973, information sous 48h, retrait sous 60 jours sans accord) · Royaume-Uni (convention constitutionnelle, vote des Communes depuis 2003) · Allemagne (vote du Bundestag obligatoire) · Italie (vote du Parlement obligatoire, article 78).</p>\n<h3>9. Enjeux Stratégiques</h3>\n<p>L'exécutif français conserve un quasi-monopole sur la guerre. Le contrôle parlementaire est tardif et faible. Le consensus politique sur les OPEX masque l'absence de débat réel. L'évolution géopolitique (Ukraine, Moyen-Orient) repose la question.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Vote parlementaire préalable obligatoire pour toute OPEX de plus de 50 soldats + débat parlementaire annuel sur les OPEX en cours + clause d'urgence (information sous 24h, vote sous 7 jours) + maintien du domaine réservé nucléaire par exception.</p>"}, {"id": "35362af8e03f816481bdc041d21f101d", "titre": "Le Premier ministre : statut et pouvoirs", "theme": 1, "cat": "1.2.2", "html": "<h3>🔁 Apports versés — 6 août 2026 (fusion de la version archivée « PM et Matignon, 25 PM »)</h3>\n<p>Cette fiche reste la canonique du statut ; le détail 2017-2027 est développé dans « Les Premiers ministres de Macron ». Apport principal transféré — <strong>table historique complète, corrigée</strong> (la version archivée comportait des dates et des chiffres faux) :</p>\n<p><strong>Les 28 Premiers ministres de la Ve République (29 mandats, Chirac ×2)</strong> : Debré (1959-62, rédacteur de la Constitution) · Pompidou (1962-68, Mai 68) · Couve de Murville (1968-69) · Chaban-Delmas (1969-72, « Nouvelle société ») · Messmer (1972-74) · Chirac (1974-76, démission) · Barre (1976-81, rigueur) · Mauroy (1981-84, union de la gauche) · Fabius (1984-86, plus jeune PM avant Attal) · Chirac (1986-88, 1re cohabitation) · Rocard (1988-91, 28 recours au 49.3, record) · Cresson (1991-92, 1re femme PM) · Bérégovoy (1992-93) · Balladur (1993-95, 2e cohabitation) · Juppé (1995-97, plan Juppé/grèves) · Jospin (1997-2002, 3e cohabitation, 35h) · Raffarin (2002-2005, canicule 2003) · Villepin (2005-2007, CPE) · Fillon (2007-12) · Ayrault (2012-14) · Valls (2014-16, loi El Khomri) · Cazeneuve (déc. 2016-mai 2017, ~5 mois) · Philippe (2017-20, Gilets jaunes) · Castex (2020-22, Covid) · Borne (2022-jan. 2024, 2e femme PM, 23 recours au 49.3) · Attal (jan.-sept. 2024, plus jeune PM, 34 ans) · Barnier (sept.-déc. 2024, censuré le 4 déc.) · Bayrou (déc. 2024-sept. 2025, confiance refusée le 8 sept. 2025) · Lecornu (depuis sept. 2025 ; Lecornu I = gouvernement de ~14h, record absolu de brièveté).</p>\n<p><strong>Corrections apportées à cette fiche</strong> : « 27 PM (1958-2024) » → 28 avec Lecornu · « plus court mandat : Cazeneuve (2 mois) » → Cazeneuve = déc. 2016-mai 2017 (~5 mois), records de brièveté ensuite : Barnier ~3 mois (2024) puis Lecornu I ~14 heures (oct. 2025) · « 23 fois sous Rocard » → 28 sous Rocard (23 est le chiffre de Borne).</p>\n<h3>1. Définition & Cadre</h3>\n<p>Le Premier ministre (PM) est le chef du gouvernement. Il « détermine et conduit la politique de la Nation » (article 20). Chef de la majorité parlementaire, coordinateur de l'action gouvernementale, il est la cheville ouvrière du système exécutif. Son influence réelle dépend étroitement de la configuration politique.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 8 (nommé par le PR, révocable à sa discrétion) · article 20 (le gouvernement détermine et conduit la politique de la Nation) · article 21 (dirige l'action du gouvernement, exécute les lois, exerce le pouvoir réglementaire) · article 49.1 (engage la responsabilité devant l'AN) · article 49.3 (engage la responsabilité sur un texte) · article 38 (habilitation à légiférer par ordonnances).</p>\n<h3>3. Fonctionnement Concret</h3>\n<p>Coordination (préside les conseils interministériels, arbitre les différends) · ordre du jour du Conseil des ministres préparé par le SGG sous son autorité · pouvoir réglementaire (décrets) · relations avec le Parlement. Hors cohabitation, exécute la politique définie par le PR ; en cohabitation, gouverne effectivement dans tous les domaines intérieurs.</p>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Relation avec le PM</th></tr><tr><td>Secrétaire général du gouvernement</td><td>Bras droit technique</td></tr><tr><td>Directeur de cabinet</td><td>Coordination politique</td></tr><tr><td>Ministères</td><td>Sous l'autorité du PM</td></tr><tr><td>Groupes parlementaires</td><td>Interlocuteurs politiques</td></tr><tr><td>Partenaires sociaux</td><td>Dialogue social national</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Budget Matignon : ~25 M€/an. Cabinet du PM : ~40 conseillers. SGG : ~200 agents. Traitement du PM : ~15 000 €/mois brut.</p>\n<h3>6. Audit Factuel</h3>\n<p>28 Premiers ministres sous la Ve République. Durée moyenne d'un PM : ~20 mois. Plus long mandat : Lionel Jospin (5 ans). 49.3 utilisé ~100 fois, dont 28 sous Rocard. 2024-2025 : Attal, Barnier, Bayrou, Lecornu en moins de deux ans.</p>\n<h3>7. Chronologie</h3>\n<p>1958 (création du rôle de PM) · 1962 (le PM devient subordonné au PR hors cohabitation) · 1986 (Chirac, 1er PM en cohabitation) · 2008 (révision : encadrement du 49.3) · 2024-2025 (instabilité : 4 PM successifs).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>Majorité parlementaire</strong> : condition de survie politique du PM</li>\n<li><strong>Président</strong> : dépend de son soutien hors cohabitation</li>\n<li><strong>Conjoncture économique et sociale</strong> : détermine la marge de manœuvre politique</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<ul>\n<li><strong>Dualité de l'exécutif</strong> : ambiguïté sur qui « dirige vraiment »</li>\n<li><strong>49.3</strong> : outil perçu comme anti-démocratique, source de crises politiques</li>\n<li><strong>Instabilité</strong> : rotation rapide des PM en période de fragmentation</li>\n</ul>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Le PM représente la France au Conseil de l'UE sur les sujets économiques et sociaux. En cohabitation, tension avec le PR sur la représentation européenne.</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>La stabilité du PM conditionne la capacité réformatrice de l'État. L'instabilité ministérielle actuelle rappelle les dérives de la IVe République.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : statu quo, instabilité gérée cas par cas</p>\n<p><strong>Scénario 2</strong> : constitutionnalisation d'un mécanisme de coalition formé (culture allemande)</p>\n<p><strong>Scénario 3</strong> : renforcement du PM et réduction des pouvoirs propres du PR</p>\n<h3>13. Faisabilité</h3>\n<p>Tout changement structurel nécessite une révision constitutionnelle, dans une culture de l'exécutif fort très ancrée.</p>\n<h3>14. Temporalité</h3>\n<p>Court terme : gestion de l'instabilité actuelle. Moyen terme : réforme possible après 2027.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : Le rôle du PM est structurellement ambigu — subordonné au PR en situation normale, chef effectif en cohabitation. L'instabilité ministérielle de 2024-2025 illustre la fragilité du système sans majorité stable.</p>\n<p><strong>Options</strong> : Statu quo · Culture de coalition · Renforcement du PM</p>\n<p><strong>Recommandation</strong> : Instaurer une culture du dialogue et du compromis parlementaire sans attendre une réforme constitutionnelle, et encadrer le recours au 49.3.</p>\n<p><strong>Sources</strong> : Articles 8, 20, 21 Constitution — SGG — matignon.gouv.fr</p>"}, {"id": "35362af8e03f8106a260cc166be08830", "titre": "La formation du gouvernement", "theme": 1, "cat": "1.2.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>La formation du gouvernement est un processus politique et constitutionnel par lequel le Président de la République, en accord avec le Premier ministre, compose l'équipe ministérielle. En France, il n'existe pas de procédure d'investiture formelle du gouvernement par l'Assemblée nationale, contrairement à de nombreuses démocraties européennes.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 8 (le PR nomme le PM puis, sur sa proposition, les membres du gouvernement) · article 13 (le PR signe les décrets de nomination) · aucune investiture parlementaire obligatoire · article 23 (incompatibilité mandat ministériel/mandat parlementaire) · Haute Cour et CJR (responsabilité pénale des ministres).</p>\n<h3>3. Fonctionnement Concret</h3>\n<p>Nomination du PM → proposition d'une liste de ministres → arbitrage PR/PM sur les profils clés → publication des décrets au JO → passation de pouvoirs → 1re réunion du Conseil des ministres → déclaration de politique générale (facultative). Profilage : ministères « régaliens » (Économie, Intérieur, Justice, Affaires étrangères, Défense) et ministères sectoriels.</p>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>PR</td><td>Décision finale, veto possible sur certains profils</td></tr><tr><td>PM</td><td>Propose la liste, négocie avec les partis</td></tr><tr><td>Partis de la coalition</td><td>Pressions sur les nominations</td></tr><tr><td>SGG</td><td>Prépare les décrets de nomination</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Traitement d'un ministre : ~10 000-12 000 € brut/mois. Voiture et logement de fonction selon rang. Cabinet ministériel : 10 à 30 conseillers. Budget global des cabinets ministériels : ~200 M€/an.</p>\n<h3>6. Audit Factuel</h3>\n<p>Taille moyenne d'un gouvernement : 35-45 membres. Durée moyenne d'un ministre : ~18 mois. 2024-2025 : Attal, Barnier, Bayrou — plusieurs gouvernements en peu de temps.</p>\n<h3>7. Chronologie</h3>\n<p>1958 (incompatibilité mandat/ministère instituée) · 1981 (gouvernement Mauroy, 44 membres, record) · 2024-2025 (instabilité gouvernementale).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>Majorité parlementaire</strong> : détermine les contraintes politiques de composition</li>\n<li><strong>Équilibre des partis</strong> : dans une coalition, chaque parti veut ses représentants</li>\n<li><strong>Parité</strong> : pression devenue standard</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<ul>\n<li><strong>Véto du PR</strong> : peut refuser des profils proposés par le PM (ex. Chirac/Jospin 1997)</li>\n<li><strong>Incompatibilité mandat/ministère</strong> : certains parlementaires répugnent à abandonner leur siège</li>\n<li><strong>Absence d'investiture</strong> : le gouvernement peut gouverner sans jamais être approuvé par l'AN</li>\n</ul>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>La France est l'un des seuls pays européens sans investiture obligatoire du gouvernement. Comparaison : Allemagne (vote Bundestag), Espagne (vote Congrès), Italie (vote des deux chambres).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>L'absence d'investiture crée un gouvernement sans mandat parlementaire explicite, fragilisant sa légitimité en contexte de majorité relative.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : statu quo, gouvernement sans investiture</p>\n<p><strong>Scénario 2</strong> : introduction d'un vote d'investiture indicatif de l'AN</p>\n<p><strong>Scénario 3</strong> : réforme constitutionnelle imposant l'investiture</p>\n<h3>13. Faisabilité</h3>\n<p>Vote indicatif possible sans révision. Investiture obligatoire nécessite une révision de l'article 49.</p>\n<h3>14. Temporalité</h3>\n<p>Réformes possibles à court terme (vote indicatif) ; révision constitutionnelle à moyen terme.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : En situation de majorité relative, l'absence d'investiture parlementaire affaiblit la légitimité du gouvernement et retarde l'action réformatrice.</p>\n<p><strong>Options</strong> : Statu quo · Vote indicatif · Investiture obligatoire</p>\n<p><strong>Recommandation</strong> : Introduire un vote indicatif non contraignant à l'AN lors de la déclaration de politique générale, pour renforcer la légitimité sans révision constitutionnelle.</p>\n<p><strong>Sources</strong> : Articles 8, 23, 49 Constitution — SGG — Legifrance</p>"}, {"id": "35362af8e03f81939e28f88b906b19b4", "titre": "La responsabilité gouvernementale (article 49)", "theme": 1, "cat": "1.2.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>L'article 49 organise le mécanisme de responsabilité du gouvernement devant l'Assemblée nationale. Il comprend plusieurs procédures : l'engagement de responsabilité volontaire (49.1), la motion de censure (49.2), l'engagement sur un texte (49.3), et la déclaration au Sénat (49.4). Le 49.3 est l'article le plus utilisé et le plus controversé.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 49.1 (le PM engage la responsabilité par un vote de confiance) · article 49.2 (l'AN peut renverser le gouvernement par motion de censure, majorité absolue des membres) · article 49.3 (engagement sur le vote d'un texte, limité à 1 fois par session hors budget depuis 2008) · article 49.4 (déclaration au Sénat, symbolique).</p>\n<h3>3. Fonctionnement Concret</h3>\n<p><strong>49.1</strong> : le PM pose la question de confiance, vote à la majorité absolue, démission en cas de rejet — pratique tombée en désuétude depuis Castex.</p>\n<p><strong>49.2</strong> : déposée par 1/10 des députés (58 minimum), vote 48h après dépôt, majorité absolue requise (289 voix), démission obligatoire si adoptée.</p>\n<p><strong>49.3</strong> : le PM engage la responsabilité sur un texte, considéré comme adopté sauf motion de censure adoptée dans les 24h ; limité à 1 usage par session depuis 2008 (sauf textes budgétaires).</p>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>PM</td><td>Engage la responsabilité</td></tr><tr><td>AN</td><td>Vote confiance ou censure</td></tr><tr><td>Groupes d'opposition</td><td>Peuvent déposer une motion de censure</td></tr><tr><td>PR</td><td>Peut dissoudre l'AN en cas de crise</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Sans coût propre — procédure parlementaire. Le 49.3 a un coût politique (mobilisations, manifestations).</p>\n<h3>6. Audit Factuel</h3>\n<p>49.3 utilisé ~100 fois depuis 1958, dont 28 sous Rocard et 23 sous Borne. Seul gouvernement renversé par motion de censure avant 2024 : Pompidou en 1962. Motion adoptée le 4 décembre 2024 : renversement de Barnier, première depuis 1962.</p>\n<h3>7. Chronologie</h3>\n<p>1958 (article 49 instauré) · 1962 (Pompidou renversé) · 1988-91 (Rocard, 49.3 28 fois) · 2008 (révision, limitation du 49.3) · 2023 (Borne, réforme des retraites) · 2024 (Barnier renversé).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>Composition de l'AN</strong> : une majorité fragile rend l'article 49 plus crucial</li>\n<li><strong>Climat politique</strong> : le 49.3 crée des crises politiques même légalement valide</li>\n<li><strong>Calendrier législatif</strong> : textes budgétaires sous pression permanente</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<ul>\n<li><strong>Légitimité du 49.3</strong> : perçu comme autoritaire, surtout pour des réformes impopulaires</li>\n<li><strong>Risque de retournement</strong> : un 49.3 déclenchant une motion de censure gagnante renverse le gouvernement (2024)</li>\n<li><strong>Débat de suppression</strong> : demandé par LFI, PS, écologistes</li>\n</ul>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Le 49.3 est spécifiquement français. La motion de censure constructive allemande (obligation de nommer un successeur avant de renverser le chancelier) est un modèle souvent cité.</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Le 49.3 est un outil de gouvernement mais son usage systématique nuit à la légitimité démocratique. La motion de censure constructive limiterait l'instabilité gouvernementale.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : maintien du 49.3 avec limitation actuelle</p>\n<p><strong>Scénario 2</strong> : suppression du 49.3 (ou limitation aux textes financiers)</p>\n<p><strong>Scénario 3</strong> : introduction de la motion de censure constructive</p>\n<h3>13. Faisabilité</h3>\n<p>Toute réforme de fond (suppression, motion constructive, limitation aux finances) nécessite une révision constitutionnelle.</p>\n<h3>14. Temporalité</h3>\n<p>Débat à court terme (post-2024) ; réforme lors d'une fenêtre constitutionnelle, 2027 ou après.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : Le 49.3 a été utilisé pour faire passer des réformes sans majorité parlementaire, créant une crise de légitimité ; le renversement de Barnier en 2024 illustre que ce mécanisme peut se retourner contre le gouvernement.</p>\n<p><strong>Options</strong> : Suppression · Limitation aux finances · Motion constructive</p>\n<p><strong>Recommandation</strong> : Introduire la motion de censure constructive sur le modèle allemand, tout en limitant le 49.3 aux seuls textes financiers.</p>\n<p><strong>Sources</strong> : Article 49 Constitution — SGG — Assemblée nationale</p>"}, {"id": "35362af8e03f812ab429e9d8d5410dd1", "titre": "Matignon : organisation et moyens", "theme": 1, "cat": "1.2.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Matignon est la résidence et le lieu de travail du Premier ministre depuis 1935. Il abrite le cabinet du PM, le Secrétariat général du Gouvernement (SGG) et les services d'appui. Il est le centre de coordination de l'action gouvernementale.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Programme 129 en LFI (« Coordination du travail gouvernemental ») · propriété de l'État · SGG (structure permanente indépendante des alternances) · cabinet PM (structure politique renouvelée à chaque gouvernement).</p>\n<h3>3. Fonctionnement Concret</h3>\n<p><strong>Cabinet du PM (~40 conseillers) :</strong> directeur de cabinet (coordination politique), conseiller spécial, pôles thématiques (économie, social, intérieur, justice, éducation), chargés de relations avec le Parlement.</p>\n<p><strong>SGG :</strong> prépare l'ordre du jour du Conseil des ministres, coordonne le travail législatif et réglementaire, assure la continuité de l'État entre gouvernements.</p>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>Secrétaire général du Gouvernement</td><td>Clef de voûte technique</td></tr><tr><td>Directeur de cabinet PM</td><td>Pivot politique</td></tr><tr><td>SGG</td><td>Mémoire institutionnelle</td></tr><tr><td>SGDSN</td><td>Sécurité nationale et défense</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Budget Matignon (programme 129) : ~700 M€ (SGG + coordination interministérielle inclus). Cabinet strict du PM : ~25 M€. Personnel SGG : ~200 agents. SGDSN (rattaché au PM) : ~300 M€.</p>\n<h3>6. Audit Factuel</h3>\n<p>37 Premiers ministres installés à Matignon depuis 1958. SGG créé en 1935, traversant toutes les Républiques. Budget 2024 (programme 129) : 706 M€.</p>\n<h3>7. Chronologie</h3>\n<p>1935 (installation du PM à Matignon) · 1958 (SGG renforcé) · 2008 (renforcement du rôle de coordination parlementaire) · 2017 (création du Secrétariat général pour l'investissement).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>Élysée</strong> : la coordination Élysée/Matignon est le nerf de la gouvernance</li>\n<li><strong>Ministères</strong> : le SGG est l'interface obligatoire pour les textes normatifs</li>\n<li><strong>Parlement</strong> : les services de Matignon suivent les procédures législatives</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<ul>\n<li><strong>Double circuit Élysée/Matignon</strong> : risque de court-circuitage du PM</li>\n<li><strong>Rotation des cabinets</strong> : changement à chaque gouvernement, le SGG assurant la continuité</li>\n<li><strong>Inflation normative</strong> : le SGG est submergé par le flux de textes à coordonner</li>\n</ul>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Le SGAE, rattaché à Matignon, coordonne les positions françaises à Bruxelles. Comparaison : Chancellerie fédérale allemande (plus puissante), Cabinet Office britannique.</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>La coordination Matignon/Élysée est le facteur clé de l'efficacité gouvernementale ; la qualité du SGG conditionne la cohérence juridique de l'action de l'État.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : statu quo, amélioration de la coordination informelle</p>\n<p><strong>Scénario 2</strong> : fusion SGPR/SGG en un Secrétariat général unique de l'exécutif</p>\n<p><strong>Scénario 3</strong> : renforcement du SGAE comme interface centrale avec l'UE</p>\n<h3>13. Faisabilité</h3>\n<p>Réorganisation interne possible par décret ; fusion SGPR/SGG complexe politiquement.</p>\n<h3>14. Temporalité</h3>\n<p>Court terme : optimisation des processus existants. Moyen terme : réforme organisationnelle possible.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : La coordination Matignon/Élysée repose trop sur des mécanismes informels et les relations personnelles entre secrétaires généraux, créant des risques de dysfonctionnement en cas de tension politique.</p>\n<p><strong>Options</strong> : Amélioration informelle · Fusion SGPR/SGG · Renforcement SGAE</p>\n<p><strong>Recommandation</strong> : Formaliser les procédures de coordination Élysée/Matignon et renforcer le SGAE comme pivot de la position française à Bruxelles.</p>\n<p><strong>Sources</strong> : LFI 2024 (programme 129) — SGG (gouvernement.fr) — SGAE — Cour des comptes</p>"}, {"id": "35362af8e03f81e287ebd361077ac67d", "titre": "Le Secrétariat Général du Gouvernement (SGG)", "theme": 1, "cat": "1.2.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le Secrétariat général du Gouvernement (SGG) est la cheville ouvrière administrative de Matignon. Structure permanente et non politique, il assure la continuité de l'État à travers toutes les alternances. Il prépare l'ordre du jour du Conseil des ministres, coordonne le travail normatif et assure la qualité juridique des textes.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Créé par décret (structure administrative, pas constitutionnelle) · rattaché au Premier ministre · décret du 25 juillet 1934 (fondation du SGG) · circulaires du Premier ministre sur l'organisation du travail gouvernemental.</p>\n<h3>3. Fonctionnement Concret</h3>\n<p>Missions : préparation de l'ordre du jour du Conseil des ministres, coordination de la procédure d'élaboration des textes législatifs et réglementaires, saisine du Conseil d'État, transmission des textes au Parlement, publication au Journal officiel, gestion des archives gouvernementales, conseil juridique auprès du PM.</p>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>Secrétaire général du Gouvernement</td><td>Haute autorité permanente</td></tr><tr><td>Directeurs adjoints</td><td>Coordination par pôles</td></tr><tr><td>Conseil d'État</td><td>Partenaire pour la qualité juridique</td></tr><tr><td>SGPR</td><td>Homologue élyséen</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Personnel : ~200 agents permanents (juristes, hauts fonctionnaires issus de l'INSP, du CE, de la magistrature). Budget intégré au programme 129.</p>\n<h3>6. Audit Factuel</h3>\n<p>SGG permanent depuis 1935 — seule structure qui ne change pas lors des alternances. Chaque semaine : préparation d'un Conseil des ministres. Le SGG refuse les textes mal rédigés avant saisine du Conseil d'État.</p>\n<h3>7. Chronologie</h3>\n<p>1934-35 (création du SGG) · 1958 (renforcement dans la Ve République) · années 1990 (extension du rôle de coordination interministérielle) · 2017 (collaboration renforcée avec le Conseil d'État).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>Conseil d'État</strong> : partenaire obligatoire pour les projets de loi et décrets en CE</li>\n<li><strong>Journal officiel</strong> : canal final de publication des textes</li>\n<li><strong>Ministères</strong> : producteurs des projets de textes soumis au SGG</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<ul>\n<li><strong>Inflation normative</strong> : flux de textes trop important, risque de dégradation de la qualité</li>\n<li><strong>Tension politique/technique</strong> : les cabinets politiques contournent parfois le SGG</li>\n<li><strong>Accumulation des réformes</strong> : surcharge procédurale</li>\n</ul>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Le SGG collabore avec le SGAE pour les textes de transposition du droit européen. Comparaison : Cabinet Office britannique (plus politique), Bundeskanzleramt (plus puissant).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Le SGG est le garant de la cohérence juridique et procédurale de l'action gouvernementale. Sa montée en puissance dans la coordination interministérielle est un enjeu d'efficacité de l'État.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : maintien du rôle actuel</p>\n<p><strong>Scénario 2</strong> : renforcement du SGG comme office de simplification normative</p>\n<p><strong>Scénario 3</strong> : fusion SGPR/SGG en structure exécutive unifiée</p>\n<h3>13. Faisabilité</h3>\n<p>Renforcement du rôle possible par circulaire ; fusion nécessitant un accord politique fort.</p>\n<h3>14. Temporalité</h3>\n<p>Évolutions possibles à court terme par décision du PM.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : L'inflation normative et la politisation croissante de l'action gouvernementale fragilisent la qualité juridique des textes et la cohérence de l'action publique.</p>\n<p><strong>Options</strong> : Statu quo · Renforcement SGG · Fusion exécutive</p>\n<p><strong>Recommandation</strong> : Renforcer le mandat du SGG comme office de qualité normative et de simplification législative, avec un pouvoir de blocage formel sur les textes mal rédigés.</p>\n<p><strong>Sources</strong> : gouvernement.fr — Conseil d'État (rapports publics) — Cour des comptes</p>"}, {"id": "35862af8e03f8104a221e8f9888209c0", "titre": "L'article 49 : 49.1, 49.2, 49.3, 49.4 — mécanismes de responsabilité", "theme": 1, "cat": "1.2.2", "html": "<h3>🔁 Apports versés — 6 août 2026 (fusion de la version archivée « 49.3 et motion de censure »)</h3>\n<p>Cette fiche reste la canonique (périmètre complet de l'article 49). Apports transférés :</p>\n<p><strong>Procédure détaillée du 49.3</strong> : engagement après délibération en Conseil des ministres → suspension des débats → 24h pour déposer une motion de censure (1/10 des députés, soit 58) → vote 48h après dépôt. Un seul texte par engagement, à l'AN uniquement.</p>\n<p><strong>Distinction 49.3 / vote bloqué (art. 44.3)</strong> : le 44.3 impose un vote unique avec les seuls amendements acceptés par le Gouvernement — moins radical, le vote a lieu.</p>\n<p><strong>Comparaisons étrangères</strong> : Allemagne (question de confiance, art. 68 LF), Espagne (motion de censure constructive — obligation de proposer un autre chef de gouvernement), Italie (motion de confiance répétée).</p>\n<p><strong>Positions de réforme par parti</strong> : suppression totale (LFI, Écologistes, PCF) · limitation supplémentaire y compris budgétaire (PS) · maintien (Renaissance, LR) · RN fluctuant.</p>\n<p><strong>MAJ 6 juillet 2026 — motion de censure « climatique » (49.2) rejetée</strong> : déposée le 2 juillet par 58 députés (Écologistes/LFI) sur la gestion de la canicule et la baisse du Fonds vert (2,4 Md€ 2024 → 837 M€) ; rejetée le 6 juillet avec 132 voix pour (289 requises), la gauche restant divisée. Confirmation : sans coalition alternative, les motions spontanées échouent.</p>\n<p><strong>Arbitrage de dates (séquence Barnier)</strong> : 49.3 sur le PLFSS engagé le 2 décembre 2024, motion adoptée le 4 décembre 2024 (331 voix), Bayrou nommé le 13 décembre 2024.</p>\n<h3>1. Définition & Cadre</h3>\n<p>L'article 49 organise les mécanismes de mise en jeu de la responsabilité du Gouvernement devant l'Assemblée nationale. Quatre procédures coexistent : 49.1 (engagement sur le programme), 49.2 (motion de censure), 49.3 (engagement sur un texte), 49.4 (déclaration au Sénat). Le 49.3 est l'article le plus utilisé et le plus controversé.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Constitution, article 49 (4 alinéas) · révision constitutionnelle du 23 juillet 2008 (encadrement du 49.3) · règlement de l'Assemblée nationale.</p>\n<h3>3. Article 49.1 : Engagement sur Programme</h3>\n<p>Le PM peut engager la responsabilité sur son programme ou une déclaration de politique générale ; vote favorable à la majorité simple ; si rejet, démission obligatoire du Gouvernement. Pratique tombée en désuétude depuis Castex (2020).</p>\n<h3>4. Article 49.2 : Motion de Censure</h3>\n<p>Déposée par 1/10 des députés (58 minimum), vote 48h après le dépôt, majorité absolue requise (289 voix, ne comptant que les votes favorables). ~50 motions déposées depuis 1958, une seule adoptée avant 2024 (Pompidou, 5 octobre 1962). Barnier renversé le 4 décembre 2024 (331 voix) — première depuis 62 ans.</p>\n<h3>5. Article 49.3 : L'Engagement Forcé</h3>\n<p>Le PM engage la responsabilité sur un texte, considéré comme adopté sans vote, sauf motion de censure (49.2) adoptée. Limité depuis 2008 à 1 utilisation par session (sauf budgets).</p>\n<table><tr><th>Premier ministre</th><th>Nombre</th></tr><tr><td>Rocard (1988-91)</td><td>28 (record)</td></tr><tr><td>Borne (2022-2024)</td><td>23 (record post-2008)</td></tr><tr><td>Attal (2024)</td><td>7</td></tr><tr><td>Total depuis 1958</td><td>~95</td></tr></table>\n<h3>6. Article 49.4 : Déclaration au Sénat</h3>\n<p>Le PM peut demander au Sénat l'approbation d'une déclaration de politique générale, sans engagement de responsabilité ni sanction en cas de rejet.</p>\n<h3>7. Le 49.3 : Débat Démocratique</h3>\n<p>Critiques : déni de débat parlementaire, concentration excessive du pouvoir, usage pour les retraites/le budget/l'asile sous Borne. Défense : stabilité institutionnelle, possibilité d'agir en période de blocage, sanction démocratique possible via motion de censure.</p>\n<h3>8. Crise de 2024</h3>\n<p>Barnier utilise le 49.3 sur le PLFSS (2 décembre 2024). Motion de censure déposée par le NFP, adoptée par 331 voix le 4 décembre 2024 (première depuis 1962). Bayrou nommé PM le 13 décembre 2024.</p>\n<h3>9. Enjeux Stratégiques</h3>\n<p>Le 49.3 est devenu la béquille des gouvernements minoritaires, avec un risque de banalisation de la motion de censure et une nécessité reconnue d'une nouvelle culture parlementaire.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>L'équilibre de l'article 49 a été déstabilisé par la dissolution de 2024 et la motion de censure adoptée contre Barnier. Réformes à envisager : suppression du 49.3 sauf pour les budgets, encadrement de la motion de censure, dose de proportionnelle pour favoriser les compromis.</p>"}, {"id": "35862af8e03f81d7a3eed54f76594f26", "titre": "Le Conseil des ministres : fonctionnement, composition et décisions", "theme": 1, "cat": "1.2.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le Conseil des ministres est l'organe principal de délibération du gouvernement, présidé par le président de la République. Il se réunit chaque mercredi à l'Élysée. Il valide les décisions importantes : projets de loi, ordonnances, décrets en Conseil des ministres, nominations.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 9 (présidence par le président) · article 38 (ordonnances) · article 13 (nominations) · décret du 11 juillet 1979 sur la communication officielle.</p>\n<h3>3. Fonctionnement</h3>\n<p>Hebdomadaire, chaque mercredi 10h à l'Élysée. Préparé par le SGG. Ordre du jour fixé par le président. Communiqué final lu par la porte-parole du gouvernement.</p>\n<h3>4. Composition</h3>\n<p>Président de la République (préside) · Premier ministre · tous les ministres de plein exercice · ministres délégués si concernés · Secrétaire général du Gouvernement (assiste, ne vote pas) · Secrétaire général de l'Élysée.</p>\n<h3>5. Les Décisions</h3>\n<p>Projets de loi avant dépôt au Parlement · ordonnances (article 38) · décrets en Conseil des ministres (les plus importants) · nominations (préfets, ambassadeurs, recteurs, directeurs d'administration centrale) · communications de chaque ministre.</p>\n<h3>6. Le Compte Rendu</h3>\n<p>Pas de procès-verbal public ; compte rendu transmis aux membres uniquement ; communication officielle par la porte-parole du gouvernement après la réunion ; débats secrets sauf fuites.</p>\n<h3>7. Les Conseils Restreints</h3>\n<p>Convoqués en cas de besoin (sécurité, crise), composition réduite. Le Conseil de défense et de sécurité nationale (CDSN) a été très utilisé sous Macron pour la Covid et l'Ukraine.</p>\n<h3>8. Données Clés</h3>\n<p>50 à 60 Conseils des ministres par an, durée moyenne 1h30, 5 à 10 points à l'ordre du jour. Plus de 200 conseils de défense entre 2020 et 2024 sous Macron.</p>\n<h3>9. Les Critiques Récurrentes</h3>\n<p>Sous Macron, peu de débats réels (décisions prises en amont). Le Conseil de défense est utilisé pour contourner le Conseil des ministres (secret + restreint). Beaucoup de communication, peu de débat réel.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Le Conseil des ministres est un rituel formel, mais le pouvoir réel se joue ailleurs (Élysée + cabinets). Réforme à envisager : compte rendu public partiel, limitation des Conseils de défense aux situations réellement de crise.</p>"}, {"id": "35862af8e03f813a8cc1c88222f9983f", "titre": "Les Premiers ministres de Macron 2017-2027 : Philippe, Castex, Borne, Attal, Barnier, Bayrou, Lecornu", "theme": 1, "cat": "1.2.2", "html": "<p>> Fiche actualisée au 3 août 2026. Lecornu y figure comme 7e Premier ministre de Macron, en fonction depuis septembre 2025.</p>\n<h3>1. Définition & Cadre</h3>\n<p>Les Premiers ministres successifs sous la présidence d'Emmanuel Macron (2017-2027) illustrent une instabilité gouvernementale sans précédent sous la Ve République : 7 chefs de gouvernement en moins de 10 ans. La difficulté à gouverner sans majorité absolue, installée depuis 2022, s'est muée en crise institutionnelle ouverte après la dissolution de juin 2024, culminant en 2025 avec la première chute d'un gouvernement sur vote de confiance depuis 1958, puis le gouvernement le plus éphémère de l'histoire de la Ve République.</p>\n<h3>2. Les 7 Premiers ministres de Macron</h3>\n<table><tr><th>PM</th><th>Période</th><th>Origine</th><th>Fin</th></tr><tr><td>Édouard Philippe</td><td>mai 2017 – juillet 2020</td><td>LR (transfuge)</td><td>Départ après municipales</td></tr><tr><td>Jean Castex</td><td>juillet 2020 – mai 2022</td><td>LR (technique)</td><td>Départ après présidentielle</td></tr><tr><td>Élisabeth Borne</td><td>mai 2022 – janvier 2024</td><td>LREM</td><td>Départ, choix Macron</td></tr><tr><td>Gabriel Attal</td><td>janvier – septembre 2024</td><td>LREM (le + jeune)</td><td>Départ après dissolution</td></tr><tr><td>Michel Barnier</td><td>septembre – décembre 2024</td><td>LR</td><td>Censure (NFP + RN)</td></tr><tr><td>François Bayrou</td><td>décembre 2024 – septembre 2025</td><td>MoDem</td><td>Chute sur vote de confiance (49.1)</td></tr><tr><td>Sébastien Lecornu</td><td>septembre 2025 – en fonction</td><td>Renaissance (ex-LR)</td><td>En fonction (Lecornu II)</td></tr></table>\n<h3>3. Édouard Philippe (2017-2020)</h3>\n<p>Ancien maire LR du Havre, choix d'ouverture. Réformes SNCF, retraite avortée, crise des Gilets jaunes, début du Covid. Départ après son succès aux municipales 2020. A fondé Horizons (centre-droit), candidat déclaré à la présidentielle 2027.</p>\n<h3>4. Jean Castex (2020-2022)</h3>\n<p>Ex-préfet, profil technique après les Gilets jaunes et pendant le Covid. Connu pour la gestion du déconfinement, peu politique, consensuel. Départ après la réélection de Macron.</p>\n<h3>5. Élisabeth Borne (2022-2024)</h3>\n<p>2e femme Première ministre après Édith Cresson. Profil technique (ex-RATP, préfectorale, ministères). Marquée par la réforme des retraites 2023 (49.3), usage record du 49.3. Départ sur choix de Macron. Suite (2026) : quitte la présidence du conseil national de Renaissance en mai 2026 et fonde le mouvement « Bâtissons ensemble ».</p>\n<h3>6. Gabriel Attal (2024)</h3>\n<p>34 ans, plus jeune PM de la Ve République. Issu de l'Éducation nationale (interdiction de l'abaya). Échec aux européennes 2024, départ provoqué par la dissolution surprise. Suite (2026) : désigné candidat à la présidentielle 2027 par le conseil national de Renaissance (12 mai 2026, 221 voix soit 91 %) ; doit déclarer sa candidature avant le 1er octobre 2026.</p>\n<h3>7. Michel Barnier (2024)</h3>\n<p>1er PM LR depuis 2017, 73 ans, doyen des PM de la Ve République. Ex-négociateur européen du Brexit. Censuré le 4 décembre 2024 (motion NFP + RN), 1re censure aboutie depuis 1962. ~3 mois en poste.</p>\n<h3>8. François Bayrou (2024-2025)</h3>\n<p>Président du MoDem, 73 ans à sa nomination. Plan de redressement budgétaire (~40 Mds€ d'économies), mesures impopulaires (suppression de deux jours fériés). 8 septembre 2025 : l'Assemblée lui refuse la confiance (art. 49.1, 364 voix contre, 194 pour) — premier gouvernement contraint à démissionner après un vote de confiance défavorable depuis la chute du gouvernement Gaillard en 1958. Démission remise le 9 septembre 2025.</p>\n<h3>9. Sébastien Lecornu (depuis septembre 2025) — PM en fonction</h3>\n<p><strong>Profil :</strong> né le 11 juin 1986, engagé à l'UMP à 16 ans, ex-LR rallié à Macron dès 2017, membre de Renaissance. Parcours : président du conseil départemental de l'Eure (2015-2017), secrétaire d'État puis ministre à plusieurs portefeuilles, ministre des Armées (2022-2025).</p>\n<p><strong>Lecornu I — le gouvernement le plus éphémère de la Ve République :</strong> nommé PM le 9 septembre 2025 (jour de la démission de Bayrou), 26 jours de consultations (record de la Ve République), gouvernement nommé le 5 octobre 2025, démission le 6 octobre 2025, soit ~14 heures après la nomination des ministres et avant le premier conseil des ministres — devant la menace de départ des Républicains et de censure.</p>\n<p><strong>Lecornu II (en fonction) :</strong> reconduit le 10 octobre 2025, ministres nommés le 12 octobre 2025 (48e gouvernement de la Ve République). Six ministres LR y figurent malgré l'opposition de leur parti. Darmanin quitte Renaissance le 14 octobre 2025. Discours de politique générale : suspension de la réforme des retraites annoncée, engagement à ne pas recourir au 49.3. Remaniement à la marge le 26 février 2026.</p>\n<p><strong>Bilan et épreuves (2026) :</strong> budget 2026 — Lecornu recourt finalement trois fois au 49.3 (20, 23, 30 janvier) après plus de 350 heures de débat ; cinq motions de censure rejetées ; budget définitivement adopté début février 2026, déficit ramené à 5 % du PIB. Gestion du choc économique lié à la guerre USA-Iran et au blocage du détroit d'Ormuz. 21 mai 2026 : première conférence de presse. 6 juillet 2026 : survit à une motion de censure « climatique » (132 voix sur 289 requises).</p>\n<p><strong>Suite — juillet-août 2026 :</strong> 8 juillet, annonce d'un projet de loi triplant les peines pour diffusion de faux contenus en période électorale ; 14 juillet, saisine du Conseil constitutionnel sur la loi relative à l'aide à mourir pour en sécuriser les points fragiles (affaire n° 2026-910 DC) ; 20-21 juillet, crise ouverte sur la loi d'urgence agricole, adoptée contre une partie du gouvernement ; 24 juillet, gestion des incendies Gironde-Landes.</p>\n<h3>10. Enjeux stratégiques</h3>\n<p>Instabilité record (7 PM en moins de 10 ans, deux gouvernements tombés, un gouvernement de 14 heures). Gouverner sans majorité absolue depuis 2022 impose un recours massif au 49.3 puis à la survie par division des oppositions. Question de fond : la Ve République est-elle adaptée aux majorités relatives durables ?</p>\n<h3>11. Synthèse décisionnelle</h3>\n<p>La multiplication des Premiers ministres n'est pas un accident de personnes mais un symptôme institutionnel : la Ve République, conçue pour le fait majoritaire, fonctionne mal en majorité relative durable. Trois leviers : introduire une dose de proportionnelle, encadrer ou supprimer le 49.3 en échange d'un contrat de coalition, renforcer les pouvoirs de contrôle du Parlement.</p>"}, {"id": "35962af8e03f81c0a813d252ecb4d66a", "titre": "Le SGAE (Secrétariat général des affaires européennes) : coordination Bruxelles-Paris", "theme": 1, "cat": "1.2.2", "html": "<h3>🔁 Lecture croisée — 10 août 2026</h3>\n<p>Depuis une page archivée sur le même sujet, restée avec la mention « transfert non vérifié ». Apport principal : le cycle par lequel une position française se fabrique, qui manquait entièrement à la version d'origine.</p>\n<p><strong>Le cycle de la position française, en sept temps :</strong> proposition de la Commission européenne → le SGAE saisit les ministères concernés → réunion interministérielle (RIM), sous présidence du SGAE (≈1 500 par an, millésime à confirmer) → élaboration d'un mandat de négociation → arbitrage (PM, voire Président sur les sujets sensibles) → transmission à la Représentation permanente à Bruxelles → négociation au COREPER, puis au Conseil. C'est au COREPER que le représentant permanent donne le feu vert sur les compromis, avant le niveau ministre.</p>\n<p><strong>Procédures d'infraction ouvertes contre la France :</strong> environ 70 en cours (état 2024) — à distinguer des condamnations proprement dites (1-2 par an) : deux grandeurs distinctes, à ne jamais présenter comme comparables.</p>\n<p><strong>Rattachement institutionnel</strong> : vérification menée sur sources ouvertes — le SGAE est chargé, sous l'autorité du Premier ministre, de la coordination interministérielle pour les affaires européennes, conformément aux orientations définies par le président de la République. Le rattachement est donc bien Matignon (secrétaire général depuis le 25 juillet 2022 : Emmanuel Puisais-Jauvin). Reste ouverte la seule question de l'auteur formel du décret individuel de nomination (PR ou PM), à vérifier au JO.</p>\n<p><strong>Écarté (non repris)</strong> : « 80 % des lois françaises ont une dimension européenne » (chiffre contesté, périmètre non défini) · « 200+ directives à transposer chaque année » (invraisemblable, incompatible avec le taux de transposition réel) · « L'Allemagne a cinq fois plus d'agents dédiés » (aucun périmètre comparable donné) · localisation à Matignon (le SGAE est un service du PM mais n'y est pas hébergé — à vérifier avant toute mention).</p>\n<h3>1. Définition & Cadre</h3>\n<p>Le Secrétariat général des affaires européennes (SGAE) est un service du Premier ministre chargé de coordonner la position française sur les sujets européens. Il est l'interface centrale entre les ministères français et les institutions européennes.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Décret n° 2005-1283 du 17 octobre 2005 (création du SGAE, en remplacement du SGCI), rattaché au Premier ministre.</p>\n<h3>3. Missions du SGAE</h3>\n<p>Coordination interministérielle (prépare la position française, assure la cohérence entre ministères, médiation en cas de divergence) · liaison avec Bruxelles (Représentation permanente, groupes de travail du Conseil, Parlement européen) · pilotage des transpositions de directives · veille européenne.</p>\n<h3>4. Organisation</h3>\n<p>Environ 200 agents, majoritairement détachés des ministères. Bureaux spécialisés : affaires institutionnelles, politiques internes, politiques sectorielles, politiques externes, affaires juridiques, affaires budgétaires.</p>\n<h3>5. Le Pilotage Politique</h3>\n<p>Le Premier ministre préside les réunions de coordination européenne et tranche les arbitrages interministériels. Le Président préside les Conseils européens et conserve son domaine réservé (politique étrangère et de sécurité). Le ministre des Affaires européennes travaille sous l'autorité du PM.</p>\n<h3>6. La Référence Permanente : la REP</h3>\n<p>La Représentation permanente de la France auprès de l'UE, basée à Bruxelles (plus de 200 agents), articulée en permanence avec le SGAE (SGAE = arène de Paris, REP = arène de Bruxelles).</p>\n<h3>7. Les Défis du SGAE</h3>\n<p>Coordination interministérielle (conflits fréquents entre ministères) · veille réglementaire (plus de 1 200 textes en négociation simultanée) · forte présence des lobbys étrangers à Bruxelles.</p>\n<h3>8. La Transposition des Directives</h3>\n<p>Taux de transposition français en 2024 : 99,1 % (18 directives en retard). France condamnée en moyenne 1-2 fois/an pour retard de transposition.</p>\n<h3>9. Le SGDSN et le SGAE : Différence</h3>\n<p>Le SGDSN traite les dossiers de défense et de sécurité (dont la cybersécurité, ANSSI rattachée) ; le SGAE traite les dossiers UE et la transposition des directives, avec un travail conjoint sur les sujets de sécurité européenne (PESC, PSDC).</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>Le SGAE est crucial mais peu connu du grand public ; sa qualité détermine l'influence française à Bruxelles. Débat sur son renforcement face à un possible sous-effectif relatif.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Renforcer les effectifs du SGAE + créer des fonctions de « détachés européens » dans tous les ministères + plan de carrière européen pour les hauts fonctionnaires + transparence sur les positions françaises + commission européenne renforcée à l'AN.</p>"}, {"id": "35962af8e03f814c871cf538d459dd78", "titre": "Ministres délégués et secrétaires d'État : statut, hiérarchie et rôles", "theme": 1, "cat": "1.2.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les ministres délégués et secrétaires d'État sont des membres du Gouvernement de rang inférieur aux ministres pleins. Ils ne participent pas systématiquement au Conseil des ministres et travaillent sous l'autorité d'un ministre titulaire. Leur statut, attributions et nombre varient selon les gouvernements.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 8 al. 2 de la Constitution · décret de nomination (portée variable selon le PM) · décret d'attributions individuelles · article 23 (incompatibilités).</p>\n<h3>3. La Hiérarchie au Sein du Gouvernement</h3>\n<p>Ordre protocolaire : Premier ministre → ministres d'État (rang exceptionnel) → ministres pleins → ministres délégués → secrétaires d'État → hauts-commissaires (rares).</p>\n<h3>4. Les Ministres d'État</h3>\n<p>Rang protocolaire supérieur au ministre ordinaire, souvent attribué à des personnalités majeures. Exemples récents : Bruno Le Maire (Économie), Gérald Darmanin (Intérieur).</p>\n<h3>5. Les Ministres Délégués</h3>\n<p>Rattachés à un ministre titulaire, compétence sectorielle déléguée, siègent au Conseil des ministres selon l'ordre du jour, disposent d'un cabinet et d'un budget propres.</p>\n<h3>6. Les Secrétaires d'État</h3>\n<p>Rang inférieur aux ministres délégués, compétence très spécifique, ne siègent au Conseil des ministres que sur invitation, budget et cabinet plus modestes.</p>\n<h3>7. La Composition Variable des Gouvernements</h3>\n<table><tr><th>PM</th><th>Gouvernement</th><th>Ministres pleins</th><th>Ministres délégués</th><th>Sec. d'État</th><th>Total</th></tr><tr><td>Borne (2022)</td><td>1er gouv.</td><td>17</td><td>14</td><td>11</td><td>42</td></tr><tr><td>Attal (2024)</td><td>Gouv. resserré</td><td>14</td><td>12</td><td>8</td><td>34</td></tr><tr><td>Barnier (2024)</td><td>Gouv. min.</td><td>17</td><td>8</td><td>6</td><td>31</td></tr><tr><td>Bayrou (2024)</td><td>Gouv. min.</td><td>16</td><td>10</td><td>6</td><td>32</td></tr></table>\n<p>Comparaisons internationales : Allemagne (~16 ministres fédéraux), Royaume-Uni (~22 ministres + 100 secrétaires d'État), France (30-45 membres généralement).</p>\n<h3>8. Le Salaire et les Avantages</h3>\n<table><tr><th>Niveau</th><th>Net mensuel</th></tr><tr><td>Premier ministre</td><td>17 000 €</td></tr><tr><td>Ministre plein</td><td>10 500 €</td></tr><tr><td>Ministre délégué</td><td>9 700 €</td></tr><tr><td>Secrétaire d'État</td><td>8 200 €</td></tr></table>\n<p>Avantages : logement de fonction selon poste, véhicule et chauffeur, cabinet (5-30 personnes selon rang), défraiements, sécurité.</p>\n<h3>9. Les Cabinets Ministériels</h3>\n<p>Composition : directeur de cabinet, chef de cabinet, conseillers, attachés parlementaires/presse/communication. Taille : 15-30 conseillers pour un ministre plein, 8-15 pour un délégué, 5-10 pour un secrétaire d'État. Plafond Macron (2017) : 10 conseillers max pour un ministre, peu respecté en pratique (détachements).</p>\n<h3>10. Le Rôle des Ministres Junior</h3>\n<p>Avantages : couverture de plus de sujets, représentation des sensibilités politiques, formation de la relève. Inconvénients : coûts (multiplication des cabinets), doublons, manque de visibilité, opacité du qui-fait-quoi.</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Les gouvernements français sont parmi les plus pléthoriques d'Europe. Le coût total des cabinets est considérable (60+ M€/an). Certains secrétariats d'État sont jugés symboliques.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Limiter les gouvernements à 25 membres maximum + supprimer les secrétariats d'État purement symboliques + plafond réel à 10 conseillers/ministre + transparence des rémunérations et des cabinets + séparation claire des attributions.</p>"}, {"id": "35962af8e03f81d39b39c0682a9826be", "titre": "La démission du Gouvernement : cas, affaires courantes et crise 2024-2025", "theme": 1, "cat": "1.2.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>La démission du Gouvernement met fin aux fonctions du Premier ministre et de l'ensemble des ministres. Elle peut intervenir suite à une motion de censure, une défaite électorale, une décision personnelle du PM, ou une demande du Président. La période de gestion d'affaires courantes qui s'ensuit a un régime juridique limité.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 8 al. 1 (le PR met fin aux fonctions du PM sur présentation de la démission du Gouvernement) · article 49 al. 2-3 (motion de censure adoptée → démission obligatoire) · article 50 (obligation de démission après censure ou désapprobation d'une déclaration de politique générale).</p>\n<h3>3. Les Cas de Démission</h3>\n<p>Après motion de censure : Pompidou 1962, Barnier 5 décembre 2024. Après élection législative défavorable : Mauroy 1986, Bérégovoy 1993, Juppé 1997, Attal juin 2024. Décision personnelle du PM : Chirac 1976, Rocard 1991, Cresson 1992, Castex 2022, Borne 2024, Bayrou septembre 2025, Lecornu I (après 14h, octobre 2025, record historique). Demande du Président : Pompidou 1968, Chaban-Delmas 1972, Mauroy 1984.</p>\n<h3>4. La Gestion des Affaires Courantes</h3>\n<p>Le Gouvernement reste en fonction jusqu'à la nomination du successeur, avec des pouvoirs limités (pas de réformes d'envergure, pas de nominations stratégiques). Le cas Attal juin-septembre 2024 constitue la plus longue période d'affaires courantes de la Ve République (51 jours), critiquée pour son inertie.</p>\n<h3>5. La Crise Bayrou-Lecornu Septembre-Octobre 2025</h3>\n<p>Bayrou (8 sept. 2025) : demande un vote de confiance sur les économies, rejeté par 364 voix contre 194, démission immédiate. Lecornu I (5-6 oct. 2025) : gouvernement nommé le 5 octobre, démission le 6 après-midi (~14h de gouvernement), record historique. Lecornu II (10-12 oct. 2025) : renommé, gouvernement reformé.</p>\n<h3>6. La Question de la « Démission Préventive »</h3>\n<p>Le vote de confiance de l'article 49 al. 1 fait du rejet un acte politique dont la démission est un usage constant depuis 1962, sans être explicitement obligatoire au sens strict de l'article 50 (qui ne vise formellement que la censure et la désapprobation d'une déclaration de politique générale) — la chute de Bayrou en 2025 confirme cet usage en pratique.</p>\n<h3>7. Le Rôle du Président</h3>\n<p>Le PR « met fin » aux fonctions sur présentation de la démission ; il pourrait théoriquement refuser, mais ne le fait pas en pratique. L'article 50 rend la démission obligatoire en cas de motion de censure ou de désapprobation d'une déclaration de politique générale.</p>\n<h3>8. Comparaisons étrangères</h3>\n<p>Allemagne (motion de censure constructive, obligeant à élire un nouveau chancelier) · Royaume-Uni (convention de démission immédiate après défaite législative) · USA (pas de démission, mandat fixe).</p>\n<h3>9. Enjeux Stratégiques</h3>\n<p>Le régime juridique du Gouvernement démissionnaire est flou. Les longues périodes d'affaires courantes créent un vide décisionnel. La crise 2024-2025 (Barnier censuré, Attal 51 jours d'affaires courantes, Bayrou renversé sur la confiance, Lecornu I 14 heures, Lecornu II survivant par défaut) constitue le corpus empirique le plus fourni depuis 1958 pour justifier une réforme.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Clarifier le régime des affaires courantes : loi organique définissant les pouvoirs du gouvernement démissionnaire, délai maximal de 30 jours pour la nomination d'un successeur, prolongation possible du PLF/PLFSS par décret en dernière extrémité, introduction d'une motion de censure constructive à l'allemande.</p>"}, {"id": "35962af8e03f81e18b90d41f5e1f8018", "titre": "Les projets de loi gouvernementaux : initiative, procédure et statistiques", "theme": 1, "cat": "1.2.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les lois d'initiative gouvernementale (« projets de loi ») représentent la majorité des textes adoptés en France (~80 %). Elles sont déposées par le Gouvernement, à la différence des « propositions de loi » d'initiative parlementaire (~20 %). Le Gouvernement dispose de plusieurs leviers pour accélérer ou contraindre l'examen.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 39 (initiative législative partagée PM/parlementaires) · article 39 al. 3 (étude d'impact obligatoire, loi organique du 15 avril 2009) · article 42 (débat sur le texte adopté par la commission) · article 44 (droit d'amendement et vote bloqué) · article 45 (navette et CMP) · article 47 (loi de finances, délai de 70 jours) · article 47-1 (loi de financement de la Sécu, 50 jours) · article 49 al. 3.</p>\n<h3>3. Les Leviers d'Accélération</h3>\n<p><strong>Procédure accélérée (art. 45)</strong> : une seule lecture par chambre avant CMP, devenue la norme (plus de 70 % des textes en 2023-2024).</p>\n<p><strong>Le vote bloqué (art. 44 al. 3)</strong> : vote sur l'ensemble du texte avec amendements gouvernementaux, sans être un 49.3 (le vote a lieu) — Borne y a eu recours 11 fois en 2022-2024.</p>\n<p><strong>Le 49.3 (art. 49 al. 3)</strong> : adoption sans vote, limité à 1 fois par an depuis 2008 (sauf budget).</p>\n<h3>4. Le Travail Parlementaire sur Projets de Loi</h3>\n<p>Volumétrie 2023-2024 : environ 50 textes déposés par an, 30 adoptés, 50 000 à 100 000 amendements, 5 000 à 10 000 articles votés. Proportion projets vs propositions passée de 76/24 (2017-2022) à 60/40 (2022-2024, effet de la majorité relative).</p>\n<h3>5. L'Étude d'Impact</h3>\n<p>Obligatoire depuis 2009 pour tout projet de loi déposé (sauf urgence, finances), devant évaluer objectifs, options, conséquences économiques, sociales, budgétaires et environnementales. Souvent jugées trop superficielles.</p>\n<h3>6. Le Conseil d'État</h3>\n<p>Avis obligatoire (art. 39 al. 2) sur les projets de loi, non publié par défaut mais systématiquement publié depuis 2014-2017. Rôle : conseil juridique, vérification de la constitutionnalité et de la légalité européenne.</p>\n<h3>7. Les Lois Cadres et Lois d'Orientation</h3>\n<p>Loi-cadre (principes généraux, renvoi à décrets) et loi d'orientation (objectifs pluriannuels) : loi de programmation militaire, loi de programmation des finances publiques (LPFP), loi d'orientation et de programmation du ministère de l'Intérieur (LOPMI).</p>\n<h3>8. Les Cavaliers Législatifs</h3>\n<p>Amendements sans rapport avec le texte, souvent introduits par le gouvernement, fréquemment censurés par le Conseil constitutionnel (~50 articles/an, 12 pour la LFI 2024).</p>\n<h3>9. Comparaisons étrangères</h3>\n<p>USA (pas de projet présidentiel formel, mais State of the Union influent) · Allemagne (projets gouvernementaux + Bundesrat) · Royaume-Uni (Government Bills majoritaires).</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>L'exécutif français conserve un quasi-monopole législatif. L'accélération est devenue la norme, appauvrissant le débat. La majorité relative depuis 2022 a forcé un usage accru du 49.3.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Limiter la procédure accélérée à 30 % des textes + réserver une niche parlementaire mensuelle obligatoire + renforcer les études d'impact (audit indépendant) + rendre obligatoire la publication des avis du Conseil d'État + sanctionner les cavaliers par un rejet automatique en commission.</p>"}, {"id": "35962af8e03f8119a623c365f5b2c736", "titre": "Le statut des ministres : incompatibilités, conflits d'intérêts et responsabilités", "theme": 1, "cat": "1.2.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le statut des ministres régit leur nomination, leurs incompatibilités, leurs rémunérations, et leurs responsabilités. Il combine l'article 23 de la Constitution (incompatibilité avec le mandat parlementaire) et un ensemble de lois et décrets sur la transparence, les conflits d'intérêts et le statut financier.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 23 (incompatibilité avec mandat parlementaire, fonction publique, profession) · loi du 11 octobre 2013 sur la transparence de la vie publique · loi du 15 septembre 2017 sur la confiance dans la vie publique · décret du 27 janvier 2017 sur les obligations déontologiques · Code pénal art. 432-12 (prise illégale d'intérêts).</p>\n<h3>3. Les Incompatibilités</h3>\n<p>Mandat parlementaire : le suppléant prend le siège, retour automatique si le ministre quitte son poste (depuis 2008). Fonction publique : détachement obligatoire. Activité professionnelle : suspension obligatoire (sauf enseignement limité). Mandats locaux : compatibles mais cumul découragé par convention républicaine post-2017.</p>\n<h3>4. Les Obligations Déclarations (HATVP)</h3>\n<p>Haute Autorité pour la Transparence de la Vie Publique, créée en 2013. Déclarations obligatoires de patrimoine et d'intérêts (entrée/sortie, mise à jour annuelle, publication). Sanctions en cas de déclaration mensongère : 3 ans de prison et 45 000 € d'amende.</p>\n<h3>5. Les Conflits d'Intérêts</h3>\n<p>Définition légale (2013) : toute situation d'interférence entre un intérêt public et des intérêts publics ou privés susceptible d'influencer l'exercice indépendant, impartial et objectif d'une fonction. Mécanismes : déclaration, déport, saisine du déontologue du gouvernement.</p>\n<h3>6. Le Pantouflage et le Verrou Post-Mandat</h3>\n<p>Verrou de 3 ans examiné par la HATVP, interdisant de travailler dans un secteur géré pendant le mandat. Critique récurrente : verrou jugé trop souple en pratique.</p>\n<h3>7. La Rémunération</h3>\n<p>Salaires bruts mensuels : PM ~16 000 €, ministres ~10 700 €, ministres délégués ~9 900 €, secrétaires d'État ~9 900 €. Avantages : logement de fonction, voiture avec chauffeur, personnel de cabinet, frais de représentation. Après mandat : indemnité de 3 mois.</p>\n<h3>8. La Responsabilité Pénale et Politique</h3>\n<p>La Cour de Justice de la République (CJR) est compétente pour les crimes et délits commis dans l'exercice des fonctions ministérielles (12 magistrats parlementaires + 3 magistrats de la Cour de cassation) ; critique récurrente de non-indépendance, suppression envisagée mais bloquée. Responsabilité politique devant le Parlement (art. 49), le Président et l'opinion.</p>\n<h3>9. Les Cabinets Ministériels</h3>\n<p>25 à 50 personnes par cabinet, issues principalement de l'INSP, de Polytechnique, de Sciences Po et de la magistrature. Coût total estimé à ~150 M€/an. Plafond de 10 conseillers instauré en 2017, souvent contourné par détachements.</p>\n<h3>10. Comparaisons étrangères</h3>\n<p>USA (confirmation sénatoriale des membres du Cabinet, règles d'éthique strictes) · Royaume-Uni (Ministerial Code) · Allemagne (ministres, secrétaires d'État parlementaires et administratifs) · Italie (statut codifié avec confirmation parlementaire).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Le statut des ministres a été renforcé depuis 2013 (HATVP), mais des zones grises persistent (cabinets, pantouflage). L'incompatibilité stricte avec le mandat parlementaire freine la respiration politique.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Renforcer le verrou post-mandat à 5 ans + élargir le contrôle de la HATVP aux cabinets + réformer la CJR (transfert vers le tribunal judiciaire de Paris) + débat sur la compatibilité ministre-député + obligation de publication des notes de cabinet.</p>"}, {"id": "35362af8e03f81958420c05e911a7f21", "titre": "Les ministères : organisation et périmètres", "theme": 1, "cat": "1.2.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les ministères constituent la structure de base de l'administration centrale de l'État. Ils sont créés, modifiés ou supprimés par décret du Premier ministre contresigné par les ministres concernés. Leur nombre, périmètre et organisation varient selon les gouvernements et témoignent des priorités politiques.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Décret d'organisation (chaque ministère créé par décret) · loi DCRA de 2000 (droits des citoyens dans leurs relations avec l'administration) · LOLF 2001 (structure budgétaire par programmes) · décret de répartition des attributions · Code des relations entre le public et l'administration (CRPA).</p>\n<h3>3. Fonctionnement Concret</h3>\n<p>Structure type : ministre + cabinet (10-30 conseillers), secrétaire général du ministère (administration permanente), directions d'administration centrale (DAC), services déconcentrés, opérateurs sous tutelle. Ministères régaliens permanents : Intérieur, Justice, Économie, Défense, Affaires étrangères, Finances publiques, Éducation nationale, Santé.</p>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>Ministre</td><td>Direction politique</td></tr><tr><td>Directeur de cabinet</td><td>Coordination politique</td></tr><tr><td>Secrétaire général</td><td>Administration permanente</td></tr><tr><td>Directeurs centraux</td><td>Expertise sectorielle</td></tr><tr><td>Corps d'inspection</td><td>Contrôle interne</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Masse salariale de l'administration centrale : ~11 Md€/an. Fonctionnement : ~5 Md€/an. Cabinets ministériels : ~200 M€/an. Nombre de ministères variable (14 à 45 selon les gouvernements).</p>\n<h3>6. Audit Factuel</h3>\n<p>Gouvernement type de 30-45 membres. Environ 200 directions d'administration centrale au total. Environ 40 000 fonctionnaires en administration centrale. Rapport de la Cour des comptes 2022 recommandant la réduction du nombre de directions.</p>\n<h3>7. Chronologie</h3>\n<p>1958 (création des ministères de la Ve République) · 2007 (RGPP, fusion de ministères) · 2012 (MAP) · 2017 (Action publique 2022) · 2023 (réforme de la haute fonction publique).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>LOLF</strong> : structure les ministères en programmes budgétaires</li>\n<li><strong>Fonction publique</strong> : effectifs soumis aux plafonds d'emplois</li>\n<li><strong>Services déconcentrés</strong> : exécution départementale et régionale des politiques</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<ul>\n<li><strong>Instabilité ministérielle</strong> : le périmètre change à chaque gouvernement, perturbant l'action</li>\n<li><strong>Concurrence inter-ministérielle</strong> : logiques de silo, coordination difficile</li>\n<li><strong>Inflation des cabinets</strong> : pouvoir des conseillers vs. administration permanente</li>\n</ul>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>La structure ministérielle doit s'adapter aux obligations européennes (transposition des directives). Certains ministères sont davantage exposés au droit UE (Agriculture, Économie, Environnement). Comparaison : Allemagne (ministères stables), Royaume-Uni (Whitehall), Italie (instabilité).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>La stabilité des périmètres et l'optimisation des effectifs sont un levier majeur d'efficacité de l'État. La tension entre ministères politiques (court terme) et administration permanente (long terme) est structurelle.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : maintien de l'instabilité organisationnelle selon les gouvernements</p>\n<p><strong>Scénario 2</strong> : constitutionnalisation d'un noyau de « ministères régaliens permanents »</p>\n<p><strong>Scénario 3</strong> : réduction forte du nombre de ministères (modèle nordique)</p>\n<h3>13. Faisabilité</h3>\n<p>Réduction du nombre de ministères politiquement difficile ; périmètres stables possibles par convention.</p>\n<h3>14. Temporalité</h3>\n<p>Court terme : adaptation à chaque nouveau gouvernement. Moyen terme : réforme structurelle possible post-2027.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : L'instabilité des périmètres ministériels désoriente les administrations, perturbe les politiques de long terme et nuit à la lisibilité de l'action de l'État.</p>\n<p><strong>Options</strong> : Statu quo · Périmètres stables · Réduction du nombre de ministères</p>\n<p><strong>Recommandation</strong> : Fixer par décret-cadre un noyau de ministères permanents aux périmètres stables, réduire les cabinets et renforcer l'administration permanente.</p>\n<p><strong>Sources</strong> : LOLF — Cour des comptes — DGAFP — Rapport CIAP 2022</p>"}, {"id": "35362af8e03f81dfb453d121c9481980", "titre": "Les autorités administratives indépendantes (AAI)", "theme": 1, "cat": "1.2.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les autorités administratives indépendantes (AAI) sont des organismes étatiques qui exercent une mission de service public sans être soumis à l'autorité hiérarchique du gouvernement. Leur indépendance est garantie par la loi ou la Constitution. Elles ont proliféré depuis les années 1970 pour réguler des secteurs sensibles.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi du 20 janvier 2017 (premier cadre légal général des AAI et API) · Constitution (le Défenseur des droits a valeur constitutionnelle, art. 71-1) · lois sectorielles créant chaque AAI · statut des membres (inamovibilité, incompatibilités, mandat non renouvelable) · 26 AAI et 4 API recensées.</p>\n<h3>3. Fonctionnement Concret</h3>\n<table><tr><th>AAI</th><th>Domaine</th></tr><tr><td>AMF</td><td>Marchés financiers</td></tr><tr><td>ARCOM</td><td>Audiovisuel et contenus numériques</td></tr><tr><td>ARCEP</td><td>Télécommunications</td></tr><tr><td>CRE</td><td>Énergie</td></tr><tr><td>Autorité de la concurrence</td><td>Concurrence</td></tr><tr><td>CNIL</td><td>Protection des données</td></tr><tr><td>Défenseur des droits</td><td>Droits fondamentaux</td></tr><tr><td>HATVP</td><td>Déontologie publique</td></tr></table>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>Membres (nommés par PR/AN/Sénat)</td><td>Décision indépendante</td></tr><tr><td>Gouvernement</td><td>Ne peut donner d'instructions</td></tr><tr><td>Parlement</td><td>Contrôle via rapports annuels</td></tr><tr><td>Cour des comptes</td><td>Audit financier</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Budget global des AAI/API : ~1,2 Md€/an. AMF ~100 M€/an, ARCOM ~50 M€/an, ARCEP ~25 M€/an. Financement par dotations budgétaires et taxes sectorielles.</p>\n<h3>6. Audit Factuel</h3>\n<p>26 AAI et 4 API en 2024, contre 1 seule dans les années 70. Rapport parlementaire 2017 recommandant une rationalisation. CNIL : 3 200 notifications de violations de données en 2023. Autorité de la concurrence : plus de 200 décisions par an.</p>\n<h3>7. Chronologie</h3>\n<p>1978 (première AAI, la CNIL) · 1984 (Haute Autorité de la communication audiovisuelle) · 1996 (ART télécoms) · 2003 (CSA réformé) · 2017 (loi-cadre AAI/API) · 2021 (ARCOM fusionne CSA et HADOPI).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>Droit européen</strong> : de nombreuses AAI transposent des directives UE</li>\n<li><strong>Secteurs régulés</strong> : légitimité liée à l'efficacité de la régulation</li>\n<li><strong>Nominations politiques</strong> : l'indépendance dépend de la qualité des nominations</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<ul>\n<li><strong>Prolifération incontrôlée</strong> : trop d'AAI, chevauchements de compétences</li>\n<li><strong>Nominations</strong> : risque de capture réglementaire par les secteurs régulés</li>\n<li><strong>Déficit démocratique</strong> : échappent au contrôle politique direct</li>\n<li><strong>Financement</strong> : certaines AAI dépendantes des taxes des opérateurs qu'elles régulent</li>\n</ul>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Le règlement DSA renforce le rôle de l'ARCOM comme régulateur national. CNIL et ARCOM en première ligne pour la régulation des plateformes. Le RGPD renforce la CNIL comme pivot de la protection des données.</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>La régulation des secteurs stratégiques (numérique, énergie, finance) dépend de l'efficacité des AAI, dont l'indépendance est un gage de crédi

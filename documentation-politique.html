ement rural.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Maintenir l'échelon départemental comme « collectivité de solidarité », fusionner les fonctions support avec les EPCI, supprimer les départements dans les métropoles (modèle Lyon).</p>"}, {"id": "35962af8e03f816e9f1cc51558db0023", "titre": "La Métropole de Lyon : fusion département-EPCI, modèle unique et bilan 2015-2026", "theme": 1, "cat": "1.5.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>La Métropole de Lyon (MLM) est la seule collectivité issue de la fusion d'un département et d'une intercommunalité. Créée le 1er janvier 2015 par la loi MAPTAM, elle exerce à la fois les compétences d'un département et celles d'une métropole. Le Département du Rhône subsiste pour la partie hors métropole.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi n° 2014-58 du 27 janvier 2014 (MAPTAM), art. 26 · articles L. 3611-1 à L. 3654-3 du CGCT · loi 3DS 2022.</p>\n<h3>3. L'Architecture Institutionnelle</h3>\n<p>Conseil de la Métropole de Lyon (150 conseillers, élus au suffrage universel direct depuis 2020, président Bruno Bernard EELV depuis 2020). Département du Rhône subsistant (29 cantons hors périmètre, président Christophe Guilloteau LR).</p>\n<h3>4. Les Compétences de la MLM</h3>\n<p>Métropolitaines (développement économique, urbanisme, transports TCL/SYTRAL, logement) + départementales sur son périmètre (action sociale, collèges, routes, PMI).</p>\n<h3>5. Le Financement</h3>\n<p>Budget 2024 : environ 3,8 Md€ (fiscalité directe et indirecte, DMTO, DGF métropole, compensation État pour les compétences sociales).</p>\n<h3>6. Le Bilan 2015-2026</h3>\n<p>Positifs : coordination urbanisme-transport-social, économies d'échelle, agilité décisionnelle. Négatifs : crise financière des compétences sociales, complexité résiduelle Rhône/MLM.</p>\n<h3>7. Le Modèle Exportable ?</h3>\n<p>Candidats potentiels : Marseille-Provence, Bordeaux, Toulouse, Lille. Obstacles : résistance des conseils généraux, coût de transition.</p>\n<h3>8. L'Enjeu de la Gouvernance</h3>\n<p>Élection directe de 2020 (première du genre), victoire surprise d'EELV, tension politique avec le Rhône (LR) et l'État.</p>\n<h3>9. Comparaisons Européennes</h3>\n<p>Grand Londres (GLA), Hambourg/Brême (cités-États allemandes), Barcelone (ville et province confondues).</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>La MLM est le laboratoire de la métropolisation ; la compétence sociale pèse sur les finances.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Généraliser le modèle MLM aux grandes métropoles, recentraliser ou cofinancer le RSA via un fonds État-métropoles dédié, maintenir l'élection directe des conseils métropolitains.</p>"}, {"id": "35962af8e03f815380ddf788d89bb2dc", "titre": "Paris et les départements d'Île-de-France : statuts, inégalités et Seine-Saint-Denis", "theme": 1, "cat": "1.5.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le Conseil de Paris est la seule collectivité exerçant simultanément les compétences d'une commune et d'un département. Paris est à la fois une commune (avec un maire) et un département (sans président distinct).</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi du 31 décembre 1975 (statut Paris) · loi PLM du 31 décembre 1982 · articles L. 2511-1 et suivants du CGCT · loi du 28 février 2017 (Métropole du Grand Paris).</p>\n<h3>3. L'Architecture Institutionnelle</h3>\n<p>Conseil de Paris (163 conseillers, à la fois municipal et départemental, maire Anne Hidalgo PS), 20 arrondissements avec conseils consultatifs.</p>\n<h3>4. La Métropole du Grand Paris (MGP)</h3>\n<p>Créée le 1er janvier 2016, 131 communes, 7,2 millions d'habitants, compétences en développement économique, logement, environnement. Budget : environ 4,6 Md€.</p>\n<h3>5. La Spécificité des Départements 92-93-94</h3>\n<p>Hauts-de-Seine (le plus riche, La Défense) · Seine-Saint-Denis (le plus pauvre de métropole, 52 % de ménages sous le seuil, président Stéphane Troussel PS) · Val-de-Marne.</p>\n<h3>6. La Seine-Saint-Denis : Cas Critique</h3>\n<p>Sous-investissement chronique documenté (écoles, santé, sécurité), 90 000 bénéficiaires du RSA, budget social représentant 60 % des dépenses, dette en forte hausse. Demandes : dotation de rattrapage, recentralisation du RSA (expérimentation depuis 2021).</p>\n<h3>7. Les Finances Franciliennes</h3>\n<table><tr><th>Département</th><th>Profil</th></tr><tr><td>Paris (75)</td><td>Très riche, dette faible</td></tr><tr><td>Hauts-de-Seine (92)</td><td>Riche, dette faible</td></tr><tr><td>Seine-Saint-Denis (93)</td><td>Pauvre, dette élevée</td></tr></table>\n<h3>8. La Péréquation Interdépartementale</h3>\n<p>Fonds de péréquation des DMTO (environ 1 Md€/an), jugé insuffisant selon le rapport Rebsamen.</p>\n<h3>9. Enjeux Stratégiques</h3>\n<p>Seine-Saint-Denis comme emblème des inégalités territoriales ; avenir incertain de la Métropole du Grand Paris.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Fusion Paris + MGP en une grande collectivité, pérennisation de la recentralisation du RSA en Seine-Saint-Denis, plan de rattrapage dédié, doublement du fonds de péréquation interdépartementale.</p>"}, {"id": "35962af8e03f817a9f83cb13c0dedd5d", "titre": "L'ADF (Assemblée des Départements de France) : missions, batailles et rapport avec l'État", "theme": 1, "cat": "1.5.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>L'Assemblée des Départements de France (ADF) est l'association représentant les 101 départements français, créée en 1946, devenue l'ADF en 2004. Elle joue un rôle de lobbying institutionnel et de coordination face à l'État.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Association loi 1901, articles L. 1211-1 et suivants du CGCT, représentée au Comité des Finances Locales et au Comité des régions (UE).</p>\n<h3>3. Organisation et Fonctionnement</h3>\n<p>Président (François Sauvadet depuis 2021), bureau de 30 membres, commissions thématiques, délégation à Bruxelles.</p>\n<h3>4. Les Missions de l'ADF</h3>\n<p>Représentation officielle auprès du gouvernement, coordination et partage de bonnes pratiques entre départements, communication publique et observatoire de l'action sociale.</p>\n<h3>5. Les Grandes Batailles de l'ADF</h3>\n<p>Contre la suppression des départements (2014-2016, mobilisation réussie face au projet Hollande). Pour la recentralisation du RSA (demande permanente depuis 2011, expérimentation dans 18 départements en 2021, généralisation refusée par l'État). Sur les DMTO : dispositif anti-volatilité obtenu partiellement en 2024.</p>\n<h3>6. Les Indicateurs Suivis par l'ADF</h3>\n<p>Épargne nette des départements, ratio dettes/recettes, part des AIS dans les dépenses, nombre de bénéficiaires (RSA 1,9 M, APA 1,4 M, PCH 330 000).</p>\n<h3>7. La Position Européenne</h3>\n<p>Délégation au Comité des régions, défense des fonds FEADER dans la future PAC.</p>\n<h3>8. Les Tensions Avec l'État</h3>\n<p>Crise ouverte 2023-2025 sur le financement de l'AIS, demande de Pacte de confiance État-Départements, aide d'urgence partielle obtenue (300 M€).</p>\n<h3>9. Enjeux Stratégiques</h3>\n<p>L'ADF est la voix politique des départements ; la crise financière renforce sa légitimité revendicative.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Conclure un Pacte de confiance pluriannuel ADF-État sur la DGF et les AIS, généraliser l'expérimentation RSA, créer un Observatoire national de la solidarité territoriale.</p>"}, {"id": "35762af8e03f81188ba4ebbededdd282", "titre": "Les communes et l'intercommunalité : maillage, EPCI, métropoles et enjeux", "theme": 1, "cat": "1.5.4", "html": "<h3>1. Définition & Cadre</h3>\n<p>La France compte 34 945 communes — plus que tous les autres pays de l'UE réunis. Ce morcellement historique est compensé depuis 1992 par un système d'intercommunalité (EPCI) qui couvre aujourd'hui 100 % du territoire.</p>\n<h3>2. Le Maillage Communal</h3>\n<table><tr><th>Taille</th><th>Nombre</th><th>% des communes</th></tr><tr><td>&lt; 500 hab.</td><td>26 000</td><td>74 %</td></tr><tr><td>500-2 000 hab.</td><td>6 000</td><td>17 %</td></tr><tr><td>&gt; 100 000</td><td>43</td><td>0,1 %</td></tr></table>\n<h3>3. Les Compétences Communales</h3>\n<p>Obligatoires : urbanisme, écoles primaires, voirie communale, état civil, police municipale, eau et assainissement (souvent délégués à l'EPCI). Facultatives : sport, culture, action sociale (CCAS).</p>\n<h3>4. L'Intercommunalité (EPCI)</h3>\n<p>Évolution : loi ATR 1992 (premiers EPCI fiscaux), loi Chevènement 1999 (communautés de communes/agglomération/urbaines), loi RCT 2010 (métropoles), loi NOTRe 2015 (couverture totale obligatoire).</p>\n<table><tr><th>Type</th><th>Seuil pop.</th><th>Exemple</th></tr><tr><td>Communauté de communes</td><td>Pas de seuil</td><td>CC du Pays de Gex</td></tr><tr><td>Communauté d'agglomération</td><td>50 000 hab.</td><td>CA du Pays d'Aix</td></tr><tr><td>Communauté urbaine</td><td>250 000 hab.</td><td>CU de Bordeaux</td></tr><tr><td>Métropole</td><td>400 000 hab.</td><td>Métropole de Lyon</td></tr></table>\n<p>2024 : 1 254 EPCI à fiscalité propre, dont 22 métropoles, budget total intercommunalité de 70 Md€.</p>\n<h3>5. Les Métropoles : Puissance et Critique</h3>\n<p>22 métropoles ont absorbé l'essentiel des compétences économiques, transports et logement des grandes villes. Critiques : creusement des inégalités territoriales, gouvernance opaque (pas d'élection directe historiquement), éloignement des citoyens.</p>\n<h3>6. Le Statut de Paris, Lyon et Marseille</h3>\n<p>Loi PLM (1982) : division en arrondissements avec double niveau de démocratie locale. Paris : commune et département fusionnés depuis 2019, budget 2024 de 11 Md€.</p>\n<h3>7. Enjeux Stratégiques</h3>\n<p>Le morcellement communal est une inefficience structurelle ; les fusions restent rares ; la démocratie métropolitaine est déficitaire ; la fracture rural/métropolitain s'agrandit.</p>\n<h3>8. Synthèse Décisionnelle</h3>\n<p>Inciter aux fusions (bonus DGF), élection directe des conseillers métropolitains, réforme de la taxe foncière, améliorer le financement des communes rurales.</p>"}, {"id": "35862af8e03f81a9b1d4ec8f48b97864", "titre": "Les métropoles : 22 métropoles, statuts et compétences", "theme": 1, "cat": "1.5.4", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les métropoles sont les EPCI à fiscalité propre les plus intégrés, créées par la loi MAPTAM du 27 janvier 2014. Elles concentrent des compétences stratégiques en urbanisme, transport et développement économique.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi MAPTAM du 27 janvier 2014 · loi NOTRe du 7 août 2015 · CGCT.</p>\n<h3>3. Les 22 Métropoles</h3>\n<p>3 à statut particulier : Métropole du Grand Paris (7,2 M habitants), Métropole de Lyon (collectivité territoriale unique, 1,4 M), Aix-Marseille-Provence (1,9 M). 19 métropoles de droit commun : Bordeaux, Brest, Clermont-Ferrand, Dijon, Grenoble, Lille, Metz, Montpellier, Nancy, Nantes, Nice, Orléans, Rennes, Rouen, Saint-Étienne, Strasbourg, Toulon, Toulouse, Tours.</p>\n<h3>4. Compétences</h3>\n<p>Obligatoires : développement économique, aménagement, habitat, politique de la ville, environnement. Spécifiques : Lyon (compétences départementales complètes).</p>\n<h3>5. La Métropole de Lyon : Cas Unique</h3>\n<p>Fusion EPCI + département (2015), président Bruno Bernard (EELV), budget 3,4 Md€ — modèle expérimental évoqué pour Marseille, Bordeaux, Lille.</p>\n<h3>6. La Métropole du Grand Paris : Critique</h3>\n<p>131 communes membres, compétences plus limitées que Lyon, débat permanent sur sa suppression ou son renforcement, budget 3,5 Md€.</p>\n<h3>7. Données Clés</h3>\n<p>Population totale des métropoles : environ 22 millions (1/3 de la France).</p>\n<h3>8. Débats</h3>\n<p>Concentration excessive du pouvoir métropolitain, fracture métropoles/périphéries, faible démocratie métropolitaine directe.</p>\n<h3>9. Synthèse Décisionnelle</h3>\n<p>Élection au suffrage universel des conseillers métropolitains, généralisation du modèle lyonnais, péréquation forte avec les périphéries.</p>"}, {"id": "35962af8e03f8195b894c5859baed698", "titre": "Paris, Lyon, Marseille : statuts particuliers et métropoles", "theme": 1, "cat": "1.5.4", "html": "<h3>🔄 MAJ — La réforme de la loi PLM (2025) et les municipales de mars 2026</h3>\n<p><strong>La réforme du mode de scrutin</strong> (loi PLM, adoptée le 11 août 2025) modifie le mode de scrutin en vigueur depuis 1982 : double bulletin, dans deux urnes distinctes — un pour les conseillers d'arrondissement, un pour élire directement les conseillers de Paris/Lyon/Marseille. Rupture avec le système antérieur où un maire pouvait être élu en perdant le vote populaire global. Les municipales de mars 2026 sont les premières organisées sous ce régime.</p>\n<p><strong>Résultats des municipales 2026</strong> :</p>\n<table><tr><th>Ville</th><th>Élu(e)</th><th>Score 2e tour</th></tr><tr><td>Paris</td><td>Emmanuel Grégoire (Union de la gauche, hors LFI)</td><td>50,52 %</td></tr><tr><td>Marseille</td><td>Benoît Payan (PS, sortant)</td><td>54,34 % (face RN 40,3 %)</td></tr><tr><td>Lyon</td><td>Grégory Doucet (Écologistes, sortant)</td><td>—</td></tr></table>\n<p>Paris : cinquième mandature de gauche consécutive, installation du Conseil de Paris le 29 mars 2026. Les candidats RN et Reconquête n'obtiennent aucun siège au Conseil de Paris. La réforme restaure une lisibilité démocratique mais complexifie le scrutin.</p>\n<h3>1. Définition & Cadre</h3>\n<p>Paris, Lyon et Marseille (PLM) ont des statuts particuliers depuis la loi du 31 décembre 1982. Chaque ville est divisée en arrondissements ou secteurs avec des conseils élus.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi du 31 décembre 1982 (PLM) · loi du 28 février 2017 (statut de Paris) · loi MAPTAM 2014.</p>\n<h3>3. Paris : Statut Particulier</h3>\n<p>Premier maire élu depuis 1871 en 1977 (Jacques Chirac). Depuis 2019 : collectivité à statut particulier (fusion ville + département). 20 arrondissements, Conseil de Paris de 163 conseillers, préfet de police avec pouvoirs propres.</p>\n<h3>4. Lyon : Révolution Métropolitaine</h3>\n<p>Métropole de Lyon créée le 1er janvier 2015, fusion communauté urbaine + département du Rhône, 59 communes, conseil métropolitain élu au suffrage direct depuis 2020.</p>\n<h3>5. Marseille : Aix-Marseille-Provence</h3>\n<p>Métropole créée en 2016, 92 communes, 1,9 M habitants. Plan « Marseille en grand » (Macron 2021) : 5 Md€ d'investissements face aux problèmes structurels (pauvreté, sécurité).</p>\n<h3>6. Le Mode de Scrutin PLM</h3>\n<p>Historiquement : scrutin de liste par arrondissement pouvant faire disparaître la majorité en voix de la ville (cas Marseille 2014-2020). Réformé en 2025 (voir mise à jour).</p>\n<h3>7. Enjeux Stratégiques</h3>\n<p>Paris : centralisation maintenue malgré le statut spécifique. Lyon : modèle métropolitain le plus abouti. Marseille : crise persistante nécessitant des interventions répétées de l'État.</p>\n<h3>8. Synthèse Décisionnelle</h3>\n<p>Généraliser le modèle lyonnais (fusion métropole-département) pour d'autres grandes villes, poursuivre la décentralisation de la préfecture de police de Paris.</p>"}, {"id": "35962af8e03f8134bb35c60177cad87b", "titre": "Les communes nouvelles : fusion, communes déléguées et réduction du mille-feuille", "theme": 1, "cat": "1.5.4", "html": "<h3>1. Définition & Cadre</h3>\n<p>Une commune nouvelle résulte de la fusion de plusieurs communes en une seule entité. Créé par la loi du 16 décembre 2010 et encouragé par la loi du 16 mars 2015 (incitations financières), ce dispositif vise à réduire le nombre de communes (record européen).</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi n° 2010-1563 du 16 décembre 2010 · loi n° 2015-292 du 16 mars 2015 · articles L. 2113-1 et suivants du CGCT.</p>\n<h3>3. La France : Pays aux 35 000 Communes</h3>\n<table><tr><th>Pays</th><th>Communes</th></tr><tr><td>France</td><td>34 935</td></tr><tr><td>Allemagne</td><td>11 000</td></tr><tr><td>Italie</td><td>7 900</td></tr><tr><td>Suède</td><td>290</td></tr></table>\n<p>50 % des communes ont moins de 500 habitants ; environ 53 000 démissions d'élus par an.</p>\n<h3>4. Le Dispositif Commune Nouvelle</h3>\n<p>Conditions : délibérations concordantes ou référendum local. Avantages financiers : maintien des dotations cumulées pendant 3 ans, bonus DGF de 5 % la première année. Maintien des communes déléguées (mairies de proximité, maires délégués).</p>\n<h3>5. Évolution Quantitative</h3>\n<p>De 0 en 2015 à plus de 800 communes nouvelles en 2024, regroupant plus de 2 500 communes. Exemples : Annecy (fusion 2017, 6 communes, 130 000 habitants).</p>\n<h3>6. Les Communes Déléguées</h3>\n<p>Maintien comme entité consultative, mairie annexe, maire délégué officier d'état civil — sans personnalité juridique propre.</p>\n<h3>7. Avantages et Inconvénients</h3>\n<p>Avantages : mutualisation, économies d'échelle, cohérence de l'urbanisme. Inconvénients : perte de proximité démocratique, résistance des élus locaux, identité communale diluée.</p>\n<h3>8. Le Débat sur la Fusion Forcée</h3>\n<p>Pour : rationalisation à l'allemande ou suédoise. Contre : démocratie locale = proximité, tradition française depuis la Révolution.</p>\n<h3>9. Enjeux Stratégiques</h3>\n<p>Le succès des communes nouvelles reste modéré (800 sur 35 000, soit 2,3 %) ; sans contrainte, la rationalisation restera lente.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Objectif de 2 000 communes nouvelles d'ici 2030 (incitations fiscales triplées), simplification de la procédure pour les petites communes, maintien du modèle des communes déléguées.</p>"}, {"id": "35962af8e03f81198e0bf340e9bc8351", "titre": "Les EPCI à fiscalité propre : cartographie, compétences et gouvernance", "theme": 1, "cat": "1.5.4", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les 1 254 EPCI à fiscalité propre (2024) forment le niveau supracommunal de base : communautés de communes, d'agglomération, urbaines et métropoles. La loi NOTRe (2015) a imposé un seuil de 15 000 habitants.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Articles L. 5210-1 à L. 5842-7 du CGCT · loi Chevènement du 12 juillet 1999 · loi RCT du 16 décembre 2010 · loi MAPTAM 2014 · loi NOTRe 2015.</p>\n<h3>3. La Cartographie</h3>\n<table><tr><th>Type</th><th>Nombre</th><th>Population</th></tr><tr><td>Métropoles</td><td>22</td><td>36,5 M</td></tr><tr><td>Communautés urbaines</td><td>11</td><td>5,5 M</td></tr><tr><td>Communautés d'agglomération</td><td>221</td><td>34,7 M</td></tr><tr><td>Communautés de communes</td><td>992</td><td>23,2 M</td></tr></table>\n<p>100 % des communes françaises font partie d'un EPCI à fiscalité propre depuis 2017.</p>\n<h3>4. Les Compétences EPCI</h3>\n<p>Obligatoires : aménagement de l'espace, développement économique, PLU intercommunal, déchets, GEMAPI. Optionnelles : voirie, transports, environnement, action sociale, habitat.</p>\n<h3>5. La Gouvernance des EPCI</h3>\n<p>Conseil communautaire (maires + conseillers délégués), président élu par le conseil. Déficit démocratique : élection indirecte, faible lisibilité citoyenne.</p>\n<h3>6. Le Financement</h3>\n<p>Fiscalité professionnelle unique (CFE, CVAE supprimée en 2023, IFER, TASCOM), DGF intercommunale, DETR. Budget total EPCI 2024 : environ 80 Md€.</p>\n<h3>7. Le PLUi (Plan Local d'Urbanisme Intercommunal)</h3>\n<p>Depuis la loi ALUR (2014), compétence de plein droit des EPCI avec possibilité de blocage par minorité de communes. 735 PLUi approuvés en 2024.</p>\n<h3>8. Les Tensions Communes-EPCI</h3>\n<p>Concurrence électorale, budget et mutualisation, transferts de compétences contestés (eau, assainissement).</p>\n<h3>9. Le Débat sur l'Élection Directe</h3>\n<p>Pour : légitimité démocratique, lisibilité citoyenne. Contre : affaiblissement des communes, complexité électorale.</p>\n<h3>10. Comparaisons Européennes</h3>\n<p>Allemagne (Verbandsgemeinden, élection directe) · Italie (Unioni di Comuni) · Espagne (Mancomunidades).</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Généraliser l'élection directe des conseils communautaires, créer une dotation EPCI-rural, simplifier le code des compétences, finaliser le transfert eau/assainissement.</p>"}, {"id": "35962af8e03f8103a24efbe164f085f7", "titre": "Les 22 métropoles françaises : cartographie, métropolisme et fractures territoriales", "theme": 1, "cat": "1.5.4", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les 22 métropoles françaises exercent des compétences stratégiques renforcées. La France des métropoles concentre la richesse, laissant les territoires périphériques dans une situation de décrochage (rapport Borloo 2018).</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi MAPTAM du 27 janvier 2014 · loi NOTRe du 7 août 2015 · loi Engagement et Proximité 2019 · articles L. 5217-1 à L. 5219-10 du CGCT.</p>\n<h3>3. Les 22 Métropoles (2024)</h3>\n<p>Aix-Marseille-Provence (1,9 M), Grand Lyon (1,4 M), Grand Paris (7,2 M), Toulouse (800 000), Bordeaux (820 000), Nantes (670 000), Lille (1,2 M), Rennes (480 000), Strasbourg (510 000), Grenoble (450 000), Nice (550 000), Montpellier (500 000) et 10 autres métropoles de taille moyenne.</p>\n<h3>4. Les Compétences Métropoles</h3>\n<p>De plein droit : développement économique, habitat (PLH), aménagement (PLUi), transports (PDU), eau, déchets, GEMAPI. Optionnelles : culture, sport, action sociale.</p>\n<h3>5. Le Transfert des Compétences Départementales</h3>\n<p>Article L. 5217-2 CGCT : possible par convention (routes, transports scolaires, tourisme). Seule Lyon a intégré toutes les compétences.</p>\n<h3>6. Les Finances des Métropoles</h3>\n<p>Budget cumulé : environ 60 Md€ (2024), ressources CFE/TASCOM/IFER, DGF métropole, fonds européens.</p>\n<h3>7. La Critique du « Métropolisme »</h3>\n<p>Thèse Guilluy : France périphérique exclue de la mondialisation. Île-de-France : 22 % du PIB sur 2 % du territoire. 12 métropoles : 40 % du PIB.</p>\n<h3>8. Politiques de Rééquilibrage</h3>\n<p>Agence nationale de la cohésion des territoires (ANCT, créée en 2020), zones de revitalisation rurale, programme Petites villes de demain (1 628 villes).</p>\n<h3>9. La Gouvernance MGP</h3>\n<p>Métropole du Grand Paris : 3 niveaux (MGP, EPT, communes), efficacité contestée, rapport Dallier 2019 proposant la suppression des EPT.</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>Les métropoles concentrent croissance et investissements ; risque de fracture métropole/périphérie durable.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Généraliser l'élection directe dans les métropoles, réformer la MGP, créer un fonds métropoles-territoires, renforcer les pactes ANCT.</p>"}, {"id": "35962af8e03f81aaa62bec2c1d8a97e2", "titre": "Les maires et l'AMF : statut, crise du mandat, fiscalité et réformes", "theme": 1, "cat": "1.5.4", "html": "<h3>🔄 MAJ — Les élections municipales des 15 et 22 mars 2026 : bilan national</h3>\n<p><strong>Participation</strong> : environ 57 % au second tour.</p>\n<p><strong>La percée du bloc RN-UDR</strong> : le RN et ses alliés UDR remportent 74 mairies (dont 31 dès le premier tour), plus de 3 000 conseillers municipaux élus dans 84 départements. Sur ses 22 mairies sortantes, le RN en conserve 20. Villes gagnées : Agde, Carcassonne, Liévin, Saint-Avold, Montargis, La Flèche, Tarascon. Nice bascule : Éric Ciotti (UDR) l'emporte avec 48,54 % face à Christian Estrosi. Échecs dans les cibles majeures : Marseille (Allisio 40,3 % contre Payan 54,34 %), Nîmes, Toulon.</p>\n<p><strong>Les autres blocs</strong> : la gauche conserve Paris (Grégoire, 50,52 %), Marseille (Payan), Lyon (Doucet). LFI progresse dans les villes populaires (Saint-Denis, Roubaix). Édouard Philippe réélu au Havre (47,74 %). François Bayrou perd la mairie de Pau à 344 voix près après 12 ans.</p>\n<p><strong>Enjeux relevés par l'AMF</strong> : parité 51,5 %/48,5 % sur les listes ; crise des candidatures (68 % des communes avec une seule liste au 1er tour, essentiellement les communes de moins de 1 000 habitants) ; plusieurs candidats sous condamnation pénale élus, relançant le débat sur l'inéligibilité automatique.</p>\n<p><strong>Conséquence institutionnelle</strong> : le collège des grands électeurs des sénatoriales de septembre 2026 est composé à ~95 % de délégués municipaux — les 3 000+ conseillers RN-UDR modifient mécaniquement ce collège, sans bouleverser la majorité sénatoriale structurellement rurale.</p>\n<h3>1. Définition & Cadre</h3>\n<p>La France compte 34 935 communes, le plus grand nombre de l'UE. Les maires sont les premiers élus de proximité. L'AMF représente leurs intérêts. La loi Engagement et Proximité (2019) a renforcé leur statut.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Articles L. 2111-1 à L. 2581-6 du CGCT · loi du 27 décembre 2019 (Engagement et Proximité) · loi 3DS 2022.</p>\n<h3>3. La Diversité Communale</h3>\n<p>75 % des communes ont moins de 1 000 habitants, 36 communes dépassent 100 000 habitants. 776 communes nouvelles créées entre 2016 et 2024.</p>\n<h3>4. Les Compétences du Maire</h3>\n<p>Comme agent de l'État : état civil, police administrative, listes électorales. Comme exécutif local : exécution des délibérations, gestion des agents, marchés publics, urbanisme.</p>\n<h3>5. Le Statut des Maires (loi Engagement 2019)</h3>\n<p>Renforcement de la formation, régime indemnitaire, protection fonctionnelle. Indemnités 2024 : de 1 026 €/mois (communes <500 hab) à 5 633 €/mois (>100 000 hab).</p>\n<h3>6. La Crise du Mandat de Maire</h3>\n<p>Environ 2 500 démissions prévues sur 2020-2026 (contre 1 200 en 2014-2020), liées aux violences (×3 en 10 ans), à la charge de travail et à l'insuffisance des indemnités.</p>\n<h3>7. L'AMF (Association des Maires de France)</h3>\n<p>Créée en 1907, 40 000 maires membres, présidée par David Lisnard (LR, Cannes, depuis 2021). Positions phares : réforme de la DGF, lutte contre la sur-réglementation, statut de l'élu.</p>\n<h3>8. La Fiscalité Communale</h3>\n<p>Taxe foncière (~37 Md€), CFE (~10 Md€), taxe d'habitation résidence secondaire (~2 Md€). Budget total communes 2024 : environ 100 Md€.</p>\n<h3>9. Enjeux Stratégiques</h3>\n<p>Le maire reste l'élu préféré des Français ; la crise du mandat menace la démocratie locale ; le financement dépend trop de la DGF.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Créer un statut de l'élu local, tripler les indemnités des petites communes, créer un fonds de protection des maires face aux violences, réformer la DGF.</p>"}, {"id": "35762af8e03f81aabbebd70693963087", "titre": "Mayotte : crise institutionnelle, immigration et cyclone Chido", "theme": 1, "cat": "1.5.5", "html": "<h3>1. Définition & Cadre</h3>\n<p>Mayotte est le 101e département français depuis 2011. Il est aussi le plus pauvre de France (PIB/habitant : 12 000 €, soit 3x moins que la moyenne nationale) et connaît une crise multidimensionnelle : immigration massive, pression démographique, insularité, vulnérabilité aux cyclones. Le cyclone Chido (décembre 2024) a causé des dégâts catastrophiques.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi organique du 7 décembre 2010 (départementalisation) · CESEDA (règles spécifiques, droit du sol restreint) · loi immigration 2024 (mesures spécifiques Mayotte proposées, en partie censurées) · plan Marshall Mayotte 2025.</p>\n<h3>3. Données Clés</h3>\n<p>Population officielle : 321 000 (INSEE 2021), population réelle estimée entre 400 000 et 500 000. Naissances : 11 000/an (1er rang français). Chômage : 30 %. Taux de pauvreté : 77 %. Cyclone Chido : 35 morts officiels, 100 000 sans-abri.</p>\n<h3>4. La Crise Migratoire</h3>\n<p>Flux depuis les Comores (kwassas-kwassas), noyades fréquentes. Opération Wuambushu (2023) : 30 000 reconduites à la frontière — effet jugé insuffisant. Droit du sol restreint depuis 2018.</p>\n<h3>5. Enjeux Stratégiques</h3>\n<p>Mayotte est à la fois un département français et un territoire en tension sociale extrême ; l'écart de PIB avec les Comores (1 à 20) rend le phénomène migratoire structurel.</p>\n<h3>6. Synthèse Décisionnelle</h3>\n<p>Plan Marshall Mayotte sur 10 ans, négociation avec les Comores (aide au développement contre coopération migratoire), renforcement de la surveillance maritime, statut spécifique d'urgence économique.</p>"}, {"id": "35762af8e03f81b0817be59c353e17dd", "titre": "Les outre-mer : DROM-COM, Nouvelle-Calédonie et défis structurels", "theme": 1, "cat": "1.5.5", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les outre-mer français comprennent 5 départements et régions d'outre-mer (DROM) et 6 collectivités d'outre-mer (COM), soit 2,8 millions d'habitants et la 2e ZEE mondiale.</p>\n<h3>2. Les Principaux Territoires</h3>\n<table><tr><th>Territoire</th><th>Statut</th><th>Population</th></tr><tr><td>Guadeloupe</td><td>DROM</td><td>380 000</td></tr><tr><td>Martinique</td><td>DROM</td><td>360 000</td></tr><tr><td>Guyane</td><td>DROM</td><td>300 000</td></tr><tr><td>La Réunion</td><td>DROM</td><td>880 000</td></tr><tr><td>Mayotte</td><td>DROM</td><td>321 000+</td></tr><tr><td>Polynésie</td><td>COM</td><td>280 000</td></tr><tr><td>Nouvelle-Calédonie</td><td>Sui generis</td><td>270 000</td></tr></table>\n<h3>3. La Crise de la Nouvelle-Calédonie</h3>\n<p>3 référendums d'indépendance (2018, 2020, 2021, tous « Non »). Émeutes de mai 2024 déclenchées par la réforme du corps électoral : 14 morts, 2 Md€ de dégâts. Nickel : 25 % des réserves mondiales, usines en difficulté.</p>\n<h3>4. Les Défis Structurels des DROM</h3>\n<p>Vie chère (prix 30-40 % plus élevés), chômage de 22 %, dépendance aux transferts publics, exode des jeunes diplômés.</p>\n<h3>5. Enjeux Stratégiques</h3>\n<p>Les outre-mer sont un atout géostratégique (ZEE, présence mondiale) mais un défi économique et social majeur.</p>\n<h3>6. Synthèse Décisionnelle</h3>\n<p>Plan de convergence sociale sur 15 ans, réforme de l'octroi de mer, accord global négocié pour la Nouvelle-Calédonie, développement économique endogène.</p>"}, {"id": "35862af8e03f81b8b9fede313ee57179", "titre": "La Nouvelle-Calédonie : statut sui generis, référendums et émeutes 2024", "theme": 1, "cat": "1.5.5", "html": "<h3>🔄 MAJ 2025-2026 : de Bougival au scrutin provincial du 28 juin 2026</h3>\n<p><strong>Accord de Bougival (12 juillet 2025)</strong> : issu des négociations entre indépendantistes, loyalistes et gouvernement. Prévoit un « État de la Nouvelle-Calédonie » à statut sui generis pérenne, transfert de compétences en affaires étrangères, dégel partiel et progressif du corps électoral, création d'une nationalité calédonienne. Devait être soumis à référendum local en février 2026.</p>\n<p><strong>Troisième report des provinciales</strong> par loi organique du 6 novembre 2025 (au plus tard le 28 juin 2026) — le Conseil constitutionnel juge que ce report « devra être le dernier ». Accord complémentaire « Élysée-Oudinot » du 19 janvier 2026, boycotté par le FLNKS.</p>\n<p><strong>Échec constitutionnel du 2 avril 2026</strong> : l'Assemblée nationale rejette le projet de loi constitutionnelle traduisant les accords. Conséquence : les provinciales se tiennent sous le statut antérieur de Nouméa (1998), Lecornu fixant le scrutin au 28 juin 2026.</p>\n<p><strong>Le dégel partiel du corps électoral</strong> : sur 218 789 électeurs de la liste générale, 37 492 étaient exclus du scrutin provincial (corps gelé sur 1998), dont 10 575 natifs de Nouvelle-Calédonie. La loi organique Naturel du 28 mai 2026 (déc. CC n° 2026-905 DC du même jour) intègre les natifs par inscription d'office — environ 10 500 électeurs supplémentaires. Une modification substantielle du corps électoral resterait de niveau constitutionnel.</p>\n<p><strong>Ce qu'il faut retenir</strong> : le rejet du 2 avril 2026 a fait échouer la traduction juridique de Bougival — le territoire vote sous un statut que tous jugent périmé, sans marge de temporisation supplémentaire selon le Conseil constitutionnel. Lecornu a annoncé vouloir aboutir « avant la fin de l'année 2026 ».</p>\n<h3>1. Définition & Cadre</h3>\n<p>La Nouvelle-Calédonie est une collectivité sui generis française du Pacifique, dotée d'un statut particulier issu des accords de Matignon (1988) et de Nouméa (1998). 271 000 habitants, capitale Nouméa.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Titre XIII de la Constitution · loi organique du 19 mars 1999 · accord de Nouméa (5 mai 1998, valeur constitutionnelle).</p>\n<h3>3. Le Statut Sui Generis</h3>\n<p>Congrès (54 membres), gouvernement collégial (11 membres), 3 provinces (Sud, Nord, Îles Loyauté), lois du pays à valeur législative. Compétences propres : fiscalité, droit du travail, environnement, urbanisme.</p>\n<h3>4. La Citoyenneté Calédonienne et le Corps Électoral Gelé</h3>\n<p>Seuls les résidents présents avant 1998 (et leurs descendants) pouvaient voter aux provinciales — 40 000 personnes en étaient privées avant la réforme de 2026. Le projet de « dégel » de 2024 a déclenché les émeutes de mai.</p>\n<h3>5. Les Trois Référendums d'Autodétermination</h3>\n<table><tr><th>Référendum</th><th>NON</th><th>Participation</th></tr><tr><td>4 nov. 2018</td><td>56,7 %</td><td>81 %</td></tr><tr><td>4 oct. 2020</td><td>53,3 %</td><td>86 %</td></tr><tr><td>12 déc. 2021</td><td>96,5 %</td><td>44 % (boycott indépendantiste)</td></tr></table>\n<h3>6. Les Émeutes de Mai 2024</h3>\n<p>13 morts, 2 000 commerces incendiés, 2,2 Md€ de dégâts, état d'urgence du 13 mai au 28 juin 2024, 6 000 forces de l'ordre envoyées.</p>\n<h3>7. Le Nickel</h3>\n<p>2e producteur mondial, 8 000 emplois directs, 25 % du PIB local. Crise majeure liée à l'effondrement des cours ; Pacte Nickel (2024) pour recapitalisation.</p>\n<h3>8. Les Forces Politiques</h3>\n<p>Loyalistes (Les Loyalistes, Sonia Backes) vs indépendantistes (FLNKS, Union Calédonienne, UNI).</p>\n<h3>9. Synthèse Décisionnelle</h3>\n<p>La Nouvelle-Calédonie reste dans une impasse politique nécessitant un nouveau cadre négocié post-Nouméa. Les provinciales de juin 2026 se tiennent sous un statut que toutes les parties jugent dépassé — la reprise des négociations est jugée urgente par le rapporteur sénatorial.</p>"}, {"id": "35862af8e03f8181b281e6956d98fba2", "titre": "La Polynésie française : statut, indépendantistes au pouvoir et essais nucléaires", "theme": 1, "cat": "1.5.5", "html": "<h3>1. Définition & Cadre</h3>\n<p>La Polynésie française est une Collectivité d'Outre-mer (COM) du Pacifique avec un statut d'autonomie très poussé. 280 000 habitants sur 118 îles réparties en 5 archipels.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 74 de la Constitution · loi organique du 27 février 2004 · loi du 7 juin 2010 (renforcement des pouvoirs).</p>\n<h3>3. Les Institutions</h3>\n<p>Assemblée (57 membres, scrutin proportionnel), président élu par l'Assemblée, Conseil des ministres, haut-commissaire de la République (équivalent préfet).</p>\n<h3>4. Les Compétences</h3>\n<p>Propres : fiscalité, douanes, droit social, santé, éducation, tourisme, pêche, gestion de la ZEE (4,8 millions km²). Régaliennes (État) : défense, justice, monnaie, affaires étrangères.</p>\n<h3>5. Le Président Moetai Brotherson (2023-)</h3>\n<p>Premier président indépendantiste depuis Oscar Temaru, Tavini Huiraatira au pouvoir dans les 3 institutions clés (mairie de Papeete, Assemblée, gouvernement).</p>\n<h3>6. La Question de l'Indépendance</h3>\n<p>Pas de référendum d'autodétermination organisé ; Polynésie inscrite sur la liste ONU des territoires à décoloniser depuis 2013.</p>\n<h3>7. Les Essais Nucléaires</h3>\n<p>193 essais entre 1966 et 1996 (Mururoa, Fangataufa). Loi Morin (2010) : reconnaissance des conséquences sanitaires. CIVEN : environ 4 000 dossiers indemnisés sur 23 000 déposés, critères jugés restrictifs.</p>\n<h3>8. L'Économie</h3>\n<p>Transferts annuels de l'État : 1,8 Md€/an. Tourisme (240 000 visiteurs/an), perliculture, pêche thonière. Chômage : 22 %, pauvreté : 17 %.</p>\n<h3>9. Les Défis</h3>\n<p>Dépendance économique à la métropole, montée des eaux menaçant les atolls bas, disparités entre Tahiti et les archipels périphériques.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Poursuite des transferts financiers, reconnaissance pleine des conséquences des essais nucléaires, lutte contre les inégalités entre archipels.</p>"}, {"id": "35962af8e03f8161b8c3d59c953670f9", "titre": "DROM-COM : cartographie, statuts (art. 73-74), problèmes structurels et RUP", "theme": 1, "cat": "1.5.5", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les DROM (5 : Guadeloupe, Martinique, Guyane, La Réunion, Mayotte) relèvent de l'article 73 : les lois s'y appliquent de plein droit avec adaptation possible. Les COM relèvent de l'article 74 : organisation propre.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Articles 73, 74 et 74-1 de la Constitution · loi organique du 21 février 2007 · règlement UE 2021/1060 (fonds structurels RUP).</p>\n<h3>3. Les DROM (Article 73)</h3>\n<table><tr><th>DROM</th><th>Population</th><th>PIB/hab</th></tr><tr><td>Guadeloupe</td><td>384 000</td><td>22 000 €</td></tr><tr><td>Martinique</td><td>360 000</td><td>22 500 €</td></tr><tr><td>Guyane</td><td>297 000</td><td>16 500 €</td></tr><tr><td>La Réunion</td><td>870 000</td><td>23 500 €</td></tr><tr><td>Mayotte</td><td>320 000</td><td>8 300 €</td></tr></table>\n<h3>4. Les COM (Article 74)</h3>\n<p>Wallis-et-Futuna, Saint-Pierre-et-Miquelon, Saint-Barthélemy, Saint-Martin, Polynésie française, TAAF.</p>\n<h3>5. La Nouvelle-Calédonie : Statut Sui Generis</h3>\n<p>Accord de Nouméa (1998), 3 référendums (2018-2021, tous « Non »), articles 76 et 77, émeutes de mai 2024.</p>\n<h3>6. Les Problèmes Structurels des DROM-COM</h3>\n<p>Chômage structurel (20-30 %), vie chère (+10-15 %), retard scolaire, chlordécone (Antilles, contamination des sols).</p>\n<h3>7. Le Statut RUP (Région Ultrapériphérique)</h3>\n<p>Article 349 TFUE, accès aux fonds structurels européens (~5 Md€ 2021-2027), dérogations réglementaires (octroi de mer, TVA).</p>\n<h3>8. La Vie Chère et l'Octroi de Mer</h3>\n<p>Taxe douanière protégeant la production locale, réautorisée jusqu'en 2027 par l'UE. Rapport Lurel 2019 : la vie chère n'est pas imputable aux seuls transports.</p>\n<h3>9. Mayotte : Cas Critique 2024-2025</h3>\n<p>Cyclone Chido (décembre 2024) : crise humanitaire majeure, plan de reconstruction de 500 M€.</p>\n<h3>10. La Guyane</h3>\n<p>83 534 km² (15 % du territoire français), centre spatial de Kourou, orpaillage illégal, immigration Haïti-Suriname, croissance démographique de +3 %/an.</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Les outre-mer représentent une ZEE stratégique de 11 M km² ; le chlordécone engage la responsabilité de l'État.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Créer un ministère de plein exercice pour l'Outre-mer, plan chlordécone 2025-2030, réforme de l'octroi de mer, plan Marshall Mayotte, stratégie ZEE renforcée.</p>"}, {"id": "35962af8e03f816d9cace7d0b133615f", "titre": "La politique de l'État envers l'Outre-mer : DGOM, continuité territoriale et égalité réelle", "theme": 1, "cat": "1.5.5", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le Ministère chargé des Outre-mer coordonne les politiques publiques dans les DROM-COM via la DGOM (Direction générale des Outre-mer), les préfectures locales et la mission budgétaire Outre-mer (2,7 Md€).</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi organique n° 2007-223 · CGCT articles L. 3441 et suivants · loi du 28 février 2017 (égalité réelle des DROM) · code des transports (continuité territoriale).</p>\n<h3>3. Les Outils du Ministère</h3>\n<p>DGOM (évaluation, affaires juridiques, politiques publiques), agences locales (ARS, offices de l'eau, ADEME Outre-mer).</p>\n<h3>4. Les Grandes Politiques</h3>\n<p>Continuité territoriale (aide au billet d'avion, ~50 M€/an) · défiscalisation (dispositifs Girardin, ~800 M€/an) · Service Militaire Adapté (6 000 stagiaires/an, 80 % d'insertion) · fonds européens (FEADER, consommation insuffisante 50-70 %).</p>\n<h3>5. La Mission Budgétaire Outre-mer</h3>\n<p>Crédits LFI 2024 : 2,7 Md€ (programmes emploi et conditions de vie), plus de 5 Md€ d'engagements européens 2021-2027, exonérations de charges d'environ 2 Md€/an.</p>\n<h3>6. La Loi Égalité Réelle (2017)</h3>\n<p>Objectif : convergence socio-économique DROM-métropole en 20 ans, via plans de convergence et contrats de convergence et de transformation (CCT). Bilan 2017-2024 : objectifs partiellement atteints.</p>\n<h3>7. Les Crises Politiques Locales</h3>\n<p>Martinique et Guadeloupe (contestation de la vie chère, obligation vaccinale en 2021) · Nouvelle-Calédonie (émeutes 2024).</p>\n<h3>8. Le Rôle Stratégique des Outre-mers</h3>\n<p>ZEE de 11 M km² (2e mondiale), bases militaires (FAZSOI La Réunion, FANC Nouvelle-Calédonie).</p>\n<h3>9. Enjeux Stratégiques</h3>\n<p>Les DROM-COM assurent une présence mondiale à la France ; la vie chère demeure une tension sociale permanente.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Renforcer la DGOM, lancer un plan de développement économique endogène, réformer la défiscalisation, renforcer la police des fonds marins, accélérer les contrats de convergence.</p>"}, {"id": "35962af8e03f81239973c1fb1ab15a7c", "titre": "Articles 73, 74, 76 : les trois régimes constitutionnels de l'Outre-mer", "theme": 1, "cat": "1.5.5", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les articles 73 et 74 de la Constitution définissent deux régimes juridiques distincts pour l'Outre-mer. L'article 73 permet des adaptations tout en appliquant les lois métropolitaines ; l'article 74 permet une organisation propre pouvant aller jusqu'à une large autonomie. L'article 76 est spécifique à la Nouvelle-Calédonie.</p>\n<h3>2. Article 73 : DROM — Application de Plein Droit</h3>\n<p>Les lois et règlements sont applicables de plein droit, avec adaptations possibles (habilitation directe depuis 2003). Concerne Guadeloupe, Martinique, Guyane, La Réunion, Mayotte.</p>\n<h3>3. Article 74 : COM — Organisation Propre</h3>\n<p>Statut tenant compte des intérêts propres de chaque collectivité. Degrés d'autonomie variables : Polynésie française (gouvernement, assemblée, lois du pays), Saint-Barthélemy (fiscalité propre, extériorité douanière), Saint-Martin (autonomie limitée), Wallis-et-Futuna (royautés coutumières maintenues).</p>\n<h3>4. L'Article 76 : Nouvelle-Calédonie</h3>\n<p>Statut sui generis (articles 76 et 77), accord de Nouméa (1998), institutions propres (gouvernement, Congrès, Sénat coutumier, 3 provinces).</p>\n<h3>5. L'Articulation Avec le Droit de l'UE</h3>\n<p>DROM = Régions Ultrapériphériques (RUP, article 349 TFUE, droit européen applicable, fonds structurels). COM = Pays et Territoires d'Outre-mer (PTOM, hors espace européen, décision d'association, pas de fonds structurels directs).</p>\n<h3>6. Les Évolutions Récentes</h3>\n<p>Martinique (demande d'autonomie article 74 portée par Serge Letchimy) · Guyane (Congrès de Guyane 2015, collectivité unique) · Guadeloupe (débat sur une collectivité unique).</p>\n<h3>7. Le Débat Sur l'Autonomie Poussée</h3>\n<p>Pour : adaptation aux réalités locales, développement endogène. Contre : unité de la République, dépendance financière, risque souverainiste.</p>\n<h3>8. Synthèse Décisionnelle</h3>\n<p>Ouvrir la possibilité d'un passage de l'article 73 vers l'article 74 par référendum local, maintenir le soutien financier indépendamment du statut, harmoniser les statuts PTOM/RUP au niveau européen, accélérer le règlement du dossier calédonien.</p>"}], "ficheIndex": {"1.1.1": [{"id": "35362af8e03f81fe9b5cc0b0ec925ff3", "titre": "La Constitution du 4 octobre 1958"}, {"id": "35362af8e03f812cb8b3e29fcf75f5ef", "titre": "Le Préambule de 1958 et ses composantes"}, {"id": "35362af8e03f817b8c82fbaedd2109fc", "titre": "La Ve République : régime semi-présidentiel"}, {"id": "35362af8e03f81e5b371f8132d1a2f07", "titre": "L'architecture générale des institutions"}, {"id": "35862af8e03f81a598dff2b8d8b97ae7", "titre": "La genèse de la Constitution de 1958 : de Gaulle, Debré et la fondation de la Ve République"}, {"id": "35862af8e03f818f90faff6382034640", "titre": "Les cohabitations sous la Ve République : 1986, 1993, 1997 et la nouvelle pratique 2022"}], "1.1.2": [{"id": "35362af8e03f8133bdb6cbf483357094", "titre": "La procédure de révision (article 89)"}, {"id": "35362af8e03f81589409d35c69e387e7", "titre": "Les révisions constitutionnelles majeures depuis 1958"}, {"id": "35362af8e03f81afa5d1ca4e66e42e1b", "titre": "Le référendum constitutionnel"}, {"id": "35362af8e03f81a28616fe85b1767601", "titre": "Les limites à la révision constitutionnelle"}, {"id": "35862af8e03f8152ae9bc6e0419fe4d8", "titre": "Les référendums sous la Ve République : usage, RIP et débat sur le RIC"}, {"id": "35862af8e03f81a7bd95e0454942e494", "titre": "La révision constitutionnelle du 23 juillet 2008 (Sarkozy/Balladur)"}, {"id": "35862af8e03f818289c0d7cff819f3c6", "titre": "La révision constitutionnelle du 4 août 1995 (Chirac)"}, {"id": "35862af8e03f81e4bf82d21933b3178d", "titre": "Le quinquennat (2000) : référendum, calendrier électoral et hyperprésidentialisation"}, {"id": "35962af8e03f81588e28d260250241d3", "titre": "La révision constitutionnelle du 8 mars 2024 : IVG dans la Constitution"}, {"id": "35962af8e03f81eba67bd09722ed0609", "titre": "La révision constitutionnelle du 25 juin 1992 (Maastricht)"}, {"id": "35962af8e03f8145b377f6cad713a628", "titre": "La révision constitutionnelle du 8 juillet 1999 (parité)"}, {"id": "35962af8e03f81648c8ff65e1f381bb5", "titre": "La révision constitutionnelle du 8 juillet 1999 : Cour Pénale Internationale"}, {"id": "35962af8e03f81fe82dcd41745bad1d0", "titre": "La révision constitutionnelle du 28 mars 2003 : décentralisation"}, {"id": "35962af8e03f81f49c1df17171aa6a80", "titre": "La Charte de l'environnement (1er mars 2005) : valeur constitutionnelle"}, {"id": "35962af8e03f8176a85dfec7b882cf3b", "titre": "Le Congrès du Parlement à Versailles : réunions, allocutions et révisions"}, {"id": "35962af8e03f8107a33bffd3b214ed99", "titre": "Les échecs de révision constitutionnelle : 1969, 2005 et tentatives bloquées"}], "1.1.3": [{"id": "35362af8e03f81fc948bc9d00cb80f02", "titre": "Le bloc de constitutionnalité"}, {"id": "35362af8e03f81af9068d1547724d9a3", "titre": "La Déclaration des droits de l'Homme et du Citoyen (1789)"}, {"id": "35362af8e03f818786fad8922e4314ce", "titre": "   $$('.nav-item').forEach(b=>b.addEventListener('click', ()=>{ location.hash = b.dataset.route; }));
}
function navGroup(label, items){ return `<div class="nav-group"><div class="nav-group-label">${label}</div>${items.join('')}</div>`; }
function navItem(route, emoji, label, rn=false, n=null){
  return `<button class="nav-item ${rn?'rn':''}" data-route="${route}"><span class="em">${emoji}</span>${n?`<span class="n">${n}</span>`:''}<span>${escapeHtml(label)}</span></button>`;
}

function setActive(route){
  $$('.nav-item').forEach(b=> b.classList.toggle('active', b.dataset.route===route));
}

function badge(status){
  if(!status) return '';
  if(status.includes('✅')) return `<span class="badge green">complet</span>`;
  if(status.includes('🟠')) return `<span class="badge amber">partiel</span>`;
  if(status.includes('🔴')) return `<span class="badge red">ouvert</span>`;
  return '';
}

function pageHead(kicker, title, note, rn=false){
  return `<div class="page-head ${rn?'rn':''}"><div class="kicker">${kicker}</div><h1>${title}</h1>${note?`<div class="status-note">${note}</div>`:''}</div>`;
}

function renderHome(){
  const senat = DATA.calendrier.find(c=>c[0]==='Sénatoriales');
  const pres = DATA.calendrier.find(c=>c[0].includes('1er tour'));
  return `
  <div class="hero">
    <div class="hero-eyebrow">Documentation Politique — Base de Décision d'État</div>
    <h1>Tableau de bord de campagne</h1>
    <p class="lede">${DATA.totalThemes} thèmes, ≈${DATA.totalFiches} fiches indexées, dossier programmatique RN et calendrier électoral 2026-2027 réunis dans un seul outil de lecture.</p>
    <div class="countdown-row">
      <div class="countdown"><div class="num">${senat[2]}</div><div class="label">Sénatoriales — ${senat[1]}</div></div>
      <div class="countdown"><div class="num">${pres[2].split(',')[0]}</div><div class="label">Présidentielle 1er tour — ${pres[1]}</div></div>
    </div>
  </div>
  <div class="stat-grid">
    <div class="stat"><div class="v">${DATA.totalThemes}</div><div class="l">Thèmes cartographiés</div></div>
    <div class="stat"><div class="v">≈${DATA.totalFiches}</div><div class="l">Fiches indexées (structure)</div></div>
    <div class="stat"><div class="v">${DATA.integratedFiches}</div><div class="l">Fiches en texte intégral (15 sections)</div></div>
  </div>
  <div class="empty-note">Intégration du contenu fiche par fiche en cours, dans l'ordre des dossiers (Th. 1 → Th. 38). ${DATA.integratedFiches} sur ≈${DATA.totalFiches} à ce jour — reprise à la catégorie suivante à la prochaine session.</div>
  <div class="quicklinks">
    <a class="qcard rn" href="#hub"><div class="qt">🚨 Hub Campagne</div><div class="qd">Calendrier, urgences sénatoriales, statut du dossier RN</div></a>
    <a class="qcard neutral" href="#critiques"><div class="qt">🔴 Sujets critiques</div><div class="qd">Sélection hors dossier RN, base neutre, 38 thèmes</div></a>
    <a class="qcard rn" href="#rn"><div class="qt">🔵 Dossier RN</div><div class="qd">Programme applicable, 11 blocs, 5 points durs</div></a>
    <a class="qcard neutral" href="#glossaire"><div class="qt">📖 Glossaire</div><div class="qd">Notions, institutions, procédures, sigles</div></a>
  </div>
  <footer class="note">Base construite et maintenue par Claude (Anthropic) pour Seth — usage interne. Structure des 38 thèmes transcrite de la Cartographie Notion (dernière mise à jour structurelle : 15 août 2026). La page Notion source fait toujours foi en cas de divergence.</footer>
  `;
}

function renderHub(){
  let html = pageHead('Hub Campagne', 'Calendrier, urgences et priorités 2026-2027',
    'Curation manuelle mise à jour à chaque session touchant le calendrier électoral ou le dossier RN. En cas de divergence, la page Notion source fait foi.', true);

  html += `<h2>${DATA.lePen.titre}</h2>${DATA.lePen.corps}`;

  html += `<h2>Calendrier électoral</h2><table><tr><th>Échéance</th><th>Date</th><th>J-</th></tr>`;
  DATA.calendrier.forEach(c=>{
    html += `<tr><td>${c[3]?'<strong>'+c[0]+'</strong>':c[0]}</td><td>${c[1]}</td><td class="mono">${c[2]}</td></tr>`;
  });
  html += `</table>`;

  html += `<h2>Trois urgences non résolues à J-23 des sénatoriales</h2><ul>`;
  DATA.urgences.forEach(u=> html += `<li style="margin-bottom:8px; font-size:13.5px; color:var(--ink-soft);">${u}</li>`);
  html += `</ul>`;

  html += `<h2>Statut du dossier programmatique RN</h2><table><tr><th>Document</th><th>Statut</th></tr>`;
  DATA.rnDocs.forEach(d=> html += `<tr><td>${d[0]}</td><td>${d[1]}</td></tr>`);
  html += `</table>`;

  html += `<p class="source-note">Détail : page Dossier RN de ce site, ou <a href="#rn">voir le programme complet →</a></p>`;
  return html;
}

function renderCritiques(){
  let html = pageHead('Base neutre — hors dossier RN', 'Sujets critiques', 'Sélection, pas audit exhaustif des ~'+DATA.totalFiches+' fiches. Critère : pertinence électorale directe et statut non résolu.');
  DATA.sujetsCritiques.forEach(s=>{
    html += `<div class="sc-card"><div class="th">${s.theme}</div><h3>${s.titre}</h3><p>${s.corps}</p></div>`;
  });
  return html;
}

function renderRN(){
  let html = pageHead('Couche programmatique — dérivée de la base documentaire', 'Rassemblement National — Dossier programmatique', 'La base documentaire (Th. 1 à 38) reste neutre, factuelle et sourcée. Elle alimente ce dossier ; ce dossier ne la modifie pas.', true);

  html += `<h2>Résultat consolidé</h2><table><tr><th>Indicateur</th><th>Programme initial</th><th>Version applicable</th></tr>`;
  DATA.rnResultat.forEach(r=> html += `<tr><td>${r[0]}</td><td>${r[1]}</td><td><strong>${r[2]}</strong></td></tr>`);
  html += `</table>`;

  html += `<h2>Les 11 blocs programmatiques</h2><ul class="bloc-list">`;
  DATA.rnBlocs.forEach(b=>{
    html += `<li><span class="bloc-cost">${b[2]}</span><span class="bloc-num">Bloc ${b[0]}</span><span class="bloc-title">${b[1]}</span><div class="bloc-detail">${b[3]}</div><div class="bloc-theme">→ ${b[4]}</div></li>`;
  });
  html += `</ul>`;

  html += `<h2>Les 5 points durs</h2>`;
  DATA.rnPointsDurs.forEach(p=>{
    html += `<div class="dur-item"><div class="t">${p[0]}</div><div class="d">${p[1]}</div></div>`;
  });

  html += `<div class="empty-note">Fédérations, argumentaire de débat détaillé et synthèse grand public restent dans Notion — non dupliqués ici (règle : renvoi, jamais de développement parallèle).</div>`;
  return html;
}

function renderGlossaire(){
  let html = pageHead('Référentiel', 'Glossaire', 'Notions juridiques, institutionnelles, budgétaires, européennes et politiques utilisées dans la base.');
  html += `<h2>Sommaire</h2><ul class="cat-list">`;
  DATA.glossaireSections.forEach(s=> html += `<li><span class="name">${s}</span></li>`);
  html += `</ul>`;
  html += `<h2>Additifs récents (veille 2026)</h2>`;
  DATA.glossaireAddendum.forEach(cat=>{
    html += `<div class="gl-cat"><h3>${cat.cat}</h3>`;
    cat.terms.forEach(t=> html += `<div class="gl-term"><div class="t">${t[0]}</div><div class="d">${t[1]}</div></div>`);
    html += `</div>`;
  });
  return html;
}

function renderTransversal(){
  let html = pageHead('Sections transversales', 'Autres dossiers de la base', 'Contenu structurel — intégration détaillée à programmer par session ultérieure.');
  html += `<table><tr><th>Section</th><th>Fiches / rapports</th><th>Description</th></tr>`;
  DATA.transversal.forEach(t=>{
    html += `<tr><td>${t.titre}</td><td class="mono">${t.fiches||'—'}</td><td style="font-size:12.5px;color:var(--ink-soft)">${t.desc}</td></tr>`;
  });
  html += `</table>`;
  return html;
}

function renderTheme(num){
  const t = DATA.themes.find(x=>x.num===num);
  if(!t) return `<p>Thème introuvable.</p>`;
  let html = pageHead(`Thème ${t.num} · base neutre`, `${t.emoji} ${t.titre}`, t.statut);
  html += `<table style="margin-bottom:24px;"><tr><td style="border:none;padding:0;font-size:12.5px;color:var(--ink-faint);">≈${t.fiches} fiches actives sur ce thème · <a href="https://app.notion.com/p/${t.notion_id}" target="_blank" rel="noopener">ouvrir dans Notion →</a></td></tr></table>`;
  html += `<h2>Catégories</h2><ul class="cat-list">`;
  t.categories.forEach(c=>{
    const code = c[0];
    let fichesHere = [];
    Object.keys(DATA.ficheIndex).forEach(k=>{
      if(k===code || k.startsWith(code+'.')) fichesHere = fichesHere.concat(DATA.ficheIndex[k]);
    });
    html += `<li><span class="code">${code}</span><div style="flex:1;"><span class="name">${c[1]}</span>`;
    if(fichesHere && fichesHere.length){
      html += `<div style="margin-top:6px;">` + fichesHere.map(f=>`<a href="#fiche-${f.id}" class="fiche-link">📄 ${escapeHtml(f.titre)}</a>`).join('') + `</div>`;
    }
    html += `</div></li>`;
  });
  html += `</ul>`;
  const anyIntegrated = t.categories.some(c=>DATA.ficheIndex[c[0]]);
  if(!anyIntegrated){
    html += `<div class="empty-note">Détail fiche par fiche (15 sections) non encore intégré à ce site pour ce thème — consulter la page Notion pour le contenu complet. Structure et catégories vérifiées au 15 août 2026.</div>`;
  } else {
    html += `<div class="empty-note">Catégories sans fiches listées ci-dessus : détail non encore intégré — consulter Notion. Intégration en cours, dans l'ordre des dossiers.</div>`;
  }
  return html;
}

function renderFiche(id){
  const f = DATA.fiches.find(x=>x.id===id);
  if(!f) return `<p>Fiche introuvable.</p>`;
  const t = DATA.themes.find(x=>x.num===f.theme);
  let html = `<div class="page-head"><div class="kicker">Fiche · ${f.cat} · Th. ${f.theme}${t?' — '+t.titre:''}</div><h1>${escapeHtml(f.titre)}</h1></div>`;
  html += `<div class="fiche-body">${f.html}</div>`;
  html += `<p class="source-note"><a href="#theme-${f.theme}">← retour au thème ${f.theme}</a></p>`;
  return html;
}

const ROUTES = {
  home: ()=>({title:'Tableau de bord', html:renderHome()}),
  hub: ()=>({title:'Hub Campagne', html:renderHub()}),
  critiques: ()=>({title:'Sujets critiques', html:renderCritiques()}),
  rn: ()=>({title:'Dossier RN', html:renderRN()}),
  glossaire: ()=>({title:'Glossaire', html:renderGlossaire()}),
  transversal: ()=>({title:'Autres dossiers', html:renderTransversal()}),
};

function route(){
  const hash = (location.hash||'#home').slice(1);
  let out;
  if(hash.startsWith('theme-')){
    const num = parseInt(hash.split('-')[1],10);
    const t = DATA.themes.find(x=>x.num===num);
    out = {title: t? `Th. ${t.num} — ${t.titre}` : 'Thème', html: renderTheme(num)};
  } else if(hash.startsWith('fiche-')){
    const id = hash.slice(6);
    const f = DATA.fiches.find(x=>x.id===id);
    out = {title: f? f.titre : 'Fiche', html: renderFiche(id)};
  } else if(ROUTES[hash]){
    out = ROUTES[hash]();
  } else {
    out = ROUTES.home();
  }
  $('#content').innerHTML = out.html;
  $('#crumb').innerHTML = `<b>${out.title}</b>`;
  setActive(hash);
  window.scrollTo(0,0);
  $('#sidebar').classList.remove('open');
}

function initSearch(){
  $('#searchInput').addEventListener('input', (e)=>{
    const q = e.target.value.trim().toLowerCase();
    $$('#themeNav .nav-item').forEach(btn=>{
      const txt = btn.textContent.toLowerCase();
      btn.style.display = (!q || txt.includes(q)) ? 'flex' : 'none';
    });
  });
}

renderSidebar();
initSearch();
window.addEventListener('hashchange', route);
$('#menuToggle').addEventListener('click', ()=> $('#sidebar').classList.toggle('open'));
route();
</script>
</body>
</html>

Président</td><td>Président de la République</td><td>20 février 2025</td></tr><tr><td>Jacques Mézard</td><td>Président de la République</td><td>22 février 2019</td></tr><tr><td>Jacqueline Gourault</td><td>Président de la République</td><td>1er mars 2022</td></tr><tr><td>François Pillet</td><td>Président du Sénat</td><td>21 février 2019</td></tr><tr><td>François Seners</td><td>Président du Sénat</td><td>23 février 2022</td></tr><tr><td>Philippe Bas</td><td>Président du Sénat</td><td>19 février 2025</td></tr><tr><td>Alain Juppé</td><td>Président de l'Assemblée nationale</td><td>21 février 2019</td></tr><tr><td>Véronique Malbec</td><td>Présidente de l'Assemblée nationale</td><td>23 février 2022</td></tr><tr><td>Laurence Vichnievsky</td><td>Présidente de l'Assemblée nationale</td><td>19 février 2025</td></tr></table>\n<p><strong>Membres de droit</strong> (anciens Présidents de la République, à vie) : Nicolas Sarkozy (depuis 2012, ne siège pas) · François Hollande (depuis 2017, n'a jamais siégé).</p>\n<p>⚠️ <strong>Corrections apportées le 7 août 2026</strong> : Michel Pinault et Corinne Luquiens ont quitté leurs fonctions le 7 mars 2025 (mandat de 9 ans échu). François Seners et Laurence Vichnievsky, absents des fiches sources, sont bien membres actuels. Alain Juppé a été nommé par le président de l'Assemblée nationale (et non par le PR comme indiqué à tort dans une source). Jacques Mézard est membre depuis 2019 (et non 2025).</p>\n<h3>4. Fonctionnement Concret</h3>\n<p>Contrôle a priori (avant promulgation, sur saisine des 60 députés/sénateurs ou PR, PM, présidents des chambres) · QPC (a posteriori, sur renvoi du Conseil d'État ou de la Cour de cassation) · décision dans le mois (8 jours en urgence) · effets erga omnes, pas d'appel possible.</p>\n<h3>5. Compétences</h3>\n<p>Contentieux normatif (contrôle a priori, QPC, contrôle des traités) · contentieux électoral (présidentielle, législatives, sénatoriales, référendums) · compétences consultatives (avis sur l'article 16, avis sur l'empêchement présidentiel).</p>\n<h3>6. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>Président CC</td><td>Préside, voix prépondérante</td></tr><tr><td>8 membres</td><td>Délibèrent</td></tr><tr><td>Rapporteur adjoint</td><td>Instruction du dossier</td></tr><tr><td>Secrétaire général CC</td><td>Administration (Catherine Leroy depuis le 16 avril 2026)</td></tr></table>\n<h3>7. Finances & Moyens</h3>\n<p>Budget : environ 13 M€/an. Effectifs : divergence non tranchée entre 80 et 120 agents selon les sources — à vérifier sur le rapport d'activité. Indemnité des membres : environ 15 000 €/mois, pas de régime de retraite spécifique. Siège : Palais-Royal.</p>\n<h3>8. Audit Factuel</h3>\n<p>Décisions DC depuis 1958 : environ 1 200. Décisions QPC depuis 2010 : plus de 1 100, rythme récent d'environ 80/an. Taux d'inconstitutionnalité en QPC : environ 20 %.</p>\n<h3>9. Chronologie</h3>\n<p>1958 (création) · 1971 (décision « liberté d'association », naissance du bloc de constitutionnalité) · 1974 (saisine ouverte aux 60 parlementaires) · 2010 (entrée en vigueur de la QPC) · 2023 (validation de la réforme des retraites) · février 2025 (renouvellement par tiers : Ferrand président, Bas, Vichnievsky).</p>\n<h3>10. Dépendances</h3>\n<ul>\n<li><strong>Nominations politiques</strong> : risque de composition partisane</li>\n<li><strong>Jurisprudence</strong> : le CC construit le droit constitutionnel au fil des décisions</li>\n<li><strong>Dialogue des juges</strong> : CC, CE, Cour de cassation, CJUE, CEDH s'influencent mutuellement</li>\n</ul>\n<h3>11. Points de Rupture & Tensions</h3>\n<p>Légitimité démocratique (9 membres non élus peuvent annuler des lois votées), nominations perçues comme politiques, risque de « gouvernement des juges ». Le débat complet sur l'indépendance est traité dans la fiche dédiée.</p>\n<h3>12. Dimension Européenne & Internationale</h3>\n<p>Dialogue avec la CJUE et la Cour EDH, défense de l'identité constitutionnelle française face au droit de l'UE. Comparaisons : Allemagne (BVerfG, 16 membres, mandat 12 ans, opinions dissidentes), Italie (15 membres), Espagne (12 membres), USA (Cour suprême, mandat à vie).</p>\n<h3>13. Enjeux Stratégiques</h3>\n<p>Maintenir l'équilibre entre indépendance et légitimité démocratique ; réformer les nominations pour renforcer l'indépendance réelle.</p>\n<h3>14. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : statu quo</p>\n<p><strong>Scénario 2</strong> : réforme des nominations (audition parlementaire renforcée, véto qualifié)</p>\n<p><strong>Scénario 3</strong> : transformation en Cour constitutionnelle à part entière (magistrats professionnels)</p>\n<h3>15. Faisabilité, Temporalité, Synthèse Décisionnelle + Sources</h3>\n<p><strong>Faisabilité</strong> : réforme des nominations nécessite une révision constitutionnelle. <strong>Temporalité</strong> : fenêtre de réforme envisageable après 2027.</p>\n<p><strong>Problème</strong> : le CC est devenu un acteur central du système juridique français sans réforme de sa composition, restée à la discrétion politique.</p>\n<p><strong>Recommandation</strong> : réformer les nominations (expertise juridique requise, véto qualifié du Parlement) et clarifier le statut des membres de droit.</p>\n<p><strong>Sources</strong> : conseil-constitutionnel.fr (composition certifiée 7 août 2026) — Articles 56-63 de la Constitution — Dominique Rousseau, Droit du contentieux constitutionnel</p>"}, {"id": "35862af8e03f81849288ee638b0ea21b", "titre": "La QPC : procédure, bilan et impact sur le droit", "theme": 1, "cat": "1.4.1", "html": "<h3>🔵 Fusion — 7 août 2026 : triplon QPC résorbé</h3>\n<p>Cette fiche absorbe deux fiches archivées sur le même sujet, enrichie de l'angle historique et de la comparaison européenne.</p>\n<h3>1. Définition & Cadre</h3>\n<p>La Question Prioritaire de Constitutionnalité (QPC) permet à tout justiciable, à l'occasion d'un procès, de contester devant les juridictions ordinaires la conformité d'une loi en vigueur aux droits et libertés garantis par la Constitution. Créée par la révision du 23 juillet 2008, entrée en vigueur le 1er mars 2010, elle a transformé le contrôle de constitutionnalité français d'un système purement a priori vers un système mixte.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 61-1 de la Constitution (2008) · loi organique du 10 décembre 2009 · décret du 16 février 2010 · conditions de renvoi (disposition applicable au litige, non déjà déclarée conforme, caractère sérieux ou nouveau).</p>\n<h3>3. Fonctionnement Concret — la procédure à triple filtre</h3>\n<p>Devant le juge du fond (vérification de l'applicabilité et du caractère nouveau/sérieux) → devant la Cour de cassation ou le Conseil d'État (filtre sous 3 mois, environ 50 % de rejets) → devant le Conseil constitutionnel (examen au fond, audience publique, décision sous 3 mois). Effets : conformité, conformité sous réserve, ou non-conformité (abrogation immédiate ou différée, erga omnes).</p>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>Justiciables</td><td>Déclencheurs</td></tr><tr><td>Avocats</td><td>Stratèges du contentieux constitutionnel</td></tr><tr><td>Conseil d'État / Cour de cassation</td><td>Filtre et sélection</td></tr><tr><td>Conseil constitutionnel</td><td>Décideur final</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Budget CC : environ 13 M€/an. Procédure gratuite pour le justiciable (hors honoraires d'avocat), aide juridictionnelle disponible.</p>\n<h3>6. Audit Factuel</h3>\n<p>QPC déposées devant les juges du fond (2010-2024) : environ 10 000. QPC transmises au Conseil constitutionnel : plus de 1 100. Rythme récent : environ 80 décisions QPC/an. Domaines les plus contestés : droit pénal, procédure pénale, droit fiscal, droit social. Décisions emblématiques : garde à vue (2010, censure totale), mariage pour tous (validé), loi Renseignement (2015, 2018), déchéance de nationalité (2018), loi Avia (2020, censure quasi totale), réforme des retraites (2023, QPC rejetée).</p>\n<h3>7. Chronologie</h3>\n<p>2008 (révision, article 61-1) · 2009 (loi organique) · 1er mars 2010 (entrée en vigueur) · 2010-2024 (plus de 1 100 QPC transmises) · 2023 (QPC retraites rejetée).</p>\n<h3>8. Dépendances</h3>\n<p>Jurisprudence du CC en évolution continue, articulation avec le renvoi préjudiciel CJUE, qualité de la législation (les lois imprécises sont plus vulnérables). ⚠️ Divergence chiffrée non tranchée sur le taux d'inconstitutionnalité (cité tantôt à 30 %, tantôt 15-25 %, tantôt 50 % selon le dénominateur) — à vérifier sur le bilan statistique officiel avant citation ferme.</p>\n<h3>9. Points de Rupture & Tensions</h3>\n<p>Gouvernement des juges, conflits de critères de filtrage entre Conseil d'État et Cour de cassation, ordre de priorité QPC/renvoi CJUE discuté, usage stratégique parfois procédural, délai total jugé long (6-9 mois).</p>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Modèles étrangers : Allemagne (Verfassungsbeschwerde, recours direct), Espagne (recurso de amparo), Italie (contrôle incident), Royaume-Uni (pas de Cour constitutionnelle). Articulation avec le renvoi préjudiciel CJUE et dialogue avec la Cour EDH.</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>La QPC a démocratisé l'accès au contrôle de constitutionnalité et placé le CC au cœur du système juridictionnel comme juridiction quasi suprême, permettant de contester des lois anciennes.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : maintien du double filtre</p>\n<p><strong>Scénario 2</strong> : accès direct au Conseil constitutionnel (modèle allemand)</p>\n<p><strong>Scénario 3</strong> : extension du champ (règlements, engagements internationaux)</p>\n<h3>13. Faisabilité</h3>\n<p>Système mature et éprouvé juridiquement ; toute modification nécessite une révision de la loi organique ou de la Constitution.</p>\n<h3>14. Temporalité</h3>\n<p>Procédure : 6 à 9 mois de la saisine à la décision. Évolution du système progressive, par la législation et la jurisprudence.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : la QPC a révolutionné le système français mais soulève la question de l'équilibre entre contrôle de constitutionnalité et légitimité du législateur démocratiquement élu.</p>\n<p><strong>Recommandation</strong> : maintenir le double filtre mais clarifier l'articulation avec le renvoi préjudiciel CJUE ; envisager une motivation enrichie des décisions.</p>\n<p><strong>Sources</strong> : article 61-1 de la Constitution — loi organique du 10 décembre 2009 — conseil-constitutionnel.fr — Xavier Magnon, QPC mode d'emploi</p>"}, {"id": "35862af8e03f811faa75cfeb2715db29", "titre": "Le contrôle a priori des lois (article 61) : saisine, procédure et grandes décisions", "theme": 1, "cat": "1.4.1", "html": "<h3>✅ Fiche canonique — arbitrage de propriété du 3 août 2026</h3>\n<p>Cette fiche est le propriétaire du sujet « contrôle a priori » dans la base. Toute actualisation sur les saisines, les décisions et l'activité du Conseil constitutionnel s'y inscrit désormais.</p>\n<h3>🔴 MAJ — 21 juillet 2026 : le Conseil constitutionnel, arbitre final d'une législature sans majorité</h3>\n<p><strong>Analyse transversale.</strong> L'été 2026 illustre une mutation de fond du rôle du contrôle a priori : dans une Assemblée sans majorité absolue depuis 2024, où l'exécutif légifère par 49.3 et où le Sénat rejette à répétition, le Conseil constitutionnel est devenu le dernier lieu d'arbitrage effectif de plusieurs des textes les plus clivants.</p>\n<p><strong>Un niveau de saisine record</strong> : selon le Conseil lui-même, l'institution n'a jamais été autant saisie depuis quinze ans. 11 saisines a priori enregistrées depuis janvier 2026 (Premier ministre Lecornu, président du Sénat Larcher, groupes LR/LFI/RN). QPC en forte hausse : 42 en 2024, 55 en 2025, déjà 31 sur le seul premier semestre 2026.</p>\n<p><strong>Trois textes majeurs de juillet 2026 convergent vers le Conseil</strong> : loi sur l'aide à mourir (5 saisines distinctes, griefs sur le délai de rétractation et les majeurs protégés) → Th. 8.4 · loi d'urgence agricole (saisine LFI/PS/Écologistes + sénateurs, fondement Charte de l'environnement, dans le sillage de la censure Duplomb du 7 août 2025) → Th. 11 · loi d'actualisation de la LPM → Th. 5.</p>\n<p><strong>Portée institutionnelle</strong> : le contrôle a priori change de fonction — conçu comme filtre de conformité, il devient l'instance de dernier ressort d'un désaccord politique que le Parlement ne parvient pas à trancher. Nouveauté procédurale notable : la saisine par le Premier ministre lui-même d'un texte que son propre camp a fait adopter (aide à mourir), non pour le faire tomber, mais pour sécuriser les points fragiles avant promulgation — stratégie de « verrouillage constitutionnel préventif ». Le précédent Duplomb (censure de l'acétamipride en août 2025 sur le fondement de la Charte de l'environnement) structure par anticipation le contentieux agricole de 2026.</p>\n<p><strong>Enjeu de rupture</strong> : cette centralité expose le Conseil à un risque de politisation accrue — plus il tranche de questions de société et de conflits majorité/opposition, plus ses décisions sont lues comme des actes politiques, à l'approche de 2027.</p>\n<p><strong>Rappel</strong> : décision n° 2026-7 RIP du 17 juin 2026, par laquelle le Conseil a jugé que les questions éthiques de fin de vie n'entrent pas dans le champ du référendum de l'article 11.</p>\n<h3>1. Définition & Cadre</h3>\n<p>Le contrôle a priori (article 61) permet au Conseil constitutionnel de vérifier la conformité d'une loi avant sa promulgation. Créé en 1958, ce contrôle était initialement réservé à 4 autorités. Depuis 1974, 60 députés ou 60 sénateurs peuvent saisir le Conseil.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 61 de la Constitution · révision du 29 octobre 1974 (ouverture aux 60 parlementaires) · loi organique du 7 novembre 1958.</p>\n<h3>3. Les Saisines</h3>\n<p>Saisine obligatoire : lois organiques, règlements des assemblées, certains traités. Saisine facultative : lois ordinaires, par le Président, le PM, les présidents des chambres, ou 60 parlementaires.</p>\n<h3>4. La Procédure</h3>\n<p>Délai d'1 mois pour statuer (8 jours en urgence), audience non publique, rapporteur désigné par section, décision motivée publiée au JO.</p>\n<h3>5. Les Types de Décisions</h3>\n<p>Conformité · conformité sous réserve d'interprétation · inconstitutionnalité partielle · inconstitutionnalité totale (rare).</p>\n<h3>6. Les Grandes Décisions Historiques</h3>\n<p>16 juillet 1971 (liberté d'association) · 27 décembre 1973 (taxation d'office) · 23 janvier 1987 (Conseil de la concurrence) · 25 janvier 2024 (loi immigration, 35 articles censurés).</p>\n<h3>7. Données Clés</h3>\n<table><tr><th>Indicateur</th><th>Valeur</th></tr><tr><td>Décisions par an</td><td>~30</td></tr><tr><td>Lois ordinaires examinées</td><td>100 % depuis 2008</td></tr><tr><td>Taux de censure totale</td><td>5 %</td></tr><tr><td>Taux de censure partielle</td><td>25 %</td></tr></table>\n<h3>8. La Censure de la Loi Immigration (2024)</h3>\n<p>78 articles examinés, 35 censurés (44 %), pour cavaliers législatifs et atteinte aux principes constitutionnels — affaiblissant politiquement le gouvernement Macron.</p>\n<h3>9. Les Critiques</h3>\n<p>Politisation des nominations, absence de critère de compétence juridique obligatoire, court-circuit par le législateur via des validations législatives.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Le contrôle a priori est un outil mature devenu, en 2026, l'instance de dernier ressort d'une législature sans majorité. Réformes : composition (juristes obligatoires), abandon du rôle des anciens présidents, transparence des débats internes.</p>"}, {"id": "35862af8e03f81a19de7ddd69b55b2ae", "titre": "La jurisprudence majeure du Conseil constitutionnel", "theme": 1, "cat": "1.4.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>La jurisprudence du Conseil constitutionnel est l'ensemble des décisions qui définissent le sens du droit constitutionnel français. Depuis 1958, le Conseil a rendu plus de 5 000 décisions, dont seules quelques dizaines sont réellement structurantes.</p>\n<h3>2. Les Grandes Décisions Fondatrices</h3>\n<p>1971 (liberté d'association, création des PFRLR) · 1975 (IVG, validation de la loi Veil) · 1977 (liberté d'enseignement, PFRLR) · 1981 (nationalisations, valeur constitutionnelle du droit de propriété) · 1985 (Nouvelle-Calédonie, droit à l'autodétermination).</p>\n<h3>3. Les Grandes Décisions Modernes (Post-2008)</h3>\n<p>2010 (garde à vue, censure totale, force la réforme de 2011) · 2013 (mariage pour tous, validation intégrale) · 2015 (loi Renseignement, censure partielle) · 2020 (loi Avia, censure quasi totale) · 2022 (loi séparatisme) · 2023 (réforme des retraites, décision la plus politique de la décennie) · 2024 (loi immigration, 35 articles sur 86 censurés, record absolu).</p>\n<h3>4. Évolution de la Doctrine</h3>\n<p>1958-1971 (doctrine timide) · 1971-1980 (ouverture) · 1980-2000 (extension du bloc de constitutionnalité) · 2000-2010 (européanisation) · 2010-2024 (QPC et activisme constitutionnel).</p>\n<h3>5. Critères Fréquents Utilisés</h3>\n<p>Contrôle de proportionnalité (mesure adaptée, nécessaire, proportionnée) · erreur manifeste d'appréciation (contrôle restreint) · censure des cavaliers législatifs depuis 2010.</p>\n<h3>6. Rôle Politique</h3>\n<p>Le Conseil constitutionnel est devenu un acteur politique majeur, censurant environ 30 % des lois saisies, avec une influence énorme sur le travail parlementaire (« effet de saisine »).</p>\n<h3>7. Synthèse Décisionnelle</h3>\n<p>La jurisprudence du Conseil constitutionnel s'est considérablement étoffée depuis 1971. Une réforme de sa composition (juristes professionnels) est nécessaire pour en faire une vraie Cour suprême.</p>"}, {"id": "35962af8e03f81a3b9a4c67fc0597e49", "titre": "Décisions du Conseil constitutionnel — recensement continu : millésime 2026, 2024-2025", "theme": 1, "cat": "1.4.1", "html": "<h3>🔴 Millésime 2026 — 14 août 2026 : deux décisions le même jour</h3>\n<p><strong>Décision n° 2026-914 DC du 14 août 2026, Loi d'urgence pour la protection et la souveraineté agricoles</strong> — saisine du 24 juillet 2026. Partiellement conforme : deux censures sur le fond (article 35, servitude d'utilité publique jugée disproportionnée au droit de propriété ; partie de l'article 46, habilitation par ordonnance à une police spéciale de l'élevage), trois articles conformes sous réserves (dont l'article 6, dérogation néonicotinoïdes, avec deux réserves sur la délimitation géographique et le délai imparti à l'Anses), six cavaliers législatifs censurés. Dossier complet en fiche 11.2.</p>\n<p><strong>Décision n° 2026-910 DC du 14 août 2026, Loi relative au droit à l'aide à mourir</strong> — cinq saisines (16-20 juillet 2026). Conformité totale, trois réserves d'interprétation : garantie procédurale pour le majeur protégé (vérification « par tous moyens » à la charge du médecin, faute de registre créé), extension de la clause de conscience aux pharmaciens, faculté encadrée pour un établissement privé de refuser d'accueillir la procédure. Deux décisions de récusation rejetées le même jour (membres Vichnievsky et Mézard). Dossier complet en fiche 8.4.</p>\n<p><strong>Lecture transversale du millésime</strong> : sur cinq décisions DC de 2026, quatre comportent des réserves d'interprétation. La réserve est l'instrument principal du contrôle a priori de ce millésime — le Conseil ne bloque pas les choix du législateur, il en borne les conditions d'exercice, transférant souvent la charge d'exécution à un tiers (médecin, Anses).</p>\n<h3>🆕 13 août 2026 : QPC n° 2026-1213 (droit de se taire devant l'AMF)</h3>\n<p>Décision du 10 juillet 2026, conformité — notification du droit de se taire dans une procédure de sanction de l'AMF. Prolonge la ligne jurisprudentielle « droit de se taire » des procédures de sanction administrative.</p>\n<h3>🔄 Millésime 2026 — rattachement du contenu déjà présent dans la base</h3>\n<p><strong>n° 2026-900 DC (18 février 2026)</strong> — Confidentialité des consultations des juristes d'entreprise : conformité sous réserves d'interprétation, réécrivant les voies de levée de la confidentialité.</p>\n<p><strong>n° 2026-901 DC (19 février 2026)</strong> — Loi de finances 2026 : validation du timbre de 50 € pour l'aide juridique et de la mise des frais de justice pénale à la charge du condamné, sous réserve que le juge apprécie le caractère proportionné de la charge au regard de la situation économique.</p>\n<p><strong>n° 2025-1184 QPC (6 mars 2026)</strong> — Contribution pour la justice économique (TAE) : conforme sous réserve similaire de proportionnalité.</p>\n<p><strong>QPC du 25 juin 2026</strong> — Cumul de sanctions en matière de démarchage téléphonique : censure de la possibilité de sanctionner deux fois les mêmes faits par plusieurs autorités (CNIL, ARCEP, DGCCRF) sans concertation ni plafond global, sur le fondement de la nécessité et de la proportionnalité des peines (art. 8 DDHC). Abrogation différée au 31 octobre 2027.</p>\n<p><strong>Lecture transversale</strong> : une technique dominante — la validation conditionnelle. Sur les décisions de ce millésime, la plupart comportent des réserves d'interprétation plutôt que des censures de principe. Un axe thématique net : plusieurs décisions de février-mars 2026 portent sur le coût et l'accès au juge — un changement de doctrine validant un financement partiel de la justice par ses usagers.</p>\n<h3>1. Définition & Cadre</h3>\n<p>Le Conseil constitutionnel a rendu plusieurs décisions majeures en 2024-2026, dans un contexte de tensions institutionnelles. Ces décisions ont façonné le contour des pouvoirs publics, l'application des lois sociales, et le respect des droits fondamentaux.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Articles 61 (a priori) et 61-1 (QPC) de la Constitution · loi organique du 7 novembre 1958 · décisions publiées au JO.</p>\n<h3>3. La Décision Loi Immigration (25 janvier 2024)</h3>\n<p>Décision n° 2024-863 DC : 35 articles censurés sur 86 (record absolu), pour cavaliers législatifs et atteinte aux principes constitutionnels. Loi promulguée mais allégée, relançant le débat sur le « gouvernement des juges ».</p>\n<h3>4. La Décision Réforme des Retraites (14 avril 2023)</h3>\n<p>Décision n° 2023-849 DC : l'essentiel de la loi validé, 6 articles censurés (cavaliers). RIP retraites rejeté le même jour (motif : pas une réforme au sens de l'article 11).</p>\n<h3>5. Les Décisions QPC 2024-2026</h3>\n<p>75 QPC instruites en 2024 (25 abrogations, 50 validations) ; 42 en 2024, 55 en 2025, déjà 31 sur le premier semestre 2026 — tendance à la hausse continue.</p>\n<h3>6. Les Tendances Jurisprudentielles</h3>\n<p>Renforcement du contrôle des cavaliers législatifs (30 % des articles censurés en 2024 sur ce motif), position prudente sur les droits sociaux, dépendance persistante à la nomination politique.</p>\n<h3>7. Comparaisons étrangères</h3>\n<p>Allemagne (Bundesverfassungsgericht, extrêmement actif) · Espagne (Tribunal Constitucional) · Italie (Corte Costituzionale, médiateur État-Régions).</p>\n<h3>8. Enjeux Stratégiques</h3>\n<p>Le Conseil devient un acteur politique de fait dont la légitimité dépend de la perception de neutralité, mise sous tension par le niveau record de saisines de 2026.</p>\n<h3>9. Synthèse Décisionnelle</h3>\n<p>Réformer les nominations (majorité qualifiée), supprimer les membres de droit, publier des opinions dissidentes, auditionner publiquement les candidats. Dans le contexte 2026, la réserve d'interprétation s'impose comme la méthode dominante du Conseil pour arbitrer sans bloquer un Parlement fragmenté.</p>\n<p><strong>Sources</strong> : décisions du Conseil constitutionnel n° 2026-900 DC, 2026-901 DC, 2025-1184 QPC, 2026-910 DC, 2026-914 DC, 2026-1210 QPC — franceinfo — Club des juristes — Public Sénat</p>"}, {"id": "35962af8e03f81ec8b5ec5f6bb31a553", "titre": "L'indépendance du Conseil constitutionnel : nominations, membres de droit et réformes", "theme": 1, "cat": "1.4.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>L'indépendance du Conseil constitutionnel est régulièrement remise en cause en raison de sa composition (nominations politiques par les 3 plus hautes autorités de l'État), de la présence des anciens Présidents comme membres de droit, et de l'absence d'opinions dissidentes publiées.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Articles 56-58 de la Constitution · article 56 al. 2 (anciens PR membres de droit) · loi organique du 7 novembre 1958 · décret du 13 novembre 1959.</p>\n<h3>3. La Composition Actuelle</h3>\n<p>Composition certifiée : voir la fiche canonique « Le Conseil constitutionnel : composition et rôle ». Membres de droit : Nicolas Sarkozy (depuis 2012, ne siège pas), François Hollande (depuis 2017, n'a jamais siégé).</p>\n<h3>4. Les Critiques de la Composition</h3>\n<p>Politisation des nominations (environ 70 % d'anciens parlementaires/ministres, 20 % de juristes universitaires, 10 % de magistrats). Membres de droit jugés problématiques (conflit d'intérêts potentiel, légitimité démocratique nulle). Pas d'opinions dissidentes publiées, contrairement à la Cour suprême américaine ou au BVerfG allemand.</p>\n<h3>5. Les Cas Célèbres de Conflit d'Intérêts</h3>\n<p>Sarkozy (membre de droit depuis 2012, poursuites pénales, ne siège pas) · Fabius président (ancien PM et ministre des AE, critiques sur l'impartialité pour des décisions sur des lois connues comme ministre) · Ferrand nommé président en 2025 (symbole de la nomination politique controversée).</p>\n<h3>6. Les Réformes Proposées</h3>\n<p>Réforme Macron 2018 (suppression des membres de droit, abandonnée, bloquée par le Sénat) · réforme PS (nominations à la majorité qualifiée 3/5, audition publique, cooling-off 5 ans) · réforme LR (50 % de magistrats/professeurs, maintien des membres de droit) · réforme LFI (Cour constitutionnelle de plein exercice, 12 magistrats à majorité qualifiée, opinions dissidentes).</p>\n<h3>7. Les Réformes Adoptées</h3>\n<p>2008 (création de la QPC, audition préalable des candidats par commission parlementaire, veto possible des 3/5 d'une commission, jamais activé) — bilan : audition réelle mais sans conséquence.</p>\n<h3>8. Le Modèle de Cour Constitutionnelle</h3>\n<p>Allemagne (BVerfG, 16 membres, 2/3 du Bundestag/Bundesrat, mandat 12 ans, opinions dissidentes) · Espagne (12 membres, opinions dissidentes) · Italie (15 membres, 1/3 Parlement/PR/magistrats).</p>\n<h3>9. Les Débats Récurrents</h3>\n<p>Environ 70 % des Français favorables à la suppression des membres de droit selon les sondages cités. Macron a nommé 4 des 9 membres actuels en deux mandats, dont le président Ferrand (nommé le 20 février 2025 en remplacement de Fabius, dont le mandat s'est achevé le 7 mars 2025).</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>Le Conseil constitutionnel est devenu un acteur politique majeur dont la légitimité dépend de la perception de neutralité, minée par le mode de nomination.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Réformer : nominations à la majorité qualifiée du Parlement (3/5), suppression des membres de droit, publication d'opinions dissidentes, audition publique contraignante, cooling-off de 5 ans, critère de compétence juridique (50 % de juristes minimum).</p>"}, {"id": "35362af8e03f818ea8e5e5fd01a61b87", "titre": "Le Conseil d'État : juge et conseiller de l'État", "theme": 1, "cat": "1.4.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le Conseil d'État (CE) est à la fois le juge administratif suprême et le conseiller juridique du gouvernement. Créé en l'an VIII (1799) par Napoléon, il incarne la dualité de l'ordre juridictionnel français et joue un rôle fondamental dans la qualité juridique de l'action de l'État.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi du 24 mai 1872 (CE juge par délégation) · article 38 (avis sur les ordonnances) · article 39 (avis sur les projets de loi) · Code de justice administrative · arrêt Blanco (1873).</p>\n<h3>3. Fonctionnement Concret</h3>\n<p>Section du contentieux (jugements des litiges administratifs) · sections consultatives (avis sur les textes du gouvernement) · référés en urgence · rapport annuel. Le CE est saisi avant promulgation de tout projet de loi ou décret en Conseil d'État.</p>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>Vice-président</td><td>Dirige l'institution</td></tr><tr><td>Section du contentieux</td><td>Juridiction suprême administrative</td></tr><tr><td>Sections administratives</td><td>Conseil au gouvernement</td></tr><tr><td>Rapporteurs publics</td><td>Conclusions indépendantes</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Budget CE : environ 140 M€/an. Personnel : environ 1 000 agents (dont 300 membres du CE). Tribunaux administratifs et CAA : environ 4 000 magistrats.</p>\n<h3>6. Audit Factuel</h3>\n<p>Plus de 10 000 décisions par an (contentieux), environ 1 500 avis par an sur des textes gouvernementaux. Délai moyen de jugement : environ 13 mois (TA), 22 mois (CAA), 10 mois (CE). Grande jurisprudence : Blanco (1873), Nicolo (1989), Commune de Montfermeil (2010).</p>\n<h3>7. Chronologie</h3>\n<p>1799 (création par Napoléon) · 1872 (CE devient juge par délégation) · 1989 (Nicolo, primauté des traités sur les lois) · 2010 (réforme du code de justice administrative) · 2022 (réforme de la haute fonction publique, INSP remplace l'ENA).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>Qualité normative</strong> : le CE garantit la cohérence juridique des textes</li>\n<li><strong>Droit UE</strong> : le CE s'articule avec la CJUE</li>\n<li><strong>Juridictions ordinaires</strong> : Tribunal des conflits en cas de litige de compétence</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<p>Double casquette conseiller/juge créant un risque d'impartialité perçu, délais restant longs malgré les efforts, corps historiquement issu de l'ENA avec un débat sur sa diversification.</p>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Dialogue avec la CJUE (renvois préjudiciels fréquents), adaptation à la jurisprudence de la Cour EDH, réseau européen des Conseils d'État (ACA-Europe).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Maintenir la qualité des avis face à l'inflation normative, réduire les délais de jugement sans nuire à la qualité des décisions.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : statu quo + efforts d'amélioration des délais</p>\n<p><strong>Scénario 2</strong> : séparation entre fonctions consultatives et juridictionnelles</p>\n<p><strong>Scénario 3</strong> : chambre spécialisée commune CE/Cour de cassation pour le contentieux fiscal</p>\n<h3>13. Faisabilité</h3>\n<p>Séparation des fonctions : réforme culturelle et organisationnelle profonde, possible par décret.</p>\n<h3>14. Temporalité</h3>\n<p>Court terme : réduction des délais. Moyen terme : réforme de la structure.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : la double casquette conseiller/juge du CE est une spécificité française qui soulève des questions d'impartialité.</p>\n<p><strong>Recommandation</strong> : maintenir la double fonction mais renforcer les écrans entre sections consultatives et contentieuses, investir dans la réduction des délais.</p>\n<p><strong>Sources</strong> : conseil-etat.fr — Code de justice administrative — Rapports annuels du CE</p>"}, {"id": "35862af8e03f812baf04f6d7737b3950", "titre": "La fonction consultative du Conseil d'État : 6 sections, avis obligatoires et facultatifs", "theme": 1, "cat": "1.4.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le Conseil d'État exerce une double fonction : conseiller du gouvernement (avis sur les projets de loi et décrets) et juge administratif suprême. La fonction consultative est méconnue mais essentielle.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Articles 38, 39, 74-1 de la Constitution (avis obligatoires) · Code de justice administrative (art. L.112-1) · décret du 7 octobre 1985.</p>\n<h3>3. Les 6 Sections Administratives</h3>\n<p>Section de l'intérieur · section des finances · section sociale · section des travaux publics · section de l'administration · section du rapport et des études.</p>\n<h3>4. Les Avis Obligatoires</h3>\n<p>Projets de loi (plus de 100/an, publiés depuis 2014) · décrets en Conseil d'État (environ 250/an) · ordonnances de l'article 38.</p>\n<h3>5. Les Avis Facultatifs</h3>\n<p>Demandes du gouvernement sur des questions juridiques complexes, consultation possible pour les référendums (article 11), avis sur la communicabilité d'archives.</p>\n<h3>6. La Composition des Sections</h3>\n<p>Président de section (conseiller d'État expérimenté), membres (conseillers d'État, maîtres des requêtes, auditeurs), 5 à 15 membres par section.</p>\n<h3>7. La Force des Avis du Conseil d'État</h3>\n<p>Avis non publics par défaut (sauf depuis 2014 pour les projets de loi), influence considérable — peu de gouvernements vont contre l'avis (cas rare : Macron sur les retraites en 2023).</p>\n<h3>8. Données Clés</h3>\n<table><tr><th>Indicateur</th><th>Valeur 2024</th></tr><tr><td>Avis sur projets de loi</td><td>~100</td></tr><tr><td>Avis sur décrets</td><td>1 200</td></tr><tr><td>Conseillers d'État</td><td>200</td></tr></table>\n<h3>9. Les Avis Célèbres</h3>\n<p>Avis sur la loi sur le port du voile (2003), sur la réforme des retraites (2019, 2023, critiques notables), sur la loi immigration (2023, alerte ignorée), sur l'état d'urgence sanitaire (2020).</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>La fonction consultative du Conseil d'État est un atout démocratique sous-utilisé. Réformes : publication systématique des avis, suivi obligatoire (motivation des divergences par le gouvernement), ouverture aux observations citoyennes.</p>"}, {"id": "35862af8e03f81138f8ee93cc14783b3", "titre": "Les juridictions administratives : 42 TA, 9 CAA, référés et contentieux des étrangers", "theme": 1, "cat": "1.4.2", "html": "<h3>🔁 Lecture croisée — 10 août 2026</h3>\n<p>Depuis une page archivée sur le même sujet. Apports versés :</p>\n<p><strong>Typologie des recours</strong> : REP (recours pour excès de pouvoir, demande d'annulation, dispense de ministère d'avocat) vs plein contentieux (le juge réforme et indemnise, avocat requis) — distinction structurante expliquant une partie du volume de contentieux.</p>\n<p><strong>Volume du Conseil d'État</strong> : environ 12 000 affaires par an (millésime à confirmer).</p>\n<p><strong>Incohérence corrigée</strong> : la liste des CAA annonce 9 cours (la neuvième est Toulouse, créée en 2022).</p>\n<p><strong>Série chiffrée écartée</strong> : une page archivée portait des chiffres incompatibles avec cette fiche, probablement issus d'une confusion entre flux et stock, ou entre TA et CAA — aucun de ces chiffres n'est citable sans reprise sur le rapport public du Conseil d'État.</p>\n<h3>1. Définition & Cadre</h3>\n<p>Les Tribunaux Administratifs (TA, 42) et les Cours Administratives d'Appel (CAA, 9) constituent les juridictions inférieures de l'ordre administratif. Créés en 1953 (TA) et 1987 (CAA), ils traitent les litiges entre les administrations et les particuliers. Le Conseil d'État est juge en dernier ressort.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Code de justice administrative (CJA) · décret du 30 septembre 1953 (TA) · loi du 31 décembre 1987 (CAA) · article R.811-1 CJA.</p>\n<h3>3. Les Tribunaux Administratifs</h3>\n<p>42 TA en métropole et outre-mer, 1 200 magistrats. Matières : urbanisme, fonction publique, fiscal, étrangers (OQTF), marchés publics, police administrative.</p>\n<h3>4. Les Cours Administratives d'Appel</h3>\n<p>9 CAA : Bordeaux, Douai, Lyon, Marseille, Nancy, Nantes, Paris, Versailles, Toulouse (créée 2022). 350 magistrats, présidées par un conseiller d'État.</p>\n<h3>5. Le Conseil d'État (Cassation)</h3>\n<p>Juge en cassation des décisions des CAA, juge en premier et dernier ressort de certaines matières (décrets, ordonnances, élections régionales et européennes).</p>\n<h3>6. Les Référés Administratifs</h3>\n<p>Référé-liberté (atteinte grave à une liberté fondamentale, urgence 48h) · référé-suspension (suspension d'une décision) · référé-mesures utiles (mesures conservatoires).</p>\n<h3>7. Données Clés 2024</h3>\n<table><tr><th>Indicateur</th><th>Valeur</th></tr><tr><td>Affaires enregistrées TA</td><td>250 000/an</td></tr><tr><td>Affaires réglées TA</td><td>240 000/an</td></tr><tr><td>Délai moyen TA</td><td>9 mois</td></tr><tr><td>Affaires CAA</td><td>30 000/an</td></tr><tr><td>Délai moyen CAA</td><td>11 mois</td></tr><tr><td>Magistrats administratifs (total)</td><td>1 600</td></tr></table>\n<h3>8. Le Contentieux des Étrangers</h3>\n<p>35 % des affaires TA, souvent en urgence (OQTF), délais raccourcis (96h en rétention), spécialisation en juge unique.</p>\n<h3>9. Les Difficultés Structurelles</h3>\n<p>Engorgement (250 000 affaires/an), crise des effectifs, complexité croissante du droit administratif, pression du contentieux des étrangers.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>Les juridictions administratives sont sous-dotées. Réformes : recrutement renforcé, simplification des procédures, développement de la médiation administrative, dématérialisation accélérée (Télérecours).</p>"}, {"id": "35962af8e03f81c2ba36d90641e5bfe6", "titre": "Les grands arrêts du Conseil d'État (GAJA) : Blanco, Nicolo, Grande Synthe", "theme": 1, "cat": "1.4.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les grands arrêts du Conseil d'État ont façonné le droit administratif français depuis l'arrêt Blanco (1873) : autonomie du droit administratif, responsabilité de la puissance publique, principes généraux du droit, service public, contrôle des actes administratifs. Cette jurisprudence est compilée dans le GAJA, ouvrage de référence.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi du 24 mai 1872 (autonomie de la justice administrative) · décret-loi du 30 septembre 1953 (TA) · loi du 31 décembre 1987 (CAA) · Code de justice administrative.</p>\n<h3>3. Les Arrêts Fondateurs (XIXe-XXe)</h3>\n<p>Blanco (TC, 1873, autonomie du droit administratif) · Cadot (CE, 1889, fin de la « justice retenue ») · Casanova (1901) · Terrier (1903, compétence du juge administratif sur les services publics).</p>\n<h3>4. Les Arrêts Sur la Responsabilité</h3>\n<p>Cames (1895, responsabilité sans faute) · Couitéas (1923, rupture d'égalité devant les charges publiques) · Bianchi (1993, risque thérapeutique hospitalier).</p>\n<h3>5. Les Arrêts Sur le Service Public</h3>\n<p>Bac d'Éloka (1921, distinction SPA/SPIC) · Caisse primaire (1938, critères du service public).</p>\n<h3>6. Les Arrêts Sur les PGD</h3>\n<p>Aramu (1945, premiers principes généraux du droit, droits de la défense) · Dame Lamotte (1950, recours pour excès de pouvoir toujours possible).</p>\n<h3>7. Les Arrêts Contemporains</h3>\n<p>Nicolo (1989, contrôle de conventionnalité) · Cohn-Bendit (1978) · Commune de Morsang-sur-Orge (1995, dignité humaine) · Sarran (1998, Constitution supérieure aux traités en droit interne) · Grande Synthe (2020-2021, première décision contraignante en matière climatique).</p>\n<h3>8. Les Arrêts sur les Libertés</h3>\n<p>Benjamin (1933, proportionnalité liberté/ordre public) · Les Films Lutetia (1959, police du cinéma).</p>\n<h3>9. La Méthode du Conseil d'État</h3>\n<p>Motivation concise jusqu'en 2018 ; depuis 2019, motivation enrichie obligatoire, décisions plus longues et pédagogiques.</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>Le CE est un législateur négatif dont la jurisprudence influence le droit administratif européen, avec un rôle accru en matière climatique.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Maintenir le pouvoir créateur du CE, généraliser la motivation enrichie, accélérer les délais (objectif 6 mois en cassation), transparence des dossiers.</p>"}, {"id": "35962af8e03f814d9bc2c8ebf5e99b30", "titre": "Les référés administratifs : liberté, suspension, mesures utiles et référés spécialisés", "theme": 1, "cat": "1.4.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les procédures de référé administratif permettent au juge administratif de prendre des mesures urgentes en quelques jours, voire quelques heures. Créées par la loi du 30 juin 2000, elles ont révolutionné la justice administrative. Trois référés principaux : liberté, suspension, mesures utiles.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi n° 2000-597 du 30 juin 2000 · Code de justice administrative (livre V, art. L. 521-1 et suivants).</p>\n<h3>3. Le Référé-Liberté (Article L. 521-2 CJA)</h3>\n<p>Conditions : atteinte grave et manifestement illégale à une liberté fondamentale, urgence. Délai : 48 heures, juge unique. Libertés reconnues : aller et venir, manifester, commerce et industrie, asile, vie familiale, présomption d'innocence, dignité humaine.</p>\n<h3>4. Le Référé-Suspension (Article L. 521-1 CJA)</h3>\n<p>Conditions : recours au fond déjà déposé, doute sérieux sur la légalité, urgence. Effet : suspension de l'exécution de la décision attaquée.</p>\n<h3>5. Le Référé-Mesures Utiles (Article L. 521-3 CJA)</h3>\n<p>Conditions : urgence, pas d'obstacle à l'exécution d'une décision administrative. Pouvoirs : mesures conservatoires, constatations.</p>\n<h3>6. Les Référés Spécialisés</h3>\n<p>Référé-précontractuel et référé contractuel (marchés publics) · référé fiscal · référé instruction.</p>\n<h3>7. Données Clés 2024</h3>\n<table><tr><th>Indicateur</th><th>Valeur</th></tr><tr><td>Référés tous TA</td><td>~50 000/an</td></tr><tr><td>Référé-liberté (TA + CE)</td><td>~5 000/an</td></tr><tr><td>Taux de succès</td><td>25 %</td></tr><tr><td>Délai moyen référé-liberté</td><td>32 heures</td></tr></table>\n<h3>8. Les Affaires Emblématiques</h3>\n<p>Burkini (2016, suspension de l'arrêté anti-burkini) · restaurants Covid (2020) · affaires climatiques (Notre-Dame-des-Landes) · mineurs migrants (référés multiples 2018-2024).</p>\n<h3>9. Comparaisons étrangères</h3>\n<p>Allemagne (einstweiliger Rechtsschutz) · Royaume-Uni (judicial review) · Italie (sospensione cautelare).</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>Les référés ont rendu la justice administrative réactive, outil clé dans la défense des libertés contre l'administration, accélérés par la pratique du Covid.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Maintenir et renforcer les référés, généraliser le délai de 24h pour le référé-liberté, envisager un référé-environnement, transparence des décisions, formation continue des juges référendaires.</p>"}, {"id": "35962af8e03f81b38937fce4af3b211d", "titre": "L'organisation du Conseil d'État : sections, formations et magistrats", "theme": 1, "cat": "1.4.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le Conseil d'État est organisé en sections spécialisées et formations de jugement, reflétant sa double fonction consultative et juridictionnelle.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Code de justice administrative (livre I) · décret du 30 juillet 1963 · loi du 24 mai 1872 · ordonnance du 31 juillet 1945.</p>\n<h3>3. La Direction du Conseil d'État</h3>\n<p>Vice-président (plus haut magistrat, le Premier ministre étant président nominal sans jamais présider) : Didier-Roland Tabuteau depuis septembre 2022, mandat de 5 ans renouvelable.</p>\n<h3>4. Les Sections Administratives</h3>\n<p>6 sections : intérieur, finances, travaux publics, sociale, administration, études/prospective/coopération. Volumétrie 2024 : 1 200 avis rendus (200 sur projets de loi, 800 sur décrets, 200 divers).</p>\n<h3>5. La Section du Contentieux</h3>\n<p>10 sous-sections spécialisées, formations de jugement (sous-section seule, sous-sections réunies, section du contentieux, assemblée du contentieux). Volumétrie : 10 000 décisions/an.</p>\n<h3>6. Les Formations Spécialisées</h3>\n<p>Section sociale (droit social, environnement, santé) · section des études (rapports thématiques) · section de la coopération (droit comparé).</p>\n<h3>7. Les Membres du Conseil d'État</h3>\n<p>Conseillers d'État en service ordinaire et extraordinaire, maîtres des requêtes, auditeurs. Effectif total : environ 230 membres en service, plus 1 200 magistrats des TA/CAA.</p>\n<h3>8. Les Recrutements</h3>\n<p>INSP (ex-ENA, 8-12 places/an) · tour extérieur (30 % des conseillers, magistrats/professeurs/hauts fonctionnaires, nomination en Conseil des ministres, critiqué comme politisé) · magistrats TA/CAA (concours CFRA).</p>\n<h3>9. Les Outils Modernes</h3>\n<p>Télérec (téléprocédure), Sagace (suivi des dossiers), Ariane (base jurisprudentielle open data).</p>\n<h3>10. Le Budget du CE</h3>\n<p>2024 : 470 M€ (CE + TA + CAA), dont 75 % de personnel.</p>\n<h3>11. Les Débats</h3>\n<p>Séparation consultatif/juridictionnel (même structure, « muraille de Chine » entre membres ayant rendu un avis et ceux jugeant, validée par la CEDH depuis Procola 1995). Charge de travail en augmentation continue.</p>\n<h3>12. Comparaisons étrangères</h3>\n<p>Italie (Consiglio di Stato, même structure) · Belgique (même structure) · Pays-Bas (séparation plus stricte) · Allemagne (pas d'équivalent).</p>\n<h3>13. Enjeux Stratégiques</h3>\n<p>Le CE est un « laboratoire institutionnel » unique dont l'organisation reflète sa double mission, avec un risque de politisation lié au tour extérieur.</p>\n<h3>14. Synthèse Décisionnelle</h3>\n<p>Maintenir la structure, renforcer la séparation consultatif/juridictionnel, diminuer le tour extérieur (15 % max), transparence sur les désignations, audit indépendant des délais.</p>"}, {"id": "35962af8e03f810694ffeb6220c718f5", "titre": "Le rapporteur public (ex-commissaire du gouvernement) : fonction et conclusions", "theme": 1, "cat": "1.4.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le rapporteur public (anciennement « commissaire du gouvernement ») est une figure singulière du Conseil d'État : il présente publiquement, en séance, son analyse indépendante du dossier et propose une solution à la formation de jugement.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Code de justice administrative, art. R. 122-12 et R. 711-1 à R. 733-1 · loi du 4 août 2016 (changement de nom) · décret du 7 janvier 2009 · arrêt Kress c/France (CEDH, 2001).</p>\n<h3>3. La Fonction du Rapporteur Public</h3>\n<p>Examen indépendant du dossier après le rapport du juge rapporteur, rédaction de conclusions publiques, présentation orale en séance, pas de pouvoir décisionnel, voix non délibérative.</p>\n<h3>4. Les Conclusions du Rapporteur Public</h3>\n<p>Contenu type : faits, état du droit, analyse des moyens, solution proposée. Publication sur Ariane, recueil Lebon, revues juridiques. 80 à 90 % des conclusions sont suivies par le juge.</p>\n<h3>5. Le Changement de Nom 2009</h3>\n<p>« Commissaire du gouvernement » devenu « rapporteur public » pour clarifier qu'il ne représente pas le gouvernement, changement réel en 2009 puis légal en 2016.</p>\n<h3>6. La Polémique Kress c/France</h3>\n<p>Arrêt CEDH du 7 juin 2001 condamnant la France pour la présence du commissaire du gouvernement à la délibération (violation de l'égalité des armes). Compromis 2006 : le rapporteur public n'assiste plus au délibéré sauf demande des parties.</p>\n<h3>7. Les Rapporteurs Publics Célèbres</h3>\n<p>Léon Blum, Marceau Long, Bruno Genevois (Cohn-Bendit 1978), Marie-Christine Kessler (Nicolo 1989).</p>\n<h3>8. La Formation</h3>\n<p>Sélection parmi les magistrats du CE, affectation par le président de section, durée de 3-4 ans, 30-50 dossiers par an et par rapporteur.</p>\n<h3>9. La Reception</h3>\n<p>Très respectées par les magistrats (80 % suivies), outil de prédiction pour les avocats, référence majeure pour la doctrine.</p>\n<h3>10. Comparaisons étrangères</h3>\n<p>Italie (Avvocato dello Stato) · Belgique (auditeur, même fonction) · pas d'équivalent en Allemagne.</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Le rapporteur public est une institution unique en Europe garantissant la qualité de la jurisprudence administrative, avec une transparence réelle.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Maintenir l'institution, publier automatiquement toutes les conclusions, faciliter la note en réplique des parties.</p>"}, {"id": "35362af8e03f81919700e21038ebc604", "titre": "La Cour des comptes : missions et pouvoirs", "theme": 1, "cat": "1.4.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>La Cour des comptes est la juridiction financière suprême française. Créée en 1807, elle a pour mission de contrôler les finances publiques : vérification des comptes, évaluation des politiques publiques, certification des comptes de l'État.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 47-2 de la Constitution (depuis 2008) · Code des juridictions financières · loi du 26 janvier 1984 · LOLF 2001 · 7 chambres spécialisées · 18 chambres régionales des comptes.</p>\n<h3>3. Fonctionnement Concret</h3>\n<p>Certification annuelle des comptes de l'État, rapports publics thématiques, jugement des comptables publics, enquêtes à la demande du Parlement.</p>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<p><strong>Premier président (depuis 2020) : Pierre Moscovici</strong> — ancien commissaire européen aux Affaires économiques, ancien ministre de l'Économie sous Hollande, profil politique pour un poste juridictionnel, auteur de rapports très commentés sur la dette publique.</p>\n<table><tr><th>Rapport</th><th>Année</th><th>Conclusions</th></tr><tr><td>Hôpitaux</td><td>2021</td><td>T2A inadaptée</td></tr><tr><td>Défense</td><td>2022</td><td>LPM sous-exécutée historiquement</td></tr><tr><td>Apprentissage</td><td>2023</td><td>Explosion non maîtrisée (+50 Md€)</td></tr><tr><td>Finances locales</td><td>2024</td><td>Crise des départements (DMTO effondrées)</td></tr><tr><td>Dette publique</td><td>2024</td><td>Trajectoire insoutenable, ajustement ~50 Md€ nécessaire</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Budget : environ 220 M€/an. Personnel : environ 1 800 agents (Cour + CRC), environ 200 membres.</p>\n<h3>6. Audit Factuel</h3>\n<p>Environ 40 rapports publics par an. Certification « avec réserves » depuis 2006 (jamais sans réserve). Rapport 2024 : déficit public à 6,1 % du PIB. Réforme 2023 : création de la responsabilité financière unifiée.</p>\n<h3>7. Chronologie</h3>\n<p>1807 (création par Napoléon) · 1984 (réforme majeure) · 2001 (LOLF, certification des comptes) · 2008 (révision constitutionnelle, renforcement du rôle) · 2023 (réforme CDBF).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>LOLF</strong> : cadre de la certification et du suivi budgétaire</li>\n<li><strong>Parlement</strong> : destinataire des rapports, peut commander des missions</li>\n<li><strong>Gouvernement</strong> : peut ignorer les recommandations (pas d'obligation de suivi)</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<p>Recommandations souvent ignorées, taux de suivi estimé à environ 40 % (chiffre à recouper avant citation ferme), indépendance des magistrats nommés par le gouvernement.</p>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Cour des comptes européenne (partenaire, audite les fonds UE en France), INTOSAI, engagement français au Pacte de stabilité.</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Renforcer l'impact des recommandations sur la décision politique, adapter les méthodes d'audit aux nouvelles formes d'action publique.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : statu quo</p>\n<p><strong>Scénario 2</strong> : obligation de réponse du gouvernement dans un délai fixé</p>\n<p><strong>Scénario 3</strong> : renforcement des pouvoirs de sanction</p>\n<h3>13. Faisabilité</h3>\n<p>Obligation de réponse possible par loi organique ; renforcement des sanctions nécessite une révision constitutionnelle.</p>\n<h3>14. Temporalité</h3>\n<p>Court terme : amélioration du suivi des recommandations. Moyen terme : réforme législative des pouvoirs.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : les recommandations de la Cour des comptes sont trop souvent ignorées, réduisant son impact réel sur la gestion des finances publiques.</p>\n<p><strong>Recommandation</strong> : imposer légalement une réponse motivée du gouvernement dans les 6 mois suivant chaque rapport public.</p>\n<p><strong>Sources</strong> : ccomptes.fr — Code des juridictions financières — Rapport Cour des comptes 2024 — LOLF</p>"}, {"id": "35862af8e03f811ba629edd0b13356fd", "titre": "Les Chambres régionales des comptes (CRTC) : organisation et rôle", "theme": 1, "cat": "1.4.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les Chambres régionales et territoriales des comptes (CRTC) sont les juridictions financières de proximité. Créées par les lois de décentralisation de 1982, elles contrôlent les comptes et la gestion des collectivités territoriales et de leurs établissements publics.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Code des juridictions financières · loi du 2 mars 1982 (décentralisation) · loi du 13 décembre 2011 (réforme) · loi NOTRe (2015).</p>\n<h3>3. Composition</h3>\n<p>17 CRTC en France : 13 métropolitaines + 4 outre-mer. Magistrats : 270 magistrats du siège + 350 vérificateurs + 1 200 personnels.</p>\n<h3>4. Compétences</h3>\n<p>Contrôle juridictionnel (jugement des comptes), contrôle de la gestion (rapports d'observations, RODP), contrôle budgétaire (alerte préfectorale).</p>\n<h3>5. Données Clés</h3>\n<p>Collectivités contrôlées par an : environ 700. Rapports publiés par an : environ 600. Budget total contrôlé : 250 Md€.</p>\n<h3>6. Nouveau Régime de Responsabilité Financière (2023)</h3>\n<p>Unification entre comptables et ordonnateurs, compétence transférée à la Cour des comptes (chambre du contentieux), sanctions par amendes et mise en cause personnelle.</p>\n<h3>7. Synthèse Décisionnelle</h3>\n<p>Les CRTC sont essentielles à la transparence financière des collectivités. Réformes : publication open data des rapports d'observations, renforcement des effectifs, sanctions effectives.</p>"}, {"id": "35862af8e03f81748030e2c542f7b46c", "titre": "La certification des comptes de l'État et de la Sécu : depuis 2006-2007", "theme": 1, "cat": "1.4.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Depuis la LOLF du 1er août 2001, la Cour des comptes est chargée de certifier les comptes de l'État (depuis 2006) et ceux des organismes de Sécurité sociale (depuis 2007). Cette mission rapproche la Cour de l'audit financier moderne.</p>\n<h3>2. Cadre Juridique</h3>\n<p>LOLF (1er août 2001) · LOLFSS (2 août 2005) · Code des juridictions financières · normes IPSAS.</p>\n<h3>3. La Certification des Comptes de l'État</h3>\n<p>Examen annuel publié en mai, bilan d'environ 3 000 Md€ d'actifs. Types d'opinion : sans réserve, avec réserves (le plus courant), défavorable, refus de certifier. Évolution : 13 réserves en 2006, 4 en 2024, grâce notamment au système Chorus.</p>\n<h3>4. Les Réserves Récurrentes</h3>\n<p>Patrimoine immobilier de l'État (valorisation incertaine), engagements hors bilan (retraites, garanties, environ 4 000 Md€ estimés), provisionnement insuffisant des risques, consolidation incomplète des opérateurs.</p>\n<h3>5. La Certification des Comptes de la Sécu</h3>\n<p>Depuis 2007, 5 régimes principaux (CNAM, CNAV, CNAF, ACOSS, CCMSA), volume de 600 Md€ de prestations. Bilan 2024 : CNAM refus de certifier (3e année consécutive, cause T2A), CNAV et CNAF avec réserves, ACOSS sans réserve.</p>\n<h3>6. Le Processus</h3>\n<p>Audit préparatoire annuel, échantillonnage des opérations, analyse des procédures, rapport préliminaire, réponses des ministères, acte de certification définitif.</p>\n<h3>7. Les Enjeux</h3>\n<p>Crédibilité des comptes publics français (notation, marchés), pilotage des politiques publiques, confiance des citoyens.</p>\n<h3>8. Données Clés</h3>\n<table><tr><th>Indicateur</th><th>Valeur</th></tr><tr><td>Comptes de l'État (actif)</td><td>3 000 Md€</td></tr><tr><td>Engagements hors bilan</td><td>4 000 Md€</td></tr><tr><td>Magistrats Cour des comptes</td><td>350</td></tr><tr><td>Coût de la certification</td><td>30 M€/an</td></tr></table>\n<h3>9. Les Innovations Récentes</h3>\n<p>Open data des certificats, visualisation interactive, audits thématiques (cybersécurité du SI comptable).</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>La certification est une révolution comptable. Restent à résoudre : transparence des engagements hors bilan, consolidation complète des opérateurs, modernisation de Chorus.</p>"}, {"id": "35962af8e03f817f97bbd27bea6ea651", "titre": "Les magistrats financiers : statut, hiérarchie et Premier président", "theme": 1, "cat": "1.4.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les magistrats financiers sont les juges spécialisés qui composent la Cour des comptes et les Chambres régionales des comptes (environ 700 au total). Ils jugent les comptes des comptables publics, certifient les comptes de l'État et de la Sécu, contrôlent la régularité et l'efficacité de la dépense publique.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Code des juridictions financières · loi du 22 juin 1967 · décret du 12 juillet 1985 · article 64 de la Constitution · LOLF (2001).</p>\n<h3>3. Le Statut</h3>\n<p>Inamovibilité comme les magistrats du siège. Recrutement par l'INSP (ex-ENA), concours spécifique, tour extérieur. Hiérarchie : auditeur (30), conseiller référendaire (200), conseiller-maître (200), président de chambre (7), Premier président (1).</p>\n<h3>4. Le Premier Président de la Cour des Comptes</h3>\n<p>Pierre Moscovici (depuis juin 2020), nommé par décret du PR en Conseil des ministres, 7e personnage de l'État. Prédécesseurs : Didier Migaud (2010-2020), Philippe Séguin (2004-2010).</p>\n<h3>5. Le Procureur Général près la Cour des Comptes</h3>\n<p>Magistrat du parquet, saisit les chambres pour avis ou jugement, saisine de la 7e chambre. Procureur général 2024 : Christian Charpy (depuis 2017).</p>\n<h3>6. Les Chaînes de Contrôle</h3>\n<p>7 chambres thématiques (finances publiques, affaires militaires, éducation/recherche, affaires étrangères, politiques sociales, économie/industrie, entreprises publiques) + chambre du contentieux.</p>\n<h3>7. Les Modes de Saisine</h3>\n<p>Saisine d'office (la plus fréquente), saisine par les pouvoirs publics (PM, présidents AN/Sénat, commissions des finances), saisine citoyenne (rare).</p>\n<h3>8. Les Sanctions Possibles</h3>\n<p>Comptables publics : mise en débet, amendes, inscription au B2. Réforme 2022 : suppression de la distinction comptable/ordonnateur, création de l'infraction unique de « faute grave de gestion publique », 7e chambre compétente.</p>\n<h3>9. La Déontologie</h3>\n<p>Déclaration de patrimoine et d'intérêts (HATVP), déport en cas de conflit d'intérêt, mobilité obligatoire, examen des sorties vers le privé par la HATVP.</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>Les magistrats financiers sont la « garde rapprochée des finances publiques », avec une indépendance préservée mais une nomination politique du Premier président.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Renforcer les effectifs (+50 magistrats sur 5 ans), diversifier le recrutement, transparence accrue de la nomination du Premier président, renforcer la formation en évaluation des politiques publiques.</p>"}, {"id": "35962af8e03f81f48333ce52f6c58321", "titre": "La responsabilité financière des gestionnaires publics : suppression CDBF et 7e chambre CC", "theme": 1, "cat": "1.4.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>La Cour de discipline budgétaire et financière (CDBF) jugeait les ordonnateurs publics ayant commis des fautes de gestion. Créée en 1948, elle a été supprimée par la réforme du 30 décembre 2021 (opérationnelle au 1er janvier 2023) créant un régime unifié de responsabilité financière. La 7e chambre de la Cour des comptes est désormais compétente.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi du 25 septembre 1948 (création CDBF) · ordonnance du 23 mars 2022 (suppression) · Code des juridictions financières (art. L. 313-1 et s.) · décret du 22 décembre 2022.</p>\n<h3>3. La Réforme du Régime de Responsabilité Financière (2021)</h3>\n<p>Avant 2022 : distinction comptable (mise en débet par la CC) / ordonnateur (amende par la CDBF), faible nombre de poursuites (~50/an). Après 2022 : régime unifié, une seule infraction (« faute grave »), une seule juridiction (7e chambre CC).</p>\n<h3>4. La 7e Chambre de la Cour des Comptes</h3>\n<p>Composition : 6 conseillers-maîtres, présidée par un président de chambre. Compétence : faute grave de gestion publique, manquements aux règles de la commande publique. Procédure : saisine par le Procureur général, instruction, audience publique, appel possible.</p>\n<h3>5. La « Faute Grave » : Définition</h3>\n<p>Manquement caractérisé aux règles de la commande publique, engagement irrégulier de la dépense, non-respect des règles de cumul d'emploi, privation des droits du Trésor public.</p>\n<h3>6. Sanctions</h3>\n<p>Amende jusqu'à 6 mois de salaire brut, inscription au B2 possible, réparation du préjudice financier.</p>\n<h3>7. Bilan 2023-2024</h3>\n<p>30 affaires jugées en 2023, 50 en 2024. Profils concernés : maires, présidents d'EPCI, directeurs d'hôpital, directeurs d'établissement public.</p>\n<h3>8. Différence avec la Justice Pénale</h3>\n<p>Justice financière : faute grave sans élément intentionnel nécessairement, sanctions disciplinaires/administratives. Justice pénale : infractions pénales (prise illégale d'intérêts, favoritisme), sanctions pénales. Cumul possible.</p>\n<h3>9. Critères de la Réforme</h3>\n<p>Avantages : simplification, cohérence, effet dissuasif. Limites observées : trop récent pour un bilan définitif, délais d'instruction longs, sanctions jugées encore trop légères.</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>La réforme de 2022 unifie un dispositif disparate, avec une pression accrue sur les ordonnateurs publics et un risque de « gestion défensive ».</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Maintenir le régime réformé, évaluation à 5 ans (2027), accompagnement des ordonnateurs (formation), transparence des décisions, échelle graduée des sanctions.</p>"}, {"id": "35962af8e03f8172a505fdd20f42000c", "titre": "La LOLF et la certification des comptes : révolution budgétaire et rôle CC", "theme": 1, "cat": "1.4.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>La LOLF du 1er août 2001 a révolutionné la gestion publique française. Elle a donné à la Cour des comptes un rôle central dans l'évaluation, la certification et le contrôle de la performance budgétaire. Complétée par la LOLFSS (2005) pour la Sécurité sociale.</p>\n<h3>2. Cadre Juridique</h3>\n<p>LOLF n° 2001-692 du 1er août 2001 · LOLFSS du 2 août 2005 · loi organique du 17 décembre 2012 · loi organique du 28 décembre 2021 (modernisation).</p>\n<h3>3. Les Apports de la LOLF</h3>\n<p>Avant : budget par chapitres (~850), logique de moyens, pas d'évaluation. Après : budget par missions/programmes/actions, logique de performance, crédits pluriannuels, justification au premier euro.</p>\n<h3>4. La Structure Budgétaire LOLF</h3>\n<p>Missions (40+, votées par le Parlement) · programmes (~120, pilotés par un responsable) · actions (déclinaison opérationnelle) · indicateurs de performance (600+, suivis dans les rapports annuels de performance).</p>\n<h3>5. La Certification des Comptes</h3>\n<p>Article 27 de la LOLF : certification annuelle par la Cour des comptes, premier exercice en 2006. Bilan des réserves : 13 en 2006, 7 en 2010, 5 en 2015, 4 en 2020 et 2024 — amélioration progressive mais réserves persistantes.</p>\n<h3>6. La Certification Sécurité Sociale</h3>\n<p>Depuis la LOLFSS 2005, certification séparée des branches (maladie, vieillesse, famille, AT-MP, autonomie), premier exercice en 2007, réserves récurrentes sur la qualité des données.</p>\n<h3>7. Les Conférences Budgétaires</h3>\n<p>Calendrier annuel de février à décembre, rôle de la Cour des comptes (pré-rapport sur l'exécution, avis sur le PLF).</p>\n<h3>8. Les Prévisions Pluriannuelles</h3>\n<p>Loi de programmation des finances publiques (LPFP, cadre quinquennal), loi de programmation militaire (LPM 2024-2030, 413 Md€).</p>\n<h3>9. Les Articles Clés LOLF</h3>\n<p>Art. 7 (missions/programmes/actions), art. 27 (certification CC), art. 51 (débat d'orientation budgétaire).</p>\n<h3>10. Les Critiques</h3>\n<p>Justification au premier euro souvent théorique, trop d'indicateurs, pluriannualité limitée, dépenses fiscales mal traitées (~100 Md€/an).</p>\n<h3>11. Comparaisons étrangères</h3>\n<p>USA (Performance.gov) · Royaume-Uni (NAO) · Allemagne (Bundesrechnungshof, Schuldenbremse) · Suède (Riksrevisionen).</p>\n<h3>12. Enjeux Stratégiques</h3>\n<p>La LOLF a transformé la gestion publique mais reste perfectible ; le pilotage par la performance reste artificiel pour de nombreux programmes.</p>\n<h3>13. Synthèse Décisionnelle</h3>\n<p>Approfondir la LOLF : véritable budget pluriannuel, traitement complet des dépenses fiscales, audit de performance renforcé, suppression des programmes sans pilotage réel.</p>"}, {"id": "35962af8e03f819bb9e6f6c857dd47e3", "titre": "Le contrôle européen : Cour des comptes européenne (ECA) et coopération", "theme": 1, "cat": "1.4.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>La Cour des comptes européenne (ECA), basée à Luxembourg, est l'institution de l'UE chargée du contrôle externe des comptes européens. Elle coopère avec la Cour des comptes française notamment pour le contrôle des fonds européens en France.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Articles 285-287 TFUE · règlement financier 2018/1046 · convention OLAF/CC française sur les fraudes européennes.</p>\n<h3>3. La Cour des Comptes Européenne (ECA)</h3>\n<p>27 membres (1 par État), mandat de 6 ans renouvelable, membre français Annemie Turtelboom (depuis 2024). Mission : audit des recettes et dépenses de l'UE. Effectifs : 900 personnes, budget 165 M€/an, siège à Luxembourg.</p>\n<h3>4. Les Rapports de l'ECA</h3>\n<p>Rapport annuel sur le budget UE (octobre/novembre, déclaration d'assurance) · rapports spéciaux (30-40/an, thématiques comme la PAC ou Erasmus+).</p>\n<h3>5. La Déclaration d'Assurance (DAS)</h3>\n<p>Avis favorable sur la fiabilité des comptes en 2023, mais réserves sur la légalité/régularité des paiements (taux d'erreur estimé à 4,2 %, en augmentation).</p>\n<h3>6. Les Fonds Européens en France</h3>\n<p>Cadre 2021-2027 : environ 16 Md€/an de fonds européens (FEDER, FSE+, FEAGA, FEADER, FEAMPA). Plan de relance : facilité pour la reprise et la résilience, 39,4 Md€ pour la France sur 2021-2026.</p>\n<h3>7. La Coopération ECA / Cour des Comptes France</h3>\n<p>Audits parallèles, volume audité de 16 Md€/an de fonds UE en France et 22 Md€ de cotisation française au budget UE.</p>\n<h3>8. La Lutte Contre la Fraude</h3>\n<p>OLAF (Office européen de lutte antifraude, 1 000+ cas traités par an) · EPPO (Parquet européen, opérationnel depuis juin 2021, environ 50 cas en France par an).</p>\n<h3>9. La Politique de Cohésion</h3>\n<p>Audit récurrent des fonds structurels, conditionnalité État de droit depuis 2020, bilan France globalement bon sans suspension.</p>\n<h3>10. Les Innovations Récentes</h3>\n<p>Développement des audits de performance (vs régularité), open audit (publication ouverte des données).</p>\n<h3>11. Comparaisons étrangères</h3>\n<p>USA (GAO) · Royaume-Uni (NAO) · Allemagne (Bundesrechnungshof).</p>\n<h3>12. Enjeux Stratégiques</h3>\n<p>L'audit européen renforce la gouvernance ; la coopération ECA/CC française est efficace mais la lutte antifraude reste perfectible.</p>\n<h3>13. Synthèse Décisionnelle</h3>\n<p>Renforcer la coopération par des audits conjoints systématiques, accès ouvert des audits, sanctions renforcées pour irrégularités, consolidation EPPO/OLAF.</p>"}, {"id": "39762af8e03f81a9b65ffcdeba0248ca", "titre": "Les rapports publics de la Cour des comptes : typologie, contradictoire et suivi des recommandations", "theme": 1, "cat": "1.4.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les rapports publics constituent le principal levier d'influence de la Cour des comptes. Dépourvue de pouvoir d'injonction sur le gouvernement, la Cour agit par la publicité de ses constats — c'est le principal mécanisme de la « magistrature d'influence » consacrée par l'article 47-2 de la Constitution.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 47-2 de la Constitution (2008) · Code des juridictions financières (art. L. 143-1 à L. 143-11) · LOLF art. 58 · loi organique n° 2005-881 (LOLFSS, RALFSS).</p>\n<h3>3. Typologie des rapports</h3>\n<table><tr><th>Rapport</th><th>Périodicité</th><th>Destinataire</th></tr><tr><td>Rapport public annuel (RPA)</td><td>Février/mars</td><td>PR, Parlement, public</td></tr><tr><td>Rapport sur les finances publiques (RSPFP)</td><td>Juin/juillet</td><td>Parlement (préparation PLF)</td></tr><tr><td>Rapport sur l'exécution du budget</td><td>Mai</td><td>Parlement (loi de règlement)</td></tr><tr><td>Certification des comptes de l'État</td><td>Mai</td><td>Parlement</td></tr><tr><td>RALFSS</td><td>Mai</td><td>Parlement (PLFSS)</td></tr><tr><td>Référés du Premier président</td><td>Ponctuels</td><td>Ministres (réponse sous 2 mois)</td></tr></table>\n<h3>4. Fonctionnement concret</h3>\n<p>Procédure contradictoire : instruction par une chambre, observations provisoires envoyées aux administrations, réponses obligatoires sous 2 mois, délibéré définitif, publication avec les réponses en annexe. Depuis 2012, la Cour publie un taux de mise en œuvre de ses recommandations (environ 70-75 % totalement ou partiellement suivies à 3 ans).</p>\n<h3>5. Acteurs & institutions</h3>\n<p>Premier président (Pierre Moscovici depuis 2020), Procureur général, 6 chambres thématiques, CRTC, commissions des finances de l'AN et du Sénat, Haut Conseil des finances publiques (HCFP).</p>\n<h3>6. Finances & moyens</h3>\n<p>Budget de la Cour et des CRTC : environ 250 M€/an, environ 1 800 agents dont 650 magistrats financiers.</p>\n<h3>7. Données clés</h3>\n<p>Taux de suivi des recommandations : environ 70-75 % à 3 ans. Réponse ministérielle obligatoire sous 2 mois pour les référés.</p>\n<h3>8. Historique</h3>\n<p>1807 (création) · 1938 (premier rapport public annuel) · 1982 (CRTC) · 2001 (LOLF, certification) · 2008 (constitutionnalisation à l'article 47-2) · 2012 (suivi systématique des recommandations) · 2023 (7e chambre).</p>\n<h3>9. 🔴 Rapports marquants 2025-2026</h3>\n<p>Rapport sur l'application des lois de financement de la Sécurité sociale (mai 2026) : alerte du 29 mai 2026 sur un risque d'aggravation du déficit social de ~3 Md€ lié au choc énergétique de la guerre USA-Iran, pression partiellement desserrée après l'accord du 14 juin 2026. Rappel : déficit des régimes de base 2025 à 21,6 Md€. Thèmes récurrents : soutenabilité de la dette (~5 % du PIB), efficience de la dépense fiscale, hôpitaux, transition écologique.</p>\n<h3>10. Dépendances</h3>\n<p>Qualité des données transmises, volonté politique de mise en œuvre (aucun pouvoir d'injonction), relais parlementaire et médiatique, articulation avec le HCFP et l'ECA.</p>\n<h3>11. Points de rupture</h3>\n<p>Absence de pouvoir contraignant, effet d'annonce du RPA éclipsant les rapports thématiques, 25-30 % des recommandations restant lettre morte, tension avec le débat politique sur les choix budgétaires.</p>\n<h3>12. Dimension européenne & internationale</h3>\n<p>Cour des comptes européenne (audits conjoints), semestre européen et procédure de déficit excessif, INTOSAI/EUROSAI. Comparaison : NAO britannique et GAO américain, liens plus directs avec le Parlement.</p>\n<h3>13. Enjeux stratégiques</h3>\n<p>Faire du rapport public un instrument de décision plutôt qu'un rituel médiatique, renforcer le suivi contraignant des recommandations, préserver l'indépendance dans un contexte de politisation du débat budgétaire.</p>\n<h3>14. Options politiques</h3>\n<p>Débat parlementaire obligatoire sur les suites données au RPA, pouvoir d'injonction limité, extension de la saisine citoyenne, renforcement des moyens des CRTC.</p>\n<h3>15. Temporalité</h3>\n<p>Février/mars (RPA), mai (certification, RALFSS), juin/juillet (RSPFP), automne (auditions parlementaires).</p>\n<h3>16. Synthèse décisionnelle</h3>\n<p>La Cour des comptes dispose d'un diagnostic sans équivalent mais d'aucun pouvoir pour l'imposer. Deux leviers peu coûteux en augmenteraient le rendement : un débat parlementaire annuel obligatoire sur les suites données, et faire du RSPFP de juin le document de cadrage du PLF. Dans le contexte 2026 (déficit ~5 % du PIB, procédure européenne de déficit excessif), l'écart entre la qualité du diagnostic et la faiblesse des suites est le principal enjeu institutionnel de la juridiction financière.</p>\n<p><strong>Sources</strong> : Constitution art. 47-2 — Code des juridictions financières — LOLF art. 58 — LOLFSS — Cour des comptes (rapport LFSS, 29 mai 2026) — Public Sénat</p>"}, {"id": "35362af8e03f8136b1e3cd33e3d6aa0c", "titre": "La Haute Cour & la Cour de Justice de la République (CJR)", "theme": 1, "cat": "1.4.4", "html": "<h3>1. Définition & Cadre</h3>\n<p>La Haute Cour est l'instance parlementaire compétente pour juger le Président de la République en cas de manquement à ses devoirs manifestement incompatible avec l'exercice de son mandat. La CJR juge les membres du gouvernement pour les crimes et délits commis dans l'exercice de leurs fonctions.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Haute Cour : articles 67-68 de la Constitution (révision 2007). CJR : articles 68-1 à 68-3. Loi organique de 1993 (organisation de la CJR). CJR : 15 membres (6 députés, 6 sénateurs, 3 magistrats). Immunité présidentielle (art. 67).</p>\n<h3>3. Fonctionnement Concret</h3>\n<p>Haute Cour : vote d'une motion par AN et Sénat à la majorité des 2/3, réunion du Parlement en Haute Cour, vote de destitution à la majorité des 2/3, notion de « manquement » non définie précisément.</p>\n<p>CJR : plainte devant la Commission des requêtes, transmission au Parquet national financier si recevable, instruction, jugement.</p>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>PR</td><td>Prévenu potentiel (Haute Cour)</td></tr><tr><td>Parlement réuni</td><td>Décide de la destitution</td></tr><tr><td>CJR</td><td>Juge les ministres</td></tr><tr><td>Commission des requêtes</td><td>Filtre les plaintes</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>CJR : budget limité (environ 1 M€), peu active. Haute Cour : structure virtuelle, activée seulement si nécessaire.</p>\n<h3>6. Audit Factuel</h3>\n<p>Haute Cour : jamais activée depuis 1958. CJR : créée en 1993, rare utilisation (Christine Lagarde, 2016, condamnée pour négligence mais dispensée de peine).</p>\n<h3>7. Chronologie</h3>\n<p>1958 (Haute Cour initiale, haute trahison uniquement) · 1993 (création de la CJR) · 2007 (révision, Haute Cour réformée) · 2016 (affaire Lagarde, 1re condamnation CJR).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>Volonté politique</strong> : la Haute Cour ne peut être activée qu'avec une large majorité parlementaire</li>\n<li><strong>Système pénal ordinaire</strong> : les ministres restent justiciables du droit commun après leurs fonctions</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<p>Impunité perçue de la CJR jugée clémente, définition vague du manquement présidentiel (risque de politisation), débat récurrent sur la suppression de la CJR.</p>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Comparable à l'impeachment américain mais procédure plus exigeante. La CJR est une spécificité française — la plupart des pays soumettent leurs ministres au droit commun.</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>L'égalité devant la justice exige que les gouvernants soient justiciables comme les citoyens ; la CJR crée une justice spéciale perçue comme plus clémente.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : maintien de la CJR et de la Haute Cour</p>\n<p><strong>Scénario 2</strong> : suppression de la CJR, renvoi au droit commun</p>\n<p><strong>Scénario 3</strong> : abaissement du seuil pour activer la Haute Cour</p>\n<h3>13. Faisabilité</h3>\n<p>Suppression de la CJR nécessitant une révision constitutionnelle, très débattue.</p>\n<h3>14. Temporalité</h3>\n<p>Réforme possible dans le cadre d'une révision institutionnelle globale.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : la CJR crée une justice d'exception perçue comme trop clémente ; la Haute Cour n'a jamais été utilisée.</p>\n<p><strong>Recommandation</strong> : supprimer la CJR et soumettre les ministres au droit commun avec un parquet spécialisé (PNF), maintenir la Haute Cour réformée comme ultime recours démocratique.</p>\n<p><strong>Sources</strong> : Articles 67-68-3 Constitution — Loi organique 1993 — Rapport Jospin 2012</p>"}, {"id": "35862af8e03f81cba2a9fbfc8999c40a", "titre": "La CJR : composition, affaires célèbres et réformes proposées", "theme": 1, "cat": "1.4.4", "html": "<h3>1. Définition & Cadre</h3>\n<p>La Cour de Justice de la République (CJR) juge les ministres pour les actes commis dans l'exercice de leurs fonctions. Créée en 1993 après l'affaire du sang contaminé, elle est composée de 12 parlementaires et 3 magistrats de la Cour de cassation. Critiquée pour ses peines symboliques, sa réforme est récurrente.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Articles 68-1 et 68-2 de la Constitution · loi organique du 23 novembre 1993 · réforme constitutionnelle de juillet 2008.</p>\n<h3>3. Composition</h3>\n<p>12 parlementaires (6 députés + 6 sénateurs) élus par leurs assemblées, 3 magistrats de la Cour de cassation, président magistrat de la Cour de cassation, mandat pour la durée de la législature.</p>\n<h3>4. La Saisine</h3>\n<p>Filtre par la Commission des requêtes (7 magistrats des trois juridictions suprêmes), très sévère (environ 1 plainte sur 100 transmise). Saisine par toute personne lésée ou par le procureur général.</p>\n<h3>5. La Procédure</h3>\n<p>Plainte → Commission des requêtes → Commission d'instruction (3 magistrats) → formation de jugement (12+3) → débats et jugement → pourvoi en cassation possible.</p>\n<h3>6. Les Affaires Célèbres Jugées</h3>\n<p>Sang contaminé (1999, Fabius et Dufoix relaxés, Hervé coupable mais dispensé de peine) · Crédit Lyonnais/Lagarde (2016, coupable de négligence, dispensée de peine) · Balkany (2020) · Buzyn (2022, classé sans suite sur la gestion du Covid).</p>\n<h3>7. Les Critiques</h3>\n<p>Peines symboliques, composition trop politique (parlementaires majoritaires), filtre trop sévère, conflit avec le principe d'égalité devant la justice.</p>\n<h3>8. Les Réformes Proposées</h3>\n<p>Projet Macron 2018 (suppression, transfert à la cour d'appel de Paris, abandonné) · Comité Balladur 2007 (suppression déjà proposée).</p>\n<h3>9. La Haute Cour</h3>\n<p>Différente de la CJR : compétente pour la destitution du Président (art. 68), composée de tous les parlementaires (925 membres), jamais saisie depuis 2007.</p>\n<h3>10. Synthèse Décisionnelle</h3>\n<p>La CJR est jugée obsolète. Suppression à envisager : transfert au juge ordinaire avec garanties (collégialité, filtre adapté).</p>"}, {"id": "35962af8e03f819a9b23fc8fac6170fd", "titre": "La Haute Cour : destitution du Président, articles 67-68", "theme": 1, "cat": "1.4.4", "html": "<h3>1. Définition & Cadre</h3>\n<p>La Haute Cour est la juridiction politique spéciale chargée de juger le Président de la République. Créée par la révision constitutionnelle du 23 février 2007, elle a remplacé la « Haute Cour de justice ». Ses compétences ont été limitées au seul cas de « manquement aux devoirs manifestement incompatibles avec l'exercice du mandat ». Jamais utilisée, mais menacée en 2016 et 2024.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 67 (statut juridictionnel du PR) · article 68 (Haute Cour) · loi organique du 24 novembre 2014 · révision cons

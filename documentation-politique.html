titutionnelle du 23 février 2007.</p>\n<h3>3. L'Article 67 : Immunité Présidentielle</h3>\n<p>Le PR n'est pas responsable des actes accomplis en cette qualité, sauf devant la CPI ou la Haute Cour. Aucune action judiciaire pendant le mandat, suspension des délais de prescription, reprise 1 mois après la fin du mandat.</p>\n<h3>4. L'Article 68 : Destitution par la Haute Cour</h3>\n<p>Condition de fond : « manquement à ses devoirs manifestement incompatible avec l'exercice de son mandat », notion intentionnellement floue. Composition : tous les parlementaires (925 membres en 2024), présidée par le président de l'AN, statue dans les 3 mois, décision à la majorité des 2/3.</p>\n<h3>5. La Procédure</h3>\n<p>Proposition par 1/10 des membres d'une assemblée → vote favorable des deux assemblées (2/3) → réunion de la Haute Cour → débat → vote (2/3) → décision immédiatement exécutoire.</p>\n<h3>6. Les Tentatives Historiques</h3>\n<p>1999 (mise en cause de Mitterrand, pas de procédure formelle) · 2016 (tentative contre Hollande, rejetée 568 voix contre 1) · 2024 (tentative LFI contre Macron après la dissolution, 81 signatures, rejetée par la Conférence des présidents).</p>\n<h3>7. La Différence avec l'Impeachment Américain</h3>\n<table><tr><th>Critère</th><th>Haute Cour FR</th><th>Impeachment USA</th></tr><tr><td>Déclenchement</td><td>1/10 d'une assemblée</td><td>1/2 House of Representatives</td></tr><tr><td>Vote final</td><td>Haute Cour (2/3)</td><td>Senate (2/3)</td></tr><tr><td>Utilisations</td><td>0</td><td>4</td></tr></table>\n<h3>8. Les Critiques</h3>\n<p>Critères trop vagues (« manquement » non défini), seuils trop élevés (2/3 dans chaque assemblée + Haute Cour, quasi impossible), pas d'opportunité démocratique réelle sauf majorité écrasante.</p>\n<h3>9. Comparaisons étrangères</h3>\n<p>Allemagne (article 61 LF, Cour constitutionnelle juge) · Italie (article 90, mise en accusation par le Parlement) — procédures plus larges qu'en France.</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>La Haute Cour est l'arme institutionnelle ultime, dont la rare invocation témoigne de la stabilité institutionnelle mais dont les conditions strictes la rendent quasi inopérante.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Maintenir l'article 68 mais clarifier la notion de « manquement », abaisser le seuil à la majorité absolue, introduire un contrôle constitutionnel de la régularité de la procédure.</p>"}, {"id": "35962af8e03f81cea0c9e1c7402e6d85", "titre": "La CJR : suppression annoncée, affaires Lagarde/Balladur et réformes", "theme": 1, "cat": "1.4.4", "html": "<h3>1. Définition & Cadre</h3>\n<p>La Cour de Justice de la République (CJR), créée en 1993, juge les crimes et délits commis par les membres du Gouvernement dans l'exercice de leurs fonctions. Sa composition mi-parlementaire mi-judiciaire est régulièrement contestée. Sa suppression a été annoncée par toutes les majorités depuis 2017 sans concrétisation.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 68-1 à 68-3 de la Constitution (révision du 27 juillet 1993) · loi organique du 23 novembre 1993 · décret du 30 mars 1994.</p>\n<h3>3. La Composition de la CJR</h3>\n<p>15 juges : 12 parlementaires élus (6 députés + 6 sénateurs), 3 magistrats de la Cour de cassation (dont le président). Mandat 5 ans depuis 2008.</p>\n<h3>4. Les Affaires Célèbres</h3>\n<p>Christine Lagarde (2016, affaire arbitrage Tapie, coupable de négligence, dispense de peine) · Édouard Balladur (2021, affaire Karachi, acquitté) · François Léotard (2021, coupable de complicité d'abus de biens sociaux, 2 ans avec sursis) · affaires en cours : Buzyn (Covid), Dupond-Moretti (relaxé).</p>\n<h3>5. La Procédure CJR</h3>\n<p>Saisine (Commission des requêtes, filtrage sévère) → instruction (Commission d'instruction) → renvoi devant la formation de jugement (12 parlementaires + 3 magistrats) → cassation possible.</p>\n<h3>6. Les Critiques de la CJR</h3>\n<p>Composition majoritairement parlementaire (risque de « jugement par les pairs »), manque de moyens (1-2 affaires par an), sévérité modérée (environ 70 % de relaxes ou condamnations symboliques).</p>\n<h3>7. La Réforme Annoncée</h3>\n<p>Macron 2018 (suppression, transfert au TJ de Paris, abandonné, bloqué par le Sénat) · réforme Borloo 2020 (abandonnée) · réforme Attal 2024 (annoncée mais bloquée après la dissolution).</p>\n<h3>8. Comparaisons étrangères</h3>\n<p>USA (pas de juridiction spéciale) · Allemagne, Italie, Espagne (juridictions ordinaires avec procédure spéciale).</p>\n<h3>9. Le Débat Doctrinal</h3>\n<p>Pour la CJR : séparation des pouvoirs, compétence spécifique. Contre : manque d'impartialité, justice de classe. Doctrine majoritaire : suppression et transfert au juge ordinaire.</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>La suppression de la CJR est consensuelle sur le principe mais bloquée politiquement depuis 2017, nécessitant une révision constitutionnelle.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Supprimer la CJR : révision constitutionnelle, transfert au TJ de Paris (chambre spécialisée), magistrats professionnels indépendants, maintien d'un filtre pour éviter le harcèlement judiciaire.</p>"}, {"id": "35962af8e03f81eba563ff40b32e19b1", "titre": "La procédure de destitution du Président (art. 68) : Haute Cour et tentatives 2024", "theme": 1, "cat": "1.4.4", "html": "<h3>1. Définition & Cadre</h3>\n<p>La procédure de destitution du Président de la République (article 68) est réformée par la révision constitutionnelle du 23 février 2007 et la loi organique du 24 novembre 2014. Elle prévoit une destitution par la Haute Cour en cas de « manquement aux devoirs manifestement incompatible avec l'exercice du mandat ». Aucune destitution n'a abouti à ce jour.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 68 de la Constitution (révision du 23 février 2007) · loi organique du 24 novembre 2014.</p>\n<h3>3. La Procédure de Destitution</h3>\n<p>Proposition (dépôt par 1/10 des membres d'une assemblée) → examen par le bureau → vote de la 1re assemblée (2/3) → vote de la 2e assemblée (2/3) → réunion de la Haute Cour (débat, 1 mois max) → vote à la majorité des 2/3 → décision immédiate, vacance constatée, élection anticipée sous 20-35 jours.</p>\n<h3>4. La Notion de Manquement</h3>\n<p>Jamais définie précisément, comparée doctrinalement au « high crimes and misdemeanors » américain, plus politique que pénale. N'exige pas de faute pénale ni de simple impopularité.</p>\n<h3>5. La Tentative LFI 2024</h3>\n<p>Après la nomination de Barnier (septembre 2024), LFI considère un « manquement » dans le refus de nommer un PM du NFP. Dépôt le 8 octobre 2024 (81 signatures), recevabilité rejetée par la Conférence des présidents le 9 octobre (vote très serré). Tentative renouvelée en 2025, également rejetée.</p>\n<h3>6. Pourquoi Aucune Destitution N'A Eu Lieu</h3>\n<p>Seuil très élevé (2/3 des deux assemblées puis 2/3 du Congrès), notion floue, solutions alternatives disponibles (cohabitation, censure du gouvernement, démission volontaire).</p>\n<h3>7. Les Tentatives Historiques</h3>\n<p>Avant 2007 : ancienne Haute Cour de Justice, compétente pour « haute trahison », jamais saisie. Après 2007 : 4 propositions LFI entre 2017 et 2024, toutes rejetées sans vote en séance.</p>\n<h3>8. Comparaisons étrangères</h3>\n<p>USA (impeachment, Trump 2 fois acquitté, Clinton acquitté) · Brésil (Dilma Rousseff destituée en 2016) · Italie (mise en accusation par le Parlement, jugement par la Cour constitutionnelle).</p>\n<h3>9. Le Débat sur la Réforme</h3>\n<p>Propositions LFI (abaissement du seuil, définition précise du manquement, référendum révocatoire) · propositions LR (maintien du statu quo, crainte de banalisation).</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>La procédure existe mais reste théorique ; le seuil des 2/3 garantit la stabilité mais la rend largement ineffective.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Maintenir l'article 68, préciser la notion de « manquement » par loi organique, envisager un mécanisme de référendum révocatoire à seuil très élevé.</p>"}, {"id": "35962af8e03f81cc83fae0e83e624d9b", "titre": "La Cour de cassation : organisation, pourvoi et grands arrêts", "theme": 1, "cat": "1.4.5", "html": "<h3>1. Définition & Cadre</h3>\n<p>La Cour de cassation est la juridiction suprême de l'ordre judiciaire français. Elle veille à l'unité d'application du droit en cassant les décisions des cours d'appel et tribunaux qui ne respectent pas la loi. Elle ne juge pas les faits mais le droit. Composée de 6 chambres et environ 230 magistrats, elle traite environ 30 000 pourvois par an.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Code de l'organisation judiciaire (art. L. 411-1 et s.) · Code de procédure civile et pénale · article 64 de la Constitution · loi du 23 juillet 1947.</p>\n<h3>3. L'Organisation</h3>\n<p>6 chambres : 1re civile (personnes, famille, successions), 2e civile (procédure civile, accidents du travail), 3e civile (immobilier, urbanisme), commerciale, sociale, criminelle. Formations : chambre simple (5 magistrats), chambre mixte, assemblée plénière (19 magistrats). Premier Président (Christophe Soulard depuis 2022), Procureur général (Rémy Heitz).</p>\n<h3>4. Le Pourvoi en Cassation</h3>\n<p>Conditions : décision rendue en dernier ressort, délai de 2 mois (civil) ou 5 jours (pénal), représentation par avocat aux Conseils. Moyens : violation de la loi, défaut de base légale, vice de motivation. Décisions : rejet, cassation avec renvoi, cassation sans renvoi.</p>\n<h3>5. Données Clés 2024</h3>\n<table><tr><th>Indicateur</th><th>Valeur</th></tr><tr><td>Effectif total</td><td>230 magistrats</td></tr><tr><td>Pourvois/an</td><td>30 000</td></tr><tr><td>Délai moyen</td><td>14 mois</td></tr><tr><td>Taux de cassation</td><td>30 % en moyenne</td></tr></table>\n<h3>6. La Jurisprudence</h3>\n<p>La Cour de cassation « fait » le droit, sa jurisprudence étant suivie par toutes les juridictions de l'ordre judiciaire. Grands arrêts : Jand'heur (1930, responsabilité du fait des choses), Perruche (2000, responsabilité médicale et handicap).</p>\n<h3>7. Le Statut des Magistrats Judiciaires</h3>\n<p>Séparation siège (inamovibles) / parquet (sous l'autorité du Garde des sceaux). Recrutement par l'ENM (~250 places/an, jugé insuffisant). Effectifs : 9 000 magistrats, besoin estimé à 11 000.</p>\n<h3>8. Les Réformes Judiciaires Récentes</h3>\n<p>LPJ 2018-2022 (6,7 Md€, création des TJ en 2020) · LOPMJ 2023-2027 (11 Md€, 1 500 magistrats supplémentaires) · loi de programmation justice 2024-2030 (30 Md€ sur 6 ans).</p>\n<h3>9. Les Débats Actuels</h3>\n<p>Indépendance du parquet (critiquée par le Conseil de l'Europe), délais de procédure croissants, suppression controversée des tribunaux d'instance en 2020.</p>\n<h3>10. Comparaisons étrangères</h3>\n<p>Allemagne (Bundesgerichtshof) · Italie (Corte di cassazione) · Espagne (Tribunal Supremo) · Royaume-Uni (UK Supreme Court, depuis 2009).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>La Cour de cassation est gardienne de l'unité du droit ; son efficacité dépend de ses moyens, le manque de magistrats étant structurel.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Recruter 1 500 magistrats supplémentaires (objectif 11 000), réformer le statut du parquet (avis conforme du CSM), accélérer la numérisation, réduire les délais.</p>"}, {"id": "35962af8e03f81b08f61ea6ac6b52291", "titre": "Les juridictions de l'ordre judiciaire : TJ, CA, tribunaux spécialisés", "theme": 1, "cat": "1.4.5", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les juridictions de l'ordre judiciaire suivent une architecture pyramidale : tribunaux judiciaires (TJ depuis 2020), cours d'appel, et Cour de cassation au sommet. La justice française traite 4 millions d'affaires par an avec des moyens souvent insuffisants au regard du reste de l'Europe.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Code de l'organisation judiciaire · loi du 18 novembre 2016 (J21) · loi du 23 mars 2019 (LPJ, création des TJ) · décret du 30 août 2019.</p>\n<h3>3. La Réforme TJ (2020)</h3>\n<p>Fusion des tribunaux de grande instance et d'instance en tribunaux judiciaires (TJ), avec des tribunaux de proximité pour les anciens TI éloignés. 164 TJ en France.</p>\n<h3>4. La Pyramide Judiciaire</h3>\n<p>1er degré : 164 TJ + tribunaux spécialisés. 2e degré : 36 cours d'appel. Sommet : Cour de cassation.</p>\n<h3>5. Les Tribunaux Spécialisés</h3>\n<p>Tribunal de commerce (134, juges consulaires élus) · conseil de prud'hommes (210, paritaire) · tribunal pour enfants · tribunal de police · cour d'assises (3 magistrats + 6 jurés) et cour criminelle départementale (depuis 2023, sans jurés pour certains crimes).</p>\n<h3>6. Le Tribunal Correctionnel</h3>\n<p>Compétence : délits, 3 magistrats ou juge unique. Procédures : comparution immédiate, CRPC (plaider coupable), ordonnance pénale.</p>\n<h3>7. La Justice Spécialisée</h3>\n<p>Justice antiterroriste (PNAT, créé en 2019) · justice financière (PNF, créé en 2013, affaires Cahuzac, Sarkozy/Bygmalion, Le Pen) · JIRS contre la criminalité organisée.</p>\n<h3>8. Données Clés 2024</h3>\n<table><tr><th>Indicateur</th><th>Valeur</th></tr><tr><td>Affaires civiles traitées</td><td>2,4 M/an</td></tr><tr><td>Affaires pénales</td><td>1,5 M/an</td></tr><tr><td>Magistrats</td><td>9 000</td></tr><tr><td>Délai moyen civil</td><td>13,8 mois</td></tr><tr><td>Surpopulation carcérale</td><td>80 000 détenus pour 60 000 places</td></tr></table>\n<h3>9. Les Problèmes Structurels</h3>\n<p>Délais excessifs (objectif 6 mois non atteint), manque de moyens (0,4 % du PIB contre 0,5 % en moyenne UE, 14e place européenne), surpopulation carcérale avec condamnations CEDH régulières.</p>\n<h3>10. Les Réformes Engagées</h3>\n<p>LOPMJ 2023-2027 (11 Md€, 1 500 magistrats) · loi de programmation justice 2024-2030 (30 Md€, recrutement massif, cours criminelles départementales).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>La justice est le service public le moins bien doté de France, avec des délais incompatibles avec l'article 6 de la CEDH.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Doubler le budget de la justice sur 10 ans (0,8 % du PIB), recruter massivement (objectif 12 000 magistrats en 2030), accélérer la numérisation (Portalis), plan prison de 25 000 places.</p>"}, {"id": "35962af8e03f81788effe162a8a4457c", "titre": "Le Conseil supérieur de la magistrature (CSM) : composition, compétences et réformes", "theme": 1, "cat": "1.4.5", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le Conseil supérieur de la magistrature (CSM) est l'institution chargée de garantir l'indépendance de la magistrature. Il gère la carrière des magistrats du siège et donne avis sur la nomination des magistrats du parquet. Réformé en 1993 et 2008, il reste critiqué pour son lien avec l'exécutif via la nomination du parquet.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 65 de la Constitution · loi organique n° 94-100 du 5 février 1994 · loi organique du 22 juillet 2010 · ordonnance du 22 décembre 1958.</p>\n<h3>3. La Composition du CSM (depuis 2008)</h3>\n<p>22 membres : 8 magistrats élus par leurs pairs, 8 personnalités qualifiées (2 PR, 2 président AN, 2 président Sénat, 1 conseiller d'État, 1 avocat). Mandat de 4 ans non renouvelable. Formation siège présidée par le Premier président de la Cour de cassation, formation parquet par le Procureur général.</p>\n<h3>4. Les Compétences</h3>\n<p>Pour le siège : proposition ou avis conforme pour les nominations, le PR ne pouvant nommer contre l'avis du CSM ; discipline directement exercée par le CSM. Pour le parquet : avis simple sur les nominations (le PR peut passer outre en théorie, rarement en pratique) ; discipline par avis, sanction par le ministre.</p>\n<h3>5. La Question de l'Indépendance du Parquet</h3>\n<p>La CEDH a jugé à plusieurs reprises que le procureur français n'est pas une « autorité judiciaire » au sens conventionnel, en raison du lien hiérarchique avec le ministre de la Justice.</p>\n<h3>6. La Réforme du Statut du Parquet : Tentatives Échouées</h3>\n<p>Projets successifs en 2013 (Hollande), 2018 (Macron), tous abandonnés faute de majorité au Congrès (3/5 requis). Objectif : avis conforme du CSM pour les nominations du parquet.</p>\n<h3>7. La Discipline des Magistrats</h3>\n<p>Sanctions graduées de la réprimande à la révocation. Volume : 30-50 saisines/an, 5-10 sanctions effectives/an.</p>\n<h3>8. Les Affaires Célèbres</h3>\n<p>Affaire Burgaud (Outreau) : sanction jugée insuffisante ; les poursuites disciplinaires de magistrats restent rares en France.</p>\n<h3>9. Les Saisines Citoyennes</h3>\n<p>Depuis 2010, tout justiciable peut saisir le CSM contre un magistrat (environ 1 500 saisines/an, 2 % retenues).</p>\n<h3>10. La Carrière des Magistrats</h3>\n<p>8 200 magistrats en France (2024), recrutement par l'ENM (concours principal), concours complémentaire, recrutement latéral.</p>\n<h3>11. Comparaisons étrangères</h3>\n<p>Italie (CSM très indépendant, compétence entière sur le parquet) · Espagne (Conseil général du Pouvoir judiciaire) · USA (parquet fédéral nommé, parquets locaux élus).</p>\n<h3>12. Enjeux Stratégiques</h3>\n<p>Le CSM reste en demi-teinte (avis conforme pour le siège, simple pour le parquet), la réforme du statut du parquet étant un serpent de mer institutionnel.</p>\n<h3>13. Synthèse Décisionnelle</h3>\n<p>Réviser la Constitution pour instaurer un avis conforme du CSM sur les nominations du parquet, supprimer le rôle symbolique du PR comme président de la formation plénière, augmenter les moyens du CSM.</p>"}, {"id": "35962af8e03f81ff8a8bef02ae8562c3", "titre": "Le Tribunal des conflits : juridictions, dualité et arbitrage des compétences", "theme": 1, "cat": "1.4.5", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le Tribunal des conflits est une juridiction unique qui tranche les conflits de compétence entre l'ordre judiciaire et l'ordre administratif. Créé en 1872, il est composé paritairement de magistrats des deux ordres. Il préserve la dualité du système juridictionnel français.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi du 24 mai 1872 · loi du 16 février 2015 (modernisation) · Code de justice administrative · Code de l'organisation judiciaire.</p>\n<h3>3. La Composition</h3>\n<p>8 membres + secrétaires : 4 magistrats du Conseil d'État, 4 magistrats de la Cour de cassation, 1 vice-président (alternance tous les 3 ans). Présidence par le ministre de la Justice supprimée en 2015.</p>\n<h3>4. Les Compétences</h3>\n<p>4 types de conflits : conflit positif (l'administration revendique une affaire), conflit négatif (les deux ordres se déclarent incompétents), conflit sur renvoi, conflit de décisions au fond.</p>\n<h3>5. Les Critères de Répartition (Jurisprudence Blanco 1873)</h3>\n<p>Principe Blanco : les services publics relèvent du juge administratif, sauf gestion privée. Critères complexifiés : SPA (juge administratif) vs SPIC (juge judiciaire), voie de fait et emprise (juge judiciaire).</p>\n<h3>6. Les Grands Arrêts du TC</h3>\n<p>Blanco (1873, fondateur du droit administratif) · Bac d'Éloka (1921, distinction SPA/SPIC) · Pelletier (1873, faute personnelle/faute de service).</p>\n<h3>7. La Voie de Fait : Une Question Sensible</h3>\n<p>Action manifestement illégale de l'administration portant atteinte à une liberté fondamentale ou à la propriété, compétence du juge judiciaire. Application restrictive depuis l'arrêt Bergoend (2013, atteinte « grossière » requise).</p>\n<h3>8. La Réforme de 2015</h3>\n<p>Suppression du départage par le Garde des Sceaux, suppression du droit de tirage du préfet, saisine simplifiée.</p>\n<h3>9. Le Volume Annuel</h3>\n<p>Environ 50-80 décisions par an, délai moyen de 6-9 mois.</p>\n<h3>10. Comparaisons étrangères</h3>\n<p>Italie (Cassazione tranche les conflits) · Allemagne (pas de TC, 5 cours supérieures) · Royaume-Uni (Supreme Court unique).</p>\n<h3>11. Le Maintien de la Dualité Judiciaire</h3>\n<p>Arguments pour : spécificité du droit administratif, tradition républicaine. Arguments contre : complexité pour le justiciable, coûts, lenteurs.</p>\n<h3>12. Enjeux Stratégiques</h3>\n<p>Le Tribunal des conflits est une institution discrète mais essentielle, dont la rationalisation de 2015 a amélioré le fonctionnement.</p>\n<h3>13. Synthèse Décisionnelle</h3>\n<p>Maintenir la dualité, simplifier la répartition (guide pratique), clarifier la voie de fait, renforcer les effectifs pour des délais plus courts.</p>"}, {"id": "39762af8e03f81019d6ced901848417a", "titre": "Le parquet et les juges du siège : statut, indépendance, nomination et chaîne pénale", "theme": 1, "cat": "1.4.5", "html": "<h3>1. Définition & Cadre</h3>\n<p>La magistrature française est unique par son recrutement (même concours, même école — l'ENM) mais duale par ses fonctions : les magistrats du siège jugent, les magistrats du parquet poursuivent. Cette dualité organique dans un corps unique est la spécificité française — et la source d'une controverse permanente sur l'indépendance du ministère public, régulièrement censurée par la CEDH.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 64 de la Constitution (indépendance de l'autorité judiciaire, inamovibilité du siège) · article 65 (CSM) · ordonnance du 22 décembre 1958 · Code de procédure pénale (art. 30 à 39-3) · loi du 25 juillet 2013 (interdiction des instructions individuelles du garde des Sceaux).</p>\n<h3>3. Fonctionnement concret</h3>\n<p><strong>Magistrats du siège</strong> : inamovibles, nommés sur proposition ou avis conforme du CSM, discipline exercée directement par le CSM.</p>\n<p><strong>Magistrats du parquet</strong> : non inamovibles, hiérarchisés (« la plume est serve, la parole est libre »), nommés sur avis simple du CSM (suivi dans la pratique constante depuis 2012), discipline par avis du CSM et sanction du garde des Sceaux. Depuis 2013 : aucune instruction individuelle possible, seulement des instructions générales de politique pénale publiques.</p>\n<p><strong>Chaîne hiérarchique du parquet</strong> : garde des Sceaux → 36 procureurs généraux → procureurs de la République → substituts.</p>\n<h3>4. Acteurs & institutions</h3>\n<p>CSM (deux formations siège/parquet) · Direction des services judiciaires et DACG au ministère de la Justice · ENM (Bordeaux) · syndicats (USM majoritaire, Syndicat de la magistrature) · parquets spécialisés (PNF, PNAT, JIRS).</p>\n<h3>5. Finances & moyens</h3>\n<p>Budget de la Justice : environ 12 Md€ (LFI 2026). Environ 9 500 magistrats (dont 2 500 au parquet), 11 000 greffiers. La France reste sous la médiane européenne (environ 11 magistrats pour 100 000 habitants contre 17 en médiane CEPEJ).</p>\n<h3>6. Données clés</h3>\n<p>36 cours d'appel, environ 164 tribunaux judiciaires. Le parquet exerce l'opportunité des poursuites (art. 40-1 CPP). Taux de réponse pénale : environ 88 % des affaires poursuivables.</p>\n<h3>7. Historique</h3>\n<p>1958 (ordonnance statutaire) · 1993 (réforme du CSM) · 2008 (révision constitutionnelle, ouverture aux personnalités qualifiées) · 2010 (CEDH, Moulin c. France : le procureur français n'est pas une « autorité judiciaire » au sens de l'article 5§3) · 2013 (interdiction des instructions individuelles) · tentatives 2013, 2016, 2019, 2024 de révision constitutionnelle pour un avis conforme du CSM sur le parquet, toutes abandonnées.</p>\n<h3>8. 🔴 Actualité 2026 : la chaîne pénale sous tension</h3>\n<p><strong>Affaire Lyhanna (mai-juin 2026)</strong> : deux plaintes antérieures pour viols sur mineures (2022, août 2025) classées sans suite ou jamais instruites, suspect jamais entendu, retards liés à un dessaisissement entre parquets et à la pénurie de magistrats du tribunal d'Auch. Le 5 juin 2026, le garde des Sceaux Darmanin déplore que « l'institution judiciaire n'a pas su protéger » la victime. Le 8 juin, il réunit les 36 procureurs généraux et demande le traitement en urgence des 70 000 plaintes concernant des enfants avant le 14 juillet. Lecture institutionnelle : cette réunion illustre la frontière ténue entre instruction générale de politique pénale (autorisée) et orientation de facto de l'action des parquets sur des dossiers déterminés — relançant le débat sur le statut du parquet.</p>\n<h3>9. Dépendances</h3>\n<p>Moyens budgétaires, articulation avec la police judiciaire (double tutelle de fait avec le ministère de l'Intérieur), règles de compétence territoriale, jurisprudence CEDH et droit de l'Union.</p>\n<h3>10. Points de rupture</h3>\n<p>Statut du parquet dénoncé comme incompatible avec la jurisprudence Moulin, soupçon politique récurrent, engorgement (classements sans suite massifs, plaintes non instruites), double tutelle de la police judiciaire.</p>\n<h3>11. Dimension européenne & internationale</h3>\n<p>CEDH (Moulin c. France, Medvedyev c. France, 2010) · CJUE (arrêt OG et PI, 2019, sur le mandat d'arrêt européen, jugeant le parquet français conforme précisément grâce à la loi de 2013) · Parquet européen (EPPO, opérationnel depuis 2021, procureurs indépendants) · GRECO (Conseil de l'Europe, recommandations récurrentes).</p>\n<h3>12. Enjeux stratégiques</h3>\n<p>Crédibilité démocratique de l'indépendance perçue du parquet, efficacité de la chaîne pénale (leçon de l'affaire Lyhanna), conformité européenne, équilibre des pouvoirs.</p>\n<h3>13. Options politiques</h3>\n<p>Avis conforme du CSM pour la nomination du parquet (bloqué politiquement depuis 2013), transfert du pouvoir disciplinaire au CSM, légalité des poursuites pour certains contentieux prioritaires (violences sexuelles sur mineurs), rattachement fonctionnel de la police judiciaire au parquet (débat récurrent).</p>\n<h3>14. Faisabilité & temporalité</h3>\n<p>Avis conforme du CSM : révision constitutionnelle nécessitant un Congrès à 3/5, faisabilité faible dans une Assemblée fragmentée (quatre tentatives échouées depuis 2013). Moyens et priorisation : leviers mobilisables immédiatement.</p>\n<h3>15. Impacts</h3>\n<p>Sur la confiance (chaque affaire non instruite l'érode), sur les victimes (perception de déni de justice), sur l'État de droit, sur le contentieux européen (risque de condamnations répétées).</p>\n<h3>16. Synthèse décisionnelle</h3>\n<p>Le statut du parquet est le point aveugle de l'État de droit français : un consensus technique existe depuis quinze ans mais quatre révisions constitutionnelles ont échoué faute de majorité. L'année 2026 déplace le débat : l'affaire Lyhanna démontre que la question la plus urgente n'est pas l'indépendance formelle du parquet mais sa capacité matérielle à traiter les plaintes. Deux chantiers dans l'ordre : résorber les déserts judiciaires à court terme ; ouvrir la fenêtre constitutionnelle post-2027 pour aligner le régime du parquet sur celui du siège.</p>\n<p><strong>Sources</strong> : Constitution art. 64-65 — Ordonnance du 22 déc. 1958 — CPP art. 30, 39-1, 39-3, 40-1 — Loi du 25 juillet 2013 — CEDH Moulin c. France (2010) — CJUE OG et PI (2019) — GRECO — CEPEJ</p>"}, {"id": "35762af8e03f81b8bd69e77969fbceed", "titre": "La décentralisation : Actes I-II-III, compétences, finances locales et débat", "theme": 1, "cat": "1.5.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>La décentralisation est le transfert de compétences de l'État vers des collectivités territoriales disposant d'une personnalité juridique propre. La déconcentration est le transfert de pouvoirs à des agents de l'État sur le terrain. La France a accompli 3 grandes vagues : 1982-1983 (Defferre), 2003-2004 (Raffarin), 2015 (NOTRe). L'État reste néanmoins fortement jacobin.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 1 de la Constitution (« organisation décentralisée », ajout 2003) · article 72 (libre administration) · loi du 2 mars 1982 (Acte I) · loi constitutionnelle du 28 mars 2003 (Acte II) · loi NOTRe du 7 août 2015 (Acte III) · loi 3DS du 21 février 2022.</p>\n<h3>3. Les Collectivités Territoriales</h3>\n<table><tr><th>Collectivité</th><th>Nombre</th><th>Compétences principales</th></tr><tr><td>Régions</td><td>18 (dont 5 DOM)</td><td>Développement éco, formation pro, lycées</td></tr><tr><td>Départements</td><td>101</td><td>Action sociale, collèges, routes, RSA</td></tr><tr><td>Communes</td><td>34 945</td><td>Urbanisme, écoles primaires, voirie locale</td></tr><tr><td>Métropoles</td><td>22</td><td>Toutes les compétences des 3 niveaux</td></tr><tr><td>EPCI</td><td>1 254</td><td>Eau, déchets, transport local</td></tr></table>\n<h3>4. Les Grandes Réformes</h3>\n<p>Acte I (1982-1983) : suppression de la tutelle a priori, transfert de l'exécutif aux présidents de CG, régions collectivités de plein exercice. Acte II (2003-2004) : constitutionnalisation, transferts de compétences, droit à l'expérimentation. Réforme des régions (2015) : 22 → 13 régions, renforcement des compétences économiques, suppression de la clause générale de compétence.</p>\n<h3>5. La Déconcentration : Le Préfet</h3>\n<p>Préfet de département (représentant de l'État) et préfet de région (coordination). Nommé en Conseil des ministres, révocable à tout moment. Contrôle de légalité a posteriori. Effectifs : 100 préfets de département + 13 préfets de région + 232 sous-préfets.</p>\n<h3>6. Les Finances Locales</h3>\n<table><tr><th>Ressource</th><th>Montant 2024</th></tr><tr><td>Dotations de l'État (DGF)</td><td>27 Md€</td></tr><tr><td>Fiscalité locale (propre)</td><td>90 Md€</td></tr><tr><td>Emprunts</td><td>15 Md€</td></tr><tr><td>Total dépenses locales</td><td>~320 Md€</td></tr></table>\n<p>Crise financière des départements : dépenses sociales (RSA, APA, PCH) en explosion, recettes (DMTO) en chute avec la crise immobilière.</p>\n<h3>7. Le Débat Permanent : Quel Niveau de Décentralisation ?</h3>\n<table><tr><th>Position</th><th>Partis</th><th>Proposition</th></tr><tr><td>Plus de décentralisation</td><td>LR, régionalistes</td><td>Supprimer les départements, renforcer les régions</td></tr><tr><td>Maintien du système</td><td>Centre, PS</td><td>Équilibre actuel</td></tr><tr><td>Recentralisation</td><td>LFI, PCF</td><td>Défiance envers les élus locaux</td></tr></table>\n<h3>8. Synthèse Décisionnelle</h3>\n<p>Acte IV de la décentralisation : supprimer une strate selon les territoires, financer correctement les compétences transférées, donner plus d'autonomie fiscale, réformer la DGF, renforcer le préfet comme interlocuteur unique.</p>"}, {"id": "35562af8e03f81edbf84db4108bd89fc", "titre": "Décentralisation et déconcentration : fondements", "theme": 1, "cat": "1.5.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>La décentralisation est le transfert de compétences de l'État vers des collectivités territoriales dotées de la personnalité juridique. La déconcentration est le transfert de pouvoirs à des agents de l'État dans les territoires (préfets, recteurs). Ces deux logiques coexistent et structurent l'organisation territoriale française.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 1er (organisation décentralisée depuis 2003) · article 72 (libre administration) · lois Defferre 1982-1983 · loi ATR 1992 · révision 2003 · lois 2003-2004 · loi NOTRe 2015 · CGCT.</p>\n<h3>3. Fonctionnement Concret</h3>\n<p>Décentralisation à 3 niveaux : communes (~35 000), départements (101), régions (18). Déconcentration : préfets, recteurs, DREAL, DREETS, DRAC.</p>\n<h3>4. Acteurs & Cartographie du Pouvoir</h3>\n<table><tr><th>Acteur</th><th>Rôle</th></tr><tr><td>Élus locaux</td><td>Décision et exécution</td></tr><tr><td>Préfets</td><td>Contrôle de légalité, représentation État</td></tr><tr><td>DGCL</td><td>Tutelle normative</td></tr><tr><td>Cour des comptes/CRC</td><td>Contrôle financier</td></tr></table>\n<h3>5. Finances & Moyens</h3>\n<p>Budget total collectivités : ~270 Md€/an. DGF : ~27 Md€/an. Investissement local : environ 60 % de l'investissement public national.</p>\n<h3>6. Audit Factuel</h3>\n<p>101 départements, 18 régions, 35 000 communes (80 % ont moins de 1 000 habitants), 1 257 EPCI, 5,7 M d'agents dans les 3 fonctions publiques. Suppressions DGF : -11 Md€ entre 2013 et 2017.</p>\n<h3>7. Chronologie</h3>\n<p>1982-83 (Acte I) · 1992 (loi ATR) · 2003 (révision constitutionnelle) · 2003-04 (Acte II) · 2010 (réforme territoriale abandonnée) · 2015 (loi NOTRe) · 2017-24 (débat sur la suppression des départements).</p>\n<h3>8. Dépendances</h3>\n<ul>\n<li><strong>Budget État</strong> : les collectivités dépendent des dotations et transferts</li>\n<li><strong>Réformes fiscales</strong> : suppression taxe d'habitation, CVAE — déstabilisent les finances locales</li>\n<li><strong>Droit UE</strong> : mise en concurrence obligatoire</li>\n</ul>\n<h3>9. Points de Rupture & Tensions</h3>\n<p>Inégalités territoriales, complexité du mille-feuille, réformes fiscales successives réduisant l'autonomie réelle, persistance des financements croisés malgré NOTRe.</p>\n<h3>10. Dimension Européenne & Internationale</h3>\n<p>Charte européenne de l'autonomie locale (ratifiée par la France), fonds structurels UE (régions autorités de gestion FEDER/FSE). Comparaison : Allemagne (Länder puissants), Espagne (communautés autonomes), Italie (régions).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Simplifier le mille-feuille territorial sans perdre l'ancrage démocratique local, assurer l'équité entre collectivités, renforcer l'autonomie fiscale réelle.</p>\n<h3>12. Scénarios & Options Politiques</h3>\n<p><strong>Scénario 1</strong> : statu quo</p>\n<p><strong>Scénario 2</strong> : suppression des départements, renforcement régions + communes</p>\n<p><strong>Scénario 3</strong> : fédéralisme asymétrique, différenciation selon les capacités</p>\n<h3>13. Faisabilité</h3>\n<p>Suppression des départements : révision constitutionnelle et résistance politique forte. Différenciation : possible par loi organique (3DS 2022).</p>\n<h3>14. Temporalité</h3>\n<p>Court terme : réforme des dotations, fiscalité locale. Moyen terme : nouvelle réforme territoriale possible post-2027.</p>\n<h3>15. Synthèse Décisionnelle + Sources</h3>\n<p><strong>Problème</strong> : l'organisation territoriale française cumule les niveaux de gouvernance sans clarification réelle des compétences.</p>\n<p><strong>Recommandation</strong> : opter pour la différenciation (collectivités volontaires absorbant les compétences du niveau supérieur) plutôt que la suppression brutale.</p>\n<p><strong>Sources</strong> : CGCT — Loi NOTRe 2015 — DGCL — Rapport Attali 2008 — Rapport Lambert 2007</p>"}, {"id": "35862af8e03f81ac8109f21e86fcce6e", "titre": "La déconcentration : préfets, services territoriaux et réformes", "theme": 1, "cat": "1.5.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>La déconcentration est l'organisation administrative qui consiste à déléguer aux services locaux de l'État (préfets, directions régionales) des pouvoirs de décision sur le territoire, distincte de la décentralisation.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi du 6 février 1992 (ATR) · charte de la déconcentration (1992, réformée 2015) · réforme RÉATE (2010) puis OTE (2020).</p>\n<h3>3. Les Préfets</h3>\n<p>Préfet de région (13 en métropole + 5 outre-mer) · préfet de département (96 métropolitains + 5 outre-mer) · sous-préfets (~230 sous-préfectures).</p>\n<h3>4. Les Services Territoriaux de l'État</h3>\n<p>Échelon régional : DREAL, DRAC, rectorat, ARS, DREETS (depuis 2021). Échelon départemental : DDETS, DDT-M, DDPP.</p>\n<h3>5. Les Réformes Récentes</h3>\n<p>RÉATE 2010 (regroupement dans DREAL/DDT/DRAC) · OTE 2020 (création des SGCD, mutualisation des fonctions support).</p>\n<h3>6. Données Clés</h3>\n<table><tr><th>Indicateur</th><th>Valeur</th></tr><tr><td>Préfets et sous-préfets</td><td>230</td></tr><tr><td>Préfectures et sous-préfectures</td><td>350</td></tr><tr><td>Effectifs État territorial</td><td>~50 000</td></tr><tr><td>Budget préfectures</td><td>~1,8 Md€</td></tr></table>\n<h3>7. Problématiques Actuelles</h3>\n<p>Réduction continue des effectifs, fermeture de sous-préfectures (inquiétude rurale), perte d'expertise locale, fragmentation des compétences.</p>\n<h3>8. Le Débat « État fort » vs « État allégé »</h3>\n<p>Pour la déconcentration : proximité, adaptation, rapidité d'action. Contre : fragmentation, confusion citoyens/collectivités, dédoublement de structures.</p>\n<h3>9. Synthèse Décisionnelle</h3>\n<p>L'État territorial est en crise structurelle. Réformes à envisager : moratoire sur les réorganisations, augmentation des effectifs stratégiques, maintien des sous-préfectures rurales, clarification des compétences État/collectivités.</p>"}, {"id": "35962af8e03f8122817ccb08bffc01a8", "titre": "L'Acte I de la décentralisation : les lois Defferre (1982-1983)", "theme": 1, "cat": "1.5.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les lois Defferre constituent l'Acte I de la décentralisation : loi du 2 mars 1982 (droits et libertés), loi du 7 janvier 1983 (compétences), loi du 22 juillet 1983 (compléments). Cette réforme abolit la tutelle préfectorale a priori, transfère l'exécutif départemental et régional aux élus, et fait de la région une collectivité territoriale de plein exercice.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi n° 82-213 du 2 mars 1982 · loi n° 83-8 du 7 janvier 1983 · loi n° 83-663 du 22 juillet 1983.</p>\n<h3>3. Les Innovations Majeures</h3>\n<p>Suppression de la tutelle préfectorale a priori (contrôle a posteriori uniquement). Transfert de l'exécutif aux élus (président du Conseil général/régional remplace le préfet). La Région devient collectivité à part entière (premières élections en 1986).</p>\n<h3>4. Les Transferts de Compétences (Loi 1983)</h3>\n<p>Communes : urbanisme, écoles maternelles et primaires. Départements : action sociale, collèges, routes départementales, transport scolaire. Régions : lycées, formation professionnelle, aménagement du territoire, apprentissage.</p>\n<h3>5. Les Conséquences</h3>\n<p>Élargissement de la démocratie locale, croissance des effectifs locaux (1,3 million d'agents en 1982, 1,9 million en 2024), augmentation des dépenses locales (8 % du PIB en 1982, 11 % en 2024).</p>\n<h3>6. Les Limites</h3>\n<p>L'État reste fortement présent (pouvoir réglementaire, contrôle des financements, normes nationales). Problème du « mille-feuille » administratif à 4 échelons.</p>\n<h3>7. Héritage et Suite</h3>\n<p>Acte II en 2003-2004 (Raffarin), Acte III en 2014-2015 (Hollande), débats sur l'Acte IV.</p>\n<h3>8. Synthèse Décisionnelle</h3>\n<p>Les lois Defferre ont rompu avec la tradition jacobine. Bilan : succès de la démocratie locale, mais complexité administrative croissante.</p>"}, {"id": "35962af8e03f81009f95c63e6b379527", "titre": "L'Acte II de la décentralisation : Raffarin 2003-2004", "theme": 1, "cat": "1.5.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>L'Acte II de la décentralisation, mené par Jean-Pierre Raffarin en 2003-2004, a constitutionnalisé le principe de l'organisation décentralisée et inscrit le principe de subsidiarité. La loi du 13 août 2004 a transféré le RMI/RMA aux départements, la formation professionnelle aux régions, les routes nationales aux départements.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi constitutionnelle n° 2003-276 du 28 mars 2003 · loi n° 2003-697 du 1er août 2003 · loi n° 2004-809 du 13 août 2004.</p>\n<h3>3. Les Apports Constitutionnels</h3>\n<p>Article 1er : « son organisation est décentralisée ». Article 72 refondu : principe de subsidiarité, pouvoir réglementaire local, droit à l'expérimentation. Article 72-1 : référendum local, droit de pétition. Article 72-2 : autonomie financière (« part déterminante » des recettes propres).</p>\n<h3>4. Les Transferts (Loi du 13 août 2004)</h3>\n<p>Départements : RMI puis RSA (2009), routes nationales, personnels TOS des collèges. Régions : formation professionnelle, personnels TOS des lycées, inventaire général. Communes : logement social, délivrance des passeports/CNI.</p>\n<h3>5. Les Compensations Financières</h3>\n<p>TIPP/TICPE transférée, DGD. Critique des collectivités : compensations insuffisantes (RSA notamment), déficit cumulé estimé à 50 Md€ depuis 2004.</p>\n<h3>6. L'Expérimentation</h3>\n<p>Article 72 nouveau : dérogation possible sous conditions, durée maximale de 5 ans. Bilan : outil sous-utilisé.</p>\n<h3>7. Les Limites de l'Acte II</h3>\n<p>Subsidiarité mal appliquée, doublons de compétences persistants, rigidité institutionnelle maintenue.</p>\n<h3>8. Héritage</h3>\n<p>Constitutionnalisation marquante, bases pour l'Acte III, mais problème du financement non résolu.</p>\n<h3>9. Synthèse Décisionnelle</h3>\n<p>L'Acte II a constitutionnalisé la décentralisation sans résoudre les problèmes structurels de financement et de doublons.</p>"}, {"id": "35962af8e03f81a99c5cf7704336c96f", "titre": "L'Acte III de la décentralisation : MAPTAM 2014, NOTRe 2015 et 13 régions", "theme": 1, "cat": "1.5.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>L'Acte III, mené par François Hollande, a créé les métropoles (MAPTAM 2014) et redistribué les compétences en réduisant les régions de 22 à 13 (NOTRe 2015). Il reste contesté et incomplet.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi MAPTAM n° 2014-58 du 27 janvier 2014 · loi NOTRe n° 2015-991 du 7 août 2015 · loi de réforme des régions n° 2015-29 du 16 janvier 2015.</p>\n<h3>3. La Loi MAPTAM (2014)</h3>\n<p>Création de 22 métropoles, dont 3 à statut particulier (Paris, Lyon, Marseille). Lyon devient une collectivité territoriale (fusion ville-département).</p>\n<h3>4. La Réforme des Régions (2015)</h3>\n<p>Fusion de 22 à 13 régions métropolitaines, effective au 1er janvier 2016 : Auvergne-Rhône-Alpes, Bourgogne-Franche-Comté, Grand Est, Hauts-de-France, Normandie, Nouvelle-Aquitaine, Occitanie (fusions), Île-de-France, Bretagne, Centre-Val de Loire, Corse, Pays de la Loire, PACA (inchangées).</p>\n<h3>5. La Loi NOTRe (2015) : Répartition des Compétences</h3>\n<p>Régions : développement économique (chef de file), transports (cars, gares), lycées, apprentissage. Départements : suppression de la clause générale de compétence, action sociale maintenue. Communes : clause générale conservée, intercommunalité obligatoire renforcée (seuil 15 000 habitants).</p>\n<h3>6. La Révolution Intercommunale</h3>\n<p>Diminution du nombre d'EPCI de 2 600 à 1 250, compétences obligatoires renforcées (développement économique, eau, déchets, GEMAPI).</p>\n<h3>7. Les Critiques</h3>\n<p>Contre : régions trop grandes, disparition des spécificités historiques, mille-feuille persistant. Pour : régions comparables aux Länder, compétences clarifiées.</p>\n<h3>8. Acte IV : Le Débat Actuel</h3>\n<p>Différenciation territoriale (loi 3DS 2022), débat post-2024 sur la suppression d'un échelon.</p>\n<h3>9. Comparaisons Européennes</h3>\n<p>Allemagne (16 Länder, vrais États fédérés) · Espagne (17 communautés autonomes) · Italie (20 régions).</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>L'Acte III a clarifié mais pas résolu ; les métropoles fonctionnent (notamment Lyon) mais la taille des régions reste contestée.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Acte IV : suppression d'un échelon, autonomie fiscale renforcée, différenciation territoriale effective, réactivation du droit à l'expérimentation.</p>"}, {"id": "35962af8e03f815083cec0b604e9f7e3", "titre": "La loi 3DS (2022) : Différenciation, Décentralisation, Déconcentration, Simplification", "theme": 1, "cat": "1.5.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>La loi 3DS du 21 février 2022, principale loi territoriale du quinquennat Macron 1, est plus modeste que les actes précédents mais innove sur la différenciation : permettre à chaque collectivité d'avoir des compétences spécifiques selon ses caractéristiques.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi n° 2022-217 du 21 février 2022, 271 articles, modifiant le CGCT, le Code de l'urbanisme, le Code de la santé publique.</p>\n<h3>3. Le Pilier « Différenciation »</h3>\n<p>Compétences « à la carte » selon les territoires, conventions de compétences État-collectivités, dérogations possibles. Exemples : Bretagne (compétence élargie mer/eau/enseignement), Collectivité européenne d'Alsace (depuis 2021).</p>\n<h3>4. Le Pilier « Décentralisation »</h3>\n<p>Transferts marginaux (santé, médico-social, logement, routes nationales à titre expérimental) — critiqué comme n'étant pas un véritable « acte IV ».</p>\n<h3>5. Le Pilier « Déconcentration »</h3>\n<p>Renforcement du préfet, pouvoir de dérogation administrative (article 49) sous conditions strictes.</p>\n<h3>6. Le Pilier « Simplification »</h3>\n<p>Allégement de procédures, dématérialisation, simplification du contrôle de légalité.</p>\n<h3>7. Les Mesures Sectorielles</h3>\n<p>Logement (loi SRU maintenue avec dérogations) · transports (compétence régionale renforcée sur les TER) · santé (ARS plus liées aux élus) · énergie (compétence régionale renforcée).</p>\n<h3>8. Les Critiques</h3>\n<p>Trop technique (271 articles), pas de message politique fort, autonomie financière non renforcée, mille-feuille non simplifié.</p>\n<h3>9. Le Mille-Feuille Territorial</h3>\n<p>5 niveaux (État, région, département, intercommunalité, commune), 35 000 communes (40 % des communes européennes).</p>\n<h3>10. La Métropole de Lyon : Modèle ?</h3>\n<p>Fusion métropole-département créée en 2015, conseil métropolitain élu au suffrage direct — modèle envisagé pour Marseille, Nantes, Bordeaux.</p>\n<h3>11. La Position des Élus Locaux</h3>\n<p>AMF (défend la commune) · ADF (défend le département) · Régions de France (demande plus de compétences) · AdCF (renforcement des intercommunalités).</p>\n<h3>12. Enjeux Stratégiques</h3>\n<p>La 3DS est une demi-mesure ; la véritable décentralisation reste à faire.</p>\n<h3>13. Synthèse Décisionnelle</h3>\n<p>Acte IV 2027-2030 : transfert majeur aux régions, autonomie fiscale réelle, généralisation du modèle métropolitain de Lyon, suppression progressive des départements en zones urbaines.</p>"}, {"id": "35962af8e03f8135b2d1d49eee71195c", "titre": "La Charte européenne de l'autonomie locale : ratification, portée et limites", "theme": 1, "cat": "1.5.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>La Charte européenne de l'autonomie locale (CEAL) du Conseil de l'Europe (1985) consacre le principe d'autonomie des collectivités locales. La France l'a signée en 1985 mais ratifiée seulement en 2007, avec 3 déclarations interprétatives limitant ses engagements.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Charte du 15 octobre 1985, signée le même jour par la France, ratifiée le 17 janvier 2007, entrée en vigueur le 1er mai 2007. Article 72 de la Constitution.</p>\n<h3>3. Les 10 Principes de la Charte</h3>\n<p>Reconnaissance de l'autonomie locale, gestion d'une part importante des affaires publiques, compétence générale, protection des limites territoriales, moyens administratifs adaptés, conditions d'exercice des mandats, contrôle administratif limité, ressources financières suffisantes, recours juridictionnel.</p>\n<h3>4. Les Réserves Françaises</h3>\n<p>3 déclarations interprétatives : sur les conseils élus (art. 3§2), maintien du contrôle de légalité et budgétaire (art. 8§2), pas d'engagement chiffré sur les ressources propres (art. 9§2) — critiquées par le Congrès des pouvoirs locaux du Conseil de l'Europe.</p>\n<h3>5. Le Suivi par le Congrès du Conseil de l'Europe</h3>\n<p>Visites de monitoring (dernière en 2016), recommandations sur l'harmonisation du statut des élus, la garantie des ressources, la clarification des compétences.</p>\n<h3>6. La Charte vs Constitution Française</h3>\n<p>La Constitution prime sur la Charte (jurisprudence Sarran, 1998). Décisions notables : CC 2003-489 DC (autonomie financière), CE 2008 (invocabilité directe).</p>\n<h3>7. Le Protocole Additionnel (2009)</h3>\n<p>Protocole sur la démocratie participative, signé par 18 États, non signé par la France.</p>\n<h3>8. Comparaisons Européennes</h3>\n<p>Allemagne (autonomie communale constitutionnelle forte, art. 28 GG) · Espagne (autonomie territoriale constitutionnelle) · Royaume-Uni (devolution).</p>\n<h3>9. Le Débat Français</h3>\n<p>Critiques : déclarations interprétatives comme autolimitation, DGF en baisse continue, suppression de la taxe d'habitation. Défenseurs : Charte globalement respectée.</p>\n<h3>10. Enjeux Stratégiques</h3>\n<p>Tension entre tradition jacobine et exigences européennes ; l'autonomie financière est l'enjeu principal.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Lever les 3 déclarations interprétatives, ratifier le Protocole 2009, réformer la DGF, garantir constitutionnellement un ratio de ressources propres supérieur à 50 %.</p>"}, {"id": "35962af8e03f8123bae6d4dea9f857dc", "titre": "Le contrôle de légalité et budgétaire : préfets, CRC et collectivités", "theme": 1, "cat": "1.5.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le contrôle de légalité est la vérification par le préfet de la conformité à la loi des actes des collectivités territoriales, exercé a posteriori depuis 1982. Le contrôle budgétaire est exercé par les chambres régionales des comptes.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 72 al. 6 de la Constitution · articles L. 2131-1 à L. 2131-13 du CGCT (contrôle de légalité) · articles L. 1612-1 à L. 1612-20 (contrôle budgétaire) · loi Defferre du 2 mars 1982.</p>\n<h3>3. Le Mécanisme du Contrôle de Légalité</h3>\n<p>Transmission obligatoire des actes → examen du préfet (2 mois) → recours gracieux possible → déféré préfectoral devant le TA → suspension possible en référé. Volume : environ 5 millions d'actes transmis par an, environ 1 500 déférés/an.</p>\n<h3>4. Le Contrôle Budgétaire</h3>\n<p>4 cas de saisine de la CRC : budget non voté dans les délais, budget non voté en équilibre réel, compte administratif en déficit, dépense obligatoire non inscrite. Pouvoirs : mise en demeure, règlement d'office par le préfet.</p>\n<h3>5. Le Contrôle des Actes Soumis</h3>\n<p>Actes transmis obligatoirement : délibérations, arrêtés réglementaires, conventions de DSP, marchés publics au-dessus des seuils, documents budgétaires.</p>\n<h3>6. Les Faiblesses du Contrôle</h3>\n<p>Sous-effectif des préfectures, volume énorme d'actes, tri aléatoire (« contrôle stratégique »), faible taux de déféré (0,03 %).</p>\n<h3>7. La Télétransmission ACTES</h3>\n<p>Plateforme déployée depuis 2005, 100 % des collectivités en 2024, plus de 5 millions d'actes/an, permettant un contrôle automatisé.</p>\n<h3>8. Le Contrôle Hiérarchisé et Stratégique</h3>\n<p>Doctrine 2009 : hiérarchisation selon les enjeux (urbanisme, fonction publique territoriale, marchés publics en priorité).</p>\n<h3>9. Comparaisons Européennes</h3>\n<p>Allemagne (Kommunalaufsicht) · Italie (contrôle des CdC) · Espagne (Tribunal de Cuentas).</p>\n<h3>10. Le Débat sur la Réforme</h3>\n<p>Renforcer les moyens, créer un organe indépendant (échec), confier le contrôle entièrement aux CRC.</p>\n<h3>11. Synthèse Décisionnelle</h3>\n<p>Renforcer les moyens humains du contrôle préfectoral (+30 %), obliger la publication des déférés et avis CRC, automatiser le tri ACTES par IA.</p>"}, {"id": "35962af8e03f818daa97fdd3e6774cc1", "titre": "La libre administration et le principe de subsidiarité : article 72", "theme": 1, "cat": "1.5.1", "html": "<h3>1. Définition & Cadre</h3>\n<p>La libre administration est le principe constitutionnel selon lequel les collectivités territoriales s'administrent librement par des conseils élus. Couplé au principe de subsidiarité (article 72 al. 2), il est encadré par la loi, le contrôle préfectoral et la jurisprudence du Conseil constitutionnel.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Article 72 al. 3 (libre administration) · article 72 al. 2 (subsidiarité) · article 72-2 (autonomie financière) · décision CC 1979 « Loi Bonnet » · Charte européenne de l'autonomie locale (ratifiée 2007).</p>\n<h3>3. Les Composantes de la Libre Administration</h3>\n<p>3 piliers : conseils élus (compétence générale), compétences propres (pouvoir réglementaire local), ressources financières autonomes (article 72-2, « part déterminante » des recettes propres).</p>\n<h3>4. La Subsidiarité (Article 72 alinéa 2)</h3>\n<p>Les compétences doivent être exercées à l'échelon le plus pertinent — critère d'attribution peu invoqué en pratique par le Conseil constitutionnel, plutôt principe d'orientation.</p>\n<h3>5. Les Limites à la Libre Administration</h3>\n<p>Limites constitutionnelles (unité de la République, égalité, compétences régaliennes) et légales (loi-cadre, contrôle préfectoral, statut des élus et agents).</p>\n<h3>6. La Jurisprudence du Conseil Constitutionnel</h3>\n<p>1979 (Loi Bonnet, principe constitutionnel) · 1991 (statut Corse, pas de « peuple corse ») · 2003-487 DC (RMI, autonomie financière) · 2018-769 DC (taxe d'habitation, autonomie financière respectée).</p>\n<h3>7. Les Atteintes Présumées à la Libre Administration</h3>\n<p>Suppression de la taxe d'habitation (validée car compensée), Pacte de Cahors 2018, loi NOTRe (suppression de la clause générale de compétence) — le CC valide largement les réformes tant que les ressources sont compensées.</p>\n<h3>8. La Différenciation Territoriale (2003 + 3DS 2022)</h3>\n<p>Article 72 al. 4 (expérimentations dérogatoires), article 73 (adaptations outre-mer), loi 3DS 2022 (application limitée).</p>\n<h3>9. Le Débat sur le Pouvoir Réglementaire Local</h3>\n<p>Pouvoir réglementaire d'application des lois (article 72 al. 3), pas de pouvoir législatif sauf statut spécial (Corse, Nouvelle-Calédonie, Polynésie).</p>\n<h3>10. Comparaisons Européennes</h3>\n<p>Allemagne (autonomie communale renforcée) · Espagne (communautés autonomes avec pouvoir législatif) · Italie (régions à statut spécial).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Tension permanente entre unité républicaine et liberté locale ; l'autonomie financière est le pivot du débat.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Garantir constitutionnellement un seuil minimum de ressources propres (50 %), renforcer le pouvoir réglementaire local, multiplier les expérimentations différenciées, clarifier la répartition des compétences par une refonte du CGCT.</p>"}, {"id": "35762af8e03f81abbadec232d0ba4251", "titre": "Les régions : compétences, financement, réforme 2015 et statuts particuliers", "theme": 1, "cat": "1.5.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les régions sont des collectivités territoriales de plein exercice depuis 1982. La réforme de 2015 (loi NOTRe) a réduit le nombre de régions métropolitaines de 22 à 13. Les régions ont des compétences économiques et de formation, mais restent contraintes par leur manque de fiscalité propre.</p>\n<h3>2. Les 13 Régions Métropolitaines</h3>\n<table><tr><th>Région</th><th>Chef-lieu</th><th>Population</th><th>Président(e)</th></tr><tr><td>Île-de-France</td><td>Paris</td><td>12 M</td><td>Valérie Pécresse (LR)</td></tr><tr><td>Auvergne-Rhône-Alpes</td><td>Lyon</td><td>8 M</td><td>Laurent Wauquiez (LR)</td></tr><tr><td>Nouvelle-Aquitaine</td><td>Bordeaux</td><td>6 M</td><td>Alain Rousset (PS)</td></tr><tr><td>Grand Est</td><td>Strasbourg</td><td>5,5 M</td><td>Frédéric Bierry (LR)</td></tr><tr><td>Occitanie</td><td>Toulouse</td><td>6 M</td><td>Carole Delga (PS)</td></tr><tr><td>Hauts-de-France</td><td>Lille</td><td>6 M</td><td>Xavier Bertrand (ind.)</td></tr><tr><td>PACA</td><td>Marseille</td><td>5,1 M</td><td>Renaud Muselier (LR)</td></tr><tr><td>Corse</td><td>Ajaccio</td><td>350 000</td><td>Gilles Simeoni (nationaliste)</td></tr></table>\n<h3>3. Les Compétences des Régions</h3>\n<p>Compétences exclusives : développement économique (SRDEII), formation professionnelle et apprentissage, lycées, transports régionaux (TER, cars depuis 2017), gestion des fonds européens. Compétences partagées : culture, sport, tourisme. Depuis NOTRe : clause générale de compétence supprimée.</p>\n<h3>4. Le Financement</h3>\n<table><tr><th>Ressource</th><th>Montant 2024</th></tr><tr><td>Dotations de l'État (DGF)</td><td>5 Md€</td></tr><tr><td>CVAE</td><td>Supprimée 2024, compensée par TVA</td></tr><tr><td>Part de TVA affectée</td><td>13 Md€</td></tr><tr><td>Fonds européens gérés</td><td>15 Md€ (sur 7 ans)</td></tr><tr><td>Total dépenses régionales</td><td>~35 Md€</td></tr></table>\n<p>Problème structurel : la suppression de la CVAE a privé les régions d'une recette dynamique, remplacée par une TVA moins réactive.</p>\n<h3>5. Les Régions à Statut Particulier</h3>\n<p>Corse : Collectivité de Corse depuis 2018 (fusion CTC + 2 départements), compétences spécifiques, négociations d'autonomie 2023-2024. Alsace : Collectivité européenne d'Alsace (2021, fusion départements 67-68), compétences transfrontalières, maintien du droit local.</p>\n<h3>6. Enjeux Stratégiques</h3>\n<p>Les régions sont trop grandes pour être proches des citoyens, trop petites pour rivaliser avec les grandes régions européennes ; la suppression de la fiscalité propre accroît la dépendance aux dotations.</p>\n<h3>7. Synthèse Décisionnelle</h3>\n<p>Redonner une fiscalité propre dynamique aux régions, accorder l'autonomie à la Corse, permettre l'ouverture à la concurrence des TER, renforcer les fonds européens gérés directement.</p>"}, {"id": "35862af8e03f81f19987cb4f75e3a84a", "titre": "La réforme territoriale 2015 : 22 → 13 régions, bilan d'une fusion contestée", "theme": 1, "cat": "1.5.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>La réforme territoriale du 16 janvier 2015 a ramené le nombre de régions métropolitaines de 22 à 13, décidée « à la hussarde » par Hollande en 2014 et appliquée en 2016, pour créer des régions de « taille européenne ». Bilan mitigé : économies attendues non réalisées, identités territoriales bousculées.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi du 16 janvier 2015 (délimitation des régions) · loi NOTRe du 7 août 2015 · application au 1er janvier 2016.</p>\n<h3>3. Le Nouveau Découpage</h3>\n<p>Régions fusionnées : Bourgogne-Franche-Comté, Normandie, Hauts-de-France, Grand Est (Alsace+Champagne-Ardenne+Lorraine), Nouvelle-Aquitaine (3 régions), Occitanie, Auvergne-Rhône-Alpes. Régions inchangées : Île-de-France, Centre-Val de Loire, Pays de la Loire, Bretagne, PACA, Corse.</p>\n<h3>4. Les Régions Fusionnées — Cas Notables</h3>\n<p>Grand Est (5,5 M habitants) : tensions identitaires alsaciennes, création de la Collectivité européenne d'Alsace en 2021 en retour partiel. Nouvelle-Aquitaine (6 M habitants, 84 000 km²) : plus grande région métropolitaine, distance Bordeaux-Limoges de 220 km.</p>\n<h3>5. Bilan 10 Ans Après</h3>\n<p>Économies attendues : 25 Md€ sur 5 ans. Économies réalisées : quasi nulles (rapport Cour des comptes 2021), en raison des coûts de transition. Impacts positifs : capacité d'investissement accrue, meilleure visibilité européenne. Impacts négatifs : éloignement des décisions, identités fragilisées.</p>\n<h3>6. Réformes en Discussion</h3>\n<p>Bretagne réunifiée (rattachement de la Loire-Atlantique, projet permanent) · Corse (autonomie fiscale renforcée) · débat sur le lien région-département.</p>\n<h3>7. Synthèse Décisionnelle</h3>\n<p>La réforme de 2015 a été exécutée trop vite et sans consultation suffisante. Une stabilité institutionnelle est aujourd'hui préférable à de nouvelles fusions/défusions.</p>"}, {"id": "35862af8e03f8187a411fff5a583ab49", "titre": "Les présidents de région : pouvoir, compétences et personnalités 2024-2025", "theme": 1, "cat": "1.5.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les présidents de région sont les chefs exécutifs des conseils régionaux, élus pour 6 ans par les conseillers régionaux. Ils dirigent collectivement un budget de 30 Md€ et plus de 80 000 agents. Certains sont devenus des figures nationales (Xavier Bertrand, Carole Delga).</p>\n<h3>2. Statut et Pouvoirs</h3>\n<p>Élus pour 6 ans, reconductibles indéfiniment. Pouvoirs : préparation et exécution du budget, représentation en justice, chef des services régionaux, pouvoir réglementaire propre, pas de pouvoir de police.</p>\n<h3>3. Compétences des Régions (post-NOTRe)</h3>\n<p>Développement économique, aménagement du territoire (SRADDET), formation professionnelle, lycées (bâtiments), transports interurbains et TER, fonds européens.</p>\n<h3>4. Les Présidents de Région en 2024-2025</h3>\n<table><tr><th>Région</th><th>Président</th><th>Parti</th><th>Depuis</th></tr><tr><td>Île-de-France</td><td>Valérie Pécresse</td><td>LR</td><td>2015</td></tr><tr><td>Hauts-de-France</td><td>Xavier Bertrand</td><td>LR (indép.)</td><td>2016</td></tr><tr><td>Grand Est</td><td>Franck Leroy</td><td>UDI</td><td>2023</td></tr><tr><td>Nouvelle-Aquitaine</td><td>Alain Rousset</td><td>PS</td><td>1998 (record de longévité)</td></tr><tr><td>Auvergne-Rhône-Alpes</td><td>Laurent Wauquiez</td><td>LR</td><td>2016</td></tr><tr><td>Occitanie</td><td>Carole Delga</td><td>PS</td><td>2016</td></tr><tr><td>Corse</td><td>Gilles Simeoni</td><td>Femu a Corsica</td><td>2015</td></tr></table>\n<h3>5. Le Budget Type d'une Région</h3>\n<p>Budget moyen : 2-3 Md€/an. Répartition : transports (30 %), lycées (25 %), formation professionnelle (15 %), développement économique (10 %).</p>\n<h3>6. Le Rôle Politique</h3>\n<p>Tremplin pour des ambitions présidentielles (Bertrand, Wauquiez, Pécresse candidate en 2022).</p>\n<h3>7. Faiblesses Persistantes</h3>\n<p>Compétence « développement économique » floue (chevauchements avec les EPCI), pas de pouvoir fiscal réel, manque de visibilité face aux grandes métropoles.</p>\n<h3>8. Synthèse Décisionnelle</h3>\n<p>Élection au suffrage universel direct (séparé du conseil régional), pouvoir fiscal renforcé, clarification des compétences avec les EPCI.</p>"}, {"id": "35862af8e03f8138920ad7039f571e2d", "titre": "Le financement des régions : recettes fiscales, dotations État et fonds européens", "theme": 1, "cat": "1.5.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le financement des régions repose sur trois sources : recettes fiscales (60 %), dotations de l'État (30 %), fonds européens (10 %). Depuis la suppression de la taxe professionnelle (2010), les régions dépendent largement de fractions d'impôts nationaux.</p>\n<h3>2. Recettes Fiscales (60 % du budget)</h3>\n<p>CVAE (en extinction 2027), IFER, taxe sur les cartes grises (~2 Md€/an). Fractions d'impôts nationaux : TVA (12 Md€, principale ressource depuis 2021), TICPE (6 Md€).</p>\n<h3>3. Dotations de l'État (30 %)</h3>\n<p>DGF (5,7 Md€/an), DGD (3 Md€), compensations diverses.</p>\n<h3>4. Fonds Européens (10 %)</h3>\n<p>FEDER (8 Md€ sur 7 ans, géré par les régions), FSE+ (6 Md€), FEADER (11 Md€), Fonds Just Transition (600 M€).</p>\n<h3>5. Recettes Hors Fiscales</h3>\n<p>Vente de services, subventions européennes (LEADER, INTERREG), emprunts limités par la règle d'or.</p>\n<h3>6. Dépenses Type</h3>\n<table><tr><th>Catégorie</th><th>Part</th></tr><tr><td>Transports</td><td>30 %</td></tr><tr><td>Lycées</td><td>20 %</td></tr><tr><td>Formation professionnelle</td><td>15 %</td></tr><tr><td>Développement économique</td><td>10 %</td></tr><tr><td>Personnel</td><td>12 %</td></tr></table>\n<h3>7. La Dette Régionale</h3>\n<p>Encours total : 27 Md€ (fin 2024), en hausse depuis 2018. Capacité de désendettement moyenne de 5 ans, mais disparités fortes (PACA, Hauts-de-France plus endettées).</p>\n<h3>8. Crise des Finances Régionales (2024-2025)</h3>\n<p>Plan Bayrou : 2 Md€ de moins pour les régions en 2025. Suppression de la CVAE compensée par fraction TVA avec décalage. Tensions avec l'État.</p>\n<h3>9. Synthèse Décisionnelle</h3>\n<p>Restaurer une vraie fiscalité régionale, mettre fin au jeu « DGF baisse / fraction TVA monte », donner une visibilité pluriannuelle des recettes.</p>"}, {"id": "35962af8e03f813da7b7f5fb4ec22868", "titre": "La Collectivité de Corse : statut, autonomie et négociations 2023-2025", "theme": 1, "cat": "1.5.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>La Collectivité de Corse (CdC), créée le 1er janvier 2018 par fusion de la région Corse et de ses deux départements, dispose de compétences élargies. La question de l'autonomie a refait surface avec les négociations Beauvau-Bartolone-Corse (2023-2025).</p>\n<h3>2. Cadre Juridique</h3>\n<p>Articles 72 et 72-3 de la Constitution · loi NOTRe (2015) · ordonnance du 21 novembre 2016 · statut Joxe (1991) · statut Defferre (1982).</p>\n<h3>3. L'Architecture Institutionnelle</h3>\n<p>Assemblée de Corse (63 conseillers, 6 ans, scrutin proportionnel), Conseil exécutif (11 membres, président Gilles Simeoni depuis 2015), Conseil économique/social/environnemental/culturel (consultatif), Chambre des territoires.</p>\n<h3>4. Les Compétences</h3>\n<p>Régionales (développement économique, formation, lycées, transport ferroviaire), départementales (collèges, action sociale, routes), spécifiques (langue et culture corses, tourisme, environnement, logement social).</p>\n<h3>5. Les Résultats Électoraux Corses</h3>\n<p>Territoriales 2017 : victoire historique des nationalistes (56,5 %). Territoriales 2021 : Femu a Corsica 40,6 %, Core in Fronte 12,7 %, total nationaliste environ 70 %.</p>\n<h3>6. Le Processus d'Autonomie 2023-2025</h3>\n<p>Catalyseur : mort d'Yvan Colonna (mars 2022). Accord Beauvau du 11 mars 2024, visite Macron le 17 mars 2024, négociations bloquées par l'instabilité gouvernementale (Borne, Barnier, Bayrou). Contenu projeté : inscription « communauté historique linguistique et culturelle » à l'article 74-1, pouvoir dérogatoire (« loi de pays »), co-officialité de la langue corse.</p>\n<h3>7. Les Difficultés du Processus</h3>\n<p>Majorité constitutionnelle requise (3/5 du Congrès), opposition LR/RN sur la « communauté historique », avis réservé du Conseil d'État sur la « loi de pays ».</p>\n<h3>8. Les Compétences Spécifiques en Vigueur</h3>\n<p>PADDUC, charte du développement de l'enseignement de la langue corse, Office des transports de Corse.</p>\n<h3>9. Les Finances</h3>\n<p>Budget 2024 : environ 1,1 Md€. Continuité territoriale (aide aux liaisons maritimes et aériennes) : environ 150 M€/an.</p>\n<h3>10. Comparaisons Européennes</h3>\n<p>Sicile, Sardaigne (statuts spéciaux italiens) · Pays basque, Catalogne (autonomies espagnoles) · Écosse, Pays de Galles (devolution britannique).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Modèle potentiel pour d'autres régions (Bretagne, Pays basque, Alsace), risque de fragmentation républicaine perçu, question de l'unité nationale.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Révision constitutionnelle limitée (statut sui generis), pouvoir réglementaire renforcé (pas législatif plein), co-officialité linguistique en matières culturelles, Conférence permanente Corse-État.</p>"}, {"id": "35962af8e03f8105adf8f09756ce71ab", "titre": "La Collectivité européenne d'Alsace : statut, droit local et bilinguisme", "theme": 1, "cat": "1.5.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>La Collectivité européenne d'Alsace (CeA), créée le 1er janvier 2021 par fusion des départements du Bas-Rhin et du Haut-Rhin, reste intégrée à la région Grand Est. Elle est l'exception du paysage administratif français : ni région, ni département classique.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi n° 2019-816 du 2 août 2019 · articles L. 3431-1 à L. 3431-9 du CGCT · décret du 30 décembre 2020.</p>\n<h3>3. L'Architecture Institutionnelle</h3>\n<p>Conseil d'Alsace (80 conseillers, président Frédéric Bierry LR depuis 2021, siège à Strasbourg et Colmar). Conserve les compétences départementales, reçoit des compétences régionales déléguées, sans sortir de la région Grand Est.</p>\n<h3>4. Les Compétences Spécifiques</h3>\n<p>Départementales standards (action sociale, collèges, routes, SDIS) + spécifiques transférées (coopération transfrontalière, bilinguisme, tourisme, routes nationales non concédées).</p>\n<h3>5. Le Bilinguisme Alsacien</h3>\n<p>Bilinguisme paritaire français-allemand, environ 135 000 élèves bilingues, 65 écoles bilingues paritaires, Office pour la Langue et les Cultures d'Alsace.</p>\n<h3>6. La Coopération Transfrontalière</h3>\n<p>Eurodistricts (Strasbourg-Ortenau, Mulhouse-Fribourg), Conférence du Rhin supérieur, tram transfrontalier Strasbourg-Kehl.</p>\n<h3>7. Le Statut Spécifique du Droit Local</h3>\n<p>Héritage de l'occupation allemande 1871-1918 : Concordat (clergé rémunéré par l'État), livre foncier, 2 jours fériés supplémentaires (Vendredi Saint, Saint-Étienne), régime spécifique des associations.</p>\n<h3>8. La Question de la Sortie du Grand Est</h3>\n<p>Bierry milite pour une région Alsace autonome, refusée par Macron en 2017 et 2024. Sondages : 70-80 % en faveur du retour à une région Alsace.</p>\n<h3>9. Les Finances</h3>\n<p>Budget 2024 : environ 2 Md€.</p>\n<h3>10. Comparaisons</h3>\n<p>Catalogne (autonomie fiscale et législative), Bavière (Land fédéral), Tyrol du Sud (autonomie linguistique).</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Modèle de collectivité territoriale particulière, question du retour vers une région Alsace, préservation du droit local.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Ne pas réformer le Grand Est (trop coûteux), renforcer les compétences transfrontalières, pérenniser le droit local par révision constitutionnelle ad hoc, développer le bilinguisme éducatif.</p>"}, {"id": "35962af8e03f81f2ac2ef57e8e629005", "titre": "Les 13 régions métropolitaines : cartographie, compétences et spécificités", "theme": 1, "cat": "1.5.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les 13 régions métropolitaines, 5 régions ultramarines et 3 collectivités spéciales constituent l'échelon régional français, chacune avec ses spécificités historiques, économiques et identitaires.</p>\n<h3>2. Les Régions Ultramarines (DROM)</h3>\n<p>Guadeloupe (384 000 hab.), Martinique (360 000), Guyane (297 000), La Réunion (870 000), Mayotte (320 000). Spécificités : adaptations législatives (art. 73), octroi de mer, défiscalisation.</p>\n<h3>3. Les Collectivités Spéciales</h3>\n<p>Collectivité de Corse (2018), Collectivité européenne d'Alsace (2021), Polynésie française (art. 74), Wallis-et-Futuna, Saint-Pierre-et-Miquelon, Nouvelle-Calédonie (statut spécifique).</p>\n<h3>4. Les Spécificités Régionales</h3>\n<p>Île-de-France (22 % du PIB national) · Auvergne-Rhône-Alpes (frontière suisse/italienne, industrie) · Bretagne (identité forte, demande de réunification avec la Loire-Atlantique) · PACA (Méditerranée, tourisme).</p>\n<h3>5. Les Demandes de Réforme Régionale</h3>\n<p>Bretagne (réunification, 75 % d'opinion favorable, bloquée par l'État) · Alsace (retour à une région autonome, bloqué) · Pays basque (communauté créée en 2017 sans collectivité entière).</p>\n<h3>6. Les Compétences</h3>\n<p>Développement économique, formation professionnelle/apprentissage, lycées, transports régionaux, aménagement du territoire, environnement, tourisme — clause générale de compétence supprimée par NOTRe.</p>\n<h3>7. Le Financement</h3>\n<p>TICPE (~3 Md€), CVAE (jusqu'en 2022), DGF, cartes grises, TVA (depuis 2021). Total 2024 : ~30 Md€, dont 50 % en investissement.</p>\n<h3>8. Les Indicateurs Clés</h3>\n<p>18 régions au total, 1 950 conseillers régionaux, 30 Md€ de budget cumulé, 90 000 agents régionaux.</p>\n<h3>9. Synthèse Décisionnelle</h3>\n<p>Libérer la réunification bretonne par référendum local, créer un statut spécifique pour le Pays basque, réformer la fiscalité régionale (autonomie fiscale >30 %), clarifier le rôle des régions face aux métropoles.</p>"}, {"id": "35962af8e03f814fafddc4915a473649", "titre": "Le SRADDET : schéma régional d'aménagement et planification territoriale", "theme": 1, "cat": "1.5.2", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le SRADDET (Schéma Régional d'Aménagement, de Développement Durable et d'Égalité des Territoires) est le document de planification stratégique de la région, créé par la loi NOTRe 2015, fusionnant 6 schémas préexistants. Il a une portée prescriptive.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Loi NOTRe du 7 août 2015 (art. 10) · articles L. 4251-1 à L. 4251-11 du CGCT · loi Climat et Résilience du 22 août 2021 (ZAN) · loi 3DS 2022.</p>\n<h3>3. Les Schémas Fusionnés</h3>\n<p>SRADT, SRCAE (climat air énergie), SRCE (trame verte/bleue), SRI (infrastructures et transports), PRPGD (déchets).</p>\n<h3>4. Le Contenu Obligatoire</h3>\n<p>11 thématiques : équilibre des territoires, infrastructures, désenclavement rural, habitat, gestion économe de l'espace, intermodalité, énergie, climat, pollution de l'air, biodiversité, déchets.</p>\n<h3>5. La Portée Prescriptive</h3>\n<p>Trois niveaux : objectifs (orientation simple), règles générales (compatibilité obligatoire des SCoT/PLU), cartes. Hiérarchie : SRADDET > SCoT > PLU.</p>\n<h3>6. La Place de la ZAN (Zéro Artificialisation Nette)</h3>\n<p>Objectif national 2050, phase intermédiaire -50 % d'artificialisation 2031 vs 2011-2021, intégration obligatoire dans les SRADDET avant le 22 février 2024.</p>\n<h3>7. La Procédure d'Élaboration</h3>\n<p>Délibération de prescription, concertation, arrêt du projet, avis (CRTC, CESER), enquête publique, approbation par le préfet de région — durée de 3-4 ans en moyenne.</p>\n<h3>8. Les SRADDET en Vigueur</h3>\n<p>13 SRADDET métropolitains adoptés entre 2019 et 2021, modifications ZAN en cours 2024-2025.</p>\n<h3>9. La Spécificité IDF</h3>\n<p>SDRIF-E adopté le 5 décembre 2024, distinct du SRADDET, visant 2040.</p>\n<h3>10. La Spécificité Corse</h3>\n<p>PADDUC (2002, adopté en 2015, en révision), statut spécifique de compatibilité directe avec les PLU.</p>\n<h3>11. Enjeux Stratégiques</h3>\n<p>Outil clé de pilotage régional, articulation difficile avec la ZAN, tension avec les communes sur le zonage.</p>\n<h3>12. Synthèse Décisionnelle</h3>\n<p>Renforcer la portée prescriptive du SRADDET, simplifier la procédure d'élaboration (24 mois max), harmoniser SRADDET-SDRIF-PADDUC, financer l'ingénierie territoriale.</p>"}, {"id": "35762af8e03f817bb06de4c7e5e25bb1", "titre": "Les départements : compétences, crise financière et débat sur leur avenir", "theme": 1, "cat": "1.5.3", "html": "<h3>🔁 Recentrage institutionnel — 6 août 2026</h3>\n<p>Le développement financier de cette fiche (crise DMTO/AIS, cas Seine-Saint-Denis) a été retiré et renvoyé vers la fiche propriétaire du volet financier, « La crise financière des CT 2023-2025 » (Th. 2.5.3), conformément à l'arbitrage de frontière du 5 août 2026 : l'institution reste au Th. 1, ses finances passent au Th. 2. Repère à conserver : le RSA est une dépense obligatoire des départements (≈10 Md€ sur 12), compensée partiellement et de façon figée par l'État — ce n'est pas un cofinancement « 50/50 ».</p>\n<h3>1. Définition & Cadre</h3>\n<p>Les départements (101 en France dont 5 DOM) sont des collectivités territoriales créées en 1790. Ils ont longtemps été la collectivité de proximité par excellence. Depuis 2015, leur avenir est questionné : la loi NOTRe leur a supprimé la clause générale de compétence.</p>\n<h3>2. Les Compétences</h3>\n<p>Action sociale (RSA, APA, PCH, PMI), collèges (investissement et fonctionnement), routes départementales (~380 000 km), SDIS, transports scolaires (transférés aux régions depuis 2017 sauf Île-de-France), archives et musées départementaux.</p>\n<h3>3. Renvoi — Crise financière des départements</h3>\n<p>Le développement financier complet (mécanisme des AIS, DMTO, compensation gelée, rapport Rebsamen, plan d'urgence 2024, comparaisons européennes) est propriété exclusive de la fiche « La crise financière des CT 2023-2025 » (Th. 2.5.3) — s'y référer plutôt que de redocumenter le sujet ici.</p>\n<h3>4. Le Débat sur la Suppression des Départements</h3>\n<p>Pour la suppression (LFI, certains écologistes) : strate en trop, métropoles ayant absorbé les compétences urbaines. Contre (LR, PS, centre) : le département reste une strate de proximité essentielle en zone rurale.</p>\n<h3>5. Enjeux Stratégiques</h3>\n<p>La crise des DMTO est structurelle ; le RSA financé par les départements crée une inégalité territoriale (départements pauvres avec plus de RSA et moins de ressources).</p>\n<h3>6. Synthèse Décisionnelle</h3>\n<p>Sur le volet institutionnel : maintenir le département en zone rurale, supprimer les conseils départementaux là où la métropole a absorbé les compétences (modèle Rhône/Métropole de Lyon). Pour les recommandations financières (RSA, DMTO), voir la fiche propriétaire Th. 2.5.3.</p>"}, {"id": "35862af8e03f81d5973ef0da1436629b", "titre": "Les présidents de département et l'ADF : action sociale, voirie, collèges", "theme": 1, "cat": "1.5.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Les présidents de département dirigent les conseils départementaux, organes exécutifs des 101 départements. Le département, pivot de l'action sociale, gère un budget collectif de 80 Md€/an et emploie 350 000 agents. Élus pour 6 ans par les conseillers départementaux (binôme paritaire depuis 2015).</p>\n<h3>2. Statut et Pouvoirs</h3>\n<p>Élus pour 6 ans, reconductibles indéfiniment. Pouvoirs : préparation et exécution du budget, ordonnateur des dépenses, représentation, présidence de la commission permanente, pas de pouvoir de police propre.</p>\n<h3>3. Compétences des Départements</h3>\n<p>Action sociale (RSA, APA, PCH, aide sociale à l'enfance, PMI), collèges, voirie départementale (380 000 km), SDIS, patrimoine culturel.</p>\n<h3>4. La Répartition Politique (2024)</h3>\n<table><tr><th>Tendance</th><th>Départements</th></tr><tr><td>Droite (LR, UDI, DVD)</td><td>60</td></tr><tr><td>Gauche (PS, PC, EELV, DVG)</td><td>30</td></tr><tr><td>Centre</td><td>5</td></tr></table>\n<h3>5. Les Présidents Influents</h3>\n<p>François Sauvadet (Côte-d'Or, président de l'ADF), Bruno Retailleau (ex-Vendée, devenu ministre), Jean Castex (ex-président de l'AdCF, devenu PM).</p>\n<h3>6. L'ADF (Assemblée des Départements de France)</h3>\n<p>Lobby des départements face à l'État, présidé par François Sauvadet (LR, depuis 2021), rôle central dans les négociations sur les finances locales.</p>\n<h3>7. Les Départements-Régions (Ultra-Marins)</h3>\n<p>Guadeloupe, Martinique, Guyane, La Réunion, Mayotte — statut spécifique exerçant les compétences régionales et départementales. Martinique et Guyane : Collectivité Territoriale Unique depuis 2015.</p>\n<h3>8. Synthèse Décisionnelle</h3>\n<p>Les présidents de département sont des acteurs clés en zones rurales, mais leur légitimité élective est faible (suffrage indirect). Réforme : élection au suffrage universel direct, clarification des compétences.</p>"}, {"id": "35962af8e03f818ab077da01f9b5de64", "titre": "Les compétences départementales : action sociale, collèges, routes et NOTRe 2015", "theme": 1, "cat": "1.5.3", "html": "<h3>1. Définition & Cadre</h3>\n<p>Le département est une collectivité territoriale de droit commun (art. 72) créée en 1790, comptant 101 départements (96 métropolitains + 5 DROM). Depuis la loi NOTRe (2015), ses compétences sont limitées à l'action sociale, les collèges, les routes et l'aménagement rural.</p>\n<h3>2. Cadre Juridique</h3>\n<p>Articles 72 et 73 de la Constitution · CGCT articles L. 3211-1 à L. 3215-1 · loi NOTRe du 7 août 2015 · loi Defferre du 2 mars 1982.</p>\n<h3>3. Les Compétences Actuelles</h3>\n<p>Exclusives : action sociale (RSA, APA, PCH, PMI, protection de l'enfance), collèges, routes départementales (~375 000 km), SDIS, aménagement rural. Partagées : culture, sport, tourisme.</p>\n<h3>4. Les Compétences Supprimées par NOTRe (2015)</h3>\n<p>Développement économique (transféré aux régions), clause de compétence générale, transport scolaire (vers régions/EPCI).</p>\n<h3>5. Les Finances Départementales (repères institutionnels)</h3>\n<p>AIS (RSA + APA + PCH) : poste de dépense obligatoire majeur et structurellement croissant. DMTO : recette cyclique et volatile. Pour le détail financier complet, voir la fiche propriétaire Th. 2.5.3.</p>\n<h3>6. Effectifs & Poids</h3>\n<p>101 départements, environ 4 200 conseillers départementaux, environ 270 000 agents.</p>\n<h3>7. Le Débat sur la Suppression</h3>\n<p>Pour : doublon avec régions et EPCI, coût de l'échelon (rapport Balladur 2009). Contre : action sociale irremplaçable, proximité, coût de transition. Résultat : NOTRe a recentré sans supprimer.</p>\n<h3>8. Comparaisons Européennes</h3>\n<p>Italie (provinces en cours de suppression) · Espagne (provinces maintenues) · Allemagne (Kreise bien intégrés).</p>\n<h3>9. Enjeux Stratégiques</h3>\n<p>Le financement de l'AIS est le défi majeur ; tension avec les régions sur le développ
